# Fullstack + ML · Week 5 quizzes. Format and rules: src/content/QUIZZES.md
week: 5
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 4 review"
      covers: "Week 4: selectors and units, display and position, Flexbox, media queries, Git and GitHub"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w05-d1-g01, difficulty: easy, type: mcq, prompt: "Turn on flexbox", choices: ["display: flex", "position: flex", "flex: on", "float: flex"], answer: 0 }
        - { id: fs-w05-d1-g02, difficulty: easy, type: mcq, prompt: "Save a snapshot in Git", choices: ["git commit", "git push", "git add", "git status"], answer: 0 }
        - { id: fs-w05-d1-g03, difficulty: easy, type: mcq, prompt: "Links inside the nav only", choices: ["nav a", "nav, a", "a nav", "nav.a"], answer: 0 }
        - { id: fs-w05-d1-g04, difficulty: easy, type: truefalse, prompt: "git push uploads your commits to GitHub.", answer: true }
        - { id: fs-w05-d1-g05, difficulty: easy, type: mcq, prompt: "Let flex items move onto new lines", choices: ["flex-wrap: wrap", "flex-direction: wrap", "display: wrap", "gap: wrap"], answer: 0 }
        - { id: fs-w05-d1-g06, difficulty: easy, type: mcq, prompt: "Hide an element completely", choices: ["display: none", "position: hidden", "display: hidden", "opacity: none"], answer: 0 }
        - { id: fs-w05-d1-g07, difficulty: medium, type: mcq, prompt: "Logo left, links right, vertically centred:", choices: ["display: flex; justify-content: space-between; align-items: center;", "text-align: right;", "display: block; align-items: center;", "float: left;"], answer: 0 }
        - { id: fs-w05-d1-g08, difficulty: medium, type: order, prompt: "Order the everyday Git loop.", items: ["Edit files", "git add .", "git commit -m \"…\"", "git push"] }
        - { id: fs-w05-d1-g09, difficulty: medium, type: mcq, prompt: "The badge flies to the corner of the page, not the card. Fix?", choices: ["position: relative on the card", "position: fixed on the badge", "display: flex on the badge", "z-index: 10"], answer: 0 }
        - { id: fs-w05-d1-g10, difficulty: medium, type: text, prompt: "2rem at a 16px root = ? px (number only)", accept: ["32"] }
        - { id: fs-w05-d1-g11, difficulty: medium, type: match, prompt: "Match.", pairs: [["git status", "what changed?"], ["git add .", "stage changes"], ["git log --oneline", "list commits"], [".gitignore", "files never to save"]] }
        - { id: fs-w05-d1-g12, difficulty: medium, type: mcq, prompt: "A page looks tiny on a real phone despite media queries. Missing?", choices: ["The viewport meta tag", "flex-wrap", "rem units", "a .gitignore"], answer: 0 }
        - { id: fs-w05-d1-g13, difficulty: medium, type: truefalse, prompt: "With border-box, width includes padding and border.", answer: true }
        - { id: fs-w05-d1-g14, difficulty: medium, type: mcq, prompt: "In a column (flex-direction: column), which centres items horizontally?", choices: ["align-items: center", "justify-content: center", "text-align: center", "float: center"], answer: 0 }
        - { id: fs-w05-d1-g15, difficulty: medium, type: mcq, prompt: "Your GitHub Pages site shows old content. Most likely?", choices: ["The change wasn't committed and pushed", "Pages is broken", "CSS can't update", "The repo is private"], answer: 0 }
        - { id: fs-w05-d1-g16, difficulty: hard, type: text, prompt: "Row 900px wide, gap 20px, cards flex: 1 1 250px. How many on the first row? (number only)", accept: ["3", "three"], explain: "3×250 + 2×20 = 790 fits; 4 would need 1060." }
        - { id: fs-w05-d1-g17, difficulty: hard, type: text, prompt: "What does this print?", code: "line = \"9b2d771 Ada: Fix typo in footer\"\nprint(line.split(\" \", 1)[1].split(\":\")[0])", accept: ["Ada"] }
        - { id: fs-w05-d1-g18, difficulty: hard, type: multi, prompt: "Which help a page work on phones? (Select all.)", choices: ["The viewport meta tag", "flex-wrap: wrap on card rows", "@media (max-width: 600px)", "width: 1200px on the body"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Dictionary basics"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w05-d1-rf01, difficulty: easy, type: mcq, prompt: "Dictionaries use…", choices: ["{ }", "[ ]", "( )", "< >"], answer: 0 }
          - { id: fs-w05-d1-rf02, difficulty: easy, type: mcq, prompt: "A dictionary finds values by…", choices: ["key", "position", "size", "order only"], answer: 0 }
          - { id: fs-w05-d1-rf03, difficulty: easy, type: mcq, prompt: "Get rice's price", choices: ["prices[\"rice\"]", "prices[0]", "prices.rice()", "prices(rice)"], answer: 0 }
          - { id: fs-w05-d1-rf04, difficulty: easy, type: mcq, prompt: "Add yam at 2500", choices: ["prices[\"yam\"] = 2500", "prices.append(\"yam\", 2500)", "prices.add(yam=2500)", "prices + {\"yam\": 2500}"], answer: 0 }
          - { id: fs-w05-d1-rf05, difficulty: easy, type: mcq, prompt: "Remove beans", choices: ["del prices[\"beans\"]", "prices.remove(\"beans\")", "prices[\"beans\"] = None", "prices - \"beans\""], answer: 0 }
          - { id: fs-w05-d1-rf06, difficulty: easy, type: mcq, prompt: "Missing key with [ ] raises…", choices: ["KeyError", "IndexError", "ValueError", "nothing"], answer: 0 }
          - { id: fs-w05-d1-rf07, difficulty: easy, type: mcq, prompt: "Missing key with .get(key) returns…", choices: ["None", "0", "an error", "\"\""], answer: 0 }
          - { id: fs-w05-d1-rf08, difficulty: easy, type: mcq, prompt: "Loop over keys and values", choices: [".items()", ".keys()", ".values()", ".pairs()"], answer: 0 }
          - { id: fs-w05-d1-rf09, difficulty: easy, type: truefalse, prompt: "\"rice\" in prices checks for the key.", answer: true }
          - { id: fs-w05-d1-rf10, difficulty: easy, type: text, prompt: "f\"{1700:,}\" gives…", accept: ["1,700"] }
          - { id: fs-w05-d1-rf11, difficulty: easy, type: truefalse, prompt: "Dictionary keys must be unique.", answer: true }
      - kind: brain-teaser
        title: "Read the dictionary"
        questions:
          - id: fs-w05-d1-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              prices = {"rice": 1500, "beans": 1200}
              prices["rice"] = 1700
              prices["yam"] = 2500
              print(len(prices), prices["rice"])
            accept: ["3 1700"]
          - id: fs-w05-d1-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              stock = {"Lagos": 40, "Abuja": 25}
              print(stock.get("Kano", 0) + stock.get("Lagos", 0))
            accept: ["40"]
          - id: fs-w05-d1-bt03
            difficulty: medium
            type: mcq
            prompt: "What happens?"
            code: |
              prices = {"rice": 1500}
              print(prices["egusi"])
            choices: ["KeyError: 'egusi'", "None", "0", "egusi"]
            answer: 0
          - id: fs-w05-d1-bt04
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              ages = {"Ada": 24, "Tolu": 31, "Emeka": 28}
              oldest = ""
              for name, age in ages.items():
                  if oldest == "" or age > ages[oldest]:
                      oldest = name
              print(oldest)
            accept: ["Tolu"]
          - id: fs-w05-d1-bt05
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              d = {"a": 1, "b": 2}
              d["a"] = d["a"] + d["b"]
              d["c"] = d["a"] * 2
              print(sum(d.values()))
            accept: ["11"]

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: dictionaries"
      covers: "Week 5 · Day 1: create, read, add, change, delete, get, in, keys/values/items, looping"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w05-d2-g01, difficulty: easy, type: mcq, prompt: "Which is a dictionary?", choices: ["{\"rice\": 1500}", "[\"rice\", 1500]", "(\"rice\", 1500)", "\"rice: 1500\""], answer: 0 }
        - { id: fs-w05-d2-g02, difficulty: easy, type: mcq, prompt: "Change rice to 1700", choices: ["prices[\"rice\"] = 1700", "prices.rice = 1700", "prices(\"rice\") = 1700", "prices[0] = 1700"], answer: 0 }
        - { id: fs-w05-d2-g03, difficulty: easy, type: truefalse, prompt: "d.get(\"x\", 0) returns 0 when \"x\" is missing.", answer: true }
        - { id: fs-w05-d2-g04, difficulty: easy, type: mcq, prompt: "Number of keys", choices: ["len(d)", "d.count()", "d.size", "count(d)"], answer: 0 }
        - { id: fs-w05-d2-g05, difficulty: easy, type: mcq, prompt: "Check if \"yam\" is a key", choices: ["\"yam\" in d", "d.has(\"yam\")", "d[\"yam\"] == True", "yam in d.values()"], answer: 0 }
        - { id: fs-w05-d2-g06, difficulty: easy, type: mcq, prompt: "All the values", choices: ["d.values()", "d.keys()", "d.items()", "d.all()"], answer: 0 }
        - id: fs-w05-d2-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            prices = {"rice": 1500, "beans": 1200}
            prices["rice"] = 2000
            print(prices["rice"] + prices["beans"])
          accept: ["3200"]
        - id: fs-w05-d2-g08
          difficulty: medium
          type: mcq
          prompt: "What does this print?"
          code: |
            d = {"a": 1}
            d["a"] = 5
            d["a"] = 9
            print(d)
          choices: ["{'a': 9}", "{'a': 1, 'a': 5, 'a': 9}", "{'a': [1, 5, 9]}", "an error"]
          answer: 0
        - { id: fs-w05-d2-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["d[k]", "value, or KeyError"], ["d.get(k)", "value, or None"], ["k in d", "True / False"], ["del d[k]", "remove the key"]] }
        - id: fs-w05-d2-g10
          difficulty: medium
          type: text
          prompt: "What's the last line printed?"
          code: |
            prices = {"rice": 1500, "garri": 800}
            for item, price in prices.items():
                print(f"{item}: ₦{price:,}")
          accept: ["garri: ₦800"]
        - { id: fs-w05-d2-g11, difficulty: medium, type: truefalse, prompt: "A dictionary value can be a list.", answer: true }
        - id: fs-w05-d2-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            stock = {"rice": 10}
            print(stock.get("beans"))
          accept: ["None"]
        - { id: fs-w05-d2-g13, difficulty: medium, type: mcq, prompt: "Why use a dictionary instead of two lists (names and prices)?", choices: ["Look things up by name directly, no matching positions", "Dictionaries are always faster to type", "Lists can't hold numbers", "No reason"], answer: 0 }
        - id: fs-w05-d2-g14
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            d = {"x": 3, "y": 4}
            print("x" in d, 3 in d)
          accept: ["True False"]
        - id: fs-w05-d2-g15
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            d = {"rice": 1500, "beans": 1200, "yam": 2500}
            del d["beans"]
            print(list(d.keys()))
          accept: ["['rice', 'yam']"]
        - id: fs-w05-d2-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            prices = {"rice": 1500, "beans": 1200, "garri": 800}
            cheap = []
            for item, price in prices.items():
                if price < 1300:
                    cheap.append(item)
            print(cheap)
          accept: ["['beans', 'garri']"]
        - id: fs-w05-d2-g17
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            word = "banana"
            counts = {}
            for letter in word:
                counts[letter] = counts.get(letter, 0) + 1
            print(counts["a"], counts["n"])
          accept: ["3 2"]
        - id: fs-w05-d2-g18
          difficulty: hard
          type: mcq
          prompt: "What's the bug?"
          code: |
            prices = {"rice": 1500}
            item = input("Item: ")
            print(prices[item])
          choices: ["An item that isn't a key crashes with KeyError: check with in or use .get()", "input can't be a key", "print can't show dict values", "No bug"]
          answer: 0
    quizzes:
      - kind: rapid-fire
        title: "Data shapes"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w05-d2-rf01, difficulty: easy, type: mcq, prompt: "orders[0][\"city\"] gets…", choices: ["the first order's city", "every city", "the city list", "an error"], answer: 0 }
          - { id: fs-w05-d2-rf02, difficulty: easy, type: mcq, prompt: "A list of dictionaries is like…", choices: ["rows of a spreadsheet", "one cell", "a single number", "a function"], answer: 0 }
          - { id: fs-w05-d2-rf03, difficulty: easy, type: mcq, prompt: "Start a new city at 0 while counting", choices: ["totals.get(city, 0)", "totals[city]", "totals.start(city)", "totals[0]"], answer: 0 }
          - { id: fs-w05-d2-rf04, difficulty: easy, type: mcq, prompt: "Key with the biggest value", choices: ["max(totals, key=totals.get)", "max(totals)", "totals.max()", "max(totals.keys())"], answer: 0 }
          - { id: fs-w05-d2-rf05, difficulty: easy, type: mcq, prompt: "students[\"Ada\"][\"city\"] is…", choices: ["nested access", "an error", "a list slice", "a function call"], answer: 0 }
          - { id: fs-w05-d2-rf06, difficulty: easy, type: truefalse, prompt: "An API response usually becomes a list of dictionaries in Python.", answer: true }
          - { id: fs-w05-d2-rf07, difficulty: easy, type: mcq, prompt: "Empty dictionary", choices: ["{}", "[]", "()", "dict[]"], answer: 0 }
          - { id: fs-w05-d2-rf08, difficulty: easy, type: mcq, prompt: "Loop over a list of orders", choices: ["for order in orders:", "for order in orders.items():", "for orders in order:", "while orders:"], answer: 0 }
          - { id: fs-w05-d2-rf09, difficulty: easy, type: truefalse, prompt: "max(totals) (without key=) returns the alphabetically last key.", answer: true }
          - { id: fs-w05-d2-rf10, difficulty: easy, type: mcq, prompt: "Add to a running total", choices: ["total += amount", "total =+ amount", "total + amount", "total.add(amount)"], answer: 0 }
      - kind: brain-teaser
        title: "Group and count"
        questions:
          - id: fs-w05-d2-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              orders = [{"city": "Lagos", "amount": 500}, {"city": "Kano", "amount": 300}, {"city": "Lagos", "amount": 200}]
              totals = {}
              for o in orders:
                  totals[o["city"]] = totals.get(o["city"], 0) + o["amount"]
              print(totals)
            accept: ["{'Lagos': 700, 'Kano': 300}"]
          - id: fs-w05-d2-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              totals = {"Lagos": 700, "Kano": 300, "Abuja": 900}
              print(max(totals, key=totals.get))
            accept: ["Abuja"]
          - id: fs-w05-d2-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              students = {"Ada": {"age": 24, "city": "Lagos"}, "Tolu": {"age": 31, "city": "Ibadan"}}
              print(students["Tolu"]["city"])
            accept: ["Ibadan"]
          - id: fs-w05-d2-bt04
            difficulty: hard
            type: mcq
            prompt: "What happens?"
            code: |
              totals = {}
              for city in ["Lagos", "Kano", "Lagos"]:
                  totals[city] = totals[city] + 1
            choices: ["KeyError: 'Lagos' (the key doesn't exist the first time)", "{'Lagos': 2, 'Kano': 1}", "{'Lagos': 1, 'Kano': 1}", "TypeError"]
            answer: 0
          - id: fs-w05-d2-bt05
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              sales = [{"item": "rice", "qty": 2}, {"item": "beans", "qty": 5}, {"item": "rice", "qty": 4}]
              qty = {}
              for s in sales:
                  qty[s["item"]] = qty.get(s["item"], 0) + s["qty"]
              print(qty["rice"] * 1500)
            accept: ["9000"]

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: lists of dictionaries"
      covers: "Week 5 · Day 2: list of dicts, counting/totalling pattern, max with key, nested dicts"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w05-d3-g01, difficulty: easy, type: mcq, prompt: "orders[1][\"amount\"] gives…", choices: ["the second order's amount", "the first order's amount", "every amount", "an error"], answer: 0 }
        - { id: fs-w05-d3-g02, difficulty: easy, type: mcq, prompt: "The counting pattern uses…", choices: ["totals.get(key, 0) + amount", "totals[key] + amount", "totals.count(key)", "len(totals)"], answer: 0 }
        - { id: fs-w05-d3-g03, difficulty: easy, type: truefalse, prompt: "A dictionary can hold another dictionary as a value.", answer: true }
        - { id: fs-w05-d3-g04, difficulty: easy, type: mcq, prompt: "Start an empty totals dictionary", choices: ["totals = {}", "totals = []", "totals = 0", "totals = dict"], answer: 0 }
        - { id: fs-w05-d3-g05, difficulty: easy, type: mcq, prompt: "max(totals, key=totals.get) returns…", choices: ["the key with the largest value", "the largest value", "the last key", "the number of keys"], answer: 0 }
        - { id: fs-w05-d3-g06, difficulty: easy, type: mcq, prompt: "data[\"Ada\"][\"age\"] reads…", choices: ["Ada's age", "every age", "Ada's whole record", "the key age"], answer: 0 }
        - id: fs-w05-d3-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            orders = [{"amount": 1500}, {"amount": 2500}, {"amount": 1000}]
            total = 0
            for o in orders:
                total += o["amount"]
            print(total)
          accept: ["5000"]
        - id: fs-w05-d3-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            counts = {}
            for pay in ["POS", "Cash", "POS", "Transfer", "POS"]:
                counts[pay] = counts.get(pay, 0) + 1
            print(counts["POS"])
          accept: ["3"]
        - id: fs-w05-d3-g09
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            people = [{"name": "Ada", "age": 24}, {"name": "Emeka", "age": 30}]
            print(people[1]["name"])
          accept: ["Emeka"]
        - id: fs-w05-d3-g10
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            totals = {"Food": 3200, "Transport": 500, "Data": 1500}
            print(max(totals, key=totals.get))
          accept: ["Food"]
        - { id: fs-w05-d3-g11, difficulty: medium, type: truefalse, prompt: "totals[city] += amount works even the first time a city appears.", answer: false, explain: "KeyError: use totals.get(city, 0) + amount." }
        - id: fs-w05-d3-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            orders = [{"city": "Lagos"}, {"city": "Kano"}, {"city": "Lagos"}]
            cities = []
            for o in orders:
                if o["city"] not in cities:
                    cities.append(o["city"])
            print(len(cities))
          accept: ["2"]
        - { id: fs-w05-d3-g13, difficulty: medium, type: order, prompt: "Order the counting pattern.", items: ["totals = {}", "for order in orders:", "city = order[\"city\"]", "totals[city] = totals.get(city, 0) + order[\"amount\"]"] }
        - id: fs-w05-d3-g14
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            shop = {"items": ["rice", "beans"], "city": "Abuja"}
            shop["items"].append("yam")
            print(len(shop["items"]))
          accept: ["3"]
        - { id: fs-w05-d3-g15, difficulty: medium, type: mcq, prompt: "Best structure for 2,400 sales, each with a city, item and amount?", choices: ["A list of dictionaries", "One long string", "Three unrelated variables", "A dictionary with one key"], answer: 0 }
        - id: fs-w05-d3-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            orders = [{"city": "Lagos", "amount": 100}, {"city": "Abuja", "amount": 400}, {"city": "Lagos", "amount": 350}]
            totals = {}
            for o in orders:
                totals[o["city"]] = totals.get(o["city"], 0) + o["amount"]
            best = max(totals, key=totals.get)
            print(best, totals[best])
          accept: ["Lagos 450"]
        - id: fs-w05-d3-g17
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            data = {"Ada": {"scores": [70, 80]}, "Tolu": {"scores": [90]}}
            data["Tolu"]["scores"].append(60)
            print(sum(data["Tolu"]["scores"]) / len(data["Tolu"]["scores"]))
          accept: ["75.0"]
        - id: fs-w05-d3-g18
          difficulty: hard
          type: mcq
          prompt: "What does this print?"
          code: |
            totals = {"b": 5, "a": 9, "c": 1}
            print(max(totals), max(totals, key=totals.get))
          choices: ["c a", "a a", "c c", "9 a"]
          answer: 0
    quizzes:
      - kind: rapid-fire
        title: "Name that exception"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w05-d3-rf01, difficulty: easy, type: mcq, prompt: "int(\"ten\")", choices: ["ValueError", "TypeError", "KeyError", "NameError"], answer: 0 }
          - { id: fs-w05-d3-rf02, difficulty: easy, type: mcq, prompt: "10 / 0", choices: ["ZeroDivisionError", "ValueError", "MathError", "IndexError"], answer: 0 }
          - { id: fs-w05-d3-rf03, difficulty: easy, type: mcq, prompt: "prices[\"egusi\"] (missing)", choices: ["KeyError", "IndexError", "ValueError", "NameError"], answer: 0 }
          - { id: fs-w05-d3-rf04, difficulty: easy, type: mcq, prompt: "[1, 2][5]", choices: ["IndexError", "KeyError", "ValueError", "TypeError"], answer: 0 }
          - { id: fs-w05-d3-rf05, difficulty: easy, type: mcq, prompt: "open(\"missing.txt\")", choices: ["FileNotFoundError", "KeyError", "IOError only", "ValueError"], answer: 0 }
          - { id: fs-w05-d3-rf06, difficulty: easy, type: mcq, prompt: "\"Age: \" + 30", choices: ["TypeError", "ValueError", "NameError", "SyntaxError"], answer: 0 }
          - { id: fs-w05-d3-rf07, difficulty: easy, type: mcq, prompt: "Catch an error", choices: ["try / except", "if / else", "catch / throw", "for / break"], answer: 0 }
          - { id: fs-w05-d3-rf08, difficulty: easy, type: mcq, prompt: "Runs only if nothing went wrong", choices: ["else", "finally", "except", "pass"], answer: 0 }
          - { id: fs-w05-d3-rf09, difficulty: easy, type: mcq, prompt: "Runs no matter what", choices: ["finally", "else", "except", "always"], answer: 0 }
          - { id: fs-w05-d3-rf10, difficulty: easy, type: mcq, prompt: "Raise your own error", choices: ["raise ValueError(\"…\")", "throw ValueError", "error(\"…\")", "except ValueError"], answer: 0 }
