          - { id: fs-w13-d5-rf07, difficulty: easy, type: mcq, prompt: "Sum of price × qty", choices: ["cart.reduce((s, i) => s + i.price * i.qty, 0)", "cart.sum()", "cart.length * price", "Math.total(cart)"], answer: 0 }
