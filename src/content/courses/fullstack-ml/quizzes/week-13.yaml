        title: "Follow the data"
        questions:
          - id: fs-w13-d5-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const cart = [{ price: 3500, qty: 2 }, { price: 700, qty: 1 }]
              const plates = cart.reduce((n, i) => n + i.qty, 0)
              const total = cart.reduce((s, i) => s + i.price * i.qty, 0)
              console.log(`${plates} plates · ₦${total.toLocaleString("en-NG")}`)
            accept: ["3 plates · ₦7,700"]
          - id: fs-w13-d5-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const add = (c, dish) =>
                c.some((i) => i.id === dish.id)
                  ? c.map((i) => (i.id === dish.id ? { ...i, qty: i.qty + 1 } : i))
                  : [...c, { ...dish, qty: 1 }]
              let cart = []
              cart = add(cart, { id: 1 })
              cart = add(cart, { id: 1 })
              cart = add(cart, { id: 2 })
              console.log(cart.map((i) => `${i.id}x${i.qty}`).join(" "))
            accept: ["1x2 2x1"]
          - id: fs-w13-d5-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const changeQty = (c, id, d) => c.map((i) => (i.id === id ? { ...i, qty: i.qty + d } : i)).filter((i) => i.qty > 0)
              console.log(changeQty([{ id: 1, qty: 1 }, { id: 2, qty: 2 }], 1, -1).length)
            accept: ["1"]
          - { id: fs-w13-d5-bt04, difficulty: hard, type: mcq, prompt: "The cart header (in Layout) and the menu (in Page) both need the cart. State lives in…", choices: ["App, above both", "Layout", "Page", "each, copied"], answer: 0 }
