# Fullstack + ML · Week 13 quizzes. Format and rules: src/content/QUIZZES.md
week: 13
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 12 review"
      covers: "Week 12: Node/npm/Vite, JSX rules, components and props, lists and keys, exports, building and deploying"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w13-d1-g01, difficulty: easy, type: mcq, prompt: "Start a Vite dev server", choices: ["npm run dev", "npm run build", "npm install", "node vite"], answer: 0 }
        - { id: fs-w13-d1-g02, difficulty: easy, type: mcq, prompt: "CSS class in JSX", choices: ["className", "class", "cssClass", "classList"], answer: 0 }
        - { id: fs-w13-d1-g03, difficulty: easy, type: truefalse, prompt: "A component may change its own props.", answer: false }
        - { id: fs-w13-d1-g04, difficulty: easy, type: mcq, prompt: "What's between a component's tags", choices: ["children", "props.inner", "slot", "content"], answer: 0 }
        - { id: fs-w13-d1-g05, difficulty: easy, type: mcq, prompt: "List items need a…", choices: ["key", "class", "ref", "name"], answer: 0 }
        - { id: fs-w13-d1-g06, difficulty: easy, type: mcq, prompt: "Production build folder", choices: ["dist/", "src/", "public/", "node_modules/"], answer: 0 }
        - { id: fs-w13-d1-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["export default", "any import name"], ["export const", "import with braces"], ["base", "site's path on the server"], ["key", "stable identity in a list"]] }
        - { id: fs-w13-d1-g08, difficulty: medium, type: mcq, prompt: "{count && <p>Items</p>} with count = 0 renders…", choices: ["0", "nothing", "Items", "false"], answer: 0 }
        - { id: fs-w13-d1-g09, difficulty: medium, type: mcq, prompt: "price=\"3500\" then price + 500 →", choices: ["\"3500500\"", "4000", "NaN", "error"], answer: 0 }
        - { id: fs-w13-d1-g10, difficulty: medium, type: truefalse, prompt: "The array index is a fine key for a list you reorder.", answer: false }
        - { id: fs-w13-d1-g11, difficulty: medium, type: text, prompt: "Write JSX that renders DishCard with name \"Zobo\" and price 700 (number).", accept: ["<DishCard name=\"Zobo\" price={700} />", "<DishCard name='Zobo' price={700} />"] }
        - id: fs-w13-d1-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const cats = ["Rice", "Drinks", "Rice", "Sides"]
            console.log([...new Set(cats)].length)
          accept: ["3"]
        - { id: fs-w13-d1-g13, difficulty: medium, type: mcq, prompt: "Deployed React page is blank, assets 404. Fix:", choices: ["set base to the repo path, rebuild", "add keys", "use className", "npm install again"], answer: 0 }
        - { id: fs-w13-d1-g14, difficulty: medium, type: mcq, prompt: "style={{ fontSize: 18 }} →", choices: ["18px", "18em", "error", "18%"], answer: 0 }
        - { id: fs-w13-d1-g15, difficulty: medium, type: mcq, prompt: "<welcome /> (lowercase) renders…", choices: ["an unknown HTML tag, not your component", "your component", "nothing ever", "an error always"], answer: 0 }
        - id: fs-w13-d1-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const order = ["Rice", "Soups", "Drinks"]
            const dishes = [{ c: "Drinks" }, { c: "Rice" }, { c: "Drinks" }]
            console.log(order.map((o) => dishes.filter((d) => d.c === o).length).join("-"))
          accept: ["1-0-2"]
        - { id: fs-w13-d1-g17, difficulty: hard, type: mcq, prompt: "Two items share key 3. React…", choices: ["warns and may mix them up on update", "merges them", "drops one silently with no warning", "fails the build"], answer: 0 }
        - { id: fs-w13-d1-g18, difficulty: hard, type: multi, prompt: "True about JSX (Select all.)", choices: ["{ } holds expressions", "every tag must close", "one parent per return", "if statements go inside { }"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "useState"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w13-d1-rf01, difficulty: easy, type: mcq, prompt: "Data React remembers between renders", choices: ["state", "props", "keys", "refs only"], answer: 0 }
          - { id: fs-w13-d1-rf02, difficulty: easy, type: mcq, prompt: "useState(0) returns…", choices: ["[value, setter]", "a number", "a function only", "an object"], answer: 0 }
          - { id: fs-w13-d1-rf03, difficulty: easy, type: mcq, prompt: "Change state", choices: ["call the setter", "assign to the variable", "edit the DOM", "reload"], answer: 0 }
          - { id: fs-w13-d1-rf04, difficulty: easy, type: mcq, prompt: "Changing state causes…", choices: ["a re-render", "a page reload", "a build", "nothing"], answer: 0 }
          - { id: fs-w13-d1-rf05, difficulty: easy, type: mcq, prompt: "Next value depends on the last", choices: ["setCount((c) => c + 1)", "setCount(count++)", "count += 1", "setCount += 1"], answer: 0 }
          - { id: fs-w13-d1-rf06, difficulty: easy, type: mcq, prompt: "Functions starting with use are…", choices: ["hooks", "props", "events", "components"], answer: 0 }
          - { id: fs-w13-d1-rf07, difficulty: easy, type: truefalse, prompt: "Two <Counter />s share one count.", answer: false }
          - { id: fs-w13-d1-rf08, difficulty: easy, type: mcq, prompt: "Where to call hooks", choices: ["top level of the component", "inside if", "inside loops", "inside handlers"], answer: 0 }
          - { id: fs-w13-d1-rf09, difficulty: easy, type: mcq, prompt: "let count = 0; count++ in a click handler →", choices: ["the screen doesn't change", "the screen updates", "an error", "a reload"], answer: 0 }
          - { id: fs-w13-d1-rf10, difficulty: easy, type: mcq, prompt: "onClick={handleClick()} (with brackets)", choices: ["calls it during render: a bug", "correct", "same as without", "syntax error"], answer: 0 }
      - kind: brain-teaser
        title: "What's the count?"
        questions:
          - { id: fs-w13-d1-bt01, difficulty: medium, type: mcq, prompt: "count = 0; one click runs setCount(count + 1) three times. New count?", choices: ["1", "3", "0", "error"], answer: 0, explain: "All three read the same count (0) from this render." }
          - { id: fs-w13-d1-bt02, difficulty: medium, type: mcq, prompt: "count = 0; one click runs setCount((c) => c + 1) three times. New count?", choices: ["3", "1", "0", "error"], answer: 0 }
          - { id: fs-w13-d1-bt03, difficulty: medium, type: mcq, prompt: "Remove that never goes below 0", choices: ["setCount(Math.max(0, count - 1))", "setCount(count - 1)", "count--", "setCount(-1)"], answer: 0 }
          - { id: fs-w13-d1-bt04, difficulty: hard, type: mcq, prompt: "console.log(count) right after setCount(5) in the same handler prints…", choices: ["the old value", "5", "undefined", "an error"], answer: 0, explain: "State updates show on the next render." }
          - { id: fs-w13-d1-bt05, difficulty: hard, type: mcq, prompt: "Why must hooks not go inside an if?", choices: ["React identifies hooks by call order; it must be the same every render", "if is slow", "style rule only", "they'd run twice"], answer: 0 }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: useState"
      covers: "Week 13 · Day 1: state vs variables, useState, setters, re-render, functional updates, hook rules"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w13-d2-g01, difficulty: easy, type: mcq, prompt: "Import useState", choices: ["import { useState } from \"react\"", "import useState from \"react-dom\"", "require(\"state\")", "React.state()"], answer: 0 }
        - { id: fs-w13-d2-g02, difficulty: easy, type: mcq, prompt: "Starting value of useState(\"\")", choices: ["an empty string", "undefined", "null", "0"], answer: 0 }
        - { id: fs-w13-d2-g03, difficulty: easy, type: truefalse, prompt: "Calling the setter makes React run the component again.", answer: true }
        - { id: fs-w13-d2-g04, difficulty: easy, type: mcq, prompt: "Never do this with state", choices: ["assign to it directly", "read it", "pass it as a prop", "show it"], answer: 0 }
        - { id: fs-w13-d2-g05, difficulty: easy, type: mcq, prompt: "Each component instance has…", choices: ["its own state", "shared state", "no state", "global state"], answer: 0 }
        - { id: fs-w13-d2-g06, difficulty: easy, type: mcq, prompt: "Reset button", choices: ["onClick={() => setCount(0)}", "onClick={setCount(0)}", "count = 0", "onClick=\"reset\""], answer: 0 }
        - { id: fs-w13-d2-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["useState", "remember a value"], ["setter", "change it + re-render"], ["(c) => c + 1", "update from the latest value"], ["hook rules", "top level, same order"]] }
        - { id: fs-w13-d2-g08, difficulty: medium, type: text, prompt: "Write the line that creates a state called plates starting at 0.", accept: ["const [plates, setPlates] = useState(0)", "const [plates, setPlates] = useState(0);"] }
        - { id: fs-w13-d2-g09, difficulty: medium, type: mcq, prompt: "Three setCount(count + 1) calls in one click, count 4 →", choices: ["5", "7", "4", "error"], answer: 0 }
        - { id: fs-w13-d2-g10, difficulty: medium, type: truefalse, prompt: "useState inside a for loop is fine.", answer: false }
        - { id: fs-w13-d2-g11, difficulty: medium, type: mcq, prompt: "Pass a handler, not call it", choices: ["onClick={add}", "onClick={add()}", "onClick=\"add()\"", "onclick={add}"], answer: 0 }
        - { id: fs-w13-d2-g12, difficulty: medium, type: mcq, prompt: "A re-render means…", choices: ["React calls your component again and updates what changed", "the page reloads", "the server restarts", "CSS reloads"], answer: 0 }
        - { id: fs-w13-d2-g13, difficulty: medium, type: mcq, prompt: "Toggle a boolean", choices: ["setOpen((o) => !o)", "setOpen(!)", "open = !open", "setOpen(toggle)"], answer: 0 }
        - { id: fs-w13-d2-g14, difficulty: medium, type: text, prompt: "count is 2. After one click running setCount((c) => c * 2) twice, count is?", accept: ["8"] }
        - { id: fs-w13-d2-g15, difficulty: medium, type: mcq, prompt: "State vs props", choices: ["state is owned and changed by the component; props come from the parent", "same thing", "props change, state can't", "state is global"], answer: 0 }
        - { id: fs-w13-d2-g16, difficulty: hard, type: text, prompt: "count is 5. One click runs setCount(count + 1) then setCount((c) => c + 10). New count?", accept: ["16"], explain: "First queued value 6, then 6 + 10." }
        - { id: fs-w13-d2-g17, difficulty: hard, type: mcq, prompt: "Expensive starting value read from localStorage once", choices: ["useState(() => localStorage.getItem(\"x\"))", "useState(localStorage.getItem(\"x\")) always the same", "useEffect only", "global variable"], answer: 0, explain: "The function form runs only on the first render." }
        - { id: fs-w13-d2-g18, difficulty: hard, type: multi, prompt: "True? (Select all.)", choices: ["state updates show on the next render", "the function form avoids stale values", "each instance has its own state", "hooks can be called conditionally"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Forms and events"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w13-d2-rf01, difficulty: easy, type: mcq, prompt: "A controlled input has…", choices: ["value={state} + onChange", "only defaultValue", "an id", "a ref only"], answer: 0 }
          - { id: fs-w13-d2-rf02, difficulty: easy, type: mcq, prompt: "The text in an onChange handler", choices: ["e.target.value", "e.value", "this.value", "e.text"], answer: 0 }
          - { id: fs-w13-d2-rf03, difficulty: easy, type: mcq, prompt: "Stop the form reloading", choices: ["e.preventDefault()", "return false", "e.stop()", "form.cancel()"], answer: 0 }
          - { id: fs-w13-d2-rf04, difficulty: easy, type: mcq, prompt: "Form submit handler goes on…", choices: ["<form onSubmit={…}>", "<button onSubmit>", "<input onSubmit>", "window"], answer: 0 }
          - { id: fs-w13-d2-rf05, difficulty: easy, type: mcq, prompt: "A value computed from state, not stored", choices: ["derived value", "prop", "effect", "key"], answer: 0 }
          - { id: fs-w13-d2-rf06, difficulty: easy, type: truefalse, prompt: "A <select> can be controlled like an input.", answer: true }
          - { id: fs-w13-d2-rf07, difficulty: easy, type: mcq, prompt: "Disable Send until valid", choices: ["<button disabled={!canSend}>", "<button off>", "<button if={canSend}>", "button.hidden"], answer: 0 }
          - { id: fs-w13-d2-rf08, difficulty: easy, type: mcq, prompt: "Nigerian mobile number check", choices: ["/^0\\d{10}$/", "/\\d+/", "/^0$/", "/^\\d{5}$/"], answer: 0 }
          - { id: fs-w13-d2-rf09, difficulty: easy, type: mcq, prompt: "Show the address only for delivery", choices: ["{mode === \"delivery\" && <input … />}", "<input if=delivery>", "{mode && <input>}", "hidden={delivery}"], answer: 0 }
          - { id: fs-w13-d2-rf10, difficulty: easy, type: mcq, prompt: "Live character count", choices: ["{notes.length}/200", "store a separate count state", "count on submit only", "CSS counter"], answer: 0 }
      - kind: brain-teaser
        title: "Controlled or not?"
        questions:
          - { id: fs-w13-d2-bt01, difficulty: medium, type: mcq, prompt: "<input value={name} /> with no onChange: typing…", choices: ["does nothing (React keeps it at name)", "works normally", "crashes", "clears it"], answer: 0 }
          - { id: fs-w13-d2-bt02, difficulty: medium, type: mcq, prompt: "Why derive phoneOk instead of storing it?", choices: ["it can never get out of sync with phone", "it's faster", "React requires it", "to save memory"], answer: 0 }
          - id: fs-w13-d2-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const ok = (p) => /^0\d{10}$/.test(p)
              console.log(ok("08031234567"), ok("8031234567"), ok("0803 123 4567"))
            accept: ["true false false"]
          - { id: fs-w13-d2-bt04, difficulty: hard, type: mcq, prompt: "Submit without preventDefault in React →", choices: ["the browser reloads the page and state is lost", "nothing", "React prevents it", "an error only"], answer: 0 }
          - id: fs-w13-d2-bt05
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              const name = "  Ada "
              const phone = "08031234567"
              const canSend = name.trim() !== "" && /^0\d{10}$/.test(phone)
              console.log(canSend, `Thanks, ${name.trim()}!`)
            accept: ["true Thanks, Ada!"]

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: controlled forms"
      covers: "Week 13 · Day 2: controlled inputs and selects, event objects, onSubmit + preventDefault, derived values, disabling buttons"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w13-d3-g01, difficulty: easy, type: mcq, prompt: "Input text in a handler", choices: ["e.target.value", "e.input", "value()", "e.data only"], answer: 0 }
        - { id: fs-w13-d3-g02, difficulty: easy, type: mcq, prompt: "Controlled means…", choices: ["React state holds the input's value", "the input is disabled", "it has validation", "it's required"], answer: 0 }
        - { id: fs-w13-d3-g03, difficulty: easy, type: truefalse, prompt: "In React you still call e.preventDefault() in onSubmit.", answer: true }
        - { id: fs-w13-d3-g04, difficulty: easy, type: mcq, prompt: "A derived value is…", choices: ["calculated from state each render", "stored in its own state", "a prop", "an effect"], answer: 0 }
        - { id: fs-w13-d3-g05, difficulty: easy, type: mcq, prompt: "Event for typing in React inputs", choices: ["onChange", "onType", "onKey", "onInputChange"], answer: 0 }
        - { id: fs-w13-d3-g06, difficulty: easy, type: mcq, prompt: "Show the error only when filled and wrong", choices: ["{phone && !phoneOk && <p>…</p>}", "{!phoneOk && <p>}", "{phone || <p>}", "{phoneOk ? <p>}"], answer: 0 }
        - { id: fs-w13-d3-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["value + onChange", "controlled input"], ["e.preventDefault()", "no reload"], ["disabled={!ok}", "block bad submits"], ["{a && <X />}", "show conditionally"]] }
        - { id: fs-w13-d3-g08, difficulty: medium, type: text, prompt: "Write the onChange for an input bound to state name (arrow function).", accept: ["onChange={(e) => setName(e.target.value)}", "onChange={e => setName(e.target.value)}"] }
        - { id: fs-w13-d3-g09, difficulty: medium, type: mcq, prompt: "Store both name and nameIsValid in state. Risk?", choices: ["they can disagree; derive validity instead", "none", "React forbids it", "slower typing only"], answer: 0 }
        - { id: fs-w13-d3-g10, difficulty: medium, type: truefalse, prompt: "value without onChange makes a read-only box (React warns).", answer: true }
        - { id: fs-w13-d3-g11, difficulty: medium, type: mcq, prompt: "Controlled select", choices: ["<select value={mode} onChange={(e) => setMode(e.target.value)}>", "<select selected={mode}>", "<select onSelect>", "<option value={mode}>"], answer: 0 }
        - id: fs-w13-d3-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const notes = "No pepper, extra dodo"
            console.log(`${notes.length}/200`)
          accept: ["21/200"]
        - { id: fs-w13-d3-g13, difficulty: medium, type: mcq, prompt: "After sending, show a thank-you instead of the form", choices: ["if (sent) return <p>Thanks…</p>", "hide the form with CSS only", "reload the page", "alert()"], answer: 0 }
        - { id: fs-w13-d3-g14, difficulty: medium, type: mcq, prompt: "Validate only after the user typed something because…", choices: ["errors on an empty, untouched form feel hostile", "React requires it", "regex fails on empty", "it's faster"], answer: 0 }
        - { id: fs-w13-d3-g15, difficulty: medium, type: mcq, prompt: "Where does a controlled input's truth live?", choices: ["in state", "in the DOM", "in localStorage", "in the server"], answer: 0 }
        - id: fs-w13-d3-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const form = { name: "Ada", phone: "0803123456" }
            const errors = []
            if (!form.name.trim()) errors.push("name")
            if (!/^0\d{10}$/.test(form.phone)) errors.push("phone")
            console.log(errors.length ? errors.join(",") : "ok")
          accept: ["phone"]
        - { id: fs-w13-d3-g17, difficulty: hard, type: mcq, prompt: "A big form with 10 fields: tidy state", choices: ["one object state + update with { ...form, [field]: value }", "10 separate globals", "store in the DOM", "no state"], answer: 0 }
        - { id: fs-w13-d3-g18, difficulty: hard, type: multi, prompt: "Good form habits (Select all.)", choices: ["controlled inputs", "derived validation", "preventDefault on submit", "storing every derived value in state"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Immutable updates"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w13-d3-rf01, difficulty: easy, type: mcq, prompt: "Add to an array in state", choices: ["setCart([...cart, item])", "cart.push(item)", "cart[cart.length] = item", "cart.add(item)"], answer: 0 }
          - { id: fs-w13-d3-rf02, difficulty: easy, type: mcq, prompt: "Remove from an array in state", choices: ["setCart(cart.filter((i) => i.id !== id))", "cart.splice(i, 1)", "delete cart[i]", "cart.pop()"], answer: 0 }
          - { id: fs-w13-d3-rf03, difficulty: easy, type: mcq, prompt: "Update one item", choices: ["cart.map((i) => (i.id === id ? { ...i, qty: i.qty + 1 } : i))", "cart[i].qty++", "cart.find(id).qty++", "cart.qty++"], answer: 0 }
          - { id: fs-w13-d3-rf04, difficulty: easy, type: mcq, prompt: "Change one field of an object in state", choices: ["setCustomer({ ...customer, area: \"Surulere\" })", "customer.area = \"Surulere\"", "setCustomer(\"Surulere\")", "Object.set(customer)"], answer: 0 }
          - { id: fs-w13-d3-rf05, difficulty: easy, type: mcq, prompt: "Why new copies?", choices: ["React compares references to see changes", "copies are faster", "JS forbids changes", "for CSS"], answer: 0 }
          - { id: fs-w13-d3-rf06, difficulty: easy, type: truefalse, prompt: "cart.push(x) then setCart(cart) reliably re-renders.", answer: false }
          - { id: fs-w13-d3-rf07, difficulty: easy, type: mcq, prompt: "This idea is called…", choices: ["immutability", "mutation", "hoisting", "closure"], answer: 0 }
          - { id: fs-w13-d3-rf08, difficulty: easy, type: mcq, prompt: "[...a, x] puts x…", choices: ["at the end", "at the start", "in the middle", "nowhere"], answer: 0 }
          - { id: fs-w13-d3-rf09, difficulty: easy, type: mcq, prompt: "[x, ...a] puts x…", choices: ["at the start", "at the end", "replacing a", "nowhere"], answer: 0 }
          - { id: fs-w13-d3-rf10, difficulty: easy, type: mcq, prompt: "Toggle fav on dish 3", choices: ["dishes.map((d) => (d.id === 3 ? { ...d, fav: !d.fav } : d))", "dishes[3].fav = !fav", "dishes.fav(3)", "toggle(dishes)"], answer: 0 }
      - kind: brain-teaser
        title: "New array, same data?"
        questions:
          - id: fs-w13-d3-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const cart = [{ id: 1, qty: 1 }]
              const next = [...cart, { id: 2, qty: 1 }]
              console.log(cart.length, next.length, cart === next)
            accept: ["1 2 false"]
          - id: fs-w13-d3-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const cart = [{ id: 1, qty: 1 }, { id: 2, qty: 3 }]
              const next = cart.map((i) => (i.id === 2 ? { ...i, qty: i.qty + 1 } : i))
              console.log(cart[1].qty, next[1].qty, cart[0] === next[0])
            accept: ["3 4 true"]
          - id: fs-w13-d3-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const a = [1, 2, 3]
              const b = a
              b.push(4)
              console.log(a.length, a === b)
            accept: ["4 true"]
          - { id: fs-w13-d3-bt04, difficulty: hard, type: mcq, prompt: "Why does the bt03 situation break React updates?", choices: ["the 'new' state is the same array, so React may skip the render", "push is slow", "arrays can't hold numbers", "it doesn't"], answer: 0 }
          - id: fs-w13-d3-bt05
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              const c = { name: "Ada", area: "Yaba" }
              const d = { ...c, area: "Surulere" }
              console.log(c.area, d.area, d.name)
            accept: ["Yaba Surulere Ada"]

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: arrays and objects in state"
      covers: "Week 13 · Day 3: immutability; add with spread, remove with filter, update with map; objects with spread"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w13-d4-g01, difficulty: easy, type: mcq, prompt: "Add an item immutably", choices: ["[...list, item]", "list.push(item)", "list.unshift(item)", "list.add(item)"], answer: 0 }
        - { id: fs-w13-d4-g02, difficulty: easy, type: mcq, prompt: "Remove id 7", choices: ["list.filter((x) => x.id !== 7)", "list.splice(7)", "delete list[7]", "list.remove(7)"], answer: 0 }
        - { id: fs-w13-d4-g03, difficulty: easy, type: truefalse, prompt: "map returns a new array.", answer: true }
