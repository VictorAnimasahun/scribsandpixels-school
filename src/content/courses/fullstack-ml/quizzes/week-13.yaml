      bank:
        - { id: fs-w13-d5-g01, difficulty: easy, type: mcq, prompt: "Import useEffect", choices: ["import { useEffect } from \"react\"", "import effect from \"react\"", "React.effect()", "require(\"effect\")"], answer: 0 }
