        - { id: fs-w13-d5-g03, difficulty: easy, type: truefalse, prompt: "Fetching belongs in an effect, not directly in the render.", answer: true }
        - { id: fs-w13-d5-g04, difficulty: easy, type: mcq, prompt: "Cleanup is…", choices: ["a function the effect returns", "a hook called useCleanup", "a CSS reset", "React.clean()"], answer: 0 }
