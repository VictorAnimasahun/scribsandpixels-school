# Fullstack + ML · Week 12 quizzes. Format and rules: src/content/QUIZZES.md
week: 12
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 11 review"
      covers: "Week 11: CSS Grid, auto-fit + minmax, grid areas, custom properties, responsive images, multi-page sites with a shared header"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w12-d1-g01, difficulty: easy, type: mcq, prompt: "Two-direction layout", choices: ["Grid", "Flexbox", "float", "position"], answer: 0 }
        - { id: fs-w12-d1-g02, difficulty: easy, type: mcq, prompt: "Cards that fit any screen", choices: ["repeat(auto-fit, minmax(220px, 1fr))", "repeat(3, 220px)", "width: 33%", "columns: auto"], answer: 0 }
        - { id: fs-w12-d1-g03, difficulty: easy, type: truefalse, prompt: "Custom properties are defined in :root to be used page-wide.", answer: true }
        - { id: fs-w12-d1-g04, difficulty: easy, type: mcq, prompt: "Same-shape photos without squashing", choices: ["aspect-ratio + object-fit: cover", "width: 100% only", "object-fit: fill", "height: 300px only"], answer: 0 }
        - { id: fs-w12-d1-g05, difficulty: easy, type: mcq, prompt: "Mark the current page link", choices: ["aria-current=\"page\"", "class=\"now\" only", "role=\"current\"", "current"], answer: 0 }
        - { id: fs-w12-d1-g06, difficulty: easy, type: mcq, prompt: "Load images only near the screen", choices: ["loading=\"lazy\"", "defer", "async", "hidden"], answer: 0 }
        - { id: fs-w12-d1-g07, difficulty: medium, type: text, prompt: "Container 620px, columns repeat(3, 1fr), gap 10px. Column width (px)?", accept: ["200", "200px"] }
        - { id: fs-w12-d1-g08, difficulty: medium, type: match, prompt: "Match.", pairs: [["grid-template-areas", "draw the page layout"], ["var(--brand)", "use a token"], ["srcset", "offer file sizes"], ["defer", "run script after HTML"]] }
        - { id: fs-w12-d1-g09, difficulty: medium, type: mcq, prompt: "Phone layout with areas: you change…", choices: ["the area map in a media query", "the HTML order", "JavaScript", "nothing possible"], answer: 0 }
        - { id: fs-w12-d1-g10, difficulty: medium, type: truefalse, prompt: "A section can redefine a variable just for its own content.", answer: true }
        - { id: fs-w12-d1-g11, difficulty: medium, type: text, prompt: "A 400px-wide box with aspect-ratio 4 / 3. Height (px)?", accept: ["300", "300px"] }
        - { id: fs-w12-d1-g12, difficulty: medium, type: mcq, prompt: "Why build the header once in site.js?", choices: ["change it in one place, every page updates", "it loads faster", "GitHub needs it", "CSS can't style copied headers"], answer: 0 }
        - id: fs-w12-d1-g13
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const path = "/mama-put-kitchen/"
            console.log(path.split("/").pop() || "index.html")
          accept: ["index.html"]
        - { id: fs-w12-d1-g14, difficulty: medium, type: mcq, prompt: ":root { --c: red } .box { --c: blue } .box p { color: var(--c) } — the p is…", choices: ["blue", "red", "black", "invalid"], answer: 0 }
        - { id: fs-w12-d1-g15, difficulty: medium, type: mcq, prompt: "Decorative image alt", choices: ["alt=\"\"", "alt=\"image\"", "no alt", "alt=\"decoration image\""], answer: 0 }
        - { id: fs-w12-d1-g16, difficulty: hard, type: text, prompt: "Screen 500px, repeat(auto-fit, minmax(220px, 1fr)), gap 20px. Column width (px)?", accept: ["240", "240px"] }
        - { id: fs-w12-d1-g17, difficulty: hard, type: mcq, prompt: "A 2× phone 400px wide, srcset 400w/800w/1600w, sizes 100vw. File chosen?", choices: ["800w", "400w", "1600w", "none"], answer: 0 }
        - { id: fs-w12-d1-g18, difficulty: hard, type: multi, prompt: "True? (Select all.)", choices: ["fr shares space left after gaps", "Grid areas must be rectangles", "var() can't be used in a media query condition", "auto-fit always needs a media query"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Node, npm, Vite"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w12-d1-rf01, difficulty: easy, type: mcq, prompt: "Runs JavaScript outside the browser", choices: ["Node.js", "npm", "Vite", "React"], answer: 0 }
          - { id: fs-w12-d1-rf02, difficulty: easy, type: mcq, prompt: "Downloads packages", choices: ["npm", "Node", "Vite", "Git"], answer: 0 }
          - { id: fs-w12-d1-rf03, difficulty: easy, type: mcq, prompt: "Creates the project, dev server, builds", choices: ["Vite", "npm", "React", "GitHub"], answer: 0 }
          - { id: fs-w12-d1-rf04, difficulty: easy, type: mcq, prompt: "Start the dev server", choices: ["npm run dev", "npm start build", "vite deploy", "node dev"], answer: 0 }
          - { id: fs-w12-d1-rf05, difficulty: easy, type: mcq, prompt: "Folder you never edit or commit", choices: ["node_modules", "src", "public", "dist only"], answer: 0 }
          - { id: fs-w12-d1-rf06, difficulty: easy, type: mcq, prompt: "Lists the project's dependencies and scripts", choices: ["package.json", "index.html", "main.jsx", ".gitignore"], answer: 0 }
          - { id: fs-w12-d1-rf07, difficulty: easy, type: mcq, prompt: "Component names start with…", choices: ["a capital letter", "a lowercase letter", "a $", "use"], answer: 0 }
          - { id: fs-w12-d1-rf08, difficulty: easy, type: mcq, prompt: "HTML-looking code inside JS", choices: ["JSX", "JSON", "XML", "HTMX"], answer: 0 }
          - { id: fs-w12-d1-rf09, difficulty: easy, type: truefalse, prompt: "Browsers run JSX directly.", answer: false }
          - { id: fs-w12-d1-rf10, difficulty: easy, type: mcq, prompt: "Use a component called Greeting", choices: ["<Greeting />", "Greeting()", "<greeting>", "{Greeting}"], answer: 0 }
      - kind: brain-teaser
        title: "First component"
        questions:
          - { id: fs-w12-d1-bt01, difficulty: medium, type: mcq, prompt: "A component is…", choices: ["a function that returns what to show", "a CSS file", "an HTML page", "a database row"], answer: 0 }
          - { id: fs-w12-d1-bt02, difficulty: medium, type: mcq, prompt: "Why must component names be capitalised?", choices: ["JSX treats lowercase tags as HTML elements", "style rule only", "npm requires it", "it's faster"], answer: 0 }
          - { id: fs-w12-d1-bt03, difficulty: medium, type: mcq, prompt: "main.jsx usually…", choices: ["puts <App /> into #root", "holds the CSS", "lists packages", "builds dist/"], answer: 0 }
          - { id: fs-w12-d1-bt04, difficulty: hard, type: mcq, prompt: "You cloned a React repo; npm run dev says vite: not found. Fix:", choices: ["npm install first", "delete package.json", "install React globally", "use Python"], answer: 0 }
          - { id: fs-w12-d1-bt05, difficulty: hard, type: mcq, prompt: "Why not commit node_modules?", choices: ["it's huge and npm install recreates it from package.json", "it's secret", "Git can't store JS", "it's empty"], answer: 0 }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: Node, npm, Vite and components"
      covers: "Week 12 · Day 1: Node vs npm vs Vite, project files, npm run dev, components, JSX, createRoot"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w12-d2-g01, difficulty: easy, type: mcq, prompt: "Create a Vite React project", choices: ["npm create vite@latest my-app -- --template react", "npm new react", "vite react new", "node create react"], answer: 0 }
        - { id: fs-w12-d2-g02, difficulty: easy, type: mcq, prompt: "Download a project's packages", choices: ["npm install", "npm get", "node install", "vite install"], answer: 0 }
        - { id: fs-w12-d2-g03, difficulty: easy, type: truefalse, prompt: "npm comes with Node.", answer: true }
        - { id: fs-w12-d2-g04, difficulty: easy, type: mcq, prompt: "The div React fills", choices: ["#root", "#app always", "body", "#react"], answer: 0 }
        - { id: fs-w12-d2-g05, difficulty: easy, type: mcq, prompt: "Vite's dev server address", choices: ["http://localhost:5173", "http://localhost:80", "file://", "github.io"], answer: 0 }
        - { id: fs-w12-d2-g06, difficulty: easy, type: mcq, prompt: "Which version of Node to install", choices: ["LTS", "the oldest", "nightly", "any beta"], answer: 0 }
        - { id: fs-w12-d2-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["Node.js", "runs JS on your laptop"], ["npm", "downloads packages"], ["Vite", "dev server + build"], ["React", "builds UIs from components"]] }
        - { id: fs-w12-d2-g08, difficulty: medium, type: text, prompt: "Write the JSX to use a component named MenuCard (no props).", accept: ["<MenuCard />", "<MenuCard/>", "<MenuCard></MenuCard>"] }
        - { id: fs-w12-d2-g09, difficulty: medium, type: mcq, prompt: "<menuCard /> (lowercase) renders…", choices: ["an unknown HTML element, not your component", "your component", "an error always", "nothing"], answer: 0 }
        - { id: fs-w12-d2-g10, difficulty: medium, type: truefalse, prompt: "A component must return something renderable (JSX, a string, or null).", answer: true }
        - { id: fs-w12-d2-g11, difficulty: medium, type: mcq, prompt: "Live reload means…", choices: ["save the file, the browser updates", "the server restarts daily", "Git commits for you", "the page refreshes every second"], answer: 0 }
        - { id: fs-w12-d2-g12, difficulty: medium, type: mcq, prompt: "Where does the dist/ folder come from?", choices: ["npm run build", "npm install", "npm run dev", "git clone"], answer: 0 }
        - { id: fs-w12-d2-g13, difficulty: medium, type: mcq, prompt: "Render App into #root", choices: ["ReactDOM.createRoot(document.getElementById(\"root\")).render(<App />)", "React.render(App)", "document.root = <App />", "App.mount('#root')"], answer: 0 }
        - { id: fs-w12-d2-g14, difficulty: medium, type: text, prompt: "Command to check Node is installed and see its version?", accept: ["node --version", "node -v"] }
        - { id: fs-w12-d2-g15, difficulty: medium, type: mcq, prompt: "Last week's site.js header was a step towards…", choices: ["components: one piece, reused everywhere", "databases", "CSS Grid", "APIs"], answer: 0 }
        - { id: fs-w12-d2-g16, difficulty: hard, type: mcq, prompt: "A teammate adds a package. You pull their code. Before npm run dev you should…", choices: ["npm install (package.json changed)", "delete node_modules forever", "nothing ever", "reinstall Node"], answer: 0 }
        - { id: fs-w12-d2-g17, difficulty: hard, type: mcq, prompt: "function welcome() { return <h1>Hi</h1> } then <welcome /> shows…", choices: ["nothing useful: React treats it as an HTML tag", "Hi", "a crash on build only", "welcome"], answer: 0 }
        - { id: fs-w12-d2-g18, difficulty: hard, type: multi, prompt: "Files in a fresh Vite React project (Select all.)", choices: ["index.html", "package.json", "src/main.jsx", "manage.py"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "JSX rules"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w12-d2-rf01, difficulty: easy, type: mcq, prompt: "CSS class in JSX", choices: ["className", "class", "cssClass", "classes"], answer: 0 }
          - { id: fs-w12-d2-rf02, difficulty: easy, type: mcq, prompt: "Insert a JS value", choices: ["{price}", "${price}", "{{price}}", "(price)"], answer: 0 }
          - { id: fs-w12-d2-rf03, difficulty: easy, type: mcq, prompt: "Image tag in JSX", choices: ["<img src=\"a.jpg\" alt=\"…\" />", "<img src=\"a.jpg\">", "<img>a.jpg</img>", "<image />"], answer: 0 }
          - { id: fs-w12-d2-rf04, difficulty: easy, type: mcq, prompt: "Wrap two siblings without a div", choices: ["<> </> (a fragment)", "<div hidden>", "[ ]", "<span>"], answer: 0 }
          - { id: fs-w12-d2-rf05, difficulty: easy, type: mcq, prompt: "Show only if soldOut", choices: ["{soldOut && <p>Sold out</p>}", "{if (soldOut) <p>…}", "<p if={soldOut}>", "{soldOut ? <p>}"], answer: 0 }
          - { id: fs-w12-d2-rf06, difficulty: easy, type: mcq, prompt: "Choose between two", choices: ["{ok ? \"Yes\" : \"No\"}", "{if ok \"Yes\" else \"No\"}", "{ok || \"Yes\" : \"No\"}", "<if ok>"], answer: 0 }
          - { id: fs-w12-d2-rf07, difficulty: easy, type: mcq, prompt: "Inline style in JSX", choices: ["style={{ color: \"red\" }}", "style=\"color: red\"", "style={color: red}", "css={red}"], answer: 0 }
          - { id: fs-w12-d2-rf08, difficulty: easy, type: mcq, prompt: "font-weight in a style object", choices: ["fontWeight", "font-weight", "fontweight", "FontWeight"], answer: 0 }
          - { id: fs-w12-d2-rf09, difficulty: easy, type: mcq, prompt: "A JSX comment", choices: ["{/* note */}", "<!-- note -->", "// note", "# note"], answer: 0 }
          - { id: fs-w12-d2-rf10, difficulty: easy, type: truefalse, prompt: "You can put an if statement directly inside { } in JSX.", answer: false }
      - kind: brain-teaser
        title: "What renders?"
        questions:
          - { id: fs-w12-d2-bt01, difficulty: medium, type: mcq, prompt: "const n = 0; {n && <p>Items</p>} renders…", choices: ["0", "nothing", "Items", "false"], answer: 0, explain: "0 is falsy, so && returns 0, and React prints numbers. Use n > 0 &&." }
          - { id: fs-w12-d2-bt02, difficulty: medium, type: text, prompt: "price = 3500. What does <p>₦{price.toLocaleString(\"en-NG\")}</p> show?", accept: ["₦3,500"] }
          - { id: fs-w12-d2-bt03, difficulty: medium, type: mcq, prompt: "return <h1>A</h1><p>B</p> (no wrapper)", choices: ["syntax error: one parent needed", "renders both", "renders only A", "renders only B"], answer: 0 }
          - { id: fs-w12-d2-bt04, difficulty: hard, type: mcq, prompt: "{false}, {null}, {undefined} in JSX render…", choices: ["nothing", "the words false/null/undefined", "an error", "0"], answer: 0 }
          - { id: fs-w12-d2-bt05, difficulty: hard, type: mcq, prompt: "Fix: {count && <p>{count} in cart</p>} shows a stray 0 when empty", choices: ["{count > 0 && …}", "{count ?? …}", "{!count && …}", "{count || …}"], answer: 0 }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: JSX rules"
      covers: "Week 12 · Day 2: one parent and fragments, className, {expressions}, closing tags, && and ternaries, style objects"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w12-d3-g01, difficulty: easy, type: mcq, prompt: "class in JSX is written", choices: ["className", "class", "klass", "cls"], answer: 0 }
        - { id: fs-w12-d3-g02, difficulty: easy, type: mcq, prompt: "A fragment", choices: ["<> </>", "<frag>", "<div>", "{ }"], answer: 0 }
        - { id: fs-w12-d3-g03, difficulty: easy, type: truefalse, prompt: "Every JSX tag must be closed, including <img />.", answer: true }
        - { id: fs-w12-d3-g04, difficulty: easy, type: mcq, prompt: "{ } in JSX holds…", choices: ["a JavaScript expression", "a CSS rule", "a comment only", "HTML"], answer: 0 }
        - { id: fs-w12-d3-g05, difficulty: easy, type: mcq, prompt: "style in JSX is…", choices: ["an object", "a string", "an array", "a class"], answer: 0 }
        - { id: fs-w12-d3-g06, difficulty: easy, type: mcq, prompt: "Ternary syntax", choices: ["cond ? a : b", "cond ?? a : b", "if cond a else b", "cond => a | b"], answer: 0 }
        - { id: fs-w12-d3-g07, difficulty: medium, type: match, prompt: "HTML → JSX.", pairs: [["class=\"x\"", "className=\"x\""], ["<br>", "<br />"], ["style=\"color: red\"", "style={{ color: \"red\" }}"], ["<!-- c -->", "{/* c */}"]] }
        - { id: fs-w12-d3-g08, difficulty: medium, type: text, prompt: "Write JSX that shows <p>Sold out</p> only when soldOut is true.", accept: ["{soldOut && <p>Sold out</p>}"] }
        - { id: fs-w12-d3-g09, difficulty: medium, type: mcq, prompt: "Why return ( … ) with brackets?", choices: ["so multi-line JSX isn't cut off by automatic semicolons", "React requires brackets", "for speed", "for CSS"], answer: 0 }
        - { id: fs-w12-d3-g10, difficulty: medium, type: truefalse, prompt: "A for loop can't go directly inside JSX braces, but map can.", answer: true }
        - { id: fs-w12-d3-g11, difficulty: medium, type: mcq, prompt: "background-color in a style object", choices: ["backgroundColor", "background-color", "bgColor", "BackgroundColor"], answer: 0 }
        - { id: fs-w12-d3-g12, difficulty: medium, type: text, prompt: "Write a ternary that shows \"Open\" if isOpen, else \"Closed\" (just the JSX expression in braces).", accept: ["{isOpen ? \"Open\" : \"Closed\"}", "{isOpen ? 'Open' : 'Closed'}"] }
        - { id: fs-w12-d3-g13, difficulty: medium, type: mcq, prompt: "Read a Vite error overlay for class= in JSX. It usually means…", choices: ["you must use className", "React is broken", "reinstall Node", "nothing"], answer: 0 }
        - { id: fs-w12-d3-g14, difficulty: medium, type: mcq, prompt: "alt={name} vs alt=\"{name}\"", choices: ["the first uses the variable; the second is the literal text {name}", "same", "both errors", "second uses the variable"], answer: 0 }
        - { id: fs-w12-d3-g15, difficulty: medium, type: mcq, prompt: "Show nothing at all", choices: ["return null", "return false string", "return \"\" only", "return undefined in HTML"], answer: 0 }
        - { id: fs-w12-d3-g16, difficulty: hard, type: mcq, prompt: "items = []; {items.length && <p>Cart</p>} shows…", choices: ["0", "nothing", "Cart", "[]"], answer: 0 }
        - { id: fs-w12-d3-g17, difficulty: hard, type: mcq, prompt: "style={{ fontSize: 18 }} gives…", choices: ["18px (React adds px for numbers)", "18em", "an error", "no size"], answer: 0 }
        - { id: fs-w12-d3-g18, difficulty: hard, type: multi, prompt: "Valid JSX (Select all.)", choices: ["<img src={url} alt=\"\" />", "<p>{a + b}</p>", "<>{x}</>", "<p class=\"x\">"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Props"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w12-d3-rf01, difficulty: easy, type: mcq, prompt: "Props are…", choices: ["a component's inputs", "its CSS", "its state", "its file"], answer: 0 }
          - { id: fs-w12-d3-rf02, difficulty: easy, type: mcq, prompt: "Pass a number", choices: ["price={3500}", "price=\"3500\" (number)", "price=3500", "{price: 3500}"], answer: 0 }
          - { id: fs-w12-d3-rf03, difficulty: easy, type: mcq, prompt: "Pass a string", choices: ["name=\"Moi moi\"", "name={Moi moi}", "name=Moi moi", "name:{\"Moi moi\"}"], answer: 0 }
          - { id: fs-w12-d3-rf04, difficulty: easy, type: mcq, prompt: "<DishCard spicy /> sets spicy to…", choices: ["true", "\"spicy\"", "undefined", "false"], answer: 0 }
          - { id: fs-w12-d3-rf05, difficulty: easy, type: mcq, prompt: "Read props neatly", choices: ["function DishCard({ name, price })", "function DishCard(name, price)", "DishCard.props", "this.name"], answer: 0 }
          - { id: fs-w12-d3-rf06, difficulty: easy, type: mcq, prompt: "Default for a prop", choices: ["{ spicy = false }", "{ spicy || false }", "spicy: default", "@default spicy"], answer: 0 }
          - { id: fs-w12-d3-rf07, difficulty: easy, type: truefalse, prompt: "A component may change its own props.", answer: false }
          - { id: fs-w12-d3-rf08, difficulty: easy, type: mcq, prompt: "What's between a component's tags", choices: ["children", "inner", "content", "slot"], answer: 0 }
          - { id: fs-w12-d3-rf09, difficulty: easy, type: mcq, prompt: "Props are like…", choices: ["function arguments", "global variables", "CSS classes", "database tables"], answer: 0 }
          - { id: fs-w12-d3-rf10, difficulty: easy, type: mcq, prompt: "Small components combined into bigger ones is called…", choices: ["composition", "inheritance", "compilation", "hosting"], answer: 0 }
      - kind: brain-teaser
        title: "Read the props"
        questions:
          - { id: fs-w12-d3-bt01, difficulty: medium, type: mcq, prompt: "<DishCard name=\"Jollof\" price=\"3500\" /> then price + 500 is…", choices: ["\"3500500\" (a string!)", "4000", "NaN", "an error"], answer: 0 }
          - { id: fs-w12-d3-bt02, difficulty: medium, type: mcq, prompt: "function Card({ title }) used as <Card name=\"A\" /> shows title as…", choices: ["undefined (nothing)", "A", "name", "an error"], answer: 0 }
          - { id: fs-w12-d3-bt03, difficulty: medium, type: mcq, prompt: "<Section title=\"Rice\"><DishCard … /></Section>: the DishCard arrives as…", choices: ["children", "title", "props.dish", "nothing"], answer: 0 }
          - id: fs-w12-d3-bt04
            difficulty: hard
            type: text
            prompt: "Plain JavaScript, same idea as props. What does this print?"
            code: |
              function label({ name, price, spicy = false }) {
                return `${name}${spicy ? " (hot)" : ""}: ${price}`
              }
              console.log(label({ name: "Pepper soup", price: 3000, spicy: true }), "|", label({ name: "Moi moi", price: 1000 }))
            accept: ["Pepper soup (hot): 3000 | Moi moi: 1000"]
          - { id: fs-w12-d3-bt05, difficulty: hard, type: mcq, prompt: "Why are props read-only?", choices: ["the parent owns the data; changing it below would make the UI unpredictable", "JavaScript forbids it", "for speed", "no reason"], answer: 0 }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: components and props"
      covers: "Week 12 · Day 3: props, strings vs braces, boolean props, defaults, read-only props, children, composition"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w12-d4-g01, difficulty: easy, type: mcq, prompt: "Pass the number 3000 as price", choices: ["price={3000}", "price=\"3000\"", "price=3000", "{3000}"], answer: 0 }
        - { id: fs-w12-d4-g02, difficulty: easy, type: mcq, prompt: "Content between tags arrives as", choices: ["children", "content", "inner", "body"], answer: 0 }
        - { id: fs-w12-d4-g03, difficulty: easy, type: truefalse, prompt: "Props flow from parent to child.", answer: true }
        - { id: fs-w12-d4-g04, difficulty: easy, type: mcq, prompt: "<Badge sale /> means sale is…", choices: ["true", "\"sale\"", "false", "null"], answer: 0 }
        - { id: fs-w12-d4-g05, difficulty: easy, type: mcq, prompt: "Default value for size", choices: ["function Btn({ size = \"md\" })", "function Btn({ size: \"md\" })", "Btn.size = \"md\" only", "size ||= md"], answer: 0 }
        - { id: fs-w12-d4-g06, difficulty: easy, type: mcq, prompt: "A component can change its props?", choices: ["No, they're read-only", "Yes, any time", "Only strings", "Only in Vite"], answer: 0 }
        - { id: fs-w12-d4-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["name=\"Moi moi\"", "a string prop"], ["price={1000}", "a number prop"], ["spicy", "a true boolean prop"], ["children", "what's between the tags"]] }
        - { id: fs-w12-d4-g08, difficulty: medium, type: text, prompt: "Write the JSX to use DishCard with name Zobo and price 700 (a number).", accept: ["<DishCard name=\"Zobo\" price={700} />", "<DishCard name='Zobo' price={700} />", "<DishCard price={700} name=\"Zobo\" />"] }
        - { id: fs-w12-d4-g09, difficulty: medium, type: mcq, prompt: "Section({ title, children }) returns…", choices: ["<section><h2>{title}</h2>{children}</section>", "<section>{title.children}</section>", "<section children={title} />", "{children.title}"], answer: 0 }
        - { id: fs-w12-d4-g10, difficulty: medium, type: truefalse, prompt: "An optional photo prop can be shown with {photo && <img src={photo} alt=\"\" />}.", answer: true }
