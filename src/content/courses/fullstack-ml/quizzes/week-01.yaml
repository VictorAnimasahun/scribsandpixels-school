# Fullstack + ML · Week 1 quizzes. Format and rules: src/content/QUIZZES.md
week: 1
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: how this school works"
      covers: "Course overview: daily structure, rules, phases"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w01-d1-g01, difficulty: easy, type: mcq, prompt: "How long is this Fullstack + ML program?", choices: ["6 months", "12 months", "2 years", "3 months"], answer: 1 }
        - { id: fs-w01-d1-g02, difficulty: easy, type: mcq, prompt: "Roughly how long is each study day, Monday to Saturday?", choices: ["About 1 hour", "About 2.5–3 hours", "About 5 hours", "About 8 hours"], answer: 1 }
        - { id: fs-w01-d1-g03, difficulty: easy, type: truefalse, prompt: "Sunday is rest plus a 1-hour weekly review.", answer: true }
        - { id: fs-w01-d1-g04, difficulty: easy, type: mcq, prompt: "Which programming language do you start with?", choices: ["Python", "Java", "C#", "Swift"], answer: 0 }
        - { id: fs-w01-d1-g05, difficulty: easy, type: mcq, prompt: "What is the last block of every study day?", choices: ["Review", "Log", "Practice", "Lesson"], answer: 1 }
        - { id: fs-w01-d1-g06, difficulty: easy, type: truefalse, prompt: "Copy-pasting the code examples is fine, it saves time.", answer: false, explain: "Rule: type, don't copy. Your hands need to learn too." }
        - { id: fs-w01-d1-g07, difficulty: medium, type: order, prompt: "Put the daily blocks in order.", items: ["Review", "Lesson", "Practice", "Mini-task", "Log"] }
        - { id: fs-w01-d1-g08, difficulty: medium, type: mcq, prompt: "How long is the daily Review block?", choices: ["10 min", "30 min", "45 min", "60 min"], answer: 1 }
        - { id: fs-w01-d1-g09, difficulty: medium, type: match, prompt: "Match the phase to its focus.", pairs: [["Phase 1", "Foundations"], ["Phase 3", "Backend"], ["Phase 5", "Machine learning"], ["Phase 6", "Job-ready"]] }
        - { id: fs-w01-d1-g10, difficulty: medium, type: mcq, prompt: "The rule \"Watch twice\" means…", choices: ["Watch twice in a row at 2× speed", "First for the overview, second pausing and doing it yourself", "Watch with a friend", "Watch it again the next week"], answer: 1 }
        - { id: fs-w01-d1-g11, difficulty: medium, type: mcq, prompt: "Why is \"confusion is good\"?", choices: ["It means your brain is working", "It means you can skip ahead", "It means the lesson is wrong", "It isn't; avoid it"], answer: 0 }
        - { id: fs-w01-d1-g12, difficulty: medium, type: mcq, prompt: "What is the Phase 1 milestone?", choices: ["A job board app", "A personal webpage + a Python script that prints Lagos weather", "A house price model", "The capstone"], answer: 1 }
        - { id: fs-w01-d1-g13, difficulty: medium, type: truefalse, prompt: "You should wait until you feel ready before applying for work.", answer: false, explain: "Rule: apply early. You'll never feel ready." }
        - { id: fs-w01-d1-g14, difficulty: medium, type: mcq, prompt: "Your daily log answers which three things?", choices: ["What I learned, what confused me, what to review tomorrow", "Mood, food, sleep", "Hours, pages, videos", "Bugs, tests, commits"], answer: 0 }
        - { id: fs-w01-d1-g15, difficulty: medium, type: mcq, prompt: "Which book is \"THE\" machine-learning book in Phase 5?", choices: ["Hands-On Machine Learning (Géron)", "Automate the Boring Stuff", "Two Scoops of Django", "Eloquent JavaScript"], answer: 0 }
        - { id: fs-w01-d1-g16, difficulty: hard, type: multi, prompt: "Which are rules of this school? (Select all.)", choices: ["Never skip review", "Watch twice", "Type, don't copy", "Skip parts that confuse you", "Apply early"], answers: [0, 1, 2, 4] }
        - { id: fs-w01-d1-g17, difficulty: hard, type: mcq, prompt: "In which phase is your first fullstack app deployed live on the internet?", choices: ["Phase 2", "Phase 3", "Phase 4", "Phase 6"], answer: 2 }
        - { id: fs-w01-d1-g18, difficulty: hard, type: mcq, prompt: "\"Never skip review\" because…", choices: ["Forgetting is normal; not reviewing is the real failure", "Reviews are graded", "It's the easiest block", "The lesson depends on it technically"], answer: 0 }
    quizzes:
      - kind: rapid-fire
        title: "print() speed round"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w01-d1-rf01, difficulty: easy, type: mcq, prompt: "Which function shows text on the screen?", choices: ["print", "input", "show", "echo"], answer: 0 }
          - { id: fs-w01-d1-rf02, difficulty: easy, type: mcq, prompt: "print(\"Hi\") shows…", choices: ["Hi", "\"Hi\"", "print Hi", "an error"], answer: 0 }
          - { id: fs-w01-d1-rf03, difficulty: easy, type: mcq, prompt: "Text in Python goes inside…", choices: ["quotes", "#", "square brackets only", "nothing"], answer: 0 }
          - { id: fs-w01-d1-rf04, difficulty: easy, type: truefalse, prompt: "python --version shows which Python you have installed.", answer: true }
          - { id: fs-w01-d1-rf05, difficulty: easy, type: mcq, prompt: "Installing on Windows, which box must you tick?", choices: ["Add to PATH", "Install games", "Dark mode", "Skip tutorial"], answer: 0 }
          - { id: fs-w01-d1-rf06, difficulty: easy, type: truefalse, prompt: "Print(\"hi\") with a capital P works.", answer: false, explain: "Python is case-sensitive: it's print." }
          - { id: fs-w01-d1-rf07, difficulty: easy, type: mcq, prompt: "A program is…", choices: ["instructions a computer follows", "a monitor", "a website", "a type of file only"], answer: 0 }
          - { id: fs-w01-d1-rf08, difficulty: easy, type: mcq, prompt: "Deep down, computers work with…", choices: ["0s and 1s", "letters", "colours", "sounds"], answer: 0 }
          - { id: fs-w01-d1-rf09, difficulty: easy, type: mcq, prompt: "print(2 + 3) shows…", choices: ["5", "2 + 3", "23", "an error"], answer: 0 }
          - { id: fs-w01-d1-rf10, difficulty: easy, type: text, prompt: "Type the line that prints Hello", accept: ["print(\"Hello\")", "print('Hello')"] }
      - kind: brain-teaser
        title: "Read the code"
        questions:
          - id: fs-w01-d1-bt01
            difficulty: medium
            type: mcq
            prompt: "What does this print?"
            code: |
              print("2 + 3")
            choices: ["2 + 3", "5", "an error", "23"]
            answer: 0
            explain: "Inside quotes it's text, so Python prints it exactly."
          - id: fs-w01-d1-bt02
            difficulty: medium
            type: mcq
            prompt: "Why does this crash?"
            code: |
              print("Hello)
            choices: ["The closing quote is missing", "print needs a capital P", "Hello is too long", "It doesn't crash"]
            answer: 0
          - { id: fs-w01-d1-bt03, difficulty: medium, type: order, prompt: "Order the steps to run your very first program.", items: ["Install Python", "Open the terminal", "Type python and press Enter", "Type print(\"Hello, world!\")", "Press Enter"] }
          - { id: fs-w01-d1-bt04, difficulty: hard, type: text, prompt: "Write one line that prints: I am learning to code", accept: ["print(\"I am learning to code\")", "print('I am learning to code')"] }
          - { id: fs-w01-d1-bt05, difficulty: hard, type: multi, prompt: "Which lines are valid Python? (Select all.)", choices: ["print(\"hi\")", "Print(\"hi\")", "print(hi\")", "print('hi')", "print(\"hi\", \"there\")"], answers: [0, 3, 4] }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: your first program"
      covers: "Week 1 · Day 1: what a program is, installing Python, print()"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w01-d2-g01, difficulty: easy, type: mcq, prompt: "Which command checks that Python is installed?", choices: ["python --version", "python install", "check python", "print version"], answer: 0 }
        - { id: fs-w01-d2-g02, difficulty: easy, type: mcq, prompt: "What does print() do?", choices: ["Shows output on the screen", "Sends a file to the printer", "Saves the program", "Reads the keyboard"], answer: 0 }
        - { id: fs-w01-d2-g03, difficulty: easy, type: truefalse, prompt: "print(\"Hello, world!\") is a complete Python program.", answer: true }
        - { id: fs-w01-d2-g04, difficulty: easy, type: mcq, prompt: "To start typing Python straight into the terminal, you type…", choices: ["python", "start", "run code", "print"], answer: 0 }
        - { id: fs-w01-d2-g05, difficulty: easy, type: truefalse, prompt: "Python cares about capital letters: print and Print are different.", answer: true }
        - { id: fs-w01-d2-g06, difficulty: easy, type: mcq, prompt: "Computers understand instructions ultimately as…", choices: ["binary (0s and 1s)", "English", "pictures", "music"], answer: 0 }
        - id: fs-w01-d2-g07
          difficulty: medium
          type: mcq
          prompt: "What does this show?"
          code: |
            print("I am learning to code")
          choices: ["I am learning to code", "\"I am learning to code\"", "print I am learning to code", "an error"]
          answer: 0
        - id: fs-w01-d2-g08
          difficulty: medium
          type: mcq
          prompt: "What's wrong with this line?"
          code: |
            print(Hello)
          choices: ["Hello needs quotes to be text", "print needs a capital", "Nothing", "Brackets should be square"]
          answer: 0
        - { id: fs-w01-d2-g09, difficulty: medium, type: text, prompt: "Write the line that prints: One day I will be a software engineer", accept: ["print(\"One day I will be a software engineer\")", "print('One day I will be a software engineer')"] }
        - id: fs-w01-d2-g10
          difficulty: medium
          type: text
          prompt: "How many lines does this print? (a number)"
          code: |
            print("My name is Emeka")
            print("I am learning to code")
            print("One day I will be a software engineer")
          accept: ["3", "three"]
        - { id: fs-w01-d2-g11, difficulty: medium, type: mcq, prompt: "In CS50 Week 0, a \"program\" is best described as…", choices: ["a set of step-by-step instructions", "a computer part", "the internet", "a password"], answer: 0 }
        - { id: fs-w01-d2-g12, difficulty: medium, type: mcq, prompt: "You type print(\"Hi\" and press Enter. What happens?", choices: ["A syntax error: the bracket isn't closed", "It prints Hi", "It prints nothing, silently", "The computer restarts"], answer: 0 }
        - id: fs-w01-d2-g13
          difficulty: medium
          type: mcq
          prompt: "What does this show?"
          code: |
            print(10 - 4)
          choices: ["6", "10 - 4", "104", "an error"]
          answer: 0
        - { id: fs-w01-d2-g14, difficulty: medium, type: truefalse, prompt: "Single and double quotes both work for text: print('Hi') and print(\"Hi\").", answer: true }
        - { id: fs-w01-d2-g15, difficulty: medium, type: order, prompt: "Order the Day 1 lesson steps.", items: ["Download Python from python.org", "Install it (tick Add to PATH)", "Open the terminal", "Check python --version", "Run print(\"Hello, world!\")"] }
        - id: fs-w01-d2-g16
          difficulty: hard
          type: mcq
          prompt: "What does this show?"
          code: |
            print("5" + "5")
          choices: ["55", "10", "5 + 5", "an error"]
          answer: 0
          explain: "Both are text, so + joins them."
        - id: fs-w01-d2-g17
          difficulty: hard
          type: mcq
          prompt: "What does this show?"
          code: |
            print("Lagos", "Abuja")
          choices: ["Lagos Abuja", "LagosAbuja", "Lagos, Abuja", "an error"]
          answer: 0
          explain: "Commas in print() put a space between the items."
        - { id: fs-w01-d2-g18, difficulty: hard, type: multi, prompt: "Which of these print a number calculated by Python? (Select all.)", choices: ["print(7 * 6)", "print(\"7 * 6\")", "print(100 / 4)", "print(\"42\")"], answers: [0, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Variables & types"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w01-d2-rf01, difficulty: easy, type: mcq, prompt: "\"Emeka\" is a…", choices: ["string (text)", "integer", "float", "boolean"], answer: 0 }
          - { id: fs-w01-d2-rf02, difficulty: easy, type: mcq, prompt: "35 is an…", choices: ["integer", "string", "float", "list"], answer: 0 }
          - { id: fs-w01-d2-rf03, difficulty: easy, type: mcq, prompt: "1.75 is a…", choices: ["float", "integer", "string", "boolean"], answer: 0 }
          - { id: fs-w01-d2-rf04, difficulty: easy, type: mcq, prompt: "\"35\" (with quotes) is a…", choices: ["string", "integer", "float", "number"], answer: 0 }
          - { id: fs-w01-d2-rf05, difficulty: easy, type: mcq, prompt: "Which line creates a variable?", choices: ["age = 35", "age == 35", "35 = age", "print(age)"], answer: 0 }
          - { id: fs-w01-d2-rf06, difficulty: easy, type: truefalse, prompt: "A variable name can contain spaces, like my age = 35.", answer: false }
          - { id: fs-w01-d2-rf07, difficulty: easy, type: truefalse, prompt: "You can change a variable's value later.", answer: true }
          - { id: fs-w01-d2-rf08, difficulty: easy, type: mcq, prompt: "Which file extension is a Python script?", choices: [".py", ".txt", ".doc", ".python"], answer: 0 }
          - { id: fs-w01-d2-rf09, difficulty: easy, type: mcq, prompt: "Run about_me.py from the terminal with…", choices: ["python about_me.py", "run about_me", "open about_me.py", "print about_me.py"], answer: 0 }
          - { id: fs-w01-d2-rf10, difficulty: easy, type: mcq, prompt: "cd Desktop means…", choices: ["go into the Desktop folder", "copy Desktop", "delete Desktop", "create Desktop"], answer: 0 }
      - kind: brain-teaser
        title: "Predict and fix"
        questions:
          - id: fs-w01-d2-bt01
            difficulty: medium
            type: mcq
            prompt: "What does this print?"
            code: |
              name = "Ada"
              name = "Tunde"
              print(name)
            choices: ["Tunde", "Ada", "Ada Tunde", "an error"]
            answer: 0
            explain: "The second assignment replaces the first."
          - id: fs-w01-d2-bt02
            difficulty: medium
            type: mcq
            prompt: "What happens?"
            code: |
              age = 35
              name = "Emeka"
              print(age + name)
            choices: ["TypeError: you can't add a number and text", "35Emeka", "Emeka35", "35 Emeka"]
            answer: 0
          - id: fs-w01-d2-bt03
            difficulty: medium
            type: text
            prompt: "Fix the last line so it prints: I am 35 (use str)"
            code: |
              age = 35
              print("I am " + age)
            accept: ["print(\"I am \" + str(age))", "print('I am ' + str(age))"]
          - id: fs-w01-d2-bt04
            difficulty: hard
            type: mcq
            prompt: "What does this print?"
            code: |
              city = "Lagos"
              print("city")
            choices: ["city", "Lagos", "\"Lagos\"", "an error"]
            answer: 0
            explain: "In quotes, city is just text; without quotes it's the variable."
          - id: fs-w01-d2-bt05
            difficulty: hard
            type: mcq
            prompt: "What does this print?"
            code: |
              a = 10
              b = a
              a = 20
              print(b)
            choices: ["10", "20", "30", "an error"]
            answer: 0
            explain: "b got a copy of the value 10; changing a later doesn't change b."

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: variables and types"
      covers: "Week 1 · Day 2: variables, strings, integers, floats, TypeError"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w01-d3-g01, difficulty: easy, type: mcq, prompt: "A variable is…", choices: ["a name that stores a value", "a type of loop", "an error message", "a Python file"], answer: 0 }
        - { id: fs-w01-d3-g02, difficulty: easy, type: mcq, prompt: "Which is a string?", choices: ["\"Lagos\"", "42", "3.5", "True"], answer: 0 }
        - { id: fs-w01-d3-g03, difficulty: easy, type: mcq, prompt: "Which is an integer?", choices: ["42", "4.2", "\"42\"", "forty-two"], answer: 0 }
        - { id: fs-w01-d3-g04, difficulty: easy, type: mcq, prompt: "Which is a float?", choices: ["1.75", "175", "\"1.75\"", "one point seven"], answer: 0 }
        - { id: fs-w01-d3-g05, difficulty: easy, type: truefalse, prompt: "The = sign in age = 35 means \"store 35 in age\".", answer: true }
        - { id: fs-w01-d3-g06, difficulty: easy, type: mcq, prompt: "Which variable name is valid?", choices: ["dream_job", "dream job", "2job", "dream-job"], answer: 0 }
        - id: fs-w01-d3-g07
          difficulty: medium
          type: mcq
          prompt: "What does this print?"
          code: |
            name = "Emeka"
            age = 35
            print("My name is", name, "and I am", age, "years old")
          choices: ["My name is Emeka and I am 35 years old", "My name is name and I am age years old", "an error", "My name isEmekaand I am35years old"]
          answer: 0
        - id: fs-w01-d3-g08
          difficulty: medium
          type: mcq
          prompt: "Which error does this cause?"
          code: |
            print(35 + "Emeka")
          choices: ["TypeError", "NameError", "SyntaxError", "No error"]
          answer: 0
        - id: fs-w01-d3-g09
          difficulty: medium
          type: mcq
          prompt: "Which error does this cause?"
          code: |
            print(nmae)
          choices: ["NameError (the variable doesn't exist)", "TypeError", "SyntaxError", "No error"]
          answer: 0
        - { id: fs-w01-d3-g10, difficulty: medium, type: text, prompt: "Write the line that stores the text Abuja in a variable called city.", accept: ["city = \"Abuja\"", "city = 'Abuja'", "city=\"Abuja\"", "city='Abuja'"] }
        - { id: fs-w01-d3-g11, difficulty: medium, type: match, prompt: "Match each value to its type.", pairs: [["\"hello\"", "string"], ["7", "integer"], ["7.0", "float"], ["\"7\"", "string (looks like a number!)"]] }
        - id: fs-w01-d3-g12
          difficulty: medium
          type: mcq
          prompt: "What does this print?"
          code: |
            x = 5
            x = x + 1
            print(x)
          choices: ["6", "5", "x + 1", "51"]
          answer: 0
        - { id: fs-w01-d3-g13, difficulty: medium, type: truefalse, prompt: "\"35\" + \"1\" gives \"351\".", answer: true }
        - { id: fs-w01-d3-g14, difficulty: medium, type: mcq, prompt: "How do you turn the number 35 into text?", choices: ["str(35)", "text(35)", "int(\"35\")", "\"35\" + 0"], answer: 0 }
        - { id: fs-w01-d3-g15, difficulty: medium, type: truefalse, prompt: "Reading an error message carefully is a key programming skill.", answer: true }
        - id: fs-w01-d3-g16
          difficulty: hard
          type: mcq
          prompt: "What does this print?"
          code: |
            height = 1.75
            print(height * 2)
          choices: ["3.5", "1.751.75", "3", "an error"]
          answer: 0
        - id: fs-w01-d3-g17
          difficulty: hard
          type: mcq
          prompt: "What does this print?"
          code: |
            word = "ha"
            print(word * 3)
          choices: ["hahaha", "ha3", "an error", "ha ha ha"]
          answer: 0
        - { id: fs-w01-d3-g18, difficulty: hard, type: multi, prompt: "Which lines run without an error? (Select all.)", choices: ["print(\"Age: \" + str(35))", "print(\"Age: \" + 35)", "print(\"Age:\", 35)", "print(35 + 1)"], answers: [0, 2, 3] }
    quizzes:
      - kind: rapid-fire
        title: "Input & operators"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w01-d3-rf01, difficulty: easy, type: mcq, prompt: "input() always gives you a…", choices: ["string", "integer", "float", "number"], answer: 0 }
          - { id: fs-w01-d3-rf02, difficulty: easy, type: mcq, prompt: "17 // 5 =", choices: ["3", "3.4", "2", "85"], answer: 0 }
          - { id: fs-w01-d3-rf03, difficulty: easy, type: mcq, prompt: "17 % 5 =", choices: ["2", "3", "3.4", "0"], answer: 0 }
          - { id: fs-w01-d3-rf04, difficulty: easy, type: mcq, prompt: "17 / 5 =", choices: ["3.4", "3", "2", "3.5"], answer: 0 }
          - { id: fs-w01-d3-rf05, difficulty: easy, type: mcq, prompt: "int(\"7\") + 1 =", choices: ["8", "71", "\"8\"", "an error"], answer: 0 }
          - { id: fs-w01-d3-rf06, difficulty: easy, type: mcq, prompt: "\"7\" + \"1\" =", choices: ["\"71\"", "8", "\"8\"", "an error"], answer: 0 }
          - { id: fs-w01-d3-rf07, difficulty: easy, type: mcq, prompt: "Turn \"2.5\" into a number you can calculate with:", choices: ["float(\"2.5\")", "int(\"2.5\")", "str(\"2.5\")", "number(\"2.5\")"], answer: 0 }
          - { id: fs-w01-d3-rf08, difficulty: easy, type: mcq, prompt: "2 ** 3 =", choices: ["8", "6", "9", "5"], answer: 0 }
          - { id: fs-w01-d3-rf09, difficulty: easy, type: truefalse, prompt: "10 % 2 == 0 means 10 is even.", answer: true }
          - { id: fs-w01-d3-rf10, difficulty: easy, type: mcq, prompt: "100 USD at ₦1550 is…", choices: ["155000", "15500", "1550", "1650"], answer: 0 }
      - kind: brain-teaser
        title: "Think like the interpreter"
        questions:
          - id: fs-w01-d3-bt01
            difficulty: medium
            type: mcq
            prompt: "The user types 34. What happens?"
            code: |
              age = input("How old are you? ")
              print(age + 1)
            choices: ["TypeError: age is text", "35", "341", "34"]
            answer: 0
          - id: fs-w01-d3-bt02
            difficulty: medium
            type: text
            prompt: "The user types 34. What is printed? (just the number)"
            code: |
              age = int(input("How old are you? "))
              print(age + 1)
            accept: ["35"]
          - id: fs-w01-d3-bt03
            difficulty: medium
            type: mcq
            prompt: "The user types 2.5. What happens?"
            code: |
              usd = int(input("USD: "))
            choices: ["ValueError: \"2.5\" isn't a whole number", "usd becomes 2", "usd becomes 3", "usd becomes 2.5"]
            answer: 0
            explain: "Use float() for decimals."
          - { id: fs-w01-d3-bt04, difficulty: hard, type: text, prompt: "₦10,000 shared between 3 people in whole naira: how much does each get with 10000 // 3?", accept: ["3333"] }
          - id: fs-w01-d3-bt05
            difficulty: hard
            type: mcq
            prompt: "What does this print?"
            code: |
              minutes = 135
              print(minutes // 60, "h", minutes % 60, "min")
            choices: ["2 h 15 min", "2.25 h 0 min", "2 h 25 min", "135 h 0 min"]
            answer: 0

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: input and maths"
      covers: "Week 1 · Day 3: input(), int(), float(), str(), + - * / // %"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w01-d4-g01, difficulty: easy, type: mcq, prompt: "What does input() return?", choices: ["A string", "An integer", "A float", "Whatever the user typed, as a number"], answer: 0 }
        - { id: fs-w01-d4-g02, difficulty: easy, type: mcq, prompt: "Which turns \"12\" into the number 12?", choices: ["int(\"12\")", "str(12)", "text(\"12\")", "\"12\" * 1"], answer: 0 }
        - { id: fs-w01-d4-g03, difficulty: easy, type: mcq, prompt: "Which operator divides and keeps only the whole part?", choices: ["//", "/", "%", "**"], answer: 0 }
        - { id: fs-w01-d4-g04, difficulty: easy, type: mcq, prompt: "Which operator gives the remainder?", choices: ["%", "//", "/", "*"], answer: 0 }
