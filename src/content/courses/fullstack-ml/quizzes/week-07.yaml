# Fullstack + ML · Week 7 quizzes. Format and rules: src/content/QUIZZES.md
week: 7
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 6 review"
      covers: "Week 6: APIs and requests, weather codes, robust scripts, accessibility, portfolio and gigs"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w07-d1-g01, difficulty: easy, type: mcq, prompt: "Status code for OK", choices: ["200", "404", "500", "400"], answer: 0 }
        - { id: fs-w07-d1-g02, difficulty: easy, type: mcq, prompt: "Turn a requests response into a Python dict", choices: ["response.json()", "response.dict()", "json.dump(response)", "response.text()"], answer: 0 }
        - { id: fs-w07-d1-g03, difficulty: easy, type: mcq, prompt: "Pair with target=\"_blank\"", choices: ["rel=\"noopener\"", "alt=\"\"", "rel=\"stylesheet\"", "href=\"#\""], answer: 0 }
        - { id: fs-w07-d1-g04, difficulty: easy, type: truefalse, prompt: "Open-Meteo needs no API key.", answer: true }
        - { id: fs-w07-d1-g05, difficulty: easy, type: mcq, prompt: "Run main() only when the file is run directly", choices: ["if __name__ == \"__main__\":", "if main:", "while True:", "def __main__():"], answer: 0 }
        - { id: fs-w07-d1-g06, difficulty: easy, type: mcq, prompt: "WhatsApp link for 0803 123 4567", choices: ["https://wa.me/2348031234567", "https://wa.me/08031234567", "wa:+234 803 123 4567", "tel:wa.me/0803"], answer: 0 }
        - id: fs-w07-d1-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            CODES = {0: "Clear sky", 3: "Overcast"}
            print(CODES.get(3, "Unknown"), "|", CODES.get(45, "Unknown"))
          accept: ["Overcast | Unknown"]
        - id: fs-w07-d1-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            def check(status, body):
                if status != 200:
                    raise RuntimeError(body.get("reason", "Unknown error"))
                return body["current"]
            try:
                check(400, {"reason": "Bad latitude"})
            except RuntimeError as e:
                print(e)
          accept: ["Bad latitude"]
        - { id: fs-w07-d1-g09, difficulty: medium, type: match, prompt: "Match the trouble to the fix.", pairs: [["Unknown city", "raise ValueError, catch in main"], ["No internet", "catch requests.exceptions.RequestException"], ["Slow server", "timeout=10"], ["Status 500", "raise RuntimeError with the reason"]] }
        - { id: fs-w07-d1-g10, difficulty: medium, type: mcq, prompt: "Best link text", choices: ["View the weather script on GitHub", "click here", "here", "link"], answer: 0 }
        - { id: fs-w07-d1-g11, difficulty: medium, type: truefalse, prompt: "Removing focus outlines without a replacement hurts keyboard users.", answer: true }
        - id: fs-w07-d1-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            latitude, longitude = (9.06, 7.49)
            print(round(latitude + longitude, 2))
          accept: ["16.55"]
        - { id: fs-w07-d1-g13, difficulty: medium, type: mcq, prompt: "requirements.txt for the weather script lists…", choices: ["requests", "json", "python", "math"], answer: 0 }
        - { id: fs-w07-d1-g14, difficulty: medium, type: mcq, prompt: "Why test weather_report with fake_get?", choices: ["Check the logic offline with saved data; real_get uses the internet", "fake_get is faster in production", "requests can't be imported", "It hides errors"], answer: 0 }
        - { id: fs-w07-d1-g15, difficulty: medium, type: mcq, prompt: "Status 400 means…", choices: ["your request was wrong", "the server crashed", "OK", "not found"], answer: 0 }
        - id: fs-w07-d1-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            def rainy(code):
                return 51 <= code <= 82 or 95 <= code <= 99
            print(sum(1 for c in [0, 61, 82, 83, 96, 45] if rainy(c)))
          accept: ["3"]
        - { id: fs-w07-d1-g17, difficulty: hard, type: mcq, prompt: "Every element in a page measures 0×0. Lighthouse can't help because…", choices: ["it's a rendering problem, not an accessibility rule", "Lighthouse only checks Python", "0×0 is normal", "alt is missing"], answer: 0 }
        - { id: fs-w07-d1-g18, difficulty: hard, type: multi, prompt: "Which belong in the Phase 1 graduation check? (Select all.)", choices: ["weather.py prints a real Lagos report", "No crash on unknown city or no internet", "Site live with links to your repos", "A React app"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "JS basics"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w07-d1-rf01, difficulty: easy, type: mcq, prompt: "Print in JavaScript", choices: ["console.log()", "print()", "echo()", "log.print()"], answer: 0 }
          - { id: fs-w07-d1-rf02, difficulty: easy, type: mcq, prompt: "A variable that never changes", choices: ["const", "let", "var", "fixed"], answer: 0 }
          - { id: fs-w07-d1-rf03, difficulty: easy, type: mcq, prompt: "A variable that will change", choices: ["let", "const", "set", "change"], answer: 0 }
          - { id: fs-w07-d1-rf04, difficulty: easy, type: mcq, prompt: "Don't use…", choices: ["var", "let", "const", "function"], answer: 0 }
          - { id: fs-w07-d1-rf05, difficulty: easy, type: mcq, prompt: "JS comment", choices: ["// note", "# note", "-- note", "<!-- note -->"], answer: 0 }
          - { id: fs-w07-d1-rf06, difficulty: easy, type: mcq, prompt: "Python True in JS", choices: ["true", "True", "TRUE", "1"], answer: 0 }
          - { id: fs-w07-d1-rf07, difficulty: easy, type: mcq, prompt: "Python None in JS", choices: ["null", "None", "nil", "void"], answer: 0 }
          - { id: fs-w07-d1-rf08, difficulty: easy, type: mcq, prompt: "Template literals use…", choices: ["backticks `…`", "double quotes", "f\"…\"", "single quotes"], answer: 0 }
          - { id: fs-w07-d1-rf09, difficulty: easy, type: mcq, prompt: "typeof 42", choices: ["\"number\"", "\"int\"", "\"integer\"", "\"float\""], answer: 0 }
          - { id: fs-w07-d1-rf10, difficulty: easy, type: mcq, prompt: "Blocks in JS are marked by…", choices: ["{ }", "indentation only", "begin/end", "( )"], answer: 0 }
          - { id: fs-w07-d1-rf11, difficulty: easy, type: mcq, prompt: "Where does console.log output appear in the browser?", choices: ["DevTools → Console", "the page", "the address bar", "View Source"], answer: 0 }
      - kind: brain-teaser
        title: "Predict the console"
        questions:
          - id: fs-w07-d1-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const shop = "NaijaMart"
              let price = 1500
              price = price + 200
              console.log(`${shop}: ₦${price}`)
            accept: ["NaijaMart: ₦1700"]
          - id: fs-w07-d1-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              console.log(typeof "5", typeof 5, typeof true)
            accept: ["string number boolean"]
          - id: fs-w07-d1-bt03
            difficulty: medium
            type: mcq
            prompt: "What happens?"
            code: |
              const rate = 1550
              rate = 1600
              console.log(rate)
            choices: ["TypeError: Assignment to constant variable", "1600", "1550", "undefined"]
            answer: 0
          - id: fs-w07-d1-bt04
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              let x
              console.log(typeof x, typeof null)
            accept: ["undefined object"]
          - id: fs-w07-d1-bt05
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              console.log(2 + 3 * 4, `${2 + 3}` + 4)
            accept: ["14 54"]

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: variables and types"
      covers: "Week 7 · Day 1: console, const/let, types and typeof, template literals, script tags"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w07-d2-g01, difficulty: easy, type: mcq, prompt: "Declare a price that will change", choices: ["let price = 1500", "const price = 1500", "price := 1500", "var price == 1500"], answer: 0 }
        - { id: fs-w07-d2-g02, difficulty: easy, type: mcq, prompt: "typeof \"Lagos\"", choices: ["\"string\"", "\"text\"", "\"str\"", "\"word\""], answer: 0 }
        - { id: fs-w07-d2-g03, difficulty: easy, type: truefalse, prompt: "JavaScript has one number type for whole and decimal numbers.", answer: true }
        - { id: fs-w07-d2-g04, difficulty: easy, type: mcq, prompt: "Load app.js into a page", choices: ["<script src=\"app.js\"></script>", "<link href=\"app.js\">", "<js>app.js</js>", "import app.js"], answer: 0 }
        - { id: fs-w07-d2-g05, difficulty: easy, type: mcq, prompt: "Python's f\"{name}\" in JS", choices: ["`${name}`", "\"${name}\"", "f`{name}`", "'{name}'"], answer: 0 }
        - { id: fs-w07-d2-g06, difficulty: easy, type: mcq, prompt: "\"no value yet\" in JS", choices: ["undefined", "None", "empty", "void"], answer: 0 }
        - id: fs-w07-d2-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const name = "Ada"
            const age = 24
            console.log(`${name} is ${age + 1} next year`)
          accept: ["Ada is 25 next year"]
        - id: fs-w07-d2-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            let count = 10
            count = count - 3
            count += 5
            console.log(count)
          accept: ["12"]
        - { id: fs-w07-d2-g09, difficulty: medium, type: match, prompt: "Match the value to typeof.", pairs: [["\"5\"", "string"], ["5", "number"], ["false", "boolean"], ["undefined", "undefined"]] }
        - { id: fs-w07-d2-g10, difficulty: medium, type: mcq, prompt: "Why prefer const by default?", choices: ["You can't reassign it by accident", "It's faster", "let is deprecated", "const works in Python too"], answer: 0 }
        - { id: fs-w07-d2-g11, difficulty: medium, type: truefalse, prompt: "Semicolons at line ends are optional in most JavaScript.", answer: true }
        - id: fs-w07-d2-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            console.log(typeof null)
          accept: ["object"]
          explain: "A famous old JavaScript quirk."
        - { id: fs-w07-d2-g13, difficulty: medium, type: mcq, prompt: "Where do you put the <script> tag for app.js?", choices: ["At the end of <body>", "Before <!DOCTYPE>", "Inside <title>", "In style.css"], answer: 0 }
        - id: fs-w07-d2-g14
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const city = "Abuja"
            console.log(`Welcome to ${city}!`.length)
          accept: ["17"]
        - { id: fs-w07-d2-g15, difficulty: medium, type: mcq, prompt: "Python `is_open = True` in JS:", choices: ["const isOpen = true", "const is_open = True", "let isOpen = True", "isOpen := true"], answer: 0 }
        - id: fs-w07-d2-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            let a = 5
            let b = a
            a = 10
            console.log(a, b)
          accept: ["10 5"]
        - id: fs-w07-d2-g17
          difficulty: hard
          type: mcq
          prompt: "What happens?"
          code: |
            console.log(total)
            let total = 100
          choices: ["ReferenceError: can't access total before it's declared", "100", "undefined", "0"]
          answer: 0
        - { id: fs-w07-d2-g18, difficulty: hard, type: multi, prompt: "Which are valid JavaScript? (Select all.)", choices: ["const x = 5", "let name = \"Ada\"", "console.log(`Hi ${name}`)", "print(f\"Hi {name}\")"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Functions in JS"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w07-d2-rf01, difficulty: easy, type: mcq, prompt: "Python def in JS", choices: ["function", "def", "func", "fn"], answer: 0 }
          - { id: fs-w07-d2-rf02, difficulty: easy, type: mcq, prompt: "Arrow function", choices: ["(x) => x * 2", "x -> x * 2", "lambda x: x * 2", "fn(x) x*2"], answer: 0 }
          - { id: fs-w07-d2-rf03, difficulty: easy, type: mcq, prompt: "Default parameter", choices: ["(name = \"friend\")", "(name: \"friend\")", "(name := \"friend\")", "(default name)"], answer: 0 }
          - { id: fs-w07-d2-rf04, difficulty: easy, type: mcq, prompt: "No return gives back…", choices: ["undefined", "null", "0", "None"], answer: 0 }
          - { id: fs-w07-d2-rf05, difficulty: easy, type: mcq, prompt: "JS naming style", choices: ["camelCase: isEven", "snake_case: is_even", "PascalCase always", "kebab-case"], answer: 0 }
          - { id: fs-w07-d2-rf06, difficulty: easy, type: text, prompt: "(1500000).toLocaleString(\"en-NG\")", accept: ["1,500,000", "\"1,500,000\""] }
          - { id: fs-w07-d2-rf07, difficulty: easy, type: truefalse, prompt: "An arrow function with one expression returns it automatically.", answer: true }
          - { id: fs-w07-d2-rf08, difficulty: easy, type: truefalse, prompt: "An arrow function with { } needs return.", answer: true }
          - { id: fs-w07-d2-rf09, difficulty: easy, type: mcq, prompt: "Call toNaira with 10", choices: ["toNaira(10)", "toNaira 10", "call toNaira(10)", "toNaira[10]"], answer: 0 }
          - { id: fs-w07-d2-rf10, difficulty: easy, type: mcq, prompt: "Function body goes inside…", choices: ["{ }", "( )", "[ ]", "indentation only"], answer: 0 }
      - kind: brain-teaser
        title: "Function puzzles"
        questions:
          - id: fs-w07-d2-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              function area(w, h) {
                return w * h
              }
              console.log(area(4, 5) + 1)
            accept: ["21"]
          - id: fs-w07-d2-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const greet = (name = "friend") => `Hello, ${name}!`
              console.log(greet(), greet("Tolu"))
            accept: ["Hello, friend! Hello, Tolu!"]
          - id: fs-w07-d2-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const add = (a, b) => {
                a + b
              }
              console.log(add(2, 3))
            accept: ["undefined"]
            explain: "With braces you must write return."
          - id: fs-w07-d2-bt04
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              const vat = (amount) => amount * 0.075
              const withVat = (amount) => amount + vat(amount)
              console.log(withVat(2000))
            accept: ["2150"]
          - id: fs-w07-d2-bt05
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              const formatNaira = (n) => "₦" + n.toLocaleString("en-NG")
              console.log(formatNaira(15500 * 3))
            accept: ["₦46,500"]

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: functions"
      covers: "Week 7 · Day 2: function declarations, arrow functions, default parameters, return, toLocaleString"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w07-d3-g01, difficulty: easy, type: mcq, prompt: "Which declares a function?", choices: ["function toNaira(usd) { return usd * 1550 }", "def toNaira(usd): return usd * 1550", "toNaira = usd => { usd * 1550", "func toNaira(usd)"], answer: 0 }
        - { id: fs-w07-d3-g02, difficulty: easy, type: mcq, prompt: "Python `def greet(name=\"friend\"):` in JS", choices: ["function greet(name = \"friend\") {", "function greet(name: \"friend\") {", "def greet(name = \"friend\") {", "greet(name=\"friend\") =>"], answer: 0 }
        - { id: fs-w07-d3-g03, difficulty: easy, type: truefalse, prompt: "Arrow functions are common in modern JS and React.", answer: true }
        - { id: fs-w07-d3-g04, difficulty: easy, type: mcq, prompt: "Python is_even in JS style", choices: ["isEven", "is_even", "IsEven", "iseven"], answer: 0 }
        - { id: fs-w07-d3-g05, difficulty: easy, type: mcq, prompt: "A function without return gives…", choices: ["undefined", "null", "0", "an error"], answer: 0 }
        - { id: fs-w07-d3-g06, difficulty: easy, type: mcq, prompt: "Format 1500 as \"1,500\"", choices: ["(1500).toLocaleString(\"en-NG\")", "format(1500)", "1500.comma()", "String(1500, \",\")"], answer: 0 }
        - id: fs-w07-d3-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            function toNaira(usd) {
              return usd * 1550
            }
            console.log(toNaira(2) + toNaira(1))
          accept: ["4650"]
        - id: fs-w07-d3-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const double = (n) => n * 2
            console.log(double(double(3)))
          accept: ["12"]
        - { id: fs-w07-d3-g09, difficulty: medium, type: match, prompt: "Match Python to JavaScript.", pairs: [["def", "function"], ["None", "undefined / null"], ["True", "true"], ["f\"{x}\"", "`${x}`"]] }
        - id: fs-w07-d3-g10
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            function greet(name = "friend") {
              return "Hi " + name
            }
            console.log(greet(undefined), greet("Ada"))
          accept: ["Hi friend Hi Ada"]
        - { id: fs-w07-d3-g11, difficulty: medium, type: truefalse, prompt: "`const f = (x) => { return x + 1 }` and `const f = (x) => x + 1` behave the same.", answer: true }
        - id: fs-w07-d3-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const square = (n) => { n * n }
            console.log(square(4))
          accept: ["undefined"]
        - { id: fs-w07-d3-g13, difficulty: medium, type: mcq, prompt: "Best way to give a value back to the caller", choices: ["return", "console.log", "print", "alert"], answer: 0 }
        - id: fs-w07-d3-g14
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const formatNaira = (n) => "₦" + n.toLocaleString("en-NG")
            console.log(formatNaira(1234567))
          accept: ["₦1,234,567"]
        - { id: fs-w07-d3-g15, difficulty: medium, type: mcq, prompt: "Arrow functions have no `prototype`, so the sandbox can tell them apart. Which is an arrow function?", choices: ["const vat = (a) => a * 0.075", "function vat(a) { return a * 0.075 }", "const vat = function (a) { return a * 0.075 }", "vat(a) = a * 0.075"], answer: 0 }
        - id: fs-w07-d3-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const applyDiscount = (price, percent = 10) => price - price * percent / 100
            console.log(applyDiscount(5000), applyDiscount(5000, 20))
          accept: ["4500 4000"]
        - id: fs-w07-d3-g17
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            function outer() {
              const inner = (x) => x + 1
              return inner(inner(1))
            }
            console.log(outer())
          accept: ["3"]
        - { id: fs-w07-d3-g18, difficulty: hard, type: multi, prompt: "Which return 10 for f(5)? (Select all.)", choices: ["const f = (n) => n * 2", "function f(n) { return n + 5 }", "const f = (n) => { return n * 2 }", "const f = (n) => { n * 2 }"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Comparisons and logic"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w07-d3-rf01, difficulty: easy, type: mcq, prompt: "Strict equality", choices: ["===", "==", "=", "is"], answer: 0 }
          - { id: fs-w07-d3-rf02, difficulty: easy, type: mcq, prompt: "Strict not equal", choices: ["!==", "!=", "<>", "not"], answer: 0 }
          - { id: fs-w07-d3-rf03, difficulty: easy, type: mcq, prompt: "Python and", choices: ["&&", "and", "&", "AND"], answer: 0 }
          - { id: fs-w07-d3-rf04, difficulty: easy, type: mcq, prompt: "Python or", choices: ["||", "or", "|", "OR"], answer: 0 }
          - { id: fs-w07-d3-rf05, difficulty: easy, type: mcq, prompt: "Python not", choices: ["!", "not", "~", "NOT"], answer: 0 }
          - { id: fs-w07-d3-rf06, difficulty: easy, type: mcq, prompt: "Python elif", choices: ["else if", "elif", "elseif", "elsif"], answer: 0 }
          - { id: fs-w07-d3-rf07, difficulty: easy, type: text, prompt: "5 === \"5\"", accept: ["false"] }
          - { id: fs-w07-d3-rf08, difficulty: easy, type: text, prompt: "5 == \"5\"", accept: ["true"] }
          - { id: fs-w07-d3-rf09, difficulty: easy, type: mcq, prompt: "Ternary operator", choices: ["cond ? a : b", "a if cond else b", "cond ?? a : b", "if cond then a"], answer: 0 }
          - { id: fs-w07-d3-rf10, difficulty: easy, type: truefalse, prompt: "\"0\" is falsy in JavaScript.", answer: false, explain: "Only the empty string is falsy; \"0\" is truthy." }
      - kind: brain-teaser
        title: "Which branch?"
        questions:
          - id: fs-w07-d3-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const score = 64
              if (score >= 70) {
                console.log("A")
              } else if (score >= 60) {
                console.log("B")
              } else {
                console.log("F")
              }
            accept: ["B"]
          - id: fs-w07-d3-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const age = 17
              console.log(age >= 18 ? "Can vote" : "Too young")
            accept: ["Too young"]
          - id: fs-w07-d3-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const values = [0, "", "0", null, "Lagos"]
              let count = 0
              for (const v of values) {
                if (v) count++
              }
              console.log(count)
            accept: ["2"]
          - id: fs-w07-d3-bt04
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              function light(color) {
                switch (color) {
                  case "red": return "Stop"
                  case "green": return "Go"
                  default: return "Broken light"
                }
              }
              console.log(light("Red"))
            accept: ["Broken light"]
            explain: "Comparison is case-sensitive."
          - id: fs-w07-d3-bt05
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              const isStudent = true
              const age = 20
              console.log(age < 12 || isStudent ? 1000 : 2000)
            accept: ["1000"]

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: decisions"
      covers: "Week 7 · Day 3: if / else if / else, === vs ==, &&, ||, !, ternary, truthy/falsy, switch"
