# Fullstack + ML · Week 9 quizzes. Format and rules: src/content/QUIZZES.md
week: 9
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 8 review"
      covers: "Week 8: arrays, objects, map/filter/find, reduce/sort, JSON and storage, destructuring"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w09-d1-g01, difficulty: easy, type: mcq, prompt: "Add to the end of an array", choices: ["push", "pop", "shift", "append"], answer: 0 }
        - { id: fs-w09-d1-g02, difficulty: easy, type: mcq, prompt: "Keep only some items", choices: ["filter", "map", "find", "reduce"], answer: 0 }
        - { id: fs-w09-d1-g03, difficulty: easy, type: mcq, prompt: "Data → JSON text", choices: ["JSON.stringify", "JSON.parse", "String", "toJSON"], answer: 0 }
        - { id: fs-w09-d1-g04, difficulty: easy, type: truefalse, prompt: "localStorage.getItem returns null for a missing key.", answer: true }
        - { id: fs-w09-d1-g05, difficulty: easy, type: mcq, prompt: "Copy an array before sorting", choices: ["[...arr]", "arr.copy()", "copy(arr)", "arr"], answer: 0 }
        - { id: fs-w09-d1-g06, difficulty: easy, type: mcq, prompt: "Two variables from an object", choices: ["const { name, price } = p", "const name, price = p", "const [name, price] = p", "name, price := p"], answer: 0 }
        - id: fs-w09-d1-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const products = [{ n: "A", p: 300 }, { n: "B", p: 100 }, { n: "C", p: 200 }]
            console.log(products.filter((x) => x.p >= 200).map((x) => x.n).join(""))
          accept: ["AC"]
        - id: fs-w09-d1-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            console.log([1200, 500, 2000].reduce((s, x) => s + x, 0))
          accept: ["3700"]
        - { id: fs-w09-d1-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["map", "transform each item"], ["find", "first match"], ["reduce", "combine into one value"], ["some", "at least one passes"]] }
        - id: fs-w09-d1-g10
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const counts = {}
            for (const c of ["Lagos", "Kano", "Lagos"]) counts[c] = (counts[c] ?? 0) + 1
            console.log(JSON.stringify(counts))
          accept: ["{\"Lagos\":2,\"Kano\":1}"]
        - { id: fs-w09-d1-g11, difficulty: medium, type: truefalse, prompt: "[10, 9, 100].sort() sorts numerically.", answer: false }
        - id: fs-w09-d1-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const list = JSON.parse(null ?? "[]")
            console.log(list.length)
          accept: ["0"]
        - { id: fs-w09-d1-g13, difficulty: medium, type: mcq, prompt: "Change one property without changing the original object", choices: ["({ ...p, price: 0 })", "p.price = 0", "Object.freeze(p)", "delete p.price"], answer: 0 }
        - id: fs-w09-d1-g14
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const xs = [5, 2, 9]
            console.log([...xs].sort((a, b) => b - a)[0], xs[0])
          accept: ["9 5"]
        - { id: fs-w09-d1-g15, difficulty: medium, type: mcq, prompt: "Why pass storage into save/load?", choices: ["So tests can use a fake storage", "localStorage requires it", "It's faster", "To encrypt"], answer: 0 }
        - id: fs-w09-d1-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const sales = [{ c: "Food", v: 10 }, { c: "Data", v: 5 }, { c: "Food", v: 7 }]
            const t = sales.reduce((acc, s) => { acc[s.c] = (acc[s.c] ?? 0) + s.v; return acc }, {})
            console.log(Object.entries(t).map(([k, v]) => k + v).join(","))
          accept: ["Food17,Data5"]
        - id: fs-w09-d1-g17
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const add = (list, x) => [...list, x]
            const a = [1]
            const b = add(a, 2)
            console.log(a.length, b.length, a === b)
          accept: ["1 2 false"]
        - { id: fs-w09-d1-g18, difficulty: hard, type: multi, prompt: "Which return a new array? (Select all.)", choices: ["map", "filter", "[...arr].sort()", "arr.sort()"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "DOM basics"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w09-d1-rf01, difficulty: easy, type: mcq, prompt: "DOM stands for…", choices: ["Document Object Model", "Data Object Map", "Display Order Mode", "Document Option Menu"], answer: 0 }
          - { id: fs-w09-d1-rf02, difficulty: easy, type: mcq, prompt: "First element matching a CSS selector", choices: ["document.querySelector", "document.querySelectorAll", "document.find", "document.getAll"], answer: 0 }
          - { id: fs-w09-d1-rf03, difficulty: easy, type: mcq, prompt: "All elements matching", choices: ["document.querySelectorAll", "document.querySelector", "document.all()", "document.select"], answer: 0 }
          - { id: fs-w09-d1-rf04, difficulty: easy, type: mcq, prompt: "Set text safely", choices: ["el.textContent = …", "el.innerHTML = …", "el.text(…)", "el.value = …"], answer: 0 }
          - { id: fs-w09-d1-rf05, difficulty: easy, type: mcq, prompt: "Add a class", choices: ["el.classList.add(\"x\")", "el.class = \"x\"", "el.addClass(\"x\")", "el.style.class = \"x\""], answer: 0 }
          - { id: fs-w09-d1-rf06, difficulty: easy, type: mcq, prompt: "Toggle a class", choices: ["el.classList.toggle(\"dark\")", "el.toggle(\"dark\")", "el.classList.flip(\"dark\")", "el.dark = !el.dark"], answer: 0 }
          - { id: fs-w09-d1-rf07, difficulty: easy, type: mcq, prompt: "Hide an element", choices: ["el.hidden = true", "el.hide()", "el.visible = false", "el.display = none"], answer: 0 }
          - { id: fs-w09-d1-rf08, difficulty: easy, type: mcq, prompt: "Reads data-id=\"7\"", choices: ["el.dataset.id", "el.data.id", "el.id", "el.getData(\"id\")"], answer: 0 }
          - { id: fs-w09-d1-rf09, difficulty: easy, type: truefalse, prompt: "innerHTML with text a user typed can run their code.", answer: true }
          - { id: fs-w09-d1-rf10, difficulty: easy, type: mcq, prompt: "Current year", choices: ["new Date().getFullYear()", "Date.year()", "new Year()", "Date().year"], answer: 0 }
      - kind: brain-teaser
        title: "Select it"
        questions:
          - { id: fs-w09-d1-bt01, difficulty: medium, type: mcq, prompt: "Select the element with id=\"total\"", choices: ["document.querySelector(\"#total\")", "document.querySelector(\".total\")", "document.querySelector(\"total\")", "document.getElement(\"total\")"], answer: 0 }
          - { id: fs-w09-d1-bt02, difficulty: medium, type: mcq, prompt: "Every price inside a product card", choices: ["document.querySelectorAll(\".product .price\")", "document.querySelector(\".product .price\")", "document.querySelectorAll(\".product, .price\")", "document.price"], answer: 0 }
          - { id: fs-w09-d1-bt03, difficulty: medium, type: mcq, prompt: "Your script runs in <head> and querySelector returns null. Why?", choices: ["The HTML below hasn't been parsed yet: move the script to the end of <body> or add defer", "querySelector is broken", "The id is case-insensitive", "JS can't read the DOM"], answer: 0 }
          - { id: fs-w09-d1-bt04, difficulty: hard, type: mcq, prompt: "Best way to make prices red when on sale?", choices: ["el.classList.add(\"sale\") with .sale { color: red } in CSS", "el.style.color = \"red\" everywhere", "el.innerHTML = \"<font color=red>…\"", "Rewrite the HTML"], answer: 0 }
          - { id: fs-w09-d1-bt05, difficulty: hard, type: multi, prompt: "Which change what the page shows? (Select all.)", choices: ["el.textContent = \"Hi\"", "el.classList.add(\"x\")", "el.hidden = true", "console.log(el)"], answers: [0, 1, 2] }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: selecting and changing"
      covers: "Week 9 · Day 1: the DOM, querySelector/All, textContent vs innerHTML, classList, attributes, dataset, hidden, script placement"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w09-d2-g01, difficulty: easy, type: mcq, prompt: "querySelector takes…", choices: ["a CSS selector", "a tag only", "an index", "a URL"], answer: 0 }
        - { id: fs-w09-d2-g02, difficulty: easy, type: mcq, prompt: "Change an h1's text", choices: ["h1.textContent = \"New\"", "h1 = \"New\"", "h1.text(\"New\")", "h1.write(\"New\")"], answer: 0 }
        - { id: fs-w09-d2-g03, difficulty: easy, type: truefalse, prompt: "querySelectorAll returns all matching elements.", answer: true }
        - { id: fs-w09-d2-g04, difficulty: easy, type: mcq, prompt: "Load app.js after the HTML is ready", choices: ["<script src=\"app.js\" defer> in <head>", "<script src=\"app.js\" async> always", "<link href=\"app.js\">", "<js src=\"app.js\">"], answer: 0 }
        - { id: fs-w09-d2-g05, difficulty: easy, type: mcq, prompt: "Remove a class", choices: ["el.classList.remove(\"x\")", "el.class.delete(\"x\")", "el.removeClass(\"x\")", "delete el.x"], answer: 0 }
        - { id: fs-w09-d2-g06, difficulty: easy, type: mcq, prompt: "Set an image's alt", choices: ["img.alt = \"…\"", "img.text = \"…\"", "img.title() = \"…\"", "alt(img)"], answer: 0 }
        - { id: fs-w09-d2-g07, difficulty: medium, type: mcq, prompt: "Highlight every .price", choices: ["document.querySelectorAll(\".price\").forEach((p) => p.classList.add(\"highlight\"))", "document.querySelector(\".price\").classList.add(\"highlight\")", ".price.highlight()", "document.price.add(\"highlight\")"], answer: 0 }
        - { id: fs-w09-d2-g08, difficulty: medium, type: match, prompt: "Match.", pairs: [["textContent", "plain text"], ["innerHTML", "HTML markup"], ["classList", "classes"], ["dataset", "data-* attributes"]] }
        - { id: fs-w09-d2-g09, difficulty: medium, type: mcq, prompt: "querySelector finds nothing. It returns…", choices: ["null", "undefined", "[]", "an error"], answer: 0 }
        - { id: fs-w09-d2-g10, difficulty: medium, type: truefalse, prompt: "Prefer classes over el.style for changing looks.", answer: true }
        - { id: fs-w09-d2-g11, difficulty: medium, type: mcq, prompt: "TypeError: Cannot set properties of null (setting 'textContent'). Likely?", choices: ["querySelector found nothing (wrong selector or script too early)", "textContent is read-only", "JS is disabled", "A CSS error"], answer: 0 }
        - { id: fs-w09-d2-g12, difficulty: medium, type: mcq, prompt: "Count the .product elements", choices: ["document.querySelectorAll(\".product\").length", "document.querySelector(\".product\").length", "document.count(\".product\")", ".product.length"], answer: 0 }
        - { id: fs-w09-d2-g13, difficulty: medium, type: mcq, prompt: "<button data-id=\"42\">: el.dataset.id is…", choices: ["\"42\" (a string)", "42 (a number)", "undefined", "data-id"], answer: 0 }
        - { id: fs-w09-d2-g14, difficulty: medium, type: truefalse, prompt: "el.hidden = true hides the element.", answer: true }
        - { id: fs-w09-d2-g15, difficulty: medium, type: mcq, prompt: "Which is safe for a name the user typed?", choices: ["el.textContent = name", "el.innerHTML = name", "el.outerHTML = name", "document.write(name)"], answer: 0 }
        - { id: fs-w09-d2-g16, difficulty: hard, type: mcq, prompt: "A user types <img src=x onerror=alert(1)> as their name and you show it with innerHTML. What happens?", choices: ["Their code runs: an XSS attack", "It shows as plain text", "Nothing", "The page reloads"], answer: 0 }
        - { id: fs-w09-d2-g17, difficulty: hard, type: mcq, prompt: "Which selects the second li in #list?", choices: ["document.querySelectorAll(\"#list li\")[1]", "document.querySelector(\"#list li\")[1]", "document.querySelector(\"#list li:first\")", "document.li[2]"], answer: 0 }
        - { id: fs-w09-d2-g18, difficulty: hard, type: multi, prompt: "Which run the script after the HTML exists? (Select all.)", choices: ["<script src=\"app.js\"> at the end of <body>", "<script src=\"app.js\" defer> in <head>", "<script type=\"module\" src=\"app.js\"> in <head>", "<script src=\"app.js\"> at the top of <head>"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Events"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w09-d2-rf01, difficulty: easy, type: mcq, prompt: "Listen for a click", choices: ["el.addEventListener(\"click\", fn)", "el.onClick(fn)", "el.listen(\"click\")", "click(el, fn)"], answer: 0 }
          - { id: fs-w09-d2-rf02, difficulty: easy, type: mcq, prompt: "Every change in a text box", choices: ["input", "change", "keyup only", "submit"], answer: 0 }
          - { id: fs-w09-d2-rf03, difficulty: easy, type: mcq, prompt: "A key was pressed", choices: ["keydown", "press", "key", "type"], answer: 0 }
          - { id: fs-w09-d2-rf04, difficulty: easy, type: mcq, prompt: "Was it Enter?", choices: ["e.key === \"Enter\"", "e.enter", "e.code === 13 only", "e.key == Enter"], answer: 0 }
          - { id: fs-w09-d2-rf05, difficulty: easy, type: mcq, prompt: "The element the event happened on", choices: ["e.target", "e.element", "this.event", "e.source"], answer: 0 }
          - { id: fs-w09-d2-rf06, difficulty: easy, type: mcq, prompt: "What the user typed", choices: ["e.target.value", "e.target.text", "e.value", "e.typed"], answer: 0 }
          - { id: fs-w09-d2-rf07, difficulty: easy, type: mcq, prompt: "A select box changed", choices: ["change", "input only", "select", "pick"], answer: 0 }
          - { id: fs-w09-d2-rf08, difficulty: easy, type: truefalse, prompt: "A click listener can update the page instantly without reloading.", answer: true }
          - { id: fs-w09-d2-rf09, difficulty: easy, type: mcq, prompt: "Dark mode toggle", choices: ["document.body.classList.toggle(\"dark\")", "document.dark = true", "body.style = dark", "toggle(dark)"], answer: 0 }
          - { id: fs-w09-d2-rf10, difficulty: easy, type: mcq, prompt: "A form was sent", choices: ["submit", "send", "click", "post"], answer: 0 }
      - kind: brain-teaser
        title: "Event logic"
        questions:
          - id: fs-w09-d2-bt01
            difficulty: medium
            type: text
            prompt: "This handler runs 3 times. What does it print last?"
            code: |
              let likes = 0
              const onClick = () => { likes++; return likes }
              onClick(); onClick()
              console.log(onClick())
            accept: ["3"]
          - id: fs-w09-d2-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const greet = (value) => `Hello, ${value.trim() || "stranger"}!`
              console.log(greet("  "), greet("Ada"))
            accept: ["Hello, stranger! Hello, Ada!"]
          - { id: fs-w09-d2-bt03, difficulty: medium, type: mcq, prompt: "Why doesn't this work? `button.addEventListener(\"click\", update())`", choices: ["It calls update right away and passes its result; pass update (no brackets)", "click must be capitalised", "Buttons can't have listeners", "It needs a semicolon"], answer: 0 }
          - { id: fs-w09-d2-bt04, difficulty: hard, type: mcq, prompt: "Your keydown listener on a search box fires for every key. How do you react only to Enter?", choices: ["if (e.key === \"Enter\") { … }", "Use the click event", "e.preventDefault()", "Add a second listener"], answer: 0 }
          - id: fs-w09-d2-bt05
            difficulty: hard
            type: text
            prompt: "Toggle starts false and is pressed 5 times. What does this print?"
            code: |
              let dark = false
              for (let i = 0; i < 5; i++) dark = !dark
              console.log(dark)
            accept: ["true"]

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: events"
      covers: "Week 9 · Day 2: addEventListener, click/input/change/keydown, the event object, e.target.value, e.key"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w09-d3-g01, difficulty: easy, type: mcq, prompt: "Run code when a button is clicked", choices: ["button.addEventListener(\"click\", () => { … })", "button.click = () => { … } only", "on(button)", "button.run()"], answer: 0 }
        - { id: fs-w09-d3-g02, difficulty: easy, type: mcq, prompt: "Preview text as it's typed", choices: ["the input event", "the submit event", "the load event", "the click event"], answer: 0 }
        - { id: fs-w09-d3-g03, difficulty: easy, type: truefalse, prompt: "e.target is the element where the event happened.", answer: true }
        - { id: fs-w09-d3-g04, difficulty: easy, type: mcq, prompt: "Read a text box value in a listener", choices: ["e.target.value", "e.value", "e.target.textContent", "e.text"], answer: 0 }
        - { id: fs-w09-d3-g05, difficulty: easy, type: mcq, prompt: "Enter key", choices: ["e.key === \"Enter\"", "e.key === \"Return!\"", "e.enter === true", "e.code === \"Space\""], answer: 0 }
        - { id: fs-w09-d3-g06, difficulty: easy, type: mcq, prompt: "Toggle a theme", choices: ["classList.toggle", "classList.flip", "style.toggle", "toggleClass"], answer: 0 }
        - { id: fs-w09-d3-g07, difficulty: medium, type: mcq, prompt: "What's wrong? `btn.addEventListener(\"click\", like())`", choices: ["like() runs immediately; pass like", "click needs quotes removed", "like must be async", "nothing"], answer: 0 }
        - { id: fs-w09-d3-g08, difficulty: medium, type: match, prompt: "Match the event.", pairs: [["click", "button tapped"], ["input", "every keystroke in a box"], ["change", "select changed"], ["keydown", "key pressed"]] }
        - id: fs-w09-d3-g09
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            let count = 0
            const handler = () => { count += 1 }
            ;[1, 2, 3].forEach(handler)
            console.log(count)
          accept: ["3"]
        - { id: fs-w09-d3-g10, difficulty: medium, type: truefalse, prompt: "The input event fires when a text box loses focus only.", answer: false, explain: "That's change; input fires on every change." }
        - { id: fs-w09-d3-g11, difficulty: medium, type: mcq, prompt: "A counter shows \"01\" then \"011\" after clicks. Why?", choices: ["It joins strings: convert with Number() or keep the count in a number variable", "click fires twice", "textContent is broken", "Use innerHTML"], answer: 0 }
        - id: fs-w09-d3-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            let text = "0"
            text = text + 1
            text = text + 1
            console.log(text, Number("0") + 1 + 1)
          accept: ["011 2"]
        - { id: fs-w09-d3-g13, difficulty: medium, type: mcq, prompt: "Greeting should say \"Hello, stranger!\" when the box is empty. Use…", choices: ["value.trim() || \"stranger\"", "value ?? \"stranger\"", "value || null", "value.empty()"], answer: 0, explain: "?? only catches null/undefined; an empty string needs ||." }
        - { id: fs-w09-d3-g14, difficulty: medium, type: truefalse, prompt: "One element can have several listeners.", answer: true }
        - { id: fs-w09-d3-g15, difficulty: medium, type: mcq, prompt: "Which event for a dropdown of cities?", choices: ["change", "click", "keydown", "submit"], answer: 0 }
        - id: fs-w09-d3-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const values = ["", "  ", "Ada", null]
            console.log(values.map((v) => (v ?? "").trim() || "stranger").join(","))
          accept: ["stranger,stranger,Ada,stranger"]
        - { id: fs-w09-d3-g17, difficulty: hard, type: mcq, prompt: "A listener added inside a loop over 3 buttons uses `let i`. Each button logs…", choices: ["its own index", "3", "undefined", "0"], answer: 0, explain: "let creates a fresh i per loop round." }
        - { id: fs-w09-d3-g18, difficulty: hard, type: multi, prompt: "Which fire while typing in a text box? (Select all.)", choices: ["input", "keydown", "keyup", "submit"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Build elements"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w09-d3-rf01, difficulty: easy, type: mcq, prompt: "Make a new li", choices: ["document.createElement(\"li\")", "new li()", "document.li()", "createLi()"], answer: 0 }
          - { id: fs-w09-d3-rf02, difficulty: easy, type: mcq, prompt: "Add it to the end of a list", choices: ["list.append(li)", "list.push(li)", "list.add(li)", "list += li"], answer: 0 }
          - { id: fs-w09-d3-rf03, difficulty: easy, type: mcq, prompt: "Take an element out of the page", choices: ["el.remove()", "el.delete()", "delete el", "el.hidden()"], answer: 0 }
          - { id: fs-w09-d3-rf04, difficulty: easy, type: mcq, prompt: "Clear a list's contents", choices: ["list.innerHTML = \"\"", "list = []", "list.clear()", "list.remove()"], answer: 0 }
          - { id: fs-w09-d3-rf05, difficulty: easy, type: mcq, prompt: "The render pattern draws the page from…", choices: ["your data (an array)", "the old HTML", "localStorage only", "CSS"], answer: 0 }
          - { id: fs-w09-d3-rf06, difficulty: easy, type: truefalse, prompt: "React works on the same idea: data → render.", answer: true }
          - { id: fs-w09-d3-rf07, difficulty: easy, type: mcq, prompt: "User text in a new li", choices: ["li.textContent = text", "li.innerHTML = text", "li.html(text)", "li.value = text"], answer: 0 }
          - { id: fs-w09-d3-rf08, difficulty: easy, type: mcq, prompt: "A delete button removes its row with…", choices: ["button.addEventListener(\"click\", () => li.remove())", "button.remove(li)", "li.delete", "list.pop()"], answer: 0 }
          - { id: fs-w09-d3-rf09, difficulty: easy, type: mcq, prompt: "Add text and a button to an li", choices: ["li.append(\" \", button)", "li + button", "li.push(button)", "li.text = button"], answer: 0 }
          - { id: fs-w09-d3-rf10, difficulty: easy, type: truefalse, prompt: "Rebuilding a whole list is fine for small lists.", answer: true }
      - kind: brain-teaser
        title: "Render logic"
        questions:
          - id: fs-w09-d3-bt01
            difficulty: medium
            type: text
            prompt: "This builds the list's HTML as text. What does it print?"
            code: |
              const items = ["Rice", "Beans"]
              console.log(items.map((i) => `<li>${i}</li>`).join(""))
            accept: ["<li>Rice</li><li>Beans</li>"]
          - id: fs-w09-d3-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              let list = ["A", "B", "C"]
              list = list.filter((_, i) => i !== 0)
              console.log(list.join(""))
            accept: ["BC"]
          - { id: fs-w09-d3-bt03, difficulty: medium, type: mcq, prompt: "renderList(items) is called twice and the list shows 6 items instead of 3. Missing?", choices: ["Clearing the list (list.innerHTML = \"\") at the start", "A return", "A semicolon", "async"], answer: 0 }
          - { id: fs-w09-d3-bt04, difficulty: hard, type: mcq, prompt: "Why is `list.innerHTML = \"\"` safe here but `li.innerHTML = userText` not?", choices: ["Clearing inserts no user text; userText could contain code", "innerHTML is always safe", "Neither is safe", "Both are unsafe"], answer: 0 }
          - id: fs-w09-d3-bt05
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              const cards = [{ t: "Weather", u: "w" }, { t: "Expenses", u: "e" }]
              console.log(cards.map(({ t, u }) => `${t}:${u}`).join("|"))
