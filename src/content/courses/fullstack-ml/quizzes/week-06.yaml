# Fullstack + ML · Week 6 quizzes. Format and rules: src/content/QUIZZES.md
week: 6
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 5 review"
      covers: "Week 5: dictionaries, the counting pattern, exceptions, modules, JSON"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w06-d1-g01, difficulty: easy, type: mcq, prompt: "Safe dictionary lookup", choices: ["d.get(key, 0)", "d[key]", "d.find(key)", "d(key)"], answer: 0 }
        - { id: fs-w06-d1-g02, difficulty: easy, type: mcq, prompt: "int(\"ten\") raises…", choices: ["ValueError", "TypeError", "KeyError", "NameError"], answer: 0 }
        - { id: fs-w06-d1-g03, difficulty: easy, type: mcq, prompt: "Save a list of dicts to a file", choices: ["json.dump(data, file)", "json.load(file)", "file.write(data)", "json.dumps(file)"], answer: 0 }
        - { id: fs-w06-d1-g04, difficulty: easy, type: truefalse, prompt: "A bare except: is good practice.", answer: false }
        - { id: fs-w06-d1-g05, difficulty: easy, type: mcq, prompt: "Round up", choices: ["math.ceil", "math.floor", "round", "int"], answer: 0 }
        - { id: fs-w06-d1-g06, difficulty: easy, type: mcq, prompt: "Loop over keys and values", choices: [".items()", ".keys()", ".values()", ".pairs()"], answer: 0 }
        - id: fs-w06-d1-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            counts = {}
            for city in ["Lagos", "Kano", "Lagos", "Abuja", "Lagos"]:
                counts[city] = counts.get(city, 0) + 1
            print(counts["Lagos"], len(counts))
          accept: ["3 3"]
        - id: fs-w06-d1-g08
          difficulty: medium
          type: text
          prompt: "What does this print? (lines joined with a space)"
          code: |
            for v in ["4", "x", "6"]:
                try:
                    print(int(v) + 1)
                except ValueError:
                    print("skip")
          accept: ["5 skip 7"]
        - id: fs-w06-d1-g09
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            import json
            data = json.loads('{"city": "Abuja", "temps": [29, 31]}')
            print(data["temps"][1] - data["temps"][0])
          accept: ["2"]
        - { id: fs-w06-d1-g10, difficulty: medium, type: match, prompt: "Match.", pairs: [["KeyError", "missing dict key"], ["FileNotFoundError", "open() a missing file"], ["ZeroDivisionError", "divide by 0"], ["IndexError", "list position too big"]] }
        - { id: fs-w06-d1-g11, difficulty: medium, type: mcq, prompt: "`from math import ceil` lets you write…", choices: ["ceil(2.5)", "math.ceil(2.5) only", "import.ceil(2.5)", "ceil.math(2.5)"], answer: 0 }
        - id: fs-w06-d1-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            totals = {"Food": 3200, "Transport": 500}
            print(max(totals, key=totals.get))
          accept: ["Food"]
        - { id: fs-w06-d1-g13, difficulty: medium, type: truefalse, prompt: "JSON's null becomes None in Python.", answer: true }
        - id: fs-w06-d1-g14
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            from datetime import date
            print((date(2026, 11, 1) - date(2026, 10, 1)).days)
          accept: ["31"]
        - { id: fs-w06-d1-g15, difficulty: medium, type: mcq, prompt: "Load a JSON file that may not exist yet:", choices: ["try json.load … except FileNotFoundError: data = []", "json.load with no try", "open(…, \"w\") first", "json.loads(filename)"], answer: 0 }
        - id: fs-w06-d1-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            orders = [{"city": "Lagos", "amount": 100}, {"city": "Kano", "amount": 300}, {"city": "Lagos", "amount": 250}]
            totals = {}
            for o in orders:
                totals[o["city"]] = totals.get(o["city"], 0) + o["amount"]
            best = max(totals, key=totals.get)
            print(best, totals[best])
          accept: ["Lagos 350"]
        - id: fs-w06-d1-g17
          difficulty: hard
          type: mcq
          prompt: "What happens?"
          code: |
            try:
                print({"a": 1}["b"])
            except ValueError:
                print("caught")
          choices: ["KeyError crash: ValueError doesn't catch it", "caught", "None", "1"]
          answer: 0
        - { id: fs-w06-d1-g18, difficulty: hard, type: multi, prompt: "Which are in Python's standard library? (Select all.)", choices: ["json", "datetime", "random", "requests"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "API basics"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w06-d1-rf01, difficulty: easy, type: mcq, prompt: "An API answers programs with…", choices: ["JSON (usually)", "a web page", "a PDF", "an image"], answer: 0 }
          - { id: fs-w06-d1-rf02, difficulty: easy, type: mcq, prompt: "Fetch a URL in Python", choices: ["requests.get(url)", "open(url)", "json.get(url)", "fetch(url)"], answer: 0 }
          - { id: fs-w06-d1-rf03, difficulty: easy, type: mcq, prompt: "Status for OK", choices: ["200", "404", "500", "400"], answer: 0 }
          - { id: fs-w06-d1-rf04, difficulty: easy, type: mcq, prompt: "Status for \"not found\"", choices: ["404", "200", "500", "301"], answer: 0 }
          - { id: fs-w06-d1-rf05, difficulty: easy, type: mcq, prompt: "Server's fault", choices: ["500", "400", "200", "404"], answer: 0 }
          - { id: fs-w06-d1-rf06, difficulty: easy, type: mcq, prompt: "Response body → Python dict", choices: ["response.json()", "response.dict()", "json.dump(response)", "response.text()"], answer: 0 }
          - { id: fs-w06-d1-rf07, difficulty: easy, type: mcq, prompt: "Give up after 10 seconds", choices: ["timeout=10", "wait=10", "limit=10", "stop=10"], answer: 0 }
          - { id: fs-w06-d1-rf08, difficulty: easy, type: mcq, prompt: "Builds the ?a=1&b=2 part for you", choices: ["params=", "query=", "data=", "url+="], answer: 0 }
          - { id: fs-w06-d1-rf09, difficulty: easy, type: truefalse, prompt: "Open-Meteo needs an API key.", answer: false }
          - { id: fs-w06-d1-rf10, difficulty: easy, type: mcq, prompt: "Lagos's coordinates (roughly)", choices: ["6.52, 3.38", "9.06, 7.49", "12.00, 8.52", "51.5, -0.12"], answer: 0 }
      - kind: brain-teaser
        title: "Dig into the response"
        questions:
          - id: fs-w06-d1-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              data = {"current": {"temperature_2m": 25.7, "weather_code": 2}}
              print(data["current"]["temperature_2m"])
            accept: ["25.7"]
          - id: fs-w06-d1-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              data = {"current_units": {"temperature_2m": "°C"}, "current": {"temperature_2m": 31.4}}
              print(f"{data['current']['temperature_2m']}{data['current_units']['temperature_2m']}")
            accept: ["31.4°C"]
          - { id: fs-w06-d1-bt03, difficulty: medium, type: mcq, prompt: "In ?latitude=6.52&longitude=3.38, the parts after ? are…", choices: ["query parameters", "the domain", "the status code", "headers"], answer: 0 }
          - { id: fs-w06-d1-bt04, difficulty: hard, type: mcq, prompt: "You set latitude=600. Open-Meteo answers…", choices: ["400 with {\"error\": true, \"reason\": \"Latitude must be in range of -90 to 90°…\"}", "200 with no data", "500", "404"], answer: 0 }
          - id: fs-w06-d1-bt05
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              responses = [{"current": {"temperature_2m": 25.7}}, {"current": {"temperature_2m": 31.3}}]
              print(round(sum(r["current"]["temperature_2m"] for r in responses) / len(responses), 1))
            accept: ["28.5"]

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: APIs and requests"
      covers: "Week 6 · Day 1: what an API is, query parameters, requests.get with params and timeout, status codes, .json()"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w06-d2-g01, difficulty: easy, type: mcq, prompt: "API stands for…", choices: ["Application Programming Interface", "Automatic Page Index", "Applied Python Internet", "App Protocol Item"], answer: 0 }
        - { id: fs-w06-d2-g02, difficulty: easy, type: mcq, prompt: "Install requests", choices: ["pip install requests (terminal)", "import requests --install", "python get requests", "It's built in"], answer: 0 }
        - { id: fs-w06-d2-g03, difficulty: easy, type: mcq, prompt: "200 means…", choices: ["OK", "not found", "server error", "bad request"], answer: 0 }
        - { id: fs-w06-d2-g04, difficulty: easy, type: truefalse, prompt: "response.json() turns the JSON text into Python data.", answer: true }
        - { id: fs-w06-d2-g05, difficulty: easy, type: mcq, prompt: "Which part of a URL holds latitude=6.52?", choices: ["the query string after ?", "the domain", "the path before /v1", "the status"], answer: 0 }
        - { id: fs-w06-d2-g06, difficulty: easy, type: mcq, prompt: "Why add timeout=10?", choices: ["So the program doesn't hang forever", "To make it faster", "To retry 10 times", "It's required"], answer: 0 }
        - { id: fs-w06-d2-g07, difficulty: medium, type: match, prompt: "Match the status code.", pairs: [["200", "OK"], ["400", "bad request (your mistake)"], ["404", "not found"], ["500", "server error (their mistake)"]] }
        - { id: fs-w06-d2-g08, difficulty: medium, type: mcq, prompt: "requests.get(URL, params={\"latitude\": 6.52, \"longitude\": 3.38}) requests…", choices: ["URL?latitude=6.52&longitude=3.38", "URL/6.52/3.38", "URL with a JSON body", "only URL"], answer: 0 }
        - id: fs-w06-d2-g09
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            data = {"current": {"time": "2026-10-01T22:30", "relative_humidity_2m": 85}}
            print(data["current"]["time"][:10])
          accept: ["2026-10-01"]
        - { id: fs-w06-d2-g10, difficulty: medium, type: truefalse, prompt: "response.json() is the same as json.loads(response.text).", answer: true }
        - { id: fs-w06-d2-g11, difficulty: medium, type: mcq, prompt: "Abuja instead of Lagos: what changes in the request?", choices: ["latitude and longitude", "the URL domain", "timeout", "the status code"], answer: 0 }
        - id: fs-w06-d2-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            data = {"current": {"wind_speed_10m": 10.6}, "current_units": {"wind_speed_10m": "km/h"}}
            print(data["current"]["wind_speed_10m"], data["current_units"]["wind_speed_10m"])
          accept: ["10.6 km/h"]
        - { id: fs-w06-d2-g13, difficulty: medium, type: mcq, prompt: "Why can't the browser sandbox call the API?", choices: ["It has no internet access; we use saved responses instead", "The API is broken", "Python can't call APIs", "It needs a key"], answer: 0 }
        - { id: fs-w06-d2-g14, difficulty: medium, type: order, prompt: "Order the steps to get the temperature.", items: ["import requests", "response = requests.get(URL, params=params, timeout=10)", "data = response.json()", "temp = data[\"current\"][\"temperature_2m\"]"] }
        - { id: fs-w06-d2-g15, difficulty: medium, type: mcq, prompt: "What does \"current=temperature_2m,weather_code\" ask for?", choices: ["just those current values", "everything", "only the time", "a forecast for 2 metres"], answer: 0 }
        - id: fs-w06-d2-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            def read_current(data):
                c = data["current"]
                return {"temp": c["temperature_2m"], "code": c["weather_code"]}

            print(read_current({"current": {"temperature_2m": 29.0, "weather_code": 61, "x": 1}}))
          accept: ["{'temp': 29.0, 'code': 61}"]
        - { id: fs-w06-d2-g17, difficulty: hard, type: mcq, prompt: "Your script gets status 400. Whose fault, and what do you check?", choices: ["Yours: check the parameters you sent", "The server's: wait and retry", "The network: check Wi-Fi", "Nobody's: 400 means OK"], answer: 0 }
        - { id: fs-w06-d2-g18, difficulty: hard, type: multi, prompt: "Which are query parameters in this URL? (Select all.) …/v1/forecast?latitude=6.52&longitude=3.38&timezone=Africa/Lagos", choices: ["latitude", "longitude", "timezone", "forecast"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Codes and words"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w06-d2-rf01, difficulty: easy, type: mcq, prompt: "Weather code 0", choices: ["Clear sky", "Rain", "Fog", "Overcast"], answer: 0 }
          - { id: fs-w06-d2-rf02, difficulty: easy, type: mcq, prompt: "Weather code 3", choices: ["Overcast", "Clear sky", "Thunderstorm", "Drizzle"], answer: 0 }
          - { id: fs-w06-d2-rf03, difficulty: easy, type: mcq, prompt: "Weather code 95", choices: ["Thunderstorm", "Fog", "Clear sky", "Drizzle"], answer: 0 }
          - { id: fs-w06-d2-rf04, difficulty: easy, type: mcq, prompt: "Weather code 45", choices: ["Fog", "Rain", "Overcast", "Snow"], answer: 0 }
          - { id: fs-w06-d2-rf05, difficulty: easy, type: mcq, prompt: "Weather code 61", choices: ["Rain", "Clear sky", "Fog", "Thunderstorm"], answer: 0 }
          - { id: fs-w06-d2-rf06, difficulty: easy, type: mcq, prompt: "WMO stands for…", choices: ["World Meteorological Organization", "Weather Map Online", "Wind Measurement Office", "World Map Organisation"], answer: 0 }
          - { id: fs-w06-d2-rf07, difficulty: easy, type: mcq, prompt: "Unknown code without crashing", choices: ["CODES.get(code, \"Unknown\")", "CODES[code]", "CODES.find(code)", "CODES(code)"], answer: 0 }
          - { id: fs-w06-d2-rf08, difficulty: easy, type: truefalse, prompt: "51 <= code <= 82 is True for code 63.", answer: true }
          - { id: fs-w06-d2-rf09, difficulty: easy, type: truefalse, prompt: "51 <= code <= 82 is True for code 95.", answer: false }
          - { id: fs-w06-d2-rf10, difficulty: easy, type: mcq, prompt: "Weather code 2", choices: ["Partly cloudy", "Clear sky", "Rain", "Fog"], answer: 0 }
      - kind: brain-teaser
        title: "Build the report"
        questions:
          - id: fs-w06-d2-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              CODES = {0: "Clear sky", 2: "Partly cloudy"}
              print(CODES.get(2, "Unknown"), "/", CODES.get(7, "Unknown"))
            accept: ["Partly cloudy / Unknown"]
          - id: fs-w06-d2-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              def advice(temp, code):
                  if 51 <= code <= 82 or 95 <= code <= 99:
                      return "Take an umbrella"
                  if temp >= 32:
                      return "Stay hydrated"
                  return "Enjoy your day"

              print(advice(35, 96))
            accept: ["Take an umbrella"]
          - id: fs-w06-d2-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              city = "Abuja"
              c = {"temperature_2m": 23.1, "relative_humidity_2m": 92}
              print(f"{city}: {c['temperature_2m']}°C, humidity {c['relative_humidity_2m']}%")
            accept: ["Abuja: 23.1°C, humidity 92%"]
          - id: fs-w06-d2-bt04
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              text = ("Weather in Lagos: "
                      "Partly cloudy")
              print(len(text.split()))
            accept: ["5"]
          - id: fs-w06-d2-bt05
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              codes = [0, 61, 3, 95, 81, 45]
              rainy = [c for c in codes if 51 <= c <= 82 or 95 <= c <= 99]
              print(len(rainy))
            accept: ["3"]

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: weather codes and reports"
      covers: "Week 6 · Day 2: WMO codes, describe with .get, advice with ranges, multi-line f-string reports"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w06-d3-g01, difficulty: easy, type: mcq, prompt: "Code 0 means…", choices: ["Clear sky", "Rain", "Overcast", "Fog"], answer: 0 }
        - { id: fs-w06-d3-g02, difficulty: easy, type: mcq, prompt: "Which avoids a KeyError for a new code?", choices: ["CODES.get(code, \"Unknown\")", "CODES[code]", "CODES[\"code\"]", "CODES.code"], answer: 0 }
        - { id: fs-w06-d3-g03, difficulty: easy, type: truefalse, prompt: "95 means thunderstorm.", answer: true }
        - { id: fs-w06-d3-g04, difficulty: easy, type: mcq, prompt: "Code 65", choices: ["Heavy rain", "Fog", "Clear sky", "Mainly clear"], answer: 0 }
        - { id: fs-w06-d3-g05, difficulty: easy, type: mcq, prompt: "Code 1", choices: ["Mainly clear", "Overcast", "Drizzle", "Rain"], answer: 0 }
        - { id: fs-w06-d3-g06, difficulty: easy, type: mcq, prompt: "Codes 51, 53, 55", choices: ["Drizzle", "Thunderstorm", "Fog", "Clear"], answer: 0 }
        - id: fs-w06-d3-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            code = 81
            print(51 <= code <= 82)
          accept: ["True"]
        - id: fs-w06-d3-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            def advice(temp, code):
                if 51 <= code <= 82 or 95 <= code <= 99:
                    return "Take an umbrella"
                if temp >= 32:
                    return "Stay hydrated"
                return "Enjoy your day"

            print(advice(33, 1), "|", advice(27, 45))
          accept: ["Stay hydrated | Enjoy your day"]
        - { id: fs-w06-d3-g09, difficulty: medium, type: match, prompt: "Match the code to its meaning.", pairs: [["0", "Clear sky"], ["3", "Overcast"], ["45", "Fog"], ["82", "Violent rain showers"]] }
        - { id: fs-w06-d3-g10, difficulty: medium, type: mcq, prompt: "Why check rain BEFORE heat in advice()?", choices: ["A hot thunderstorm still needs an umbrella", "Heat is rarer", "Python checks in reverse", "No reason"], answer: 0 }
        - id: fs-w06-d3-g11
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            s = ("a"
                 "b"
                 "c")
            print(s)
          accept: ["abc"]
        - { id: fs-w06-d3-g12, difficulty: medium, type: truefalse, prompt: "Inside an f-string with double quotes, use single quotes for dictionary keys: f\"{c['temperature_2m']}\".", answer: true }
        - id: fs-w06-d3-g13
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            CODES = {61: "Rain", 63: "Rain", 65: "Heavy rain"}
            print(sum(1 for word in CODES.values() if word == "Rain"))
          accept: ["2"]
        - { id: fs-w06-d3-g14, difficulty: medium, type: mcq, prompt: "Best type for CODES?", choices: ["A dictionary: code → words", "A list of words in order", "One long string", "18 if/elif statements"], answer: 0 }
        - id: fs-w06-d3-g15
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            temp = 34.0
            print(f"{temp}°C")
          accept: ["34.0°C"]
        - id: fs-w06-d3-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            CODES = {0: "Clear sky", 2: "Partly cloudy"}
            def report(city, c):
                return (f"Weather in {city}: {CODES.get(c['weather_code'], 'Unknown')}, "
                        f"{c['temperature_2m']}°C")
            print(report("Kano", {"weather_code": 0, "temperature_2m": 36.5}))
          accept: ["Weather in Kano: Clear sky, 36.5°C"]
        - id: fs-w06-d3-g17
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            def rainy(code):
                return 51 <= code <= 82 or 95 <= code <= 99
            print([c for c in [50, 51, 82, 83, 94, 99] if rainy(c)])
          accept: ["[51, 82, 99]"]
        - { id: fs-w06-d3-g18, difficulty: hard, type: multi, prompt: "Which codes should trigger \"Take an umbrella\"? (Select all.)", choices: ["53", "80", "96", "48"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Robust scripts"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w06-d3-rf01, difficulty: easy, type: mcq, prompt: "Raise your own error", choices: ["raise ValueError(\"…\")", "throw ValueError", "error(\"…\")", "except ValueError"], answer: 0 }
          - { id: fs-w06-d3-rf02, difficulty: easy, type: mcq, prompt: "Catch every requests network problem", choices: ["requests.exceptions.RequestException", "ValueError", "KeyError", "NetworkError"], answer: 0 }
          - { id: fs-w06-d3-rf03, difficulty: easy, type: mcq, prompt: "Run main() only when the file is run directly", choices: ["if __name__ == \"__main__\":", "if main:", "if __file__:", "while True:"], answer: 0 }
          - { id: fs-w06-d3-rf04, difficulty: easy, type: mcq, prompt: "Lists packages to install", choices: ["requirements.txt", "README.md", ".gitignore", "main.py"], answer: 0 }
          - { id: fs-w06-d3-rf05, difficulty: easy, type: mcq, prompt: "Explains what the project does and how to run it", choices: ["README.md", "requirements.txt", ".gitignore", "setup.json"], answer: 0 }
          - { id: fs-w06-d3-rf06, difficulty: easy, type: mcq, prompt: "Install from requirements.txt", choices: ["pip install -r requirements.txt", "pip requirements", "python -r requirements.txt", "import requirements"], answer: 0 }
          - { id: fs-w06-d3-rf07, difficulty: easy, type: mcq, prompt: "\" Abuja \".strip().lower()", choices: ["\"abuja\"", "\"Abuja\"", "\" abuja \"", "\"ABUJA\""], answer: 0 }
          - { id: fs-w06-d3-rf08, difficulty: easy, type: mcq, prompt: "\"port harcourt\".title()", choices: ["\"Port Harcourt\"", "\"Port harcourt\"", "\"PORT HARCOURT\"", "\"port Harcourt\""], answer: 0 }
          - { id: fs-w06-d3-rf09, difficulty: easy, type: truefalse, prompt: "latitude, longitude = (6.52, 3.38) unpacks a pair.", answer: true }
          - { id: fs-w06-d3-rf10, difficulty: easy, type: mcq, prompt: "Read an exception's message", choices: ["except ValueError as error: print(error)", "except error:", "print(ValueError)", "error.read()"], answer: 0 }
      - kind: brain-teaser
        title: "Trouble handling"
        questions:
          - id: fs-w06-d3-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              CITIES = {"lagos": (6.52, 3.38)}
              def build(city):
                  key = city.strip().lower()
                  if key not in CITIES:
                      raise ValueError(f"Sorry, I don't know {city.strip()}")
                  return CITIES[key]
              try:
                  print(build("Jos "))
              except ValueError as e:
                  print(e)
            accept: ["Sorry, I don't know Jos"]
          - id: fs-w06-d3-bt02
            difficulty: medium
            type: text
