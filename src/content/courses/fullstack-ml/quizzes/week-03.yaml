              for item in items:
                  html += f"<li>{item}</li>"
              html += "</ul>"
              print(html.count("<li>"))
            accept: ["3", "three"]
          - id: fs-w03-d6-bt04
            difficulty: hard
            type: mcq
            prompt: "What does this print?"
            code: |
              def row(name, price):
                  return f"<tr><td>{name}</td><td>₦{price:,}</td></tr>"

              print(row("Milo", 3200))
            choices: ["<tr><td>Milo</td><td>₦3,200</td></tr>", "<tr><td>Milo</td><td>₦3200</td></tr>", "<tr><td>name</td><td>₦price</td></tr>", "<td>Milo</td><td>₦3,200</td>"]
