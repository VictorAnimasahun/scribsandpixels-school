          - { id: fs-w11-d5-rf07, difficulty: easy, type: mcq, prompt: "The current file name in JS", choices: ["location.pathname.split(\"/\").pop()", "document.file", "window.page", "location.file"], answer: 0 }
          - { id: fs-w11-d5-rf08, difficulty: easy, type: mcq, prompt: "What React will give you for the header problem", choices: ["components", "databases", "routers only", "nothing"], answer: 0 }
          - { id: fs-w11-d5-rf09, difficulty: easy, type: mcq, prompt: "Relative links keep working…", choices: ["on your laptop and on GitHub Pages", "only on your laptop", "only online", "only in Chrome"], answer: 0 }
          - { id: fs-w11-d5-rf10, difficulty: easy, type: mcq, prompt: "Style the current nav link", choices: ["nav a[aria-current=\"page\"] { … }", "nav a:current { … }", "nav .now", "a:here"], answer: 0 }
      - kind: brain-teaser
        title: "Build the nav"
        questions:
          - id: fs-w11-d5-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const pages = ["index.html", "menu.html", "about.html"]
              const here = "about.html"
              console.log(pages.map((p) => (p === here ? `[${p}]` : p)).join(" "))
            accept: ["index.html menu.html [about.html]"]
          - id: fs-w11-d5-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const path = "/mama-put-kitchen/menu.html"
              console.log(path.split("/").pop())
            accept: ["menu.html"]
          - id: fs-w11-d5-bt03
            difficulty: medium
            type: text
            prompt: "What does this print? (GitHub Pages serves index.html for a folder URL)"
            code: |
              const path = "/mama-put-kitchen/"
              console.log(path.split("/").pop() || "index.html")
            accept: ["index.html"]
          - id: fs-w11-d5-bt04
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              const pages = [{ href: "index.html", label: "Home" }, { href: "menu.html", label: "Menu" }]
              const here = "menu.html"
              const html = pages.map((p) => `<a href="${p.href}"${p.href === here ? ' aria-current="page"' : ""}>${p.label}</a>`).join("")
              console.log((html.match(/aria-current/g) || []).length, html.includes(">Menu<"))
            accept: ["1 true"]
          - { id: fs-w11-d5-bt05, difficulty: hard, type: mcq, prompt: "The script runs before <header id=\"site-header\"> exists and crashes. Fix:", choices: ["add defer (or put the script at the end of body)", "use innerText", "rename the id", "use async on the CSS"], answer: 0 }

