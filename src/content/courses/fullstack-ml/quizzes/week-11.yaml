# Fullstack + ML · Week 11 quizzes. Format and rules: src/content/QUIZZES.md
week: 11
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 10 review"
      covers: "Week 10: timers and promises, async/await, fetch + JSON, loading/error states, URLSearchParams, Promise.all"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w11-d1-g01, difficulty: easy, type: mcq, prompt: "An async function always returns…", choices: ["a Promise", "undefined", "a string", "the value directly"], answer: 0 }
        - { id: fs-w11-d1-g02, difficulty: easy, type: mcq, prompt: "Check the HTTP status worked (200–299)", choices: ["response.ok", "response.done", "response.success", "response.status === true"], answer: 0 }
        - { id: fs-w11-d1-g03, difficulty: easy, type: truefalse, prompt: "fetch rejects on a 404 response.", answer: false }
        - { id: fs-w11-d1-g04, difficulty: easy, type: mcq, prompt: "Read a JSON body", choices: ["await response.json()", "response.body", "JSON.parse(response)", "response.text"], answer: 0 }
        - { id: fs-w11-d1-g05, difficulty: easy, type: mcq, prompt: "Runs after try or catch, every time", choices: ["finally", "then", "always", "done"], answer: 0 }
        - { id: fs-w11-d1-g06, difficulty: easy, type: mcq, prompt: "Three states every data screen needs", choices: ["loading, error, success", "start, middle, end", "open, closed, locked", "red, amber, green"], answer: 0 }
        - id: fs-w11-d1-g07
          difficulty: medium
          type: text
          prompt: "What does this print, in order? (separate with commas)"
          code: |
            console.log("a")
            setTimeout(() => console.log("b"), 0)
            Promise.resolve().then(() => console.log("c"))
            console.log("d")
          accept: ["a, d, c, b", "a,d,c,b", "a d c b"]
          explain: "Synchronous code first (a, d), then promise callbacks (c), then timers (b)."
        - id: fs-w11-d1-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const params = new URLSearchParams({ city: "Lagos", days: 3 })
            console.log(params.toString())
          accept: ["city=Lagos&days=3"]
        - { id: fs-w11-d1-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["Promise.all", "fails if any one fails"], ["Promise.allSettled", "waits for all, reports each"], ["await", "pause until a promise settles"], ["setTimeout", "run later"]] }
        - { id: fs-w11-d1-g10, difficulty: medium, type: truefalse, prompt: "Six requests with Promise.all take about as long as the slowest one, not the sum.", answer: true }
        - { id: fs-w11-d1-g11, difficulty: medium, type: mcq, prompt: "Why disable the button while loading?", choices: ["to stop double requests from double taps", "to save battery", "browsers require it", "to hide errors"], answer: 0 }
        - { id: fs-w11-d1-g12, difficulty: medium, type: mcq, prompt: "Where may a secret API key live?", choices: ["on a server, never in browser JS", "in a JS file", "in localStorage", "in an HTML comment"], answer: 0 }
        - id: fs-w11-d1-g13
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const daily = { time: ["Mon", "Tue"], max: [31, 29] }
            const days = daily.time.map((d, i) => `${d}:${daily.max[i]}`)
            console.log(days.join(" "))
          accept: ["Mon:31 Tue:29"]
        - { id: fs-w11-d1-g14, difficulty: medium, type: mcq, prompt: "CORS decides whether…", choices: ["your page may read another site's API response", "your server can start", "cookies expire", "HTML is valid"], answer: 0 }
        - { id: fs-w11-d1-g15, difficulty: medium, type: mcq, prompt: "await works inside…", choices: ["an async function (or a module's top level)", "any function", "only loops", "only classes"], answer: 0 }
        - id: fs-w11-d1-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const wait = (ms, v) => new Promise((r) => setTimeout(() => r(v), ms))
            async function main() {
              const results = await Promise.all([wait(30, "slow"), wait(10, "fast")])
              console.log(results.join(","))
            }
            main()
          accept: ["slow,fast"]
          explain: "Promise.all keeps the input order, not the finishing order."
        - id: fs-w11-d1-g17
          difficulty: hard
          type: mcq
          prompt: "What does this log?"
          code: |
            async function getTemp(fetchFn) {
              const res = await fetchFn()
              if (!res.ok) throw new Error(`HTTP ${res.status}`)
              return (await res.json()).temp
            }
            getTemp(async () => ({ ok: false, status: 500 }))
              .then((t) => console.log(t))
              .catch((e) => console.log(e.message))
          choices: ["HTTP 500", "undefined", "500", "nothing"]
          answer: 0
        - { id: fs-w11-d1-g18, difficulty: hard, type: multi, prompt: "Which are true? (Select all.)", choices: ["fetch only rejects when the network fails", "response.json() returns a Promise", "Promise.allSettled never rejects", "await blocks the whole page"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Grid basics"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w11-d1-rf01, difficulty: easy, type: mcq, prompt: "Turn on grid layout", choices: ["display: grid", "grid: on", "display: flex-grid", "layout: grid"], answer: 0 }
          - { id: fs-w11-d1-rf02, difficulty: easy, type: mcq, prompt: "Three equal columns", choices: ["grid-template-columns: 1fr 1fr 1fr", "grid-columns: 3", "columns: 3 equal", "grid-template-rows: 1fr 1fr 1fr"], answer: 0 }
          - { id: fs-w11-d1-rf03, difficulty: easy, type: mcq, prompt: "Short for 1fr 1fr 1fr 1fr", choices: ["repeat(4, 1fr)", "4fr", "fr(4)", "1fr * 4"], answer: 0 }
          - { id: fs-w11-d1-rf04, difficulty: easy, type: mcq, prompt: "Space between grid cells", choices: ["gap", "margin-grid", "spacing", "padding-cells"], answer: 0 }
          - { id: fs-w11-d1-rf05, difficulty: easy, type: mcq, prompt: "1fr means…", choices: ["one share of the free space", "1 frame", "1 pixel", "first row"], answer: 0 }
          - { id: fs-w11-d1-rf06, difficulty: easy, type: mcq, prompt: "Grid vs Flexbox", choices: ["Grid: rows and columns; Flexbox: one direction", "same thing", "Flexbox: two directions", "Grid is only for tables"], answer: 0 }
          - { id: fs-w11-d1-rf07, difficulty: easy, type: mcq, prompt: "Make an item two columns wide", choices: ["grid-column: span 2", "width: 2fr", "columns: 2", "grid-span: 2"], answer: 0 }
          - { id: fs-w11-d1-rf08, difficulty: easy, type: mcq, prompt: "200px 1fr gives…", choices: ["a fixed 200px column and a flexible one", "two 200px columns", "one column", "an error"], answer: 0 }
          - { id: fs-w11-d1-rf09, difficulty: easy, type: truefalse, prompt: "Grid items wrap onto the next row by themselves.", answer: true }
          - { id: fs-w11-d1-rf10, difficulty: easy, type: mcq, prompt: "2fr 1fr: the first column is…", choices: ["twice as wide as the second", "2px wider", "half as wide", "the same"], answer: 0 }
      - kind: brain-teaser
        title: "Read the grid"
        questions:
          - { id: fs-w11-d1-bt01, difficulty: medium, type: mcq, prompt: "6 items in a 3-column grid: how many rows?", choices: ["2", "3", "6", "1"], answer: 0 }
          - { id: fs-w11-d1-bt02, difficulty: medium, type: mcq, prompt: "7 items in repeat(3, 1fr): the 7th sits…", choices: ["alone at the start of row 3", "squeezed into row 2", "hidden", "in a 4th column"], answer: 0 }
          - { id: fs-w11-d1-bt03, difficulty: medium, type: mcq, prompt: "Why gap instead of margins on cards?", choices: ["gap only goes between items: no extra edge space", "margins don't work in grid", "gap is faster", "no difference"], answer: 0 }
          - { id: fs-w11-d1-bt04, difficulty: hard, type: mcq, prompt: "Container 620px wide, columns 1fr 1fr 1fr, gap 10px. Each column is…", choices: ["200px", "206px", "180px", "210px"], answer: 0, explain: "620 − 2 gaps × 10 = 600, ÷ 3 = 200." }
          - { id: fs-w11-d1-bt05, difficulty: hard, type: mcq, prompt: "First of 6 cards spans 2 in a 3-column grid. How many rows now?", choices: ["3", "2", "4", "6"], answer: 0, explain: "It uses 7 cell slots, so a third row starts." }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: Grid basics"
      covers: "Week 11 · Day 1: display grid, fr units, repeat(), gap, spanning columns"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w11-d2-g01, difficulty: easy, type: mcq, prompt: "Turn on grid", choices: ["display: grid", "display: block", "grid: true", "position: grid"], answer: 0 }
        - { id: fs-w11-d2-g02, difficulty: easy, type: mcq, prompt: "repeat(3, 1fr) equals", choices: ["1fr 1fr 1fr", "3fr", "1fr 3", "33% 33% 33% 1fr"], answer: 0 }
        - { id: fs-w11-d2-g03, difficulty: easy, type: truefalse, prompt: "gap adds space only between cells, not around the outside.", answer: true }
        - { id: fs-w11-d2-g04, difficulty: easy, type: mcq, prompt: "Grid lays things out in…", choices: ["two directions", "one direction", "three dimensions", "a circle"], answer: 0 }
        - { id: fs-w11-d2-g05, difficulty: easy, type: mcq, prompt: "A card that's 2 columns wide", choices: ["grid-column: span 2", "colspan=2", "width: 200%", "flex: 2"], answer: 0 }
        - { id: fs-w11-d2-g06, difficulty: easy, type: mcq, prompt: "fr stands for…", choices: ["fraction", "frame", "free", "front"], answer: 0 }
        - { id: fs-w11-d2-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["1fr 1fr", "two equal columns"], ["200px 1fr", "fixed sidebar + flexible main"], ["2fr 1fr", "first twice as wide"], ["repeat(4, 1fr)", "four equal columns"]] }
        - { id: fs-w11-d2-g08, difficulty: medium, type: text, prompt: "Container 430px, columns 1fr 1fr, gap 30px. Width of each column (px)?", accept: ["200", "200px"] }
        - { id: fs-w11-d2-g09, difficulty: medium, type: mcq, prompt: "Most real pages use…", choices: ["Grid for the big layout, Flexbox inside small parts", "only Grid", "only Flexbox", "tables"], answer: 0 }
        - { id: fs-w11-d2-g10, difficulty: medium, type: truefalse, prompt: "1fr and 33% are the same in a 3-column grid with a gap.", answer: false, explain: "33% × 3 + gaps overflows; fr shares only the space left after gaps." }
        - { id: fs-w11-d2-g11, difficulty: medium, type: mcq, prompt: "8 items, 3 columns: items in the last row?", choices: ["2", "3", "1", "0"], answer: 0 }
        - { id: fs-w11-d2-g12, difficulty: medium, type: mcq, prompt: "Space between rows only", choices: ["row-gap", "column-gap", "gap-row", "line-height"], answer: 0 }
        - { id: fs-w11-d2-g13, difficulty: medium, type: mcq, prompt: "Nav bar with 4 links in a row: best tool", choices: ["Flexbox", "Grid areas", "a table", "float"], answer: 0 }
        - { id: fs-w11-d2-g14, difficulty: medium, type: text, prompt: "Write the property and value for 3 equal columns using repeat.", accept: ["grid-template-columns: repeat(3, 1fr)", "grid-template-columns: repeat(3, 1fr);", "grid-template-columns:repeat(3,1fr)"] }
        - { id: fs-w11-d2-g15, difficulty: medium, type: mcq, prompt: "Make a card two rows tall", choices: ["grid-row: span 2", "height: 2fr", "rows: 2", "grid-column: span 2"], answer: 0 }
        - { id: fs-w11-d2-g16, difficulty: hard, type: text, prompt: "Container 1000px, columns 2fr 1fr 1fr, gap 20px. Width of the first column (px)?", accept: ["480", "480px"], explain: "1000 − 40 = 960 free; 960 ÷ 4 shares = 240; first = 2 × 240." }
        - { id: fs-w11-d2-g17, difficulty: hard, type: mcq, prompt: "6 cards, 3 columns; cards 1 and 4 both span 2. Rows used?", choices: ["3", "2", "4", "5"], answer: 0, explain: "Row 1: card 1 (2 cells) + card 2. Row 2: card 3, then card 4 fits the 2 cells left. Row 3: cards 5 and 6." }
        - { id: fs-w11-d2-g18, difficulty: hard, type: multi, prompt: "Which give three equal columns? (Select all.)", choices: ["repeat(3, 1fr)", "1fr 1fr 1fr", "repeat(3, minmax(0, 1fr))", "3fr"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Responsive grids and areas"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w11-d2-rf01, difficulty: easy, type: mcq, prompt: "As many columns as fit, at least 220px", choices: ["repeat(auto-fit, minmax(220px, 1fr))", "repeat(220px)", "columns: auto 220px", "minmax(auto-fit)"], answer: 0 }
          - { id: fs-w11-d2-rf02, difficulty: easy, type: mcq, prompt: "minmax(220px, 1fr) means…", choices: ["at least 220px, at most a share of the space", "exactly 220px", "at most 220px", "between 1 and 220"], answer: 0 }
          - { id: fs-w11-d2-rf03, difficulty: easy, type: mcq, prompt: "Name parts of a page layout", choices: ["grid-template-areas", "grid-names", "area-map", "layout-names"], answer: 0 }
          - { id: fs-w11-d2-rf04, difficulty: easy, type: mcq, prompt: "Put <main> in the \"main\" area", choices: ["main { grid-area: main; }", "main { area: main; }", "main { grid: main; }", "<main area>"], answer: 0 }
          - { id: fs-w11-d2-rf05, difficulty: easy, type: mcq, prompt: "Change the layout under 600px", choices: ["@media (max-width: 600px)", "@screen 600", "@media (width > 600)", "@phone"], answer: 0 }
          - { id: fs-w11-d2-rf06, difficulty: easy, type: truefalse, prompt: "The auto-fit + minmax grid needs no media query.", answer: true }
          - { id: fs-w11-d2-rf07, difficulty: easy, type: mcq, prompt: "Open DevTools' device toolbar", choices: ["Ctrl+Shift+M / ⌘⇧M", "F5", "Ctrl+P", "Ctrl+D"], answer: 0 }
          - { id: fs-w11-d2-rf08, difficulty: easy, type: mcq, prompt: "\"header header\" spans the header across…", choices: ["both columns", "one column", "two rows", "nothing"], answer: 0 }
          - { id: fs-w11-d2-rf09, difficulty: easy, type: mcq, prompt: "To rearrange areas on phones, you change…", choices: ["the CSS areas, not the HTML", "the HTML order", "JavaScript", "nothing possible"], answer: 0 }
          - { id: fs-w11-d2-rf10, difficulty: easy, type: mcq, prompt: "A screen 900px wide, cards minmax(220px, 1fr), no gap: columns?", choices: ["4", "3", "5", "2"], answer: 0 }
      - kind: brain-teaser
        title: "Fit the screen"
        questions:
          - { id: fs-w11-d2-bt01, difficulty: medium, type: mcq, prompt: "Phone 360px, minmax(220px, 1fr), auto-fit: columns?", choices: ["1", "2", "0", "3"], answer: 0 }
          - { id: fs-w11-d2-bt02, difficulty: medium, type: mcq, prompt: "Laptop 1000px, minmax(220px, 1fr), gap 20px: columns?", choices: ["4", "3", "5", "2"], answer: 0, explain: "4 × 220 + 3 × 20 = 940 ≤ 1000; 5 would need 1180." }
          - { id: fs-w11-d2-bt03, difficulty: medium, type: mcq, prompt: "Areas \"header header\" \"main aside\": how many columns?", choices: ["2", "1", "3", "4"], answer: 0 }
          - { id: fs-w11-d2-bt04, difficulty: hard, type: mcq, prompt: "Phone areas \"header\" \"main\" \"aside\" \"footer\" but columns still 1fr 250px. Result?", choices: ["invalid area map vs columns: the layout breaks; set columns to 1fr too", "works perfectly", "aside disappears", "header is wider"], answer: 0 }
          - { id: fs-w11-d2-bt05, difficulty: hard, type: mcq, prompt: "auto-fit vs auto-fill with only 2 cards on a wide screen", choices: ["auto-fit stretches the 2 cards; auto-fill keeps empty column slots", "same", "auto-fill stretches them", "both hide cards"], answer: 0 }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: responsive grids and page areas"
      covers: "Week 11 · Day 2: auto-fit + minmax, grid-template-areas, grid-area, media queries for layouts"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w11-d3-g01, difficulty: easy, type: mcq, prompt: "Cards that fit any width", choices: ["repeat(auto-fit, minmax(220px, 1fr))", "repeat(3, 220px)", "width: 220px", "flex-wrap only"], answer: 0 }
        - { id: fs-w11-d3-g02, difficulty: easy, type: mcq, prompt: "Assign an element to an area", choices: ["grid-area", "grid-name", "area", "place"], answer: 0 }
        - { id: fs-w11-d3-g03, difficulty: easy, type: truefalse, prompt: "grid-template-areas is a little drawing of the layout.", answer: true }
        - { id: fs-w11-d3-g04, difficulty: easy, type: mcq, prompt: "Phone-only CSS", choices: ["@media (max-width: 600px) { … }", "@phone { … }", "@media phone", "if (phone)"], answer: 0 }
        - { id: fs-w11-d3-g05, difficulty: easy, type: mcq, prompt: "minmax(220px, 1fr): the smallest a column gets", choices: ["220px", "1fr", "0", "unlimited"], answer: 0 }
        - { id: fs-w11-d3-g06, difficulty: easy, type: mcq, prompt: "Header across two columns", choices: ["\"header header\"", "\"header\"", "\"header . header\"", "header*2"], answer: 0 }
        - { id: fs-w11-d3-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["auto-fit", "as many columns as fit"], ["minmax(220px, 1fr)", "220px minimum, stretch to share"], ["grid-template-areas", "name the layout's regions"], ["@media (max-width: 600px)", "rules for narrow screens"]] }
        - { id: fs-w11-d3-g08, difficulty: medium, type: text, prompt: "Screen 700px, minmax(220px, 1fr), no gap. How many columns?", accept: ["3"] }
        - { id: fs-w11-d3-g09, difficulty: medium, type: mcq, prompt: "The aside should appear under main on phones. You…", choices: ["redraw the areas in a media query", "move it in the HTML", "use JavaScript", "use position: absolute"], answer: 0 }
        - { id: fs-w11-d3-g10, difficulty: medium, type: truefalse, prompt: "Area names in the map must match the grid-area values on the elements.", answer: true }
        - { id: fs-w11-d3-g11, difficulty: medium, type: mcq, prompt: "Empty cell in an area map", choices: ["a dot: \".\"", "a space", "none", "empty"], answer: 0 }
        - { id: fs-w11-d3-g12, difficulty: medium, type: text, prompt: "Areas for a phone: header, main, aside, footer stacked. Write the value of grid-template-areas.", accept: ["\"header\" \"main\" \"aside\" \"footer\"", "'header' 'main' 'aside' 'footer'"] }
        - { id: fs-w11-d3-g13, difficulty: medium, type: mcq, prompt: "Laptop 1200px, minmax(220px, 1fr), gap 16px: columns?", choices: ["5", "4", "6", "3"], answer: 0, explain: "5 × 220 + 4 × 16 = 1164 ≤ 1200; 6 would need 1400." }
        - { id: fs-w11-d3-g14, difficulty: medium, type: mcq, prompt: "Why prefer auto-fit grids for card lists?", choices: ["one rule works on every screen", "they're faster", "they're required by browsers", "they look 3D"], answer: 0 }
        - { id: fs-w11-d3-g15, difficulty: medium, type: mcq, prompt: "Areas must be…", choices: ["rectangles", "any shape", "squares", "single cells"], answer: 0 }
        - { id: fs-w11-d3-g16, difficulty: hard, type: mcq, prompt: "Map \"a b\" \"b b\" is…", choices: ["invalid: b isn't a rectangle (L-shape)", "valid", "valid but b is hidden", "a 3-column grid"], answer: 0 }
        - { id: fs-w11-d3-g17, difficulty: hard, type: text, prompt: "Screen 500px, repeat(auto-fit, minmax(220px, 1fr)), gap 20px. Width of each column (px)?", accept: ["240", "240px"], explain: "2 columns fit (460 ≤ 500); (500 − 20) ÷ 2 = 240." }
        - { id: fs-w11-d3-g18, difficulty: hard, type: multi, prompt: "True about grid-template-areas? (Select all.)", choices: ["Each string is a row", "Repeating a name spans cells", "\".\" leaves a cell empty", "It changes the HTML order"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Custom properties"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w11-d3-rf01, difficulty: easy, type: mcq, prompt: "Define a variable for the whole page", choices: [":root { --brand: red; }", "body { $brand: red; }", "var brand = red", "@brand: red"], answer: 0 }
          - { id: fs-w11-d3-rf02, difficulty: easy, type: mcq, prompt: "Use a variable", choices: ["var(--brand)", "--brand", "$brand", "@brand"], answer: 0 }
          - { id: fs-w11-d3-rf03, difficulty: easy, type: mcq, prompt: "A fallback if --brand isn't set", choices: ["var(--brand, red)", "var(--brand || red)", "var(--brand ? red)", "--brand: red !default"], answer: 0 }
          - { id: fs-w11-d3-rf04, difficulty: easy, type: mcq, prompt: "Maths with variables", choices: ["calc(var(--space) * 2)", "var(--space) * 2", "math(--space * 2)", "--space x2"], answer: 0 }
          - { id: fs-w11-d3-rf05, difficulty: easy, type: mcq, prompt: ":root means…", choices: ["the whole document (html)", "the first div", "the server", "body only"], answer: 0 }
          - { id: fs-w11-d3-rf06, difficulty: easy, type: truefalse, prompt: "A section can redefine a variable for just its own content.", answer: true }
          - { id: fs-w11-d3-rf07, difficulty: easy, type: mcq, prompt: "Change --brand from JavaScript", choices: ["document.documentElement.style.setProperty('--brand', 'green')", "css.brand = 'green'", "document.brand = 'green'", "var('--brand') = 'green'"], answer: 0 }
          - { id: fs-w11-d3-rf08, difficulty: easy, type: mcq, prompt: "A named set of colours, spacing and fonts is a…", choices: ["design system", "framework", "database", "router"], answer: 0 }
          - { id: fs-w11-d3-rf09, difficulty: easy, type: mcq, prompt: "Variable names start with…", choices: ["--", "$", "@", "#"], answer: 0 }
          - { id: fs-w11-d3-rf10, difficulty: easy, type: mcq, prompt: "Why variables instead of typing #c0392b everywhere?", choices: ["change it once, it updates everywhere", "faster download only", "browsers require it", "they're shorter"], answer: 0 }
      - kind: brain-teaser
        title: "Which colour wins?"
        questions:
          - { id: fs-w11-d3-bt01, difficulty: medium, type: mcq, prompt: ":root { --c: red } .box { --c: blue } .box p { color: var(--c) } — the p is…", choices: ["blue", "red", "black", "invalid"], answer: 0 }
          - { id: fs-w11-d3-bt02, difficulty: medium, type: mcq, prompt: "color: var(--missing, green) when --missing isn't defined", choices: ["green", "black", "transparent", "an error"], answer: 0 }
          - { id: fs-w11-d3-bt03, difficulty: medium, type: text, prompt: "--space: 1rem; padding: calc(var(--space) * 3) → how many px (1rem = 16px)?", accept: ["48", "48px"] }
          - { id: fs-w11-d3-bt04, difficulty: hard, type: mcq, prompt: "The brand colour changes. With tokens, you edit…", choices: ["one line in :root", "every page's CSS", "every HTML file", "the server"], answer: 0 }
          - { id: fs-w11-d3-bt05, difficulty: hard, type: mcq, prompt: ".dark { --cream: #1f1a17 } — buttons inside .dark that use var(--cream)…", choices: ["turn dark too, automatically", "stay cream", "lose their style", "need new CSS"], answer: 0 }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: custom properties"
      covers: "Week 11 · Day 3: defining variables in :root, var() with fallbacks, calc(), redefining in a section, design tokens"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w11-d4-g01, difficulty: easy, type: mcq, prompt: "Where to define page-wide variables", choices: [":root", "body only", "the <head>", "a script"], answer: 0 }
        - { id: fs-w11-d4-g02, difficulty: easy, type: mcq, prompt: "Read --radius", choices: ["var(--radius)", "(--radius)", "--radius()", "radius"], answer: 0 }
