          - { id: fs-w04-d5-rf05, difficulty: easy, type: mcq, prompt: "Send commits to GitHub", choices: ["git push", "git pull", "git send", "git upload"], answer: 0 }
          - { id: fs-w04-d5-rf06, difficulty: easy, type: mcq, prompt: "List commits, one line each", choices: ["git log --oneline", "git list", "git history -1", "git show all"], answer: 0 }
          - { id: fs-w04-d5-rf07, difficulty: easy, type: mcq, prompt: "Files Git should never save are listed in…", choices: [".gitignore", ".gitkeep", "README.md", ".github"], answer: 0 }
          - { id: fs-w04-d5-rf08, difficulty: easy, type: truefalse, prompt: "Git and GitHub are the same thing.", answer: false, explain: "Git is the tool on your computer; GitHub is a website that hosts Git projects." }
          - { id: fs-w04-d5-rf09, difficulty: easy, type: mcq, prompt: "Log in to GitHub from the terminal", choices: ["gh auth login", "git login", "github --password", "git auth"], answer: 0 }
          - { id: fs-w04-d5-rf10, difficulty: easy, type: mcq, prompt: "Best commit message", choices: ["Add contact form", "stuff", "changes", "asdf"], answer: 0 }
      - kind: brain-teaser
        title: "Git detective"
        questions:
          - { id: fs-w04-d5-bt01, difficulty: medium, type: order, prompt: "Order the everyday loop.", items: ["Edit your files", "git add .", "git commit -m \"Describe the change\"", "git push"] }
          - { id: fs-w04-d5-bt02, difficulty: medium, type: mcq, prompt: "You edited style.css and ran git commit -m \"Style navbar\". Git says \"nothing added to commit\". Why?", choices: ["You didn't git add the change first", "The message is too short", "You need to push first", "style.css is ignored by default"], answer: 0 }
          - { id: fs-w04-d5-bt03, difficulty: medium, type: match, prompt: "Match the place to its command.", pairs: [["Working folder → staging area", "git add"], ["Staging area → repository", "git commit"], ["Your repository → GitHub", "git push"]] }
