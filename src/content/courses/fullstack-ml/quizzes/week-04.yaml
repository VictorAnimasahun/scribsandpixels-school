  # ─────────────────────────── DAY 5 ───────────────────────────
  - day: 5
    gate:
      title: "Checkpoint: wrap, grow and media queries"
      covers: "Week 4 · Day 4: flex-wrap, the flex shorthand, media queries, the viewport tag, device toolbar"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w04-d5-g01, difficulty: easy, type: mcq, prompt: "Which lets flex items move onto a new line?", choices: ["flex-wrap: wrap", "flex: wrap", "display: wrap", "overflow: wrap"], answer: 0 }
        - { id: fs-w04-d5-g02, difficulty: easy, type: mcq, prompt: "A media query starts with…", choices: ["@media", "@query", "#media", "media:"], answer: 0 }
        - { id: fs-w04-d5-g03, difficulty: easy, type: truefalse, prompt: "The viewport meta tag goes in <head>.", answer: true }
        - { id: fs-w04-d5-g04, difficulty: easy, type: mcq, prompt: "flex: 1 1 220px — what does the middle 1 mean?", choices: ["shrink if needed", "grow", "gap", "row"], answer: 0 }
        - { id: fs-w04-d5-g05, difficulty: easy, type: mcq, prompt: "Where do you test phone sizes on your laptop?", choices: ["DevTools → device toolbar", "View Source", "Settings", "Task Manager"], answer: 0 }
        - { id: fs-w04-d5-g06, difficulty: easy, type: mcq, prompt: "max-width: 600px applies when the screen is…", choices: ["600px or narrower", "wider than 600px", "600px tall", "always"], answer: 0 }
        - { id: fs-w04-d5-g07, difficulty: medium, type: mcq, prompt: "Which stacks the navbar on phones?", choices: ["@media (max-width: 600px) { header { flex-direction: column; } }", "@media (min-width: 600px) { header { flex-direction: column; } }", "header { flex-wrap: column; }", "@phone { header { display: none; } }"], answer: 0 }
        - { id: fs-w04-d5-g08, difficulty: medium, type: match, prompt: "Match.", pairs: [["flex-wrap: wrap", "move to a new line"], ["flex-grow: 1", "fill the spare space"], ["flex-basis: 220px", "starting size"], ["@media", "CSS for some screens only"]] }
        - { id: fs-w04-d5-g09, difficulty: medium, type: text, prompt: "Write the viewport tag's content value.", accept: ["width=device-width, initial-scale=1", "width=device-width, initial-scale=1.0", "width=device-width,initial-scale=1"] }
        - { id: fs-w04-d5-g10, difficulty: medium, type: truefalse, prompt: "A matching media query at the END of the file overrides earlier rules for the same selector.", answer: true, explain: "Same specificity: the later rule wins. That's why media queries usually go at the end." }
        - { id: fs-w04-d5-g11, difficulty: medium, type: mcq, prompt: "Why put media queries at the END of the stylesheet?", choices: ["Later rules win when specificity is equal", "Browsers read only the end", "They must be last to be valid", "It's faster"], answer: 0 }
        - { id: fs-w04-d5-g12, difficulty: medium, type: mcq, prompt: "Cards with flex: 1 1 220px in a 1000px row (no gap). How many per row?", choices: ["4", "3", "5", "1"], answer: 0, explain: "4 × 220 = 880 fits, 5 × 220 = 1100 doesn't; the 4 then grow to fill." }
        - { id: fs-w04-d5-g13, difficulty: medium, type: mcq, prompt: "Without the viewport tag, a phone…", choices: ["renders the page at desktop width and shrinks it", "refuses to load it", "ignores CSS", "uses the media query anyway"], answer: 0 }
        - { id: fs-w04-d5-g14, difficulty: medium, type: order, prompt: "Order a phone media query.", items: ["@media (max-width: 600px) {", "h1 {", "font-size: 1.75rem;", "}", "}"] }
        - { id: fs-w04-d5-g15, difficulty: medium, type: truefalse, prompt: "flex-grow: 1 lets an item take up spare space in the row.", answer: true }
        - { id: fs-w04-d5-g16, difficulty: hard, type: text, prompt: "Row 700px wide, gap 20px, cards flex: 1 1 200px. How many on the first row? (number only)", accept: ["3", "three"], explain: "3×200 + 2×20 = 640 fits; 4 would need 860." }
        - { id: fs-w04-d5-g17, difficulty: hard, type: mcq, prompt: "The phone rule never applies. Why?", code: "@media (max-width: 600px) {\n  h1 { font-size: 1.5rem; }\n}\nh1 { font-size: 3rem; }", choices: ["The later h1 rule overrides it: move the media query to the end", "max-width is wrong", "rem isn't allowed in media queries", "h1 needs a class"], answer: 0 }
        - { id: fs-w04-d5-g18, difficulty: hard, type: multi, prompt: "Which help a page work on phones? (Select all.)", choices: ["The viewport meta tag", "flex-wrap on card rows", "Media queries", "Fixed widths like width: 1200px"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Git commands"
        secondsPerQuestion: 8
        questions:
          - { id: fs-w04-d5-rf01, difficulty: easy, type: mcq, prompt: "Start tracking a folder", choices: ["git init", "git start", "git new", "git begin"], answer: 0 }
