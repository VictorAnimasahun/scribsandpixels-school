# Fullstack + ML · Week 8 quizzes. Format and rules: src/content/QUIZZES.md
week: 8
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 7 review"
      covers: "Week 7: JS variables and types, functions, decisions, loops, strings and debugging"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w08-d1-g01, difficulty: easy, type: mcq, prompt: "Never reassigned", choices: ["const", "let", "var", "static"], answer: 0 }
        - { id: fs-w08-d1-g02, difficulty: easy, type: mcq, prompt: "Strict equality", choices: ["===", "==", "=", "equals"], answer: 0 }
        - { id: fs-w08-d1-g03, difficulty: easy, type: mcq, prompt: "Python and", choices: ["&&", "and", "&", "||"], answer: 0 }
        - { id: fs-w08-d1-g04, difficulty: easy, type: truefalse, prompt: "\"10\" + 5 gives \"105\" in JavaScript.", answer: true }
        - { id: fs-w08-d1-g05, difficulty: easy, type: mcq, prompt: "Length of a string s", choices: ["s.length", "len(s)", "s.length()", "s.size"], answer: 0 }
        - { id: fs-w08-d1-g06, difficulty: easy, type: mcq, prompt: "Arrow function", choices: ["(x) => x * 2", "x -> x * 2", "lambda x: x * 2", "fn x => x"], answer: 0 }
        - id: fs-w08-d1-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const greet = (name = "friend") => `Hi, ${name}!`
            console.log(greet(), greet("Ada"))
          accept: ["Hi, friend! Hi, Ada!"]
        - id: fs-w08-d1-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            let total = 0
            for (let i = 1; i <= 5; i++) total += i
            console.log(total)
          accept: ["15"]
        - { id: fs-w08-d1-g09, difficulty: medium, type: match, prompt: "Match Python to JavaScript.", pairs: [["len(s)", "s.length"], ["s.strip()", "s.trim()"], ["elif", "else if"], ["None", "null"]] }
        - id: fs-w08-d1-g10
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const score = 58
            console.log(score >= 70 ? "A" : score >= 50 ? "C" : "F")
          accept: ["C"]
        - { id: fs-w08-d1-g11, difficulty: medium, type: truefalse, prompt: "\"0\" is falsy.", answer: false }
        - id: fs-w08-d1-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            console.log(Number("12") + 3, "12" + 3)
          accept: ["15 123"]
        - { id: fs-w08-d1-g13, difficulty: medium, type: mcq, prompt: "ReferenceError usually means…", choices: ["a typo or a variable that doesn't exist", "a missing }", "dividing by zero", "a slow network"], answer: 0 }
        - id: fs-w08-d1-g14
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            let count = 0
            for (const ch of "Ibadan") if ("aeiou".includes(ch.toLowerCase())) count++
            console.log(count)
          accept: ["3"]
        - { id: fs-w08-d1-g15, difficulty: medium, type: mcq, prompt: "Python `x if c else y`", choices: ["c ? x : y", "x ? c : y", "if c then x", "c && x || y only"], answer: 0 }
        - id: fs-w08-d1-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            function grade(s) {
              switch (true) {
                case s >= 70: return "A"
                case s >= 60: return "B"
                default: return "F"
              }
            }
            console.log(grade(65) + grade(90) + grade(10))
          accept: ["BAF"]
        - id: fs-w08-d1-g17
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const v = Number("abc")
            console.log(Number.isNaN(v), v === v)
          accept: ["true false"]
        - { id: fs-w08-d1-g18, difficulty: hard, type: multi, prompt: "Which are falsy? (Select all.)", choices: ["0", "\"\"", "undefined", "\"false\""], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Array basics"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w08-d1-rf01, difficulty: easy, type: mcq, prompt: "Add to the end", choices: ["push", "append", "add", "insert"], answer: 0 }
          - { id: fs-w08-d1-rf02, difficulty: easy, type: mcq, prompt: "Remove the last", choices: ["pop", "remove", "delete", "cut"], answer: 0 }
          - { id: fs-w08-d1-rf03, difficulty: easy, type: mcq, prompt: "Is \"yam\" in the array?", choices: ["foods.includes(\"yam\")", "\"yam\" in foods", "foods.has(\"yam\")", "foods.contains(\"yam\")"], answer: 0 }
          - { id: fs-w08-d1-rf04, difficulty: easy, type: mcq, prompt: "Last item", choices: ["foods[foods.length - 1]", "foods[-1]", "foods.last", "foods[length]"], answer: 0 }
          - { id: fs-w08-d1-rf05, difficulty: easy, type: mcq, prompt: "Join with \", \"", choices: ["foods.join(\", \")", "\", \".join(foods)", "foods.concat(\", \")", "join(foods)"], answer: 0 }
          - { id: fs-w08-d1-rf06, difficulty: easy, type: mcq, prompt: "indexOf when missing", choices: ["-1", "undefined", "null", "0"], answer: 0 }
          - { id: fs-w08-d1-rf07, difficulty: easy, type: mcq, prompt: "Python foods[1:3]", choices: ["foods.slice(1, 3)", "foods[1:3]", "foods.cut(1, 3)", "foods.splice(1, 3)"], answer: 0 }
          - { id: fs-w08-d1-rf08, difficulty: easy, type: mcq, prompt: "Remove 1 item at index 2", choices: ["foods.splice(2, 1)", "foods.slice(2, 1)", "delete foods[2]", "foods.remove(2)"], answer: 0 }
          - { id: fs-w08-d1-rf09, difficulty: easy, type: truefalse, prompt: "You can push into a const array.", answer: true }
          - { id: fs-w08-d1-rf10, difficulty: easy, type: mcq, prompt: "Text → array", choices: ["\"a,b\".split(\",\")", "\"a,b\".join(\",\")", "Array(\"a,b\")", "\"a,b\".list()"], answer: 0 }
      - kind: brain-teaser
        title: "Array puzzles"
        questions:
          - id: fs-w08-d1-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const foods = ["rice", "beans", "yam"]
              foods.push("suya")
              foods.splice(foods.indexOf("beans"), 1)
              console.log(foods.join(", "))
            accept: ["rice, yam, suya"]
          - id: fs-w08-d1-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const cities = "Lagos,Abuja,Kano".split(",")
              console.log(cities.length, cities[cities.length - 1])
            accept: ["3 Kano"]
          - id: fs-w08-d1-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const nums = [5, 12, 8, 20]
              console.log(nums.slice(1, 3).join(","))
            accept: ["12,8"]
          - id: fs-w08-d1-bt04
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              const a = [1, 2, 3]
              const b = a
              b.push(4)
              console.log(a.length)
            accept: ["4"]
            explain: "b and a are the same array."
          - id: fs-w08-d1-bt05
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              const foods = ["rice", "yam"]
              console.log(foods[-1], foods.at(-1))
            accept: ["undefined yam"]

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: arrays"
      covers: "Week 8 · Day 1: arrays, push/pop, includes, indexOf, slice, splice, join/split, looping"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w08-d2-g01, difficulty: easy, type: mcq, prompt: "Python append in JS", choices: ["push", "append", "add", "put"], answer: 0 }
        - { id: fs-w08-d2-g02, difficulty: easy, type: mcq, prompt: "First item of foods", choices: ["foods[0]", "foods[1]", "foods.first()", "foods(0)"], answer: 0 }
        - { id: fs-w08-d2-g03, difficulty: easy, type: truefalse, prompt: "JS arrays support negative indexes like foods[-1].", answer: false, explain: "Use foods[foods.length - 1] or foods.at(-1)." }
        - { id: fs-w08-d2-g04, difficulty: easy, type: mcq, prompt: "Number of items", choices: ["foods.length", "len(foods)", "foods.count()", "foods.size"], answer: 0 }
        - { id: fs-w08-d2-g05, difficulty: easy, type: mcq, prompt: "Loop with index and item", choices: ["foods.forEach((food, i) => …)", "for (i, food in foods)", "foods.each(i, food)", "for food, i of foods"], answer: 0 }
        - { id: fs-w08-d2-g06, difficulty: easy, type: mcq, prompt: "Does slice change the original?", choices: ["No", "Yes", "Only for strings", "Only with const"], answer: 0 }
        - id: fs-w08-d2-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const list = ["a", "b", "c", "d"]
            list.splice(1, 2)
            console.log(list.join(""))
          accept: ["ad"]
        - id: fs-w08-d2-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const nums = [3, 7, 2]
            const last = nums.pop()
            console.log(last, nums.length)
          accept: ["2 2"]
        - { id: fs-w08-d2-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["push", "add to the end"], ["pop", "remove the last"], ["splice", "remove at a position"], ["slice", "copy a part"]] }
        - id: fs-w08-d2-g10
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const names = ["Ada", "Tolu"]
            console.log(names.map((n, i) => `${i + 1}. ${n}`).join(" / "))
          accept: ["1. Ada / 2. Tolu"]
        - { id: fs-w08-d2-g11, difficulty: medium, type: truefalse, prompt: "`const foods = []` then `foods = [\"rice\"]` is allowed.", answer: false, explain: "That replaces the const; pushing into it is fine." }
        - id: fs-w08-d2-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            console.log(["Kano", "Jos"].includes("jos"), ["Kano", "Jos"].indexOf("Jos"))
          accept: ["false 1"]
        - { id: fs-w08-d2-g13, difficulty: medium, type: mcq, prompt: "Count numbers above 10 in nums", choices: ["a loop with a counter (or filter(...).length)", "nums.count(10)", "nums.length > 10", "nums.above(10)"], answer: 0 }
        - id: fs-w08-d2-g14
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const word = "naija"
            console.log(word.split("").reverse().join(""))
          accept: ["ajian"]
        - { id: fs-w08-d2-g15, difficulty: medium, type: mcq, prompt: "[first, last] of arr", choices: ["[arr[0], arr[arr.length - 1]]", "[arr[0], arr[-1]]", "[arr.first, arr.last]", "arr.ends()"], answer: 0 }
        - id: fs-w08-d2-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const a = [1, 2, 3]
            const b = [...a]
            b.push(4)
            console.log(a.length, b.length)
          accept: ["3 4"]
        - id: fs-w08-d2-g17
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const q = []
            q.push("Ada")
            q.push("Tolu")
            q.unshift("Emeka")
            console.log(q.shift(), q.join(","))
          accept: ["Emeka Ada,Tolu"]
        - { id: fs-w08-d2-g18, difficulty: hard, type: multi, prompt: "Which change the original array? (Select all.)", choices: ["push", "splice", "pop", "slice"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Object basics"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w08-d2-rf01, difficulty: easy, type: mcq, prompt: "Read a property", choices: ["product.price", "product->price", "product::price", "price(product)"], answer: 0 }
          - { id: fs-w08-d2-rf02, difficulty: easy, type: mcq, prompt: "Key in a variable", choices: ["product[key]", "product.key", "product{key}", "product(key)"], answer: 0 }
          - { id: fs-w08-d2-rf03, difficulty: easy, type: mcq, prompt: "Remove a property", choices: ["delete product.inStock", "product.remove(\"inStock\")", "del product.inStock", "product.inStock = delete"], answer: 0 }
          - { id: fs-w08-d2-rf04, difficulty: easy, type: mcq, prompt: "All the keys", choices: ["Object.keys(obj)", "obj.keys()", "keys(obj)", "obj.allKeys"], answer: 0 }
          - { id: fs-w08-d2-rf05, difficulty: easy, type: mcq, prompt: "All the values", choices: ["Object.values(obj)", "obj.values()", "values(obj)", "Object.items(obj)"], answer: 0 }
          - { id: fs-w08-d2-rf06, difficulty: easy, type: mcq, prompt: "Key-value pairs", choices: ["Object.entries(obj)", "obj.items()", "Object.pairs(obj)", "obj.entries"], answer: 0 }
          - { id: fs-w08-d2-rf07, difficulty: easy, type: mcq, prompt: "Python d.get(k, 0)", choices: ["obj[k] ?? 0", "obj.get(k, 0)", "obj[k] || null", "obj(k, 0)"], answer: 0 }
          - { id: fs-w08-d2-rf08, difficulty: easy, type: truefalse, prompt: "Object keys usually don't need quotes.", answer: true }
          - { id: fs-w08-d2-rf09, difficulty: easy, type: mcq, prompt: "Missing property gives…", choices: ["undefined", "an error", "null", "0"], answer: 0 }
          - { id: fs-w08-d2-rf10, difficulty: easy, type: mcq, prompt: "Python dict in JS", choices: ["object", "array", "string", "map only"], answer: 0 }
      - kind: brain-teaser
        title: "Object puzzles"
        questions:
          - id: fs-w08-d2-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const product = { name: "Milo", price: 3200 }
              product.price = 3000
              product.category = "Groceries"
              console.log(Object.keys(product).length, product.price)
            accept: ["3 3000"]
          - id: fs-w08-d2-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const stock = { rice: 20, beans: 15 }
              const key = "beans"
              console.log(stock[key], stock.key)
            accept: ["15 undefined"]
          - id: fs-w08-d2-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const orders = [{ city: "Lagos" }, { city: "Kano" }, { city: "Lagos" }]
              const counts = {}
              for (const o of orders) counts[o.city] = (counts[o.city] ?? 0) + 1
              console.log(counts.Lagos, counts.Kano, counts.Abuja)
            accept: ["2 1 undefined"]
          - id: fs-w08-d2-bt04
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              const inv = { rice: 20, beans: 15, yam: 5 }
              console.log(Object.values(inv).reduce((a, b) => a + b, 0))
            accept: ["40"]
          - id: fs-w08-d2-bt05
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              const p = { name: "Ada", city: { name: "Lagos", zone: "SW" } }
              console.log(p.city.zone, p["city"]["name"])
            accept: ["SW Lagos"]

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: objects"
      covers: "Week 8 · Day 2: properties, dot vs bracket, Object.keys/values/entries, arrays of objects, counting with ??"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w08-d3-g01, difficulty: easy, type: mcq, prompt: "Add a category to product", choices: ["product.category = \"Phones\"", "product.add(\"category\")", "product += category", "add(product, \"Phones\")"], answer: 0 }
        - { id: fs-w08-d3-g02, difficulty: easy, type: mcq, prompt: "Bracket notation is needed when…", choices: ["the key is in a variable", "the value is a number", "the object is const", "never"], answer: 0 }
        - { id: fs-w08-d3-g03, difficulty: easy, type: truefalse, prompt: "Object.entries gives [key, value] pairs.", answer: true }
        - { id: fs-w08-d3-g04, difficulty: easy, type: mcq, prompt: "?? returns the right side when the left is…", choices: ["null or undefined", "false", "0", "any falsy value"], answer: 0 }
        - { id: fs-w08-d3-g05, difficulty: easy, type: mcq, prompt: "An order list is usually…", choices: ["an array of objects", "one long string", "an object of arrays only", "a number"], answer: 0 }
        - { id: fs-w08-d3-g06, difficulty: easy, type: mcq, prompt: "obj.missing gives…", choices: ["undefined", "null", "an error", "\"\""], answer: 0 }
        - id: fs-w08-d3-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const p = { name: "Tecno Spark 20", price: 139000 }
            console.log(`${p.name}: ₦${p.price.toLocaleString("en-NG")}`)
          accept: ["Tecno Spark 20: ₦139,000"]
        - id: fs-w08-d3-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const p = { a: 1, b: 2 }
            for (const [k, v] of Object.entries(p)) console.log(k + v)
          accept: ["a1 b2", "a1 ⏎ b2"]
        - { id: fs-w08-d3-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["Object.keys", "the keys"], ["Object.values", "the values"], ["Object.entries", "[key, value] pairs"], ["delete obj.k", "remove a property"]] }
        - id: fs-w08-d3-g10
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const counts = {}
            for (const pay of ["POS", "Cash", "POS"]) counts[pay] = (counts[pay] ?? 0) + 1
            console.log(JSON.stringify(counts))
          accept: ["{\"POS\":2,\"Cash\":1}"]
        - { id: fs-w08-d3-g11, difficulty: medium, type: truefalse, prompt: "`0 ?? 5` gives 5.", answer: false, explain: "0 isn't null or undefined, so ?? keeps it. (0 || 5 would give 5.)" }
        - id: fs-w08-d3-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const products = [{ name: "A", price: 300 }, { name: "B", price: 100 }]
            let best = products[0]
            for (const p of products) if (p.price < best.price) best = p
            console.log(best.name)
          accept: ["B"]
        - { id: fs-w08-d3-g13, difficulty: medium, type: mcq, prompt: "Count by any key in a function countBy(items, key):", choices: ["counts[item[key]] = (counts[item[key]] ?? 0) + 1", "counts.key++", "counts[key]++", "item.key += 1"], answer: 0 }
        - id: fs-w08-d3-g14
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const p = { name: "Milo", price: 3200 }
            delete p.price
            console.log(Object.keys(p).join(","), p.price)
          accept: ["name undefined"]
        - { id: fs-w08-d3-g15, difficulty: medium, type: mcq, prompt: "Python Week 5 totals.get(city, 0) + amount in JS", choices: ["(totals[city] ?? 0) + amount", "totals.get(city, 0) + amount", "totals[city] + amount", "totals(city) + amount"], answer: 0 }
        - id: fs-w08-d3-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const orders = [{ city: "Lagos", amount: 100 }, { city: "Abuja", amount: 400 }, { city: "Lagos", amount: 350 }]
            const t = {}
            for (const o of orders) t[o.city] = (t[o.city] ?? 0) + o.amount
            console.log(JSON.stringify(t))
          accept: ["{\"Lagos\":450,\"Abuja\":400}"]
        - id: fs-w08-d3-g17
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const a = { n: 1 }
            const b = a
            b.n = 2
            console.log(a.n)
          accept: ["2"]
        - { id: fs-w08-d3-g18, difficulty: hard, type: multi, prompt: "Which read the price? (Select all.)", choices: ["p.price", "p[\"price\"]", "p[key] with key = \"price\"", "p.key with key = \"price\""], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "map, filter, find"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w08-d3-rf01, difficulty: easy, type: mcq, prompt: "Transform every item", choices: ["map", "filter", "find", "every"], answer: 0 }
          - { id: fs-w08-d3-rf02, difficulty: easy, type: mcq, prompt: "Keep only some items", choices: ["filter", "map", "find", "sort"], answer: 0 }
          - { id: fs-w08-d3-rf03, difficulty: easy, type: mcq, prompt: "The first match", choices: ["find", "filter", "some", "map"], answer: 0 }
          - { id: fs-w08-d3-rf04, difficulty: easy, type: mcq, prompt: "At least one passes", choices: ["some", "every", "find", "all"], answer: 0 }
          - { id: fs-w08-d3-rf05, difficulty: easy, type: mcq, prompt: "All pass", choices: ["every", "some", "filter", "all"], answer: 0 }
          - { id: fs-w08-d3-rf06, difficulty: easy, type: mcq, prompt: "find with no match", choices: ["undefined", "null", "[]", "-1"], answer: 0 }
          - { id: fs-w08-d3-rf07, difficulty: easy, type: mcq, prompt: "map's result length", choices: ["same as the original", "fewer", "always 1", "doubled"], answer: 0 }
          - { id: fs-w08-d3-rf08, difficulty: easy, type: truefalse, prompt: "filter changes the original array.", answer: false }
          - { id: fs-w08-d3-rf09, difficulty: easy, type: mcq, prompt: "Copy an object and change one property", choices: ["({ ...p, price: 0 })", "p.price = 0", "copy(p)", "Object(p, 0)"], answer: 0 }
          - { id: fs-w08-d3-rf10, difficulty: easy, type: mcq, prompt: "Python any()", choices: ["some", "every", "find", "includes"], answer: 0 }
      - kind: brain-teaser
        title: "Pipeline puzzles"
        questions:
          - id: fs-w08-d3-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const prices = [145000, 13500, 129000]
              console.log(prices.filter((p) => p < 130000).length)
            accept: ["2"]
          - id: fs-w08-d3-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const products = [{ name: "Milo", price: 3200 }, { name: "Peak", price: 16500 }]
              console.log(products.map((p) => p.name.toUpperCase()).join(" "))
            accept: ["MILO PEAK"]
          - id: fs-w08-d3-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const products = [{ name: "Milo", price: 3200 }, { name: "Peak", price: 16500 }]
              const found = products.find((p) => p.price > 10000)
              console.log(found.name, products.find((p) => p.price > 99999))
            accept: ["Peak undefined"]
          - id: fs-w08-d3-bt04
