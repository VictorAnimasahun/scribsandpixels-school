# Fullstack + ML · Week 14 quizzes. Format and rules: src/content/QUIZZES.md
week: 14
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 13 review"
      covers: "Week 13: useState, controlled forms, immutable updates, useEffect, lifting state up, the cart"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w14-d1-g01, difficulty: easy, type: mcq, prompt: "Remember a value between renders", choices: ["useState", "useEffect", "props", "a let variable"], answer: 0 }
        - { id: fs-w14-d1-g02, difficulty: easy, type: mcq, prompt: "Load data after render", choices: ["useEffect", "useState", "map", "key"], answer: 0 }
        - { id: fs-w14-d1-g03, difficulty: easy, type: truefalse, prompt: "cart.push(item) is the right way to add to a cart in state.", answer: false }
        - { id: fs-w14-d1-g04, difficulty: easy, type: mcq, prompt: "Controlled input", choices: ["value={state} + onChange", "defaultValue only", "an id", "a placeholder"], answer: 0 }
        - { id: fs-w14-d1-g05, difficulty: easy, type: mcq, prompt: "Shared state belongs in…", choices: ["the closest common parent", "every child", "CSS", "a global"], answer: 0 }
        - { id: fs-w14-d1-g06, difficulty: easy, type: mcq, prompt: "[] as dependencies means…", choices: ["run once after the first render", "every render", "never", "on click"], answer: 0 }
        - { id: fs-w14-d1-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["[...a, x]", "add"], ["a.filter(…)", "remove"], ["a.map(…{ ...i, qty: … }…)", "update one"], ["{ ...o, k: v }", "change an object field"]] }
        - { id: fs-w14-d1-g08, difficulty: medium, type: mcq, prompt: "count 0; three setCount((c) => c + 1) in one click →", choices: ["3", "1", "0", "error"], answer: 0 }
        - id: fs-w14-d1-g09
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const cart = [{ price: 3500, qty: 2 }, { price: 700, qty: 1 }]
            console.log(cart.reduce((s, i) => s + i.price * i.qty, 0))
          accept: ["7700"]
        - { id: fs-w14-d1-g10, difficulty: medium, type: truefalse, prompt: "The cart total should be derived, not kept in its own state.", answer: true }
        - { id: fs-w14-d1-g11, difficulty: medium, type: mcq, prompt: "useEffect with no dependency array that sets state →", choices: ["an infinite loop", "runs once", "never runs", "fine"], answer: 0 }
        - { id: fs-w14-d1-g12, difficulty: medium, type: mcq, prompt: "Children change parent state by…", choices: ["calling a callback prop like onAdd", "editing props", "global variables", "reloading"], answer: 0 }
        - id: fs-w14-d1-g13
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const c = [{ id: 1, qty: 1 }, { id: 2, qty: 2 }]
            const next = c.map((i) => (i.id === 1 ? { ...i, qty: i.qty - 1 } : i)).filter((i) => i.qty > 0)
            console.log(next.length, c.length)
          accept: ["1 2"]
        - { id: fs-w14-d1-g14, difficulty: medium, type: mcq, prompt: "Save the cart on change", choices: ["useEffect(() => save(cart), [cart])", "save during render", "useState(save)", "never"], answer: 0 }
        - { id: fs-w14-d1-g15, difficulty: medium, type: mcq, prompt: "WhatsApp text must be passed through…", choices: ["encodeURIComponent", "JSON.parse", "toString", "nothing"], answer: 0 }
        - id: fs-w14-d1-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const subtotal = 15000
            const delivery = subtotal < 15000 ? 1000 : 0
            console.log(delivery, subtotal + delivery)
          accept: ["0 15000"]
        - { id: fs-w14-d1-g17, difficulty: hard, type: mcq, prompt: "count 5: setCount(count + 1) then setCount((c) => c + 10) →", choices: ["16", "15", "6", "11"], answer: 0 }
        - { id: fs-w14-d1-g18, difficulty: hard, type: multi, prompt: "Good React state design (Select all.)", choices: ["minimal state", "derive what you can", "lift shared state", "copy data into many components"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "JSON and data"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w14-d1-rf01, difficulty: easy, type: mcq, prompt: "JSON strings use…", choices: ["double quotes only", "single quotes", "backticks", "no quotes"], answer: 0 }
          - { id: fs-w14-d1-rf02, difficulty: easy, type: truefalse, prompt: "JSON allows comments.", answer: false }
          - { id: fs-w14-d1-rf03, difficulty: easy, type: truefalse, prompt: "A trailing comma after the last item breaks JSON.", answer: true }
          - { id: fs-w14-d1-rf04, difficulty: easy, type: mcq, prompt: "Why one menu.json?", choices: ["change a price once, every page updates", "it's faster to type", "GitHub requires it", "for CSS"], answer: 0 }
          - { id: fs-w14-d1-rf05, difficulty: easy, type: mcq, prompt: "Read it in the browser", choices: ["fetch(\"menu.json\") then response.json()", "import menu.json in HTML", "localStorage.menu", "document.json"], answer: 0 }
          - { id: fs-w14-d1-rf06, difficulty: easy, type: mcq, prompt: "fetch of a local file opened as file:// …", choices: ["usually fails: use a local server", "works everywhere", "needs a key", "works only in Safari"], answer: 0 }
          - { id: fs-w14-d1-rf07, difficulty: easy, type: mcq, prompt: "Check a JSON file", choices: ["a JSON validator (jsonlint)", "Lighthouse", "axe", "Excel"], answer: 0 }
          - { id: fs-w14-d1-rf08, difficulty: easy, type: mcq, prompt: "loadMenu(fetchFn = fetch) lets you…", choices: ["pass a fake in tests", "skip errors", "load faster", "avoid JSON"], answer: 0 }
          - { id: fs-w14-d1-rf09, difficulty: easy, type: mcq, prompt: "The three states again", choices: ["loading, error, success", "start, run, stop", "red, amber, green", "open, closed, busy"], answer: 0 }
          - { id: fs-w14-d1-rf10, difficulty: easy, type: mcq, prompt: "JSON's boolean values", choices: ["true / false", "\"true\" / \"false\" only", "1 / 0 only", "yes / no"], answer: 0 }
      - kind: brain-teaser
        title: "Valid JSON?"
        questions:
          - { id: fs-w14-d1-bt01, difficulty: medium, type: mcq, prompt: "{ 'name': 'Jollof' }", choices: ["invalid: single quotes", "valid", "valid in Chrome only", "valid without spaces"], answer: 0 }
          - { id: fs-w14-d1-bt02, difficulty: medium, type: mcq, prompt: "{ \"price\": 3500, }", choices: ["invalid: trailing comma", "valid", "valid if one item", "invalid: number"], answer: 0 }
          - id: fs-w14-d1-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const menu = JSON.parse('[{"n":"Jollof","fav":true},{"n":"Rice","fav":false},{"n":"Zobo","fav":true}]')
              console.log(menu.filter((d) => d.fav).map((d) => d.n).join(","))
            accept: ["Jollof,Zobo"]
          - id: fs-w14-d1-bt04
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              try {
                JSON.parse('{"price": 3500,}')
                console.log("ok")
              } catch (e) {
                console.log(e.name)
              }
            accept: ["SyntaxError"]
          - { id: fs-w14-d1-bt05, difficulty: hard, type: mcq, prompt: "The React menu in menu/ loads the site's menu.json with…", choices: ["fetch(\"../menu.json\")", "fetch(\"/menu.json\") always", "import from src", "fetch(\"menu/menu.json\")"], answer: 0 }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: one source of data"
      covers: "Week 14 · Day 1: menu.json, JSON rules, fetch + ok check, fetchFn for tests, three states, local servers"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w14-d2-g01, difficulty: easy, type: mcq, prompt: "Where the menu lives now", choices: ["one menu.json", "each page", "the CSS", "localStorage"], answer: 0 }
        - { id: fs-w14-d2-g02, difficulty: easy, type: mcq, prompt: "Read JSON from a response", choices: ["await response.json()", "response.body", "JSON(response)", "response.text only"], answer: 0 }
        - { id: fs-w14-d2-g03, difficulty: easy, type: truefalse, prompt: "fetch rejects when the server answers 404.", answer: false }
        - { id: fs-w14-d2-g04, difficulty: easy, type: mcq, prompt: "Test the page locally with fetch", choices: ["Live Server or npx serve", "double-click the file", "print it", "email it"], answer: 0 }
        - { id: fs-w14-d2-g05, difficulty: easy, type: mcq, prompt: "JSON keys need…", choices: ["double quotes", "no quotes", "single quotes", "backticks"], answer: 0 }
        - { id: fs-w14-d2-g06, difficulty: easy, type: mcq, prompt: "Show while loading", choices: ["\"Loading…\"", "nothing", "an error", "the old menu"], answer: 0 }
        - { id: fs-w14-d2-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["response.ok", "status 200–299"], ["fetchFn", "swap in a fake"], ["menu.json", "single source of truth"], ["catch", "the error state"]] }
        - id: fs-w14-d2-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            async function loadMenu(fetchFn) {
              const r = await fetchFn("menu.json")
              if (!r.ok) throw new Error(`HTTP ${r.status}`)
              return r.json()
            }
            loadMenu(async () => ({ ok: false, status: 404 })).catch((e) => console.log(e.message))
          accept: ["HTTP 404"]
        - { id: fs-w14-d2-g09, difficulty: medium, type: mcq, prompt: "Favourites shown on the home page", choices: ["filter favourite && !soldOut", "all dishes", "the first 4", "random"], answer: 0 }
        - { id: fs-w14-d2-g10, difficulty: medium, type: truefalse, prompt: "Deleting dishes.js after switching to menu.json removes a second copy of the data.", answer: true }
        - { id: fs-w14-d2-g11, difficulty: medium, type: mcq, prompt: "A single bad comma in menu.json makes…", choices: ["every page that reads it fail to load the menu", "only one dish disappear", "nothing", "the CSS break"], answer: 0 }
        - id: fs-w14-d2-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const dishes = [{ n: "A", fav: true, out: false }, { n: "B", fav: true, out: true }, { n: "C", fav: false, out: false }]
            console.log(dishes.filter((d) => d.fav && !d.out).length)
          accept: ["1"]
        - { id: fs-w14-d2-g13, difficulty: medium, type: mcq, prompt: "The error message should…", choices: ["say what happened in plain words", "show the stack trace", "be empty", "say 'Error 0x'"], answer: 0 }
        - { id: fs-w14-d2-g14, difficulty: medium, type: mcq, prompt: "In React, load menu.json with…", choices: ["useEffect + fetch", "useState only", "import JSON in JSX", "CSS"], answer: 0 }
        - { id: fs-w14-d2-g15, difficulty: medium, type: mcq, prompt: "A price changes. With menu.json you edit…", choices: ["one line in one file", "every page", "the React build only", "the CSS"], answer: 0 }
        - id: fs-w14-d2-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const text = '[{"name":"Zobo","price":700}]'
            const [first] = JSON.parse(text)
            console.log(typeof first.price, first.price * 2)
          accept: ["number 1400"]
        - { id: fs-w14-d2-g17, difficulty: hard, type: mcq, prompt: "Why might the React menu still show old prices after editing menu.json on GitHub Pages?", choices: ["browser/CDN cache: reload hard or wait a minute", "JSON can't change", "React caches forever", "keys"], answer: 0 }
        - { id: fs-w14-d2-g18, difficulty: hard, type: multi, prompt: "Benefits of one data file (Select all.)", choices: ["no copies to forget", "every page agrees", "easy to edit without touching code", "no need to validate it"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Open now"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w14-d2-rf01, difficulty: easy, type: mcq, prompt: "Lagos time zone name", choices: ["Africa/Lagos", "GMT+1/Lagos", "WAT/Nigeria", "Lagos/Africa"], answer: 0 }
          - { id: fs-w14-d2-rf02, difficulty: easy, type: mcq, prompt: "Format a date in another time zone", choices: ["Intl.DateTimeFormat with timeZone", "date.setZone()", "new Date(\"Lagos\")", "Math.time()"], answer: 0 }
          - { id: fs-w14-d2-rf03, difficulty: easy, type: mcq, prompt: "Why isOpen(date) takes a date", choices: ["so it can be tested with any time", "for speed", "Intl requires it", "no reason"], answer: 0 }
          - { id: fs-w14-d2-rf04, difficulty: easy, type: mcq, prompt: "Open [8, 21) means open at…", choices: ["8:00 to 20:59", "8:00 to 21:59", "9:00 to 21:00", "all day"], answer: 0 }
          - { id: fs-w14-d2-rf05, difficulty: easy, type: mcq, prompt: "Sunday is day…", choices: ["0", "7", "1", "6"], answer: 0 }
          - { id: fs-w14-d2-rf06, difficulty: easy, type: truefalse, prompt: "Lagos is UTC+1 all year (no daylight saving).", answer: true }
          - { id: fs-w14-d2-rf07, difficulty: easy, type: mcq, prompt: "A placeholder is…", choices: ["not a label", "a label", "required", "the value"], answer: 0 }
          - { id: fs-w14-d2-rf08, difficulty: easy, type: mcq, prompt: "Phone rule", choices: ["/^0\\d{10}$/", "/\\d/", "/^\\d{5}$/", "/^0$/"], answer: 0 }
          - { id: fs-w14-d2-rf09, difficulty: easy, type: mcq, prompt: "Submit a form from code", choices: ["form.requestSubmit()", "form.go()", "form.send()", "form.click()"], answer: 0 }
          - { id: fs-w14-d2-rf10, difficulty: easy, type: mcq, prompt: "Link a label to an input", choices: ["<label for=\"phone\"> + <input id=\"phone\">", "<label name=\"phone\">", "<label input>", "aria-phone"], answer: 0 }
      - kind: brain-teaser
        title: "Is it open?"
        questions:
          - { id: fs-w14-d2-bt01, difficulty: medium, type: mcq, prompt: "Hours Sun [12, 18). Sunday 6:00 pm Lagos →", choices: ["closed (18 is excluded)", "open", "error", "half open"], answer: 0 }
          - { id: fs-w14-d2-bt02, difficulty: medium, type: mcq, prompt: "A laptop set to London time at 7:30 Monday (Oct, UTC+1) → Lagos hour?", choices: ["7", "6", "8", "0"], answer: 0, explain: "In October London is on BST (UTC+1), the same as Lagos." }
          - id: fs-w14-d2-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const HOURS = { 0: [12, 18], 1: [8, 21] }
              const isOpen = (day, hour) => hour >= HOURS[day][0] && hour < HOURS[day][1]
              console.log(isOpen(0, 12), isOpen(0, 18), isOpen(1, 20))
            accept: ["true false true"]
          - id: fs-w14-d2-bt04
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Lagos", hour: "numeric", hourCycle: "h23" }).formatToParts(new Date("2026-10-11T17:30:00Z"))
              console.log(parts.find((p) => p.type === "hour").value)
            accept: ["18"]
          - { id: fs-w14-d2-bt05, difficulty: hard, type: mcq, prompt: "Using new Date().getHours() instead of Lagos time fails for…", choices: ["customers or devices in another time zone", "nobody", "only Safari", "weekends only"], answer: 0 }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: the Contact page"
      covers: "Week 14 · Day 2: Lagos time with Intl, isOpen(date), hours tables, labelled forms, building the WhatsApp enquiry link"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w14-d3-g01, difficulty: easy, type: mcq, prompt: "Lagos time in code", choices: ["Intl.DateTimeFormat with timeZone: \"Africa/Lagos\"", "new Date().getHours()", "Date.lagos()", "toLocaleString() with no options"], answer: 0 }
        - { id: fs-w14-d3-g02, difficulty: easy, type: mcq, prompt: "Every input needs…", choices: ["a <label>", "a placeholder only", "an onclick", "a title"], answer: 0 }
        - { id: fs-w14-d3-g03, difficulty: easy, type: truefalse, prompt: "Passing a date into isOpen makes it testable.", answer: true }
        - { id: fs-w14-d3-g04, difficulty: easy, type: mcq, prompt: "The enquiry opens…", choices: ["WhatsApp with the message filled in", "an email", "a phone call", "nothing"], answer: 0 }
        - { id: fs-w14-d3-g05, difficulty: easy, type: mcq, prompt: "hourCycle: \"h23\" gives hours…", choices: ["0–23", "1–12 with AM/PM", "1–24", "0–11"], answer: 0 }
        - { id: fs-w14-d3-g06, difficulty: easy, type: mcq, prompt: "Find the location", choices: ["a Google Maps share link", "a photo only", "GPS in JS", "no address"], answer: 0 }
        - { id: fs-w14-d3-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["formatToParts", "date pieces by type"], ["timeZone", "whose clock to use"], ["encodeURIComponent", "safe URL text"], ["label for", "names an input"]] }
        - id: fs-w14-d3-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const text = "Hi, this is Ada (08031234567)"
            const url = `https://wa.me/2348000000000?text=${encodeURIComponent(text)}`
            console.log(url.includes(" "), decodeURIComponent(url.split("text=")[1]) === text)
          accept: ["false true"]
        - { id: fs-w14-d3-g09, difficulty: medium, type: mcq, prompt: "\"Open now\" badge colours", choices: ["green for open, dark red for closed, plus the words", "colour only, no words", "red for open", "blinking"], answer: 0, explain: "Never colour alone: some people can't tell red from green." }
        - { id: fs-w14-d3-g10, difficulty: medium, type: truefalse, prompt: "new Date(\"2026-10-11T19:00:00+01:00\") is 7 pm in Lagos.", answer: true }
        - id: fs-w14-d3-g11
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
            console.log(days.indexOf("Sun"), days.indexOf("Sat"))
          accept: ["0 6"]
        - { id: fs-w14-d3-g12, difficulty: medium, type: mcq, prompt: "Form invalid: what should happen?", choices: ["show a clear message and stop", "open WhatsApp anyway", "reload", "clear everything"], answer: 0 }
        - { id: fs-w14-d3-g13, difficulty: medium, type: mcq, prompt: "WhatsApp number format in wa.me links", choices: ["international, no + or spaces: 2348000000000", "08000000000", "+234 800 000 0000", "with dashes"], answer: 0 }
        - id: fs-w14-d3-g14
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const ok = (n, p) => n.trim() !== "" && /^0\d{10}$/.test(p)
            console.log(ok("Ada", "08031234567"), ok(" ", "08031234567"), ok("Ada", "+2348031234567"))
          accept: ["true false false"]
        - { id: fs-w14-d3-g15, difficulty: medium, type: mcq, prompt: "Testing isOpen properly means trying…", choices: ["edges: just before/after opening and closing, and Sunday", "only right now", "random times", "midnight only"], answer: 0 }
        - id: fs-w14-d3-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const lagosHour = (d) => Number(new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Lagos", hour: "numeric", hourCycle: "h23" }).format(d))
            console.log(lagosHour(new Date("2026-10-12T07:59:00Z")), lagosHour(new Date("2026-10-12T20:00:00Z")))
          accept: ["8 21"]
        - { id: fs-w14-d3-g17, difficulty: hard, type: mcq, prompt: "Open 8–21 Monday; Lagos 20:59 →", choices: ["open", "closed", "error", "depends on the laptop"], answer: 0 }
        - { id: fs-w14-d3-g18, difficulty: hard, type: multi, prompt: "A good Contact page has (Select all.)", choices: ["hours and an open-now badge", "a map link", "a labelled enquiry form", "a login"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Accessibility"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w14-d3-rf01, difficulty: easy, type: mcq, prompt: "How many <main> per page?", choices: ["one", "as many as you like", "none", "two"], answer: 0 }
          - { id: fs-w14-d3-rf02, difficulty: easy, type: mcq, prompt: "How many <h1> per page?", choices: ["one", "none", "one per section", "any"], answer: 0 }
          - { id: fs-w14-d3-rf03, difficulty: easy, type: mcq, prompt: "Clickable thing that does an action", choices: ["<button>", "<div onclick>", "<span>", "<p>"], answer: 0 }
          - { id: fs-w14-d3-rf04, difficulty: easy, type: mcq, prompt: "Show keyboard focus", choices: [":focus-visible { outline: 3px solid … }", "outline: none", "cursor: pointer", "display: none"], answer: 0 }
          - { id: fs-w14-d3-rf05, difficulty: easy, type: mcq, prompt: "Body text contrast needs at least…", choices: ["4.5:1", "1:1", "2:1", "10:1"], answer: 0 }
          - { id: fs-w14-d3-rf06, difficulty: easy, type: mcq, prompt: "Tell screen readers the language", choices: ["<html lang=\"en\">", "<meta lang>", "<body en>", "nothing"], answer: 0 }
          - { id: fs-w14-d3-rf07, difficulty: easy, type: truefalse, prompt: "Choose heading levels by how big they look.", answer: false }
          - { id: fs-w14-d3-rf08, difficulty: easy, type: mcq, prompt: "Free tool that finds a11y problems", choices: ["axe DevTools", "Excel", "Git", "npm"], answer: 0 }
          - { id: fs-w14-d3-rf09, difficulty: easy, type: mcq, prompt: "Keyboard test keys", choices: ["Tab, Shift+Tab, Enter, Space", "only arrows", "F5", "Ctrl+C"], answer: 0 }
          - { id: fs-w14-d3-rf10, difficulty: easy, type: mcq, prompt: "Landmark for the site's links", choices: ["<nav>", "<links>", "<menu> only", "<div class=nav>"], answer: 0 }
      - kind: brain-teaser
        title: "Fix the page"
        questions:
          - { id: fs-w14-d3-bt01, difficulty: medium, type: mcq, prompt: "<div onclick=\"order()\">Order</div> problem", choices: ["keyboards can't reach or press it; use <button>", "it's slow", "it's the wrong colour", "none"], answer: 0 }
          - { id: fs-w14-d3-bt02, difficulty: medium, type: mcq, prompt: "<input placeholder=\"Phone\"> with no label", choices: ["screen readers may not announce it; the hint disappears when typing", "fine", "invalid HTML", "faster"], answer: 0 }
          - { id: fs-w14-d3-bt03, difficulty: medium, type: mcq, prompt: "Headings h1 → h3 (skipping h2)", choices: ["breaks the outline; use h2", "fine", "required", "faster"], answer: 0 }
          - { id: fs-w14-d3-bt04, difficulty: hard, type: mcq, prompt: "*:focus { outline: none } with nothing else", choices: ["keyboard users can't see where they are", "looks cleaner, no downside", "improves speed", "required for buttons"], answer: 0 }
          - { id: fs-w14-d3-bt05, difficulty: hard, type: mcq, prompt: "Pale beige text #d9c9b8 on cream", choices: ["fails contrast: darken it", "fine for body text", "only fails on phones", "passes AAA"], answer: 0 }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: accessibility"
      covers: "Week 14 · Day 3: landmarks, heading order, labels, real buttons, alt text, focus styles, contrast, lang, testing with keyboard/axe"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
