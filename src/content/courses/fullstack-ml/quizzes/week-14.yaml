          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const add = (c, d) => (c.some((i) => i.id === d.id) ? c.map((i) => (i.id === d.id ? { ...i, qty: i.qty + 1 } : i)) : [...c, { ...d, qty: 1 }])
            const a = add([], { id: 1 })
            const b = add(a, { id: 1 })
            console.log(a[0].qty, b[0].qty)
          accept: ["1 2"]
