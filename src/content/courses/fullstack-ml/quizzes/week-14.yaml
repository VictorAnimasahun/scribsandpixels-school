              const delivery = mode === "delivery" && sub < 15000 ? 1000 : 0
              return sub + delivery
            }
            console.log(totals(7500, "delivery"), totals(15000, "delivery"), totals(7500, "pickup"))
          accept: ["8500 15000 7500"]
        - { id: fs-w14-d6-g09, difficulty: medium, type: mcq, prompt: "addToCart(cart, dish) should…", choices: ["return a new cart, leaving the old one unchanged", "push into cart", "print the cart", "reload"], answer: 0 }
