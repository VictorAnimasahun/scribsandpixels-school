# Fullstack + ML · Week 10 quizzes. Format and rules: src/content/QUIZZES.md
week: 10
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 9 review"
      covers: "Week 9: selecting and changing elements, events, rendering lists, forms, state → render → save"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w10-d1-g01, difficulty: easy, type: mcq, prompt: "First element matching a selector", choices: ["document.querySelector", "document.querySelectorAll", "document.find", "document.get"], answer: 0 }
        - { id: fs-w10-d1-g02, difficulty: easy, type: mcq, prompt: "Safe way to show user text", choices: ["textContent", "innerHTML", "outerHTML", "document.write"], answer: 0 }
        - { id: fs-w10-d1-g03, difficulty: easy, type: mcq, prompt: "Stop a form reloading the page", choices: ["e.preventDefault()", "form.stop()", "return true", "e.halt()"], answer: 0 }
        - { id: fs-w10-d1-g04, difficulty: easy, type: truefalse, prompt: "Form values are always strings.", answer: true }
        - { id: fs-w10-d1-g05, difficulty: easy, type: mcq, prompt: "Make a new element", choices: ["document.createElement(\"li\")", "new Element(\"li\")", "document.li()", "make(\"li\")"], answer: 0 }
        - { id: fs-w10-d1-g06, difficulty: easy, type: mcq, prompt: "Every keystroke in a text box", choices: ["input", "change", "submit", "load"], answer: 0 }
        - id: fs-w10-d1-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            let todos = [{ t: "a", done: false }, { t: "b", done: false }]
            todos = todos.map((x, i) => (i === 1 ? { ...x, done: true } : x))
            console.log(`${todos.filter((x) => !x.done).length} left`)
          accept: ["1 left"]
        - { id: fs-w10-d1-g08, difficulty: medium, type: order, prompt: "Order the render pattern for one click.", items: ["Event fires", "Change the state", "Save to storage", "render()"] }
        - { id: fs-w10-d1-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["click", "a tap"], ["submit", "form sent"], ["keydown", "key pressed"], ["change", "select changed"]] }
        - id: fs-w10-d1-g10
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const ok = (p) => /^\d{11}$/.test(p.replaceAll(" ", ""))
            console.log(ok("0803 123 4567"), ok("+2348031234567"))
          accept: ["true false"]
        - { id: fs-w10-d1-g11, difficulty: medium, type: truefalse, prompt: "Chrome blocks forms in sandboxed iframes that lack allow-forms.", answer: true }
        - { id: fs-w10-d1-g12, difficulty: medium, type: mcq, prompt: "Why rebuild the list from the array instead of editing rows?", choices: ["Page and data can't disagree", "It's required by browsers", "It uses less memory always", "To avoid CSS"], answer: 0 }
        - id: fs-w10-d1-g13
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            console.log(["1200", "500"].reduce((s, x) => s + Number(x), 0))
          accept: ["1700"]
        - { id: fs-w10-d1-g14, difficulty: medium, type: mcq, prompt: "`button.addEventListener(\"click\", save())` is wrong because…", choices: ["save runs immediately; pass save", "click needs capitals", "save must be async", "buttons can't listen"], answer: 0 }
        - { id: fs-w10-d1-g15, difficulty: medium, type: mcq, prompt: "Where does the app's truth live?", choices: ["In the state array", "In the HTML", "In CSS", "In the console"], answer: 0 }
        - id: fs-w10-d1-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const valid = (raw) => raw.trim() !== "" && Number(raw) > 0
            console.log(["5", "", "0", "abc", "12"].filter(valid).join("+"))
          accept: ["5+12"]
        - { id: fs-w10-d1-g17, difficulty: hard, type: mcq, prompt: "Showing a user's name with innerHTML lets them…", choices: ["inject code that runs (XSS)", "change the font only", "nothing", "reload the page"], answer: 0 }
        - { id: fs-w10-d1-g18, difficulty: hard, type: multi, prompt: "Which belong in the expense tracker page? (Select all.)", choices: ["Form with validation", "List with delete buttons", "₦ total", "A Python server"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Async basics"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w10-d1-rf01, difficulty: easy, type: mcq, prompt: "Run code later", choices: ["setTimeout(fn, ms)", "wait(fn)", "sleep(ms)", "delay(fn)"], answer: 0 }
          - { id: fs-w10-d1-rf02, difficulty: easy, type: mcq, prompt: "A value that arrives later", choices: ["Promise", "Callback", "Event", "Array"], answer: 0 }
          - { id: fs-w10-d1-rf03, difficulty: easy, type: mcq, prompt: "Runs when a Promise succeeds", choices: [".then", ".catch", ".finally only", ".done"], answer: 0 }
          - { id: fs-w10-d1-rf04, difficulty: easy, type: mcq, prompt: "Runs when a Promise fails", choices: [".catch", ".then", ".fail", ".error"], answer: 0 }
          - { id: fs-w10-d1-rf05, difficulty: easy, type: mcq, prompt: "Pause until a Promise resolves", choices: ["await", "wait", "pause", "yield"], answer: 0 }
          - { id: fs-w10-d1-rf06, difficulty: easy, type: mcq, prompt: "An async function always returns…", choices: ["a Promise", "undefined", "a string", "nothing"], answer: 0 }
          - { id: fs-w10-d1-rf07, difficulty: easy, type: truefalse, prompt: "await works inside an async function.", answer: true }
          - { id: fs-w10-d1-rf08, difficulty: easy, type: truefalse, prompt: "Browser JS freezes the whole page while waiting for a network reply.", answer: false }
          - { id: fs-w10-d1-rf09, difficulty: easy, type: mcq, prompt: "setTimeout's second argument is…", choices: ["milliseconds", "seconds", "minutes", "a function"], answer: 0 }
          - { id: fs-w10-d1-rf10, difficulty: easy, type: mcq, prompt: "Browser JS runs on…", choices: ["one thread", "many threads always", "the server", "the GPU"], answer: 0 }
      - kind: brain-teaser
        title: "What prints first?"
        questions:
          - id: fs-w10-d1-bt01
            difficulty: medium
            type: text
            prompt: "What does this print? (lines joined with a space)"
            code: |
              console.log("1")
              setTimeout(() => console.log("3"), 0)
              console.log("2")
            accept: ["1 2 3"]
          - id: fs-w10-d1-bt02
            difficulty: medium
            type: text
            prompt: "What does this print? (lines joined with a space)"
            code: |
              const later = (v, ms) => new Promise((r) => setTimeout(() => r(v), ms))
              later("slow", 50).then(console.log)
              later("fast", 10).then(console.log)
            accept: ["fast slow"]
          - id: fs-w10-d1-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              async function add(a, b) { return a + b }
              add(2, 3).then((x) => console.log(x * 10))
            accept: ["50"]
          - id: fs-w10-d1-bt04
            difficulty: hard
            type: text
            prompt: "What does this print? (lines joined with a space)"
            code: |
              async function run() {
                console.log("A")
                await null
                console.log("C")
              }
              run()
              console.log("B")
            accept: ["A B C"]
            explain: "await always lets other code run first, even for a value that's ready."
          - id: fs-w10-d1-bt05
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              const p = Promise.reject(new Error("boom"))
              p.then(() => console.log("ok")).catch((e) => console.log("caught", e.message))
            accept: ["caught boom"]

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: timers and Promises"
      covers: "Week 10 · Day 1: one thread, setTimeout, Promises, then/catch, async/await"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w10-d2-g01, difficulty: easy, type: mcq, prompt: "A Promise that resolves after ms", choices: ["new Promise((resolve) => setTimeout(resolve, ms))", "setTimeout(ms)", "Promise(ms)", "await ms"], answer: 0 }
        - { id: fs-w10-d2-g02, difficulty: easy, type: mcq, prompt: "Where can you use await?", choices: ["Inside an async function", "Anywhere", "Only in loops", "Only in HTML"], answer: 0 }
        - { id: fs-w10-d2-g03, difficulty: easy, type: truefalse, prompt: "setTimeout(fn, 0) still runs fn after the current code finishes.", answer: true }
        - { id: fs-w10-d2-g04, difficulty: easy, type: mcq, prompt: "Promise succeeded", choices: ["resolved", "rejected", "pending", "thrown"], answer: 0 }
        - { id: fs-w10-d2-g05, difficulty: easy, type: mcq, prompt: "Promise failed", choices: ["rejected", "resolved", "finished", "settled only"], answer: 0 }
        - { id: fs-w10-d2-g06, difficulty: easy, type: mcq, prompt: "Catch errors from await", choices: ["try / catch", "if / else", ".then only", "switch"], answer: 0 }
        - id: fs-w10-d2-g07
          difficulty: medium
          type: text
          prompt: "What does this print? (lines joined with a space)"
          code: |
            setTimeout(() => console.log("B"), 20)
            setTimeout(() => console.log("A"), 10)
            console.log("start")
          accept: ["start A B"]
        - id: fs-w10-d2-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const later = (v, ms) => new Promise((r) => setTimeout(() => r(v), ms))
            async function addLater(a, b) {
              return (await later(a, 5)) + (await later(b, 5))
            }
            addLater(4, 6).then(console.log)
          accept: ["10"]
        - { id: fs-w10-d2-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["setTimeout", "run later"], ["Promise", "value that arrives later"], ["await", "pause this function"], ["async", "function that returns a Promise"]] }
        - id: fs-w10-d2-g10
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            async function f() { return "hi" }
            console.log(f() instanceof Promise)
          accept: ["true"]
        - { id: fs-w10-d2-g11, difficulty: medium, type: truefalse, prompt: "`await wait(1000)` freezes the whole page for a second.", answer: false }
        - id: fs-w10-d2-g12
          difficulty: medium
          type: text
          prompt: "What does this print? (lines joined with a space)"
          code: |
            const wait = (ms) => new Promise((r) => setTimeout(r, ms))
            async function countdown() {
              for (const n of ["3", "2", "1"]) { console.log(n); await wait(5) }
              console.log("Go!")
            }
            countdown()
          accept: ["3 2 1 Go!"]
        - { id: fs-w10-d2-g13, difficulty: medium, type: mcq, prompt: "`const x = later(5, 10)` (no await). x is…", choices: ["a Promise", "5", "undefined", "an error"], answer: 0 }
        - id: fs-w10-d2-g14
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            Promise.resolve(2).then((x) => x * 3).then((x) => console.log(x + 1))
          accept: ["7"]
        - { id: fs-w10-d2-g15, difficulty: medium, type: mcq, prompt: "Why are network calls asynchronous in the browser?", choices: ["So the page keeps responding while waiting", "Networks are fast", "JS can't wait at all", "To save data"], answer: 0 }
        - id: fs-w10-d2-g16
          difficulty: hard
          type: text
          prompt: "What does this print? (lines joined with a space)"
          code: |
            async function a() { console.log("1"); await null; console.log("3") }
            a()
            Promise.resolve().then(() => console.log("4"))
            console.log("2")
          accept: ["1 2 3 4"]
        - id: fs-w10-d2-g17
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            async function f() { throw new Error("nope") }
            f().catch((e) => console.log(e.message.toUpperCase()))
          accept: ["NOPE"]
        - { id: fs-w10-d2-g18, difficulty: hard, type: multi, prompt: "Which give you the value 5 eventually? (Select all.)", choices: ["Promise.resolve(5).then(…)", "await Promise.resolve(5) (inside async)", "new Promise((r) => r(5))", "Promise.reject(5).then(…)"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "fetch"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w10-d2-rf01, difficulty: easy, type: mcq, prompt: "Python requests.get in the browser", choices: ["fetch", "get", "request", "ajax"], answer: 0 }
          - { id: fs-w10-d2-rf02, difficulty: easy, type: mcq, prompt: "Read the JSON body", choices: ["await response.json()", "response.json", "JSON(response)", "response.body.json"], answer: 0 }
          - { id: fs-w10-d2-rf03, difficulty: easy, type: mcq, prompt: "True for status 200–299", choices: ["response.ok", "response.good", "response.success", "response.done"], answer: 0 }
          - { id: fs-w10-d2-rf04, difficulty: easy, type: mcq, prompt: "The HTTP status number", choices: ["response.status", "response.code", "response.statusCode", "response.http"], answer: 0 }
          - { id: fs-w10-d2-rf05, difficulty: easy, type: truefalse, prompt: "fetch rejects when the server answers 404.", answer: false }
          - { id: fs-w10-d2-rf06, difficulty: easy, type: truefalse, prompt: "fetch rejects when there's no internet.", answer: true }
          - { id: fs-w10-d2-rf07, difficulty: easy, type: mcq, prompt: "Treat a bad status as an error", choices: ["if (!response.ok) throw new Error(…)", "if (response) throw", "response.throw()", "nothing needed"], answer: 0 }
          - { id: fs-w10-d2-rf08, difficulty: easy, type: mcq, prompt: "Test without the internet", choices: ["pass a fetchFn (a fake fetch)", "unplug the router", "use alert", "skip testing"], answer: 0 }
          - { id: fs-w10-d2-rf09, difficulty: easy, type: mcq, prompt: "Is response.json() async?", choices: ["Yes: await it", "No", "Only in Safari", "Only for big files"], answer: 0 }
          - { id: fs-w10-d2-rf10, difficulty: easy, type: mcq, prompt: "Read an Error's text", choices: ["error.message", "error.text", "error.string", "String(error) only"], answer: 0 }
      - kind: brain-teaser
        title: "Fake fetch puzzles"
        questions:
          - id: fs-w10-d2-bt01
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              const fakeFetch = async () => ({ ok: true, status: 200, json: async () => ({ current: { temperature_2m: 25.7 } }) })
              async function temp(f) {
                const r = await f("x")
                const d = await r.json()
                return d.current.temperature_2m
              }
              temp(fakeFetch).then((t) => console.log(`${t}°C`))
            accept: ["25.7°C"]
          - id: fs-w10-d2-bt02
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              async function getJSON(url, f) {
                const r = await f(url)
                if (!r.ok) throw new Error(`HTTP ${r.status}`)
                return r.json()
              }
              getJSON("x", async () => ({ ok: false, status: 404 })).catch((e) => console.log(e.message))
            accept: ["HTTP 404"]
          - id: fs-w10-d2-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              async function safe(f) {
                try { const r = await f(); return (await r.json()).v } catch { return null }
              }
              safe(() => Promise.reject(new TypeError("Failed to fetch"))).then(console.log)
            accept: ["null"]
          - { id: fs-w10-d2-bt04, difficulty: hard, type: mcq, prompt: "Your weather page shows \"undefined°C\" when the server returns 500. Why?", choices: ["You didn't check response.ok, so you read an error body", "fetch rejected", "JSON is broken", "°C is invalid"], answer: 0 }
          - id: fs-w10-d2-bt05
            difficulty: hard
            type: text
            prompt: "What does this print?"
            code: |
              const calls = []
              const f = async (url) => { calls.push(url); return { ok: true, json: async () => ({}) } }
              const lat = 6.52, lon = 3.38
              f(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`).then(() => console.log(calls[0].split("?")[1]))
            accept: ["latitude=6.52&longitude=3.38"]

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: fetch and JSON"
      covers: "Week 10 · Day 2: fetch, response.ok/status, response.json(), errors, fetchFn for testing"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w10-d3-g01, difficulty: easy, type: mcq, prompt: "First line to get a reply", choices: ["const response = await fetch(url)", "const response = fetch.get(url)", "fetch(url).json", "await url"], answer: 0 }
        - { id: fs-w10-d3-g02, difficulty: easy, type: mcq, prompt: "response.ok is true for…", choices: ["200–299", "only 200", "any status", "400+"], answer: 0 }
        - { id: fs-w10-d3-g03, difficulty: easy, type: truefalse, prompt: "You must await response.json().", answer: true }
        - { id: fs-w10-d3-g04, difficulty: easy, type: mcq, prompt: "fetch rejects on…", choices: ["network failure", "404", "500", "any status"], answer: 0 }
        - { id: fs-w10-d3-g05, difficulty: easy, type: mcq, prompt: "Python response.status_code in JS", choices: ["response.status", "response.code", "response.ok", "response.http"], answer: 0 }
        - { id: fs-w10-d3-g06, difficulty: easy, type: mcq, prompt: "Default parameter for testability", choices: ["async function getJSON(url, fetchFn = fetch)", "function getJSON(fetch)", "getJSON(url) only", "fetch = fake"], answer: 0 }
        - id: fs-w10-d3-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const f = async () => ({ ok: false, status: 500 })
            f().then((r) => console.log(r.ok, r.status))
          accept: ["false 500"]
        - { id: fs-w10-d3-g08, difficulty: medium, type: match, prompt: "Match Python to JS.", pairs: [["requests.get(url)", "await fetch(url)"], ["response.status_code", "response.status"], ["response.json()", "await response.json()"], ["except", "catch"]] }
        - id: fs-w10-d3-g09
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            async function getJSON(url, f) {
              const r = await f(url)
              if (!r.ok) throw new Error(`HTTP ${r.status}`)
              return r.json()
            }
            getJSON("u", async () => ({ ok: true, json: async () => ({ a: [1, 2, 3] }) })).then((d) => console.log(d.a.length))
          accept: ["3"]
        - { id: fs-w10-d3-g10, difficulty: medium, type: truefalse, prompt: "A 404 response makes fetch go to catch automatically.", answer: false }
        - { id: fs-w10-d3-g11, difficulty: medium, type: mcq, prompt: "Read the temperature from Open-Meteo's JSON", choices: ["data.current.temperature_2m", "data.temperature", "data.current[0]", "data.temp_2m"], answer: 0 }
        - id: fs-w10-d3-g12
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            const data = JSON.parse('{"current":{"temperature_2m":31.4,"weather_code":95}}')
            console.log(data.current.weather_code, data.current.temperature_2m)
          accept: ["95 31.4"]
        - { id: fs-w10-d3-g13, difficulty: medium, type: mcq, prompt: "safeTemp should return null on failure. Best structure?", choices: ["try { return await getTemp(…) } catch { return null }", "if (getTemp) return", "getTemp().then(null)", "return getTemp() ?? null"], answer: 0 }
        - id: fs-w10-d3-g14
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            async function safe(f) { try { return await f() } catch { return null } }
            Promise.all([safe(async () => 1), safe(async () => { throw new Error("x") })]).then((r) => console.log(r.join(",")))
          accept: ["1,"]
        - { id: fs-w10-d3-g15, difficulty: medium, type: mcq, prompt: "`return getTemp()` vs `return await getTemp()` inside try/catch:", choices: ["only await lets the catch see a rejection", "no difference ever", "await is slower and wrong", "return can't return Promises"], answer: 0 }
        - id: fs-w10-d3-g16
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            async function noAwait(f) { try { return f() } catch { return "caught" } }
            noAwait(() => Promise.reject(new Error("late"))).catch((e) => console.log("escaped:", e.message))
          accept: ["escaped: late"]
        - id: fs-w10-d3-g17
          difficulty: hard
          type: text
          prompt: "What does this print?"
          code: |
            const f = async (url) => ({ ok: true, json: async () => ({ url }) })
            async function go() {
              const d = await (await f("https://x.test/a?b=1")).json()
              console.log(new URL(d.url).searchParams.get("b"))
            }
            go()
          accept: ["1"]
        - { id: fs-w10-d3-g18, difficulty: hard, type: multi, prompt: "Which should be treated as errors? (Select all.)", choices: ["Network failure", "Status 404", "Status 500", "Status 200"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Loading states"
        secondsPerQuestion: 9
        questions:
          - { id: fs-w10-d3-rf01, difficulty: easy, type: mcq, prompt: "Runs on success AND error", choices: ["finally", "then", "catch", "always"], answer: 0 }
          - { id: fs-w10-d3-rf02, difficulty: easy, type: mcq, prompt: "Stop double clicks while loading", choices: ["button.disabled = true", "button.hidden", "button.remove()", "button.stop()"], answer: 0 }
          - { id: fs-w10-d3-rf03, difficulty: easy, type: mcq, prompt: "The three states of a data screen", choices: ["loading, error, success", "on, off, idle", "start, stop, pause", "red, amber, green"], answer: 0 }
          - { id: fs-w10-d3-rf04, difficulty: easy, type: mcq, prompt: "Simulate no internet", choices: ["DevTools → Network → Offline", "Close the laptop", "View Source", "Lighthouse"], answer: 0 }
          - { id: fs-w10-d3-rf05, difficulty: easy, type: mcq, prompt: "Simulate a slow network", choices: ["DevTools → Network → Slow 3G", "Zoom out", "Sources", "Console"], answer: 0 }
          - { id: fs-w10-d3-rf06, difficulty: easy, type: truefalse, prompt: "Set \"Loading…\" before the first await.", answer: true }
          - { id: fs-w10-d3-rf07, difficulty: easy, type: mcq, prompt: "Re-enable the button in…", choices: ["finally", "only then", "only catch", "never"], answer: 0 }
          - { id: fs-w10-d3-rf08, difficulty: easy, type: mcq, prompt: "On error, show…", choices: ["a clear message", "nothing", "undefined", "the stack trace"], answer: 0 }
          - { id: fs-w10-d3-rf09, difficulty: easy, type: mcq, prompt: "On success, the status should be…", choices: ["cleared", "Loading…", "an error", "hidden forever"], answer: 0 }
          - { id: fs-w10-d3-rf10, difficulty: easy, type: truefalse, prompt: "React apps use the same three states.", answer: true }
      - kind: brain-teaser
        title: "Trace the states"
        questions:
          - id: fs-w10-d3-bt01
            difficulty: medium
            type: text
            prompt: "What does this print? (lines joined with a space)"
            code: |
              async function load(f) {
                console.log("Loading…")
                try { await f(); console.log("done") } catch { console.log("error") } finally { console.log("enabled") }
              }
              load(async () => {})
            accept: ["Loading… done enabled"]
          - id: fs-w10-d3-bt02
            difficulty: medium
            type: text
            prompt: "What does this print? (lines joined with a space)"
            code: |
              async function load(f) {
                try { await f(); console.log("done") } catch { console.log("error") } finally { console.log("enabled") }
              }
              load(() => Promise.reject(new Error("x")))
            accept: ["error enabled"]
