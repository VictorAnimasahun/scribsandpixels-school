# Fullstack + ML · Week 2 quizzes. Format and rules: src/content/QUIZZES.md
week: 2
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 1 review"
      covers: "Week 1: print, variables, input, maths, if/else, loops"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w02-d1-g01, difficulty: easy, type: mcq, prompt: "What does input() return?", choices: ["A string", "An integer", "A float", "A list"], answer: 0 }
        - { id: fs-w02-d1-g02, difficulty: easy, type: mcq, prompt: "Which symbol compares two values for equality?", choices: ["==", "=", "!=", ":="], answer: 0 }
        - { id: fs-w02-d1-g03, difficulty: easy, type: mcq, prompt: "range(4) gives…", choices: ["0 1 2 3", "1 2 3 4", "0 1 2 3 4", "4"], answer: 0 }
        - { id: fs-w02-d1-g04, difficulty: easy, type: mcq, prompt: "Which is a float?", choices: ["2.5", "25", "\"2.5\"", "True"], answer: 0 }
        - { id: fs-w02-d1-g05, difficulty: easy, type: truefalse, prompt: "The lines inside an if or a loop must be indented.", answer: true }
        - { id: fs-w02-d1-g06, difficulty: easy, type: mcq, prompt: "10 % 3 =", choices: ["1", "3", "3.33", "0"], answer: 0 }
        - id: fs-w02-d1-g07
          difficulty: medium
          type: mcq
          prompt: "What does this print?"
          code: |
            x = 8
            if x > 10:
                print("big")
            elif x > 5:
                print("medium")
            else:
                print("small")
          choices: ["medium", "big", "small", "big then medium"]
          answer: 0
        - id: fs-w02-d1-g08
          difficulty: medium
          type: text
          prompt: "What does this print? (just the number)"
          code: |
            total = 0
            for i in range(1, 4):
                total = total + i
            print(total)
          accept: ["6"]
        - { id: fs-w02-d1-g09, difficulty: medium, type: mcq, prompt: "The user types 7 for n = input(). What is n + \"1\"?", choices: ["\"71\"", "8", "\"8\"", "an error"], answer: 0 }
        - { id: fs-w02-d1-g10, difficulty: medium, type: text, prompt: "Write the line that turns the text in age into a whole number, stored back in age.", accept: ["age = int(age)", "age=int(age)"] }
        - { id: fs-w02-d1-g11, difficulty: medium, type: match, prompt: "Match the error to its cause.", pairs: [["TypeError", "adding text and a number"], ["NameError", "a variable that doesn't exist"], ["SyntaxError", "a missing colon or quote"], ["ValueError", "int(\"abc\")"]] }
        - id: fs-w02-d1-g12
          difficulty: medium
          type: mcq
          prompt: "How many times does this print?"
          code: |
            count = 0
            while count < 3:
                print("Hi")
                count = count + 1
          choices: ["3", "2", "4", "forever"]
          answer: 0
        - { id: fs-w02-d1-g13, difficulty: medium, type: mcq, prompt: "Which makes \"ABUJA\" and \"abuja\" compare as equal?", choices: ["answer.lower() == \"abuja\"", "answer == \"ABUJA\" or \"abuja\"", "int(answer) == \"abuja\"", "answer.equal(\"abuja\")"], answer: 0 }
        - { id: fs-w02-d1-g14, difficulty: medium, type: truefalse, prompt: "print(\"Total:\", 5 * 3) prints Total: 15", answer: true }
        - { id: fs-w02-d1-g15, difficulty: medium, type: mcq, prompt: "Which loop is right for a countdown that stops at 1?", choices: ["while count > 0:", "while count >= -1:", "for count in range(0):", "if count > 0:"], answer: 0 }
        - id: fs-w02-d1-g16
          difficulty: hard
          type: text
          prompt: "What does this print? (just the number)"
          code: |
            score = 0
            for answer in ["abuja", "x", "lagos"]:
                if answer == "abuja" or answer == "lagos":
                    score = score + 1
            print(score)
          accept: ["2", "two"]
        - id: fs-w02-d1-g17
          difficulty: hard
          type: mcq
          prompt: "What does this print?"
          code: |
            n = 5
            n = n * 2
            n = n - 3
            print(n % 4)
          choices: ["3", "7", "1", "0"]
          answer: 0
        - { id: fs-w02-d1-g18, difficulty: hard, type: multi, prompt: "Which lines raise an error? (Select all.)", choices: ["print(\"Age: \" + 30)", "int(\"30\")", "int(\"thirty\")", "print(\"a\" * 3)", "if x > 3 print(x)"], answers: [0, 2, 4] }
    quizzes:
      - kind: rapid-fire
        title: "List basics"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w02-d1-rf01, difficulty: easy, type: mcq, prompt: "Lists use which brackets?", choices: ["[ ]", "( )", "{ }", "< >"], answer: 0 }
          - { id: fs-w02-d1-rf02, difficulty: easy, type: mcq, prompt: "The first item of a list is at index…", choices: ["0", "1", "-1", "first"], answer: 0 }
          - { id: fs-w02-d1-rf03, difficulty: easy, type: mcq, prompt: "The last item is at index…", choices: ["-1", "0", "last", "len"], answer: 0 }
          - { id: fs-w02-d1-rf04, difficulty: easy, type: mcq, prompt: "Add an item to the end", choices: [".append()", ".add()", ".push()", ".insert_end()"], answer: 0 }
          - { id: fs-w02-d1-rf05, difficulty: easy, type: mcq, prompt: "Remove an item by value", choices: [".remove()", ".delete()", ".pop_value()", ".cut()"], answer: 0 }
          - { id: fs-w02-d1-rf06, difficulty: easy, type: mcq, prompt: "How many items?", choices: ["len(list)", "list.count()", "size(list)", "list.length"], answer: 0 }
          - { id: fs-w02-d1-rf07, difficulty: easy, type: mcq, prompt: "cities = [\"Lagos\", \"Abuja\", \"Kano\"]; cities[1] is…", choices: ["\"Abuja\"", "\"Lagos\"", "\"Kano\"", "an error"], answer: 0 }
          - { id: fs-w02-d1-rf08, difficulty: easy, type: truefalse, prompt: "A list can hold text and numbers together.", answer: true }
          - { id: fs-w02-d1-rf09, difficulty: easy, type: mcq, prompt: "Number the items while looping", choices: ["enumerate()", "number()", "index()", "range()"], answer: 0 }
          - { id: fs-w02-d1-rf10, difficulty: easy, type: truefalse, prompt: "cities[1] = \"Ibadan\" changes the second item.", answer: true }
      - kind: brain-teaser
        title: "Index detective"
        questions:
          - id: fs-w02-d1-bt01
            difficulty: medium
            type: mcq
            prompt: "What happens?"
            code: |
              cities = ["Lagos", "Abuja", "Kano"]
              print(cities[3])
            choices: ["IndexError: there's no index 3", "Kano", "Lagos", "None"]
            answer: 0
          - id: fs-w02-d1-bt02
            difficulty: medium
            type: mcq
            prompt: "What does this print?"
            code: |
              foods = ["rice", "beans"]
              foods.append("yam")
              foods.remove("rice")
              print(foods)
            choices: ["['beans', 'yam']", "['rice', 'beans', 'yam']", "['yam', 'beans']", "['beans']"]
            answer: 0
          - id: fs-w02-d1-bt03
            difficulty: medium
            type: text
            prompt: "What does this print? (just the number)"
            code: |
              nums = [4, 8, 15]
              nums.append(16)
              print(len(nums))
            accept: ["4", "four"]
          - id: fs-w02-d1-bt04
            difficulty: hard
            type: mcq
            prompt: "What happens?"
            code: |
              cities = ["Lagos", "Abuja"]
              cities.remove("London")
            choices: ["ValueError: London isn't in the list", "Nothing happens", "It removes the last item", "It prints None"]
            answer: 0
          - id: fs-w02-d1-bt05
            difficulty: hard
            type: text
            prompt: "What's the last line printed?"
            code: |
              for number, city in enumerate(["Lagos", "Abuja", "Kano"], start=1):
                  print(f"{number}. {city}")
            accept: ["3. Kano"]

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: lists"
      covers: "Week 2 · Day 1: creating lists, indexes, append, remove, len, looping"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w02-d2-g01, difficulty: easy, type: mcq, prompt: "Which creates a list?", choices: ["fruits = [\"mango\", \"pawpaw\"]", "fruits = (\"mango\")", "fruits = \"mango, pawpaw\"", "fruits = list mango"], answer: 0 }
        - { id: fs-w02-d2-g02, difficulty: easy, type: mcq, prompt: "Index 0 means…", choices: ["the first item", "the last item", "no item", "the second item"], answer: 0 }
        - { id: fs-w02-d2-g03, difficulty: easy, type: mcq, prompt: "Index -1 means…", choices: ["the last item", "the first item", "an error", "an empty item"], answer: 0 }
        - { id: fs-w02-d2-g04, difficulty: easy, type: mcq, prompt: "len([\"a\", \"b\", \"c\"]) =", choices: ["3", "2", "4", "\"abc\""], answer: 0 }
        - { id: fs-w02-d2-g05, difficulty: easy, type: truefalse, prompt: "append() adds an item at the end of a list.", answer: true }
        - { id: fs-w02-d2-g06, difficulty: easy, type: truefalse, prompt: "Lists keep their items in order.", answer: true }
        - id: fs-w02-d2-g07
          difficulty: medium
          type: mcq
          prompt: "What does this print?"
          code: |
            cities = ["Lagos", "Abuja", "Kano", "Port Harcourt"]
            print(cities[-1])
          choices: ["Port Harcourt", "Lagos", "Kano", "an error"]
          answer: 0
        - id: fs-w02-d2-g08
          difficulty: medium
          type: mcq
          prompt: "What does this print?"
          code: |
            cities = ["Lagos", "Abuja", "Kano"]
            cities[1] = "Ibadan"
            print(cities)
          choices: ["['Lagos', 'Ibadan', 'Kano']", "['Ibadan', 'Abuja', 'Kano']", "['Lagos', 'Abuja', 'Ibadan']", "an error"]
          answer: 0
        - id: fs-w02-d2-g09
          difficulty: medium
          type: text
          prompt: "How many lines does this print? (a number)"
          code: |
            for city in ["Lagos", "Abuja", "Kano"]:
                print("Nigerian city:", city)
          accept: ["3", "three"]
        - { id: fs-w02-d2-g10, difficulty: medium, type: text, prompt: "Write the line that adds \"Enugu\" to the end of the list cities.", accept: ["cities.append(\"Enugu\")", "cities.append('Enugu')"] }
        - { id: fs-w02-d2-g11, difficulty: medium, type: match, prompt: "Match the code to what it does.", pairs: [["foods.append(x)", "add x at the end"], ["foods.remove(x)", "remove the first x"], ["len(foods)", "count the items"], ["foods[0]", "get the first item"]] }
        - { id: fs-w02-d2-g12, difficulty: medium, type: mcq, prompt: "Which error do you get for cities[10] on a 4-item list?", choices: ["IndexError", "TypeError", "NameError", "ValueError"], answer: 0 }
        - { id: fs-w02-d2-g13, difficulty: medium, type: mcq, prompt: "enumerate(foods, start=1) gives pairs of…", choices: ["(number, item)", "(item, number)", "(item, item)", "(0, 1)"], answer: 0 }
        - id: fs-w02-d2-g14
          difficulty: medium
          type: mcq
          prompt: "What does this print?"
          code: |
            nums = [1, 2, 3]
            nums.append(nums[0])
            print(nums)
          choices: ["[1, 2, 3, 1]", "[1, 1, 2, 3]", "[2, 3, 1]", "an error"]
          answer: 0
        - { id: fs-w02-d2-g15, difficulty: medium, type: truefalse, prompt: "remove() deletes every copy of the value from the list.", answer: false, explain: "Only the first match." }
        - id: fs-w02-d2-g16
          difficulty: hard
          type: mcq
          prompt: "What does this print?"
          code: |
            items = ["a", "b", "c", "d"]
            print(items[-2])
          choices: ["c", "b", "d", "an error"]
          answer: 0
        - id: fs-w02-d2-g17
          difficulty: hard
          type: text
          prompt: "What does this print? (just the number)"
          code: |
            scores = []
            for s in [40, 60, 80]:
                if s >= 50:
                    scores.append(s)
            print(len(scores))
          accept: ["2", "two"]
        - { id: fs-w02-d2-g18, difficulty: hard, type: multi, prompt: "For foods = [\"rice\", \"yam\"], which lines work? (Select all.)", choices: ["foods.append(\"egusi\")", "foods[2]", "foods[-1]", "foods.remove(\"yam\")", "foods.remove(\"beans\")"], answers: [0, 2, 3] }
    quizzes:
      - kind: rapid-fire
        title: "Slices & list tricks"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w02-d2-rf01, difficulty: easy, type: mcq, prompt: "[10, 20, 30, 40][1:3] =", choices: ["[20, 30]", "[10, 20, 30]", "[20, 30, 40]", "[10, 20]"], answer: 0 }
          - { id: fs-w02-d2-rf02, difficulty: easy, type: mcq, prompt: "[10, 20, 30, 40][-2:] =", choices: ["[30, 40]", "[40]", "[20, 30, 40]", "[10, 20]"], answer: 0 }
          - { id: fs-w02-d2-rf03, difficulty: easy, type: mcq, prompt: "max([45, 12, 78]) =", choices: ["78", "45", "12", "135"], answer: 0 }
          - { id: fs-w02-d2-rf04, difficulty: easy, type: mcq, prompt: "min([45, 12, 78]) =", choices: ["12", "45", "78", "0"], answer: 0 }
          - { id: fs-w02-d2-rf05, difficulty: easy, type: mcq, prompt: "sum([10, 20, 30]) =", choices: ["60", "30", "3", "102030"], answer: 0 }
          - { id: fs-w02-d2-rf06, difficulty: easy, type: mcq, prompt: "78 in [45, 12, 78] is…", choices: ["True", "False", "78", "an error"], answer: 0 }
          - { id: fs-w02-d2-rf07, difficulty: easy, type: mcq, prompt: "Sort a list in place", choices: ["nums.sort()", "sort(nums)", "nums.order()", "nums.sorted()"], answer: 0 }
          - { id: fs-w02-d2-rf08, difficulty: easy, type: mcq, prompt: "Average of scores", choices: ["sum(scores) / len(scores)", "max(scores) / 2", "len(scores) / sum(scores)", "scores.average()"], answer: 0 }
          - { id: fs-w02-d2-rf09, difficulty: easy, type: truefalse, prompt: "[\"Kano\", \"Abuja\"].sort() puts Abuja first.", answer: true }
          - { id: fs-w02-d2-rf10, difficulty: easy, type: mcq, prompt: "[1, 2, 3][0:2] =", choices: ["[1, 2]", "[1, 2, 3]", "[2, 3]", "[0, 1, 2]"], answer: 0 }
      - kind: brain-teaser
        title: "Grade the class"
        questions:
          - id: fs-w02-d2-bt01
            difficulty: medium
            type: text
            prompt: "What does this print? (just the number)"
            code: |
              scores = [50, 70, 90]
              print(sum(scores) / len(scores))
            accept: ["70.0"]
            explain: "/ always gives a float in Python."
          - id: fs-w02-d2-bt02
            difficulty: medium
            type: mcq
            prompt: "What does this print?"
            code: |
              nums = [45, 12, 78, 3]
              nums.sort()
              print(nums[0], nums[-1])
            choices: ["3 78", "45 3", "12 78", "78 3"]
            answer: 0
          - id: fs-w02-d2-bt03
            difficulty: medium
            type: mcq
            prompt: "What does this print?"
            code: |
              scores = [45, 72, 38, 91, 55]
              print(sorted(scores, reverse=True)[:3])
            choices: ["[91, 72, 55]", "[38, 45, 55]", "[45, 72, 38]", "[91, 72, 55, 45]"]
            answer: 0
          - id: fs-w02-d2-bt04
            difficulty: hard
            type: mcq
            prompt: "What does this print?"
            code: |
              scores = [45, 72, 38, 91, 55]
              average = sum(scores) / len(scores)
              print("Pass" if average >= 50 else "Fail")
            choices: ["Pass", "Fail", "60.2", "an error"]
            answer: 0
            explain: "The average is 60.2."
          - id: fs-w02-d2-bt05
            difficulty: hard
            type: mcq
            prompt: "What's the difference between these two?"
            code: |
              a = nums.sort()
              b = sorted(nums)
            choices: ["sort() changes nums and returns None; sorted() returns a new sorted list", "They are identical", "sorted() changes nums", "sort() returns a copy"]
            answer: 0

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: list operations"
      covers: "Week 2 · Day 2: slicing, sort, in, min/max, sum and averages"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fs-w02-d3-g01, difficulty: easy, type: mcq, prompt: "cities[0:2] gives…", choices: ["the first two items", "items 0, 1 and 2", "the last two items", "one item"], answer: 0 }
        - { id: fs-w02-d3-g02, difficulty: easy, type: mcq, prompt: "\"Lagos\" in cities returns…", choices: ["True or False", "the index", "the item", "a new list"], answer: 0 }
        - { id: fs-w02-d3-g03, difficulty: easy, type: mcq, prompt: "Which gives the highest number in a list?", choices: ["max()", "top()", "high()", "sum()"], answer: 0 }
        - { id: fs-w02-d3-g04, difficulty: easy, type: mcq, prompt: "Which puts a list in order?", choices: [".sort()", ".order()", ".arrange()", ".line()"], answer: 0 }
        - { id: fs-w02-d3-g05, difficulty: easy, type: truefalse, prompt: "sum([1, 2, 3]) is 6.", answer: true }
        - { id: fs-w02-d3-g06, difficulty: easy, type: mcq, prompt: "[5, 6, 7, 8][-2:] =", choices: ["[7, 8]", "[8]", "[6, 7, 8]", "[5, 6]"], answer: 0 }
        - id: fs-w02-d3-g07
          difficulty: medium
          type: mcq
          prompt: "What does this print?"
          code: |
            numbers = [45, 12, 78, 3, 56, 23, 89, 1]
            numbers.sort()
            print(numbers[0:3])
          choices: ["[1, 3, 12]", "[45, 12, 78]", "[89, 78, 56]", "[1, 3, 12, 23]"]
          answer: 0
        - id: fs-w02-d3-g08
          difficulty: medium
          type: text
          prompt: "What does this print? (just the number)"
          code: |
            scores = [60, 80, 100]
            print(max(scores) - min(scores))
          accept: ["40"]
        - { id: fs-w02-d3-g09, difficulty: medium, type: mcq, prompt: "The slice [1:3] includes index 3.", choices: ["No: the end index is excluded", "Yes", "Only for numbers", "Only for text"], answer: 0 }
        - { id: fs-w02-d3-g10, difficulty: medium, type: text, prompt: "Write the expression for the average of the list scores.", accept: ["sum(scores) / len(scores)", "sum(scores)/len(scores)"] }
        - { id: fs-w02-d3-g11, difficulty: medium, type: match, prompt: "Match the function to its result for [3, 9, 6].", pairs: [["max", "9"], ["min", "3"], ["sum", "18"], ["len", "3"]] }
        - id: fs-w02-d3-g12
          difficulty: medium
          type: mcq
          prompt: "What does this print?"
          code: |
            if 78 in [45, 12, 78]:
                print("78 is in the list")
            else:
                print("78 is not in the list")
          choices: ["78 is in the list", "78 is not in the list", "True", "an error"]
          answer: 0
        - { id: fs-w02-d3-g13, difficulty: medium, type: truefalse, prompt: "sorted(nums) leaves nums unchanged.", answer: true }
        - { id: fs-w02-d3-g14, difficulty: medium, type: mcq, prompt: "Which gives the list from highest to lowest?", choices: ["sorted(nums, reverse=True)", "sorted(nums)", "nums.sort(-1)", "reversed(nums.sort())"], answer: 0 }
        - { id: fs-w02-d3-g15, difficulty: medium, type: mcq, prompt: "cities[:2] is the same as…", choices: ["cities[0:2]", "cities[2:]", "cities[1:2]", "cities[-2:]"], answer: 0 }
        - id: fs-w02-d3-g16
          difficulty: hard
          type: text
          prompt: "What does this print? (just the list)"
          code: |
            letters = ["a", "b", "c", "d", "e"]
            print(letters[1:4])
          accept: ["['b', 'c', 'd']"]
        - id: fs-w02-d3-g17
          difficulty: hard
          type: mcq
          prompt: "What does this print?"
          code: |
            scores = [40, 55, 70]
            passing = 0
            for s in scores:
                if s >= 50:
                    passing = passing + 1
            print(passing, "of", len(scores))
          choices: ["2 of 3", "1 of 3", "3 of 3", "55 of 70"]
          answer: 0
        - { id: fs-w02-d3-g18, difficulty: hard, type: multi, prompt: "For nums = [4, 1, 3], which are True? (Select all.)", choices: ["sorted(nums) == [1, 3, 4]", "nums[-1] == 3", "3 in nums", "len(nums) == 4", "max(nums) == nums[0]"], answers: [0, 1, 2, 4] }
    quizzes:
      - kind: rapid-fire
        title: "Functions speed round"
        secondsPerQuestion: 10
        questions:
          - { id: fs-w02-d3-rf01, difficulty: easy, type: mcq, prompt: "Which keyword defines a function?", choices: ["def", "function", "fun", "define"], answer: 0 }
          - { id: fs-w02-d3-rf02, difficulty: easy, type: mcq, prompt: "Which sends a value back from a function?", choices: ["return", "print", "send", "give"], answer: 0 }
          - { id: fs-w02-d3-rf03, difficulty: easy, type: mcq, prompt: "In def greet(name):, name is a…", choices: ["parameter", "return value", "loop", "module"], answer: 0 }
          - { id: fs-w02-d3-rf04, difficulty: easy, type: mcq, prompt: "In greet(\"Ada\"), \"Ada\" is an…", choices: ["argument", "parameter", "error", "import"], answer: 0 }
          - { id: fs-w02-d3-rf05, difficulty: easy, type: mcq, prompt: "A def line ends with…", choices: [":", ";", ")", "."], answer: 0 }
          - { id: fs-w02-d3-rf06, difficulty: easy, type: truefalse, prompt: "Defining a function runs its code immediately.", answer: false }
          - { id: fs-w02-d3-rf07, difficulty: easy, type: truefalse, prompt: "A function can be called many times.", answer: true }
          - { id: fs-w02-d3-rf08, difficulty: easy, type: mcq, prompt: "A function with no return gives back…", choices: ["None", "0", "an error", "an empty string"], answer: 0 }
          - { id: fs-w02-d3-rf09, difficulty: easy, type: mcq, prompt: "Call a function named greet", choices: ["greet()", "call greet", "def greet", "greet:"], answer: 0 }
          - { id: fs-w02-d3-rf10, difficulty: easy, type: mcq, prompt: "Why write functions?", choices: ["Write code once, reuse it everywhere", "They make code slower", "Python requires them", "To avoid variables"], answer: 0 }
      - kind: brain-teaser
        title: "Return or print?"
        questions:
          - id: fs-w02-d3-bt01
            difficulty: medium
            type: text
            prompt: "What does this print? (just the number)"
            code: |
              def add(a, b):
                  return a + b

              print(add(10, 5))
            accept: ["15"]
          - id: fs-w02-d3-bt02
            difficulty: medium
            type: mcq
            prompt: "What does this print?"
            code: |
              def add(a, b):
                  print(a + b)

              result = add(2, 3)
              print(result)
            choices: ["5 then None", "5 then 5", "None", "5"]
            answer: 0
            explain: "add prints 5 but returns nothing, so result is None."
          - id: fs-w02-d3-bt03
            difficulty: medium
            type: mcq
