tasks:
  - prompt: "get_passing_scores([45, 72, 38, 91]) returns [72, 91]; with pass_mark=40 it returns [45, 72, 91]."
    tests: |
      assert get_passing_scores([45, 72, 38, 91]) == [72, 91]
      assert get_passing_scores([45, 72, 38, 91], pass_mark=40) == [45, 72, 91]
  - prompt: "get_average([10, 20, 30]) returns 20, and get_average([]) returns 0 instead of crashing."
    tests: |
      assert get_average([10, 20, 30]) == 20
      assert get_average([]) == 0, "An empty list should give 0, not a ZeroDivisionError"
  - prompt: "largest([3, 17, 8]) returns 17, largest([-5, -2]) returns -2, without using max()."
    tests: |
      assert largest([3, 17, 8]) == 17
      assert largest([-5, -2]) == -2, "Careful: start with the first item, not 0"
      assert "max(" not in __code__, "No max() allowed"
