# Week 1 · Day 3 mini-task
id: py-w01-d3-naira
kind: python
title: "Naira calculator"
description: "Ask for an amount in USD, multiply by 1550, print the result in Naira."
starter: |
  # Write your Naira calculator here.
  usd = input("Enter amount in USD: ")
tasks:
  - prompt: "With 100 as the input, your program prints 155000 somewhere in its output."
    stdin: ["100"]
    expectOutput: ["155000"]
    hint: "Convert with float(usd), multiply by 1550, then print."
  - prompt: "It also works with a decimal: 2.5 USD → 3875."
    stdin: ["2.5"]
    expectOutput: ["3875"]
