tasks:
  - prompt: "view_all_contacts() doesn't crash when contacts.txt doesn't exist yet."
    tests: |
      import os
      if os.path.exists("contacts.txt"):
          os.remove("contacts.txt")
      view_all_contacts()
  - prompt: "search_contact finds a saved contact and prints its phone number."
    tests: |
      import io, os, contextlib
      if os.path.exists("contacts.txt"):
          os.remove("contacts.txt")
      add_contact("Ngozi", "08031234567")
      out = io.StringIO()
      with contextlib.redirect_stdout(out):
          search_contact("Ngozi")
      assert "08031234567" in out.getvalue(), "search_contact('Ngozi') should print her phone number"
  - prompt: "search_contact prints Not found for an unknown name."
    tests: |
      import io, contextlib
      out = io.StringIO()
      with contextlib.redirect_stdout(out):
          search_contact("Zzz")
      assert "not found" in out.getvalue().lower(), "should print Not found"
