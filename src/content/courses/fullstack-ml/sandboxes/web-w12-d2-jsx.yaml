# Week 12 · Day 2 mini-task
id: web-w12-d2-jsx
kind: web
react: true
title: "JSX rules"
description: "className, {expressions}, && and ternaries, and a style object, in one dish card."
html: |
  <div id="root"></div>
css: |
  body { font-family: system-ui, sans-serif; padding: 1rem; background: #fff8ef; color: #2b1d16; }
  .card { background: #fff; border: 2px solid #c0392b; border-radius: 12px; padding: 0.5rem 0.75rem; margin: 0.5rem 0; }
  .card h3 { margin: 0; font-size: 1rem; }
  .card p { margin: 0.25rem 0 0; }
  .sold-out { opacity: 0.5; }
  .badge { background: #2b1d16; color: #fff; border-radius: 6px; padding: 0 0.4rem; font-size: 0.8rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; }
js: |
  const name = "Party jollof"
  const price = 3500
  const spicy = true
  const soldOut = false

  function DishOfTheDay() {
    // Fix and finish this JSX:
    // 1. Use className="card" on the article (not class)
    // 2. Show the name in the h3 and the price as ₦3,500 (use price.toLocaleString())
    // 3. Show <span className="hot">🌶️ Spicy</span> only when spicy is true (&&)
    // 4. Show "Sold out today" when soldOut is true, otherwise "Order now" (a ternary) in a <p className="status">
    // 5. Give the p.status a style object: { fontWeight: "bold" }
    return (
      <article>
        <h3>NAME HERE</h3>
        <p>PRICE HERE</p>
      </article>
    )
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<DishOfTheDay />)
tasks:
  - prompt: "The article has className=\"card\"."
    check: "document.querySelector('#root article')?.className === 'card'"
  - prompt: "The h3 shows the name and the price shows \u20a63,500."
    check: "document.querySelector('#root h3')?.textContent === 'Party jollof' && [...document.querySelectorAll('#root p')].some((p) => p.textContent === '\u20a63,500')"
    hint: "<p>\u20a6{price.toLocaleString()}</p>"
  - prompt: "The \ud83c\udf36\ufe0f Spicy span shows (spicy is true)."
    check: "document.querySelector('#root .hot')?.textContent === '\ud83c\udf36\ufe0f Spicy'"
    hint: "{spicy && <span className=\"hot\">\ud83c\udf36\ufe0f Spicy</span>}"
  - prompt: "p.status says \"Order now\" (soldOut is false), in bold via a style object."
    check: "(() => { const s = document.querySelector('#root .status'); return !!s && s.textContent === 'Order now' && s.style.fontWeight === 'bold' })()"
    hint: "<p className=\"status\" style={{ fontWeight: \"bold\" }}>{soldOut ? \"Sold out today\" : \"Order now\"}</p>"
