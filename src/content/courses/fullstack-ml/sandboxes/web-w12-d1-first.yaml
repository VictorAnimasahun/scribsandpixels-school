# Week 12 · Day 1 mini-task
id: web-w12-d1-first
kind: web
react: true
title: "Your first component"
description: "Write and render your first React components. JSX in the JS tab is compiled for you; React is preloaded."
html: |
  <div id="root"></div>
css: |
  body { font-family: system-ui, sans-serif; padding: 1rem; background: #fff8ef; color: #2b1d16; }
  .card { background: #fff; border: 2px solid #c0392b; border-radius: 12px; padding: 0.5rem 0.75rem; margin: 0.5rem 0; }
  .card h3 { margin: 0; font-size: 1rem; }
  .card p { margin: 0.25rem 0 0; }
  .sold-out { opacity: 0.5; }
  .badge { background: #2b1d16; color: #fff; border-radius: 6px; padding: 0 0.4rem; font-size: 0.8rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; }
js: |
  // Your first React component. React and ReactDOM are already loaded.
  // 1. Write a component called Welcome that returns <h1>Mama Put Kitchen</h1>
  // 2. Render <Welcome /> into the #root div
  // 3. Write a second component, Tagline, returning <p>Home-style Nigerian food in Yaba</p>
  // 4. Make Welcome return BOTH: wrap the h1 and <Tagline /> in a fragment <> </>
tasks:
  - prompt: "React renders an h1 \"Mama Put Kitchen\" inside #root."
    check: "document.querySelector('#root h1')?.textContent === 'Mama Put Kitchen'"
    hint: "ReactDOM.createRoot(document.getElementById(\"root\")).render(<Welcome />)"
  - prompt: "A Welcome component exists (a function starting with a capital W)."
    check: "typeof Welcome === 'function'"
  - prompt: "A Tagline component renders the tagline paragraph."
    check: "typeof Tagline === 'function' && document.querySelector('#root p')?.textContent === 'Home-style Nigerian food in Yaba'"
  - prompt: "The h1 and the tagline are siblings directly in #root (a fragment, no extra wrapper)."
    check: "(() => { const r = document.querySelector('#root'); return r.children.length === 2 && r.children[0].tagName === 'H1' && r.children[1].tagName === 'P' })()"
    hint: "return (<><h1>Mama Put Kitchen</h1><Tagline /></>)"
