# Week 1 · Day 6 weekly project
id: py-w01-d6-quiz
kind: python
title: "Nigeria quiz game"
description: "Finish the quiz: 3 questions, a score counter, and the final score out of 3."
starter: |
  name = input("Welcome! What is your name? ")
  print("Hello,", name, "! Let's play a quiz.")

  score = 0

  # Question 1
  answer1 = input("What is the capital of Nigeria? ").lower()
  if answer1 == "abuja":
      print("Correct!")
      score = score + 1
  else:
      print("Wrong! The answer is Abuja.")

  # Question 2 — write this yourself

  # Question 3 — write this yourself

  print("Quiz over!", name, "you scored", score, "out of 3")
tasks:
  - prompt: "It asks for the name plus 3 questions (inputs: Ada, abuja, x, x)."
    stdin: ["Ada", "abuja", "x", "x"]
    expectOutput: ["Hello, Ada", "Correct!"]
    tests: |
      assert __output__.count("?") >= 4, "Ask 3 quiz questions (each ending with ?)"
  - prompt: "All answers wrong → Quiz over! Ada you scored 0 out of 3"
    stdin: ["Ada", "x", "x", "x"]
    expectOutput: ["you scored 0 out of 3"]
    tests: |
      assert __output__.count("?") >= 4, "Ask 3 quiz questions"
  - prompt: "Only the first answer right → you scored 1 out of 3 (each question can add a point)"
    stdin: ["Ada", "abuja", "x", "x"]
    expectOutput: ["you scored 1 out of 3"]
    tests: |
      assert __code__.count("score") >= 4, "Questions 2 and 3 should add to score too"
