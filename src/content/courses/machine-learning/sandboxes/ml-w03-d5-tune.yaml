# Week 3 · Day 5 practice
id: ml-w03-d5-tune
kind: python
title: "Tune the forest, look inside, test once"
description: "Grid-search the random forest's settings, read which features it relied on, then evaluate it on the locked test set, once, and compare it with the agents."
files: [lagos_housing.csv]
starter: |
  import numpy as np
  import pandas as pd
  from sklearn.model_selection import StratifiedShuffleSplit
  from sklearn.base import BaseEstimator, TransformerMixin
  from sklearn.pipeline import Pipeline
  from sklearn.compose import ColumnTransformer
  from sklearn.impute import SimpleImputer
  from sklearn.preprocessing import OneHotEncoder, StandardScaler

  df = pd.read_csv("lagos_housing.csv")
  df["bed_cat"] = df["bedrooms"].clip(upper=5)
  train_idx, test_idx = next(StratifiedShuffleSplit(n_splits=1, test_size=0.2, random_state=42).split(df, df["bed_cat"]))
  train_set = df.iloc[train_idx].drop(columns="bed_cat")
  test_set = df.iloc[test_idx].drop(columns="bed_cat")
  X, y = train_set.drop(columns=["price_m", "listing_id"]), train_set["price_m"].copy()
  X_test, y_test = test_set.drop(columns=["price_m", "listing_id"]), test_set["price_m"].copy()

  AREA_FIX = {"surulere": "Surulere", "Ikeja Gra": "Ikeja GRA", "Ikeja G.R.A": "Ikeja GRA", "lekki phase 1": "Lekki Phase 1",
              "Lekki Ph 1": "Lekki Phase 1", "V.I.": "Victoria Island", "Victoria island": "Victoria Island", "Ajah ": "Ajah"}
  NUM_COLS = ["latitude", "longitude", "bedrooms", "bathrooms", "toilets", "size_sqm", "building_age", "parking_spaces"]

  class AreaCleaner(BaseEstimator, TransformerMixin):
      def fit(self, X, y=None):
          return self
      def transform(self, X):
          X = X.copy()
          X["area"] = X["area"].replace(AREA_FIX)
          return X

  class AddDistance(BaseEstimator, TransformerMixin):
      def fit(self, X, y=None):
          return self
      def transform(self, X):
          X = X.copy()
          X["km_to_ikoyi"] = np.sqrt(((X["latitude"] - 6.452) * 111) ** 2 + ((X["longitude"] - 3.435) * 110) ** 2)
          return X
  from sklearn.ensemble import RandomForestRegressor
  from sklearn.model_selection import GridSearchCV
  from sklearn.metrics import mean_squared_error

  num_pipeline = Pipeline([("imputer", SimpleImputer(strategy="median")), ("scaler", StandardScaler())])
  preprocess = ColumnTransformer([
      ("num", num_pipeline, NUM_COLS + ["km_to_ikoyi"]),
      ("cat", OneHotEncoder(handle_unknown="ignore"), ["area", "property_type", "serviced"]),
  ])
  full_pipeline = Pipeline([("clean", AreaCleaner()), ("distance", AddDistance()), ("prepare", preprocess)])
  X_prepared = full_pipeline.fit_transform(X)

  # 1. Try every combination: 2 × 3 = 6, each cross-validated 3 times.
  param_grid = {"n_estimators": [20, 40], "max_features": [4, 8, 12]}
  grid = None          # GridSearchCV(RandomForestRegressor(random_state=42), param_grid, cv=3, scoring="neg_mean_squared_error").fit(X_prepared, y)
  BEST_PARAMS = None   # grid.best_params_
  best = None          # grid.best_estimator_

  # 2. Which features mattered? Pair each importance with its column name, biggest first.
  names = NUM_COLS + ["km_to_ikoyi"] + list(full_pipeline.named_steps["prepare"].named_transformers_["cat"].get_feature_names_out(["area", "property_type", "serviced"]))
  TOP_FEATURES = None  # the names of the 3 most important features, e.g. sorted(zip(best.feature_importances_, names), reverse=True)[:3]

  # 3. The one honest test: transform (NOT fit) the test set, then predict.
  TEST_RMSE = None
  SHARE_WITHIN_20 = None   # share of test predictions within 20% of the real price
tasks:
  - prompt: "Grid search picks 40 trees and max_features 12."
    tests: |
      assert BEST_PARAMS == {"max_features": 12, "n_estimators": 40}, f"BEST_PARAMS = {BEST_PARAMS}"
    hint: "Uncomment the grid line; then BEST_PARAMS = grid.best_params_ and best = grid.best_estimator_."
  - prompt: "The forest's top 3 features: size_sqm, then km_to_ikoyi (your Week 2 feature), then being a detached duplex."
    tests: |
      assert TOP_FEATURES is not None and list(TOP_FEATURES)[:3] == ["size_sqm", "km_to_ikoyi", "property_type_detached duplex"], f"TOP_FEATURES = {TOP_FEATURES}"
    hint: "TOP_FEATURES = [name for _, name in sorted(zip(best.feature_importances_, names), reverse=True)[:3]]"
  - prompt: "On the test set, once: RMSE about ₦33m, and about two-thirds of predictions within 20% of the real price (the agents managed 50%)."
    tests: |
      assert TEST_RMSE is not None and abs(TEST_RMSE - 33.24) < 1.5, f"TEST_RMSE = {TEST_RMSE}"
      assert SHARE_WITHIN_20 is not None and abs(SHARE_WITHIN_20 - 0.66) < 0.03, f"SHARE_WITHIN_20 = {SHARE_WITHIN_20}"
      assert "full_pipeline.transform(X_test)" in __code__.replace(" ", "").replace("full_pipeline.transform(X_test)", "full_pipeline.transform(X_test)") or "transform(X_test)" in __code__, "prepare the test set with full_pipeline.transform(X_test)"
      assert "fit_transform(X_test)" not in __code__, "never fit on the test set: use transform"
    hint: "X_test_prepared = full_pipeline.transform(X_test); pred = best.predict(X_test_prepared); TEST_RMSE = np.sqrt(mean_squared_error(y_test, pred)); SHARE_WITHIN_20 = (abs(pred - y_test) / y_test <= 0.20).mean()"
