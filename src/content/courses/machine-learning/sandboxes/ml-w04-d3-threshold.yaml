tasks:
  - prompt: "f1(0.6, 0.75) is 0.667, and the eight-transaction table matches the lesson: threshold 0 gives 75% / 75%, raising it to 0.5 drops precision to 67%."
    tests: |
      assert f1(0.6, 0.75) is not None and abs(f1(0.6, 0.75) - 2 / 3) < 1e-9, f"f1(0.6, 0.75) = {f1(0.6, 0.75)}"
      assert abs(f1(1.0, 0.1) - 0.2 / 1.1) < 1e-9, "f1(1.0, 0.1) should be about 0.18"
      got = {t: precision_recall_at(t) for t in (-1.5, 0, 0.5, 1.0)}
      want = {-1.5: (4 / 6, 1.0), 0: (0.75, 0.75), 0.5: (2 / 3, 0.5), 1.0: (1.0, 0.5)}
      for t, (p, r) in want.items():
          assert got[t] is not None and abs(got[t][0] - p) < 1e-9 and abs(got[t][1] - r) < 1e-9, f"threshold {t}: got {got[t]}, want ({p:.3f}, {r:.3f})"
    hint: "flagged = [f for s, f in zip(SCORES, FRAUD) if s >= threshold]; precision = sum(flagged) / len(flagged); recall = sum(flagged) / sum(FRAUD)."
  - prompt: "The detector's F1 is 0.92. Demanding 100% precision needs a threshold of about 316 and keeps only about 61% recall."
    tests: |
      assert F1 is not None and abs(F1 - 0.9242) < 0.001, f"F1 = {F1}"
      assert y_scores is not None and len(y_scores) == 1437, "y_scores needs one score per training image"
      assert THRESHOLD_100 is not None and abs(THRESHOLD_100 - 316.3) < 2, f"THRESHOLD_100 = {THRESHOLD_100}"
      assert RECALL_AT_100 is not None and abs(RECALL_AT_100 - 0.607) < 0.01, f"RECALL_AT_100 = {RECALL_AT_100}"
    hint: "Uncomment the precision_recall_curve line. np.argmax finds the FIRST True, which is the lowest threshold because thresholds are sorted from low to high."
  - prompt: "At threshold -500 it catches 97% of the fives, but only 29% of its alarms are real."
    tests: |
      assert RECALL_LOW is not None and abs(RECALL_LOW - 0.9724) < 0.005, f"RECALL_LOW = {RECALL_LOW}"
      assert PRECISION_LOW is not None and abs(PRECISION_LOW - 0.2878) < 0.005, f"PRECISION_LOW = {PRECISION_LOW}"
    hint: "low = y_scores >= -500, then precision_score(y_train_5, low) and recall_score(y_train_5, low)."
