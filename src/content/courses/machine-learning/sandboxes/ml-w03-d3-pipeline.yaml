# Week 3 · Day 3 practice
id: ml-w03-d3-pipeline
kind: python
title: "Scaling, and the full preparation pipeline"
description: "Watch one typo crush min-max scaling, then chain every preparation step into one pipeline that turns raw listings into 29 numbers."
files: [lagos_housing.csv]
starter: |
  import numpy as np
  import pandas as pd
  from sklearn.model_selection import StratifiedShuffleSplit
  from sklearn.base import BaseEstimator, TransformerMixin
  from sklearn.pipeline import Pipeline
  from sklearn.compose import ColumnTransformer
  from sklearn.impute import SimpleImputer
  from sklearn.preprocessing import OneHotEncoder, StandardScaler

  df = pd.read_csv("lagos_housing.csv")
  df["bed_cat"] = df["bedrooms"].clip(upper=5)
  train_idx, test_idx = next(StratifiedShuffleSplit(n_splits=1, test_size=0.2, random_state=42).split(df, df["bed_cat"]))
  train_set = df.iloc[train_idx].drop(columns="bed_cat")
  test_set = df.iloc[test_idx].drop(columns="bed_cat")
  X, y = train_set.drop(columns=["price_m", "listing_id"]), train_set["price_m"].copy()
  X_test, y_test = test_set.drop(columns=["price_m", "listing_id"]), test_set["price_m"].copy()

  AREA_FIX = {"surulere": "Surulere", "Ikeja Gra": "Ikeja GRA", "Ikeja G.R.A": "Ikeja GRA", "lekki phase 1": "Lekki Phase 1",
              "Lekki Ph 1": "Lekki Phase 1", "V.I.": "Victoria Island", "Victoria island": "Victoria Island", "Ajah ": "Ajah"}
  NUM_COLS = ["latitude", "longitude", "bedrooms", "bathrooms", "toilets", "size_sqm", "building_age", "parking_spaces"]

  class AreaCleaner(BaseEstimator, TransformerMixin):
      def fit(self, X, y=None):
          return self
      def transform(self, X):
          X = X.copy()
          X["area"] = X["area"].replace(AREA_FIX)
          return X

  class AddDistance(BaseEstimator, TransformerMixin):
      def fit(self, X, y=None):
          return self
      def transform(self, X):
          X = X.copy()
          X["km_to_ikoyi"] = np.sqrt(((X["latitude"] - 6.452) * 111) ** 2 + ((X["longitude"] - 3.435) * 110) ** 2)
          return X

  # 1. Min-max vs standardization on the training sizes (gaps dropped).
  sizes = X["size_sqm"].dropna()
  minmax = None      # (sizes - sizes.min()) / (sizes.max() - sizes.min())
  SHARE_BELOW_02 = None   # share of min-max-scaled sizes below 0.2   →   (minmax < 0.2).mean()

  # 2. The full pipeline:
  #    numbers → impute the median → standardize;  text → one-hot;  after cleaning areas and adding distance.
  num_pipeline = None      # Pipeline([("imputer", SimpleImputer(strategy="median")), ("scaler", StandardScaler())])
  preprocess = None        # ColumnTransformer([("num", num_pipeline, NUM_COLS + ["km_to_ikoyi"]),
                           #                    ("cat", OneHotEncoder(handle_unknown="ignore"), ["area", "property_type", "serviced"])])
  full_pipeline = None     # Pipeline([("clean", AreaCleaner()), ("distance", AddDistance()), ("prepare", preprocess)])
  X_prepared = None        # full_pipeline.fit_transform(X)
tasks:
  - prompt: "The 2,320 m² typo squashes min-max scaling: about 97% of sizes end up below 0.2."
    tests: |
      assert SHARE_BELOW_02 is not None and abs(SHARE_BELOW_02 - 0.974) < 0.002, f"SHARE_BELOW_02 = {SHARE_BELOW_02}"
    hint: "minmax = (sizes - sizes.min()) / (sizes.max() - sizes.min()); SHARE_BELOW_02 = (minmax < 0.2).mean()"
  - prompt: "full_pipeline turns the 2,400 training listings into 29 columns: 9 numbers + 12 areas + 6 property types + 2 serviced."
    tests: |
      assert X_prepared is not None and X_prepared.shape == (2400, 29), f"shape {None if X_prepared is None else X_prepared.shape}"
      assert isinstance(full_pipeline, Pipeline) and isinstance(preprocess, ColumnTransformer)
    hint: "Uncomment the three lines in step 2 and run full_pipeline.fit_transform(X)."
  - prompt: "The pipeline prepares the TEST set with transform (not fit): 600 rows, 29 columns, no gaps, and the scaled training numbers are centred on 0."
    tests: |
      import numpy as np
      Xt = full_pipeline.transform(X_test)
      dense = Xt.toarray() if hasattr(Xt, "toarray") else Xt
      assert dense.shape == (600, 29) and not np.isnan(dense).any()
      tr = X_prepared.toarray() if hasattr(X_prepared, "toarray") else X_prepared
      assert abs(tr[:, :9].mean()) < 1e-9, "after StandardScaler the 9 number columns average 0 on the training set"
