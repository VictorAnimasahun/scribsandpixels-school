# Week 3 · Day 6 weekly project
id: ml-w03-d6-ship
kind: python
title: "Ship Ìlé Homes' model"
description: "The whole project in one script: prepare, train the tuned forest, test once, then produce the numbers for the model card, including where the model struggles."
files: [lagos_housing.csv]
starter: |
  import numpy as np
  import pandas as pd
  from sklearn.model_selection import StratifiedShuffleSplit
  from sklearn.base import BaseEstimator, TransformerMixin
  from sklearn.pipeline import Pipeline
  from sklearn.compose import ColumnTransformer
  from sklearn.impute import SimpleImputer
  from sklearn.preprocessing import OneHotEncoder, StandardScaler

  df = pd.read_csv("lagos_housing.csv")
  df["bed_cat"] = df["bedrooms"].clip(upper=5)
  train_idx, test_idx = next(StratifiedShuffleSplit(n_splits=1, test_size=0.2, random_state=42).split(df, df["bed_cat"]))
  train_set = df.iloc[train_idx].drop(columns="bed_cat")
  test_set = df.iloc[test_idx].drop(columns="bed_cat")
  X, y = train_set.drop(columns=["price_m", "listing_id"]), train_set["price_m"].copy()
  X_test, y_test = test_set.drop(columns=["price_m", "listing_id"]), test_set["price_m"].copy()

  AREA_FIX = {"surulere": "Surulere", "Ikeja Gra": "Ikeja GRA", "Ikeja G.R.A": "Ikeja GRA", "lekki phase 1": "Lekki Phase 1",
              "Lekki Ph 1": "Lekki Phase 1", "V.I.": "Victoria Island", "Victoria island": "Victoria Island", "Ajah ": "Ajah"}
  NUM_COLS = ["latitude", "longitude", "bedrooms", "bathrooms", "toilets", "size_sqm", "building_age", "parking_spaces"]

  class AreaCleaner(BaseEstimator, TransformerMixin):
      def fit(self, X, y=None):
          return self
      def transform(self, X):
          X = X.copy()
          X["area"] = X["area"].replace(AREA_FIX)
          return X

  class AddDistance(BaseEstimator, TransformerMixin):
      def fit(self, X, y=None):
          return self
      def transform(self, X):
          X = X.copy()
          X["km_to_ikoyi"] = np.sqrt(((X["latitude"] - 6.452) * 111) ** 2 + ((X["longitude"] - 3.435) * 110) ** 2)
          return X
  from sklearn.ensemble import RandomForestRegressor
  from sklearn.metrics import mean_squared_error

  num_pipeline = Pipeline([("imputer", SimpleImputer(strategy="median")), ("scaler", StandardScaler())])
  preprocess = ColumnTransformer([
      ("num", num_pipeline, NUM_COLS + ["km_to_ikoyi"]),
      ("cat", OneHotEncoder(handle_unknown="ignore"), ["area", "property_type", "serviced"]),
  ])
  full_pipeline = Pipeline([("clean", AreaCleaner()), ("distance", AddDistance()), ("prepare", preprocess)])
  X_prepared = full_pipeline.fit_transform(X)

  # 1. Train the tuned forest (Friday's winner) on the prepared training data.
  model = None        # RandomForestRegressor(n_estimators=40, max_features=12, random_state=42).fit(X_prepared, y)

  # 2. Test once.
  pred = None         # model.predict(full_pipeline.transform(X_test))
  TEST_RMSE = None

  # 3. Model card numbers.
  SHARE_WITHIN_20 = None    # share of test predictions within 20% of the real price
  # Where does it struggle? Error on the capped (₦500m) test listings vs the rest.
  CAPPED_MAE = None         # mean absolute error on test listings whose real price is 500
  OTHER_MAE = None          # mean absolute error on all the other test listings

  # 4. A new listing: a 3-bedroom, 160 m² serviced flat in Yaba, 8 years old, 1 parking space.
  NEW = pd.DataFrame([{"area": "Yaba", "latitude": 6.5095, "longitude": 3.3781, "property_type": "flat", "bedrooms": 3,
                       "bathrooms": 3, "toilets": 4, "size_sqm": 160, "building_age": 8, "serviced": "yes", "parking_spaces": 1}])
  NEW_PRICE = None          # the model's price for it, in ₦ millions
tasks:
  - prompt: "The tuned forest scores about ₦33m RMSE on the test set, with about two-thirds of predictions within 20%."
    tests: |
      assert TEST_RMSE is not None and abs(TEST_RMSE - 33.24) < 1.5, f"TEST_RMSE = {TEST_RMSE}"
      assert abs(SHARE_WITHIN_20 - 0.66) < 0.03, f"SHARE_WITHIN_20 = {SHARE_WITHIN_20}"
    hint: "pred = model.predict(full_pipeline.transform(X_test)); TEST_RMSE = np.sqrt(mean_squared_error(y_test, pred))"
  - prompt: "It struggles on capped listings: its average error there is more than twice its average error on the rest (about ₦42m vs ₦19m). (That's a limit to write in the model card.)"
    tests: |
      assert CAPPED_MAE is not None and OTHER_MAE is not None
      assert CAPPED_MAE > 2 * OTHER_MAE, f"capped {CAPPED_MAE:.1f} vs other {OTHER_MAE:.1f}"
    hint: "mask = (y_test == 500).values; CAPPED_MAE = np.abs(pred[mask] - y_test[mask]).mean(); OTHER_MAE = np.abs(pred[~mask] - y_test[~mask]).mean()"
  - prompt: "The pipeline prices a brand-new listing (the Yaba flat) between ₦40m and ₦110m."
    tests: |
      assert NEW_PRICE is not None and 40 < float(NEW_PRICE) < 110, f"NEW_PRICE = {NEW_PRICE}"
    hint: "NEW_PRICE = model.predict(full_pipeline.transform(NEW))[0]. The same pipeline, so the new listing gets the same cleaning, filling, scaling and encoding."
