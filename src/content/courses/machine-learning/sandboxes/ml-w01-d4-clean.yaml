tasks:
  - prompt: "count_missing(ROWS, 'size') finds the 3 rows with no size."
    tests: |
      assert count_missing(ROWS, "size") == 3, f"got {count_missing(ROWS, 'size')}"
      assert count_missing(ROWS, "rent") == 0
    hint: "sum(1 for r in rows if r[field] is None)"
  - prompt: "clean_area turns every spelling into one of Lekki, Yaba or Ikeja."
    tests: |
      for raw, want in [("lekki ", "Lekki"), ("Leki", "Lekki"), ("LEKKI", "Lekki"), ("Yabba", "Yaba"), (" ikeja", "Ikeja"), ("Yaba", "Yaba")]:
          assert clean_area(raw) == want, f"clean_area({raw!r}) = {clean_area(raw)!r}, expected {want!r}"
    hint: "return FIX[name.strip().lower()]"
  - prompt: "drop_impossible removes the ₦5 rent and the ₦250 million rent (10 rows left) without changing ROWS."
    tests: |
      cleaned = [{**r, "area": clean_area(r["area"])} for r in ROWS]
      kept = drop_impossible(cleaned)
      assert len(kept) == 10, f"{len(kept)} rows kept"
      assert all(300_000 <= r["rent"] <= 50_000_000 for r in kept)
      assert len(cleaned) == 12, "return a new list; don't remove from the one you were given"
    hint: "[r for r in rows if 300_000 <= r['rent'] <= 50_000_000]"
  - prompt: "fill_with_median gives each missing size the median of all known sizes after cleaning: 95 m²."
    tests: |
      cleaned = drop_impossible([{**r, "area": clean_area(r["area"])} for r in ROWS])
      filled = fill_with_median(cleaned)
      assert all(r["size"] is not None for r in filled), "some sizes are still missing"
      assert [r["size"] for r in filled if r["rent"] in (7_200_000, 1_900_000, 2_800_000)] == [95, 95, 95]
      assert any(r["size"] is None for r in cleaned), "make new rows; don't fill in the originals"
    hint: "known = [r['size'] for r in rows if r['size'] is not None]; m = statistics.median(known); then build new dicts: {**r, 'size': m} when r['size'] is None, else r."
  - prompt: "fill_by_area uses each area's own median: the Lekki flat gets 120 m², the Yaba flat 57.5 m², the Ikeja flat 92.5 m²."
    tests: |
      cleaned = drop_impossible([{**r, "area": clean_area(r["area"])} for r in ROWS])
      filled = fill_by_area(cleaned)
      got = {r["rent"]: r["size"] for r in filled}
      assert got[7_200_000] == 120, f"Lekki gap filled with {got[7_200_000]}"
      assert got[1_900_000] == 57.5, f"Yaba gap filled with {got[1_900_000]} (known Yaba sizes after dropping the ₦5 row: 60 and 55)"
      assert got[2_800_000] == 92.5, f"Ikeja gap filled with {got[2_800_000]} (known Ikeja sizes after dropping the ₦250m row: 85 and 100)"
    hint: "First build a dict: area → list of its known sizes. Then for each row with a missing size, use statistics.median(sizes[row['area']])."
