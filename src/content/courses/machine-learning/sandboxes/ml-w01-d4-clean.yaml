id: ml-w01-d4-clean
kind: python
title: "Clean a messy rentals table"
description: "Real data is dirty: misspelled areas, missing sizes, a rent of ₦5 and another of ₦250 million. Count the problems, fix the names, drop the impossible rows, and fill the gaps two ways."
