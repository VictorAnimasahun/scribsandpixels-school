tasks:
  - prompt: "The bank's alarm wrongly flags 10 of 980 innocent transactions: an FPR of about 1%."
    tests: |
      assert false_positive_rate(10, 970) is not None and abs(false_positive_rate(10, 970) - 10 / 980) < 1e-9, f"false_positive_rate(10, 970) = {false_positive_rate(10, 970)}"
    hint: "fp / (fp + tn): the innocent transactions are the false alarms plus the correctly ignored ones."
  - prompt: "Area under the ROC curve: SGD about 0.981, the forest about 0.995 (1.0 is perfect, 0.5 is a coin toss)."
    tests: |
      assert AUC_SGD is not None and abs(AUC_SGD - 0.9807) < 0.002, f"AUC_SGD = {AUC_SGD}"
      assert y_scores_forest is not None and np.ndim(y_scores_forest) == 1, "y_scores_forest should be ONE column: y_probas_forest[:, 1]"
      assert AUC_FOREST is not None and abs(AUC_FOREST - 0.9952) < 0.003, f"AUC_FOREST = {AUC_FOREST}"
      assert AUC_FOREST > AUC_SGD
  - prompt: "At probability 0.5 the forest is never wrong when it says '5' (100% precision) but finds only about 81% of them."
    tests: |
      assert FOREST_PRECISION is not None and FOREST_PRECISION > 0.99, f"FOREST_PRECISION = {FOREST_PRECISION}"
      assert FOREST_RECALL is not None and abs(FOREST_RECALL - 0.814) < 0.03, f"FOREST_RECALL = {FOREST_RECALL}"
    hint: "said_five = y_scores_forest >= 0.5, then precision_score(y_train_5, said_five) and recall_score(y_train_5, said_five)."
