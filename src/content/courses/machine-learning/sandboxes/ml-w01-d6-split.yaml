# Week 1 · Day 6 weekly project
id: ml-w01-d6-split
kind: python
title: "Pick a model the honest way"
description: "30 Yaba flats, already shuffled. Split them three ways, let curves of degree 1 to 5 compete on the validation set, then test the winner once. Watch training error and validation error go opposite ways."
starter: |
  import numpy as np

  # (size m², yearly rent ₦m), already in random order.
  FLATS = [(58, 1.29), (104, 2.88), (87, 2.39), (77, 2.2), (75, 1.78), (119, 3.09), (131, 3.12), (58, 1.41),
           (105, 2.75), (70, 1.97), (137, 3.38), (132, 3.13), (104, 2.49), (115, 3.14), (92, 2.46), (123, 3.18),
           (85, 2.58), (74, 1.77), (68, 2.22), (63, 2.2), (93, 2.67), (83, 2.29), (106, 2.56), (41, 1.2),
           (85, 2.11), (77, 1.99), (60, 1.5), (99, 2.57), (84, 2.4), (70, 1.71)]

  def split(rows):
      # First 18 → training, next 6 → validation, last 6 → test. Return (train, val, test).
      pass

  def fit(rows, degree):
      xs, ys = [r[0] for r in rows], [r[1] for r in rows]
      return np.poly1d(np.polyfit(xs, ys, degree))

  def mae(model, rows):
      return float(np.mean([abs(model(x) - y) for x, y in rows]))

  def compare(train, val):
      # For each degree 1..5: fit on train, then measure the error on train AND on val.
      # Return a dict: {degree: (train_error, val_error)}
      pass

  def best_degree(results):
      # The degree with the SMALLEST VALIDATION error.
      pass

  def final_test(train, val, test, degree):
      # Géron's recipe: refit the chosen degree on train + val together,
      # then measure the error on the test set, once. Return that error.
      pass

  train, val, test = split(FLATS)
  results = compare(train, val)
  for d, (tr, va) in (results or {}).items():
      print(f"degree {d}: training error {tr:.3f}   validation error {va:.3f}")
  d = best_degree(results)
  print("Chosen degree:", d)
  print("Honest test error (₦m):", final_test(train, val, test, d))
tasks:
  - prompt: "split gives 18 training flats, 6 validation flats and 6 test flats, in order."
    tests: |
      tr, va, te = split(FLATS)
      assert (len(tr), len(va), len(te)) == (18, 6, 6), f"sizes: {len(tr)}, {len(va)}, {len(te)}"
      assert tr[0] == (58, 1.29) and va[0] == (68, 2.22) and te[0] == (85, 2.11)
    hint: "return rows[:18], rows[18:24], rows[24:]"
  - prompt: "compare returns training and validation errors for degrees 1–5: training error falls as the curves get wigglier, but validation error is lowest for the straight line (≈ 0.258)."
    tests: |
      tr, va, te = split(FLATS)
      res = compare(tr, va)
      assert sorted(res) == [1, 2, 3, 4, 5], f"degrees: {sorted(res)}"
      assert abs(res[1][1] - 0.2584) < 0.001 and abs(res[2][1] - 0.3600) < 0.001, f"validation errors: {[round(res[d][1], 4) for d in res]}"
      assert res[1][0] > res[3][0], "training error should drop from degree 1 to degree 3"
    hint: "{d: (mae(fit(train, d), train), mae(fit(train, d), val)) for d in range(1, 6)}"
  - prompt: "best_degree picks degree 1, the plain straight line."
    tests: |
      tr, va, te = split(FLATS)
      assert best_degree(compare(tr, va)) == 1
      assert best_degree({1: (0.5, 0.9), 2: (0.4, 0.3), 3: (0.1, 0.6)}) == 2, "choose by the VALIDATION error (second number), not the training error"
    hint: "min(results, key=lambda d: results[d][1])"
  - prompt: "final_test refits degree 1 on train + validation and scores it once on the test set: about ₦0.147m (₦147,000) average error."
    tests: |
      tr, va, te = split(FLATS)
      got = final_test(tr, va, te, 1)
      assert got is not None and abs(got - 0.1473) < 0.001, f"test error = {got}, expected about 0.1473"
    hint: "model = fit(train + val, degree); return mae(model, test)"
