# Week 3 · Day 2 practice
id: ml-w03-d2-encode
kind: python
title: "Text to numbers, and two transformers of your own"
description: "See why numbering areas misleads a model, one-hot encode them properly, then write two transformers scikit-learn doesn't have: one cleans area names, one adds distance to Ikoyi."
files: [lagos_housing.csv]
starter: |
  import numpy as np
  import pandas as pd
  from sklearn.model_selection import StratifiedShuffleSplit

  df = pd.read_csv("lagos_housing.csv")
  df["bed_cat"] = df["bedrooms"].clip(upper=5)
  train_idx, test_idx = next(StratifiedShuffleSplit(n_splits=1, test_size=0.2, random_state=42).split(df, df["bed_cat"]))
  train_set = df.iloc[train_idx].drop(columns="bed_cat")
  test_set = df.iloc[test_idx].drop(columns="bed_cat")

  AREA_FIX = {"surulere": "Surulere", "Ikeja Gra": "Ikeja GRA", "Ikeja G.R.A": "Ikeja GRA", "lekki phase 1": "Lekki Phase 1",
              "Lekki Ph 1": "Lekki Phase 1", "V.I.": "Victoria Island", "Victoria island": "Victoria Island", "Ajah ": "Ajah"}
  NUM_COLS = ["latitude", "longitude", "bedrooms", "bathrooms", "toilets", "size_sqm", "building_age", "parking_spaces"]
  from sklearn.base import BaseEstimator, TransformerMixin
  from sklearn.preprocessing import OrdinalEncoder, OneHotEncoder

  X = train_set.drop(columns=["price_m", "listing_id"])
  areas = X[["area"]].replace(AREA_FIX)

  # 1. Ordinal: what number does each area get?
  ordinal = OrdinalEncoder().fit(areas)
  print(list(ordinal.categories_[0]))
  CODE_IKORODU = None    # the number Ikorodu gets: list(ordinal.categories_[0]).index("Ikorodu")
  CODE_IKOYI = None      # …and Ikoyi. Neighbours as numbers, ₦300m apart in price!

  # 2. One-hot: how many columns for the 12 areas?
  onehot = OneHotEncoder().fit(areas)
  AREA_COLUMNS = None    # onehot.transform(areas).shape[1]

  # 3. Your own transformers. fit returns self; transform returns a NEW DataFrame.
  class AreaCleaner(BaseEstimator, TransformerMixin):
      def fit(self, X, y=None):
          pass
      def transform(self, X):
          pass   # copy X, replace area spellings with AREA_FIX, return the copy

  class AddDistance(BaseEstimator, TransformerMixin):
      def fit(self, X, y=None):
          pass
      def transform(self, X):
          pass   # copy X, add "km_to_ikoyi" (Week 2's formula), return the copy
tasks:
  - prompt: "Ordinal numbers put Ikorodu (4) right next to Ikoyi (5), though their median prices are ₦16.8m and ₦328.6m apart."
    tests: |
      assert (CODE_IKORODU, CODE_IKOYI) == (4, 5), f"{CODE_IKORODU}, {CODE_IKOYI}"
    hint: "cats = list(ordinal.categories_[0]); CODE_IKORODU = cats.index('Ikorodu')"
  - prompt: "One-hot encoding gives 12 columns for the 12 areas."
    tests: |
      assert AREA_COLUMNS == 12, f"AREA_COLUMNS = {AREA_COLUMNS}"
  - prompt: "AreaCleaner leaves exactly 12 areas and doesn't change the original DataFrame; fit returns self."
    tests: |
      c = AreaCleaner()
      assert c.fit(X) is c, "fit must return self"
      out = c.fit_transform(X)
      assert out["area"].nunique() == 12, f"{out['area'].nunique()} areas"
      assert X["area"].nunique() == 20, "make a copy: don't change the DataFrame you were given"
    hint: "def fit(self, X, y=None): return self  /  def transform(self, X): X = X.copy(); X['area'] = X['area'].replace(AREA_FIX); return X"
  - prompt: "AddDistance adds km_to_ikoyi; a listing at Ikoyi's centre (6.452, 3.435) is 0 km away."
    tests: |
      import pandas as pd
      out = AddDistance().fit_transform(X)
      assert "km_to_ikoyi" in out.columns and "km_to_ikoyi" not in X.columns, "add the column to a copy"
      probe = AddDistance().fit_transform(pd.DataFrame({"latitude": [6.452, 6.552], "longitude": [3.435, 3.435]}))
      assert abs(probe["km_to_ikoyi"].iloc[0]) < 1e-9 and abs(probe["km_to_ikoyi"].iloc[1] - 11.1) < 0.01, "6.452,3.435 → 0 km; 0.1° north → 11.1 km"
    hint: "X['km_to_ikoyi'] = np.sqrt(((X['latitude'] - 6.452) * 111) ** 2 + ((X['longitude'] - 3.435) * 110) ** 2)"
