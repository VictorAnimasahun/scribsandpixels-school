id: ml-w01-d3-knn-line
kind: python
title: "Copy or model? Predicting a Yaba rent two ways"
description: "Instance-based (k-nearest neighbours: average the most similar flats) vs model-based (the best straight line through all of them). Same question, two kinds of learning."
