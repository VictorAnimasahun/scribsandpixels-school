tasks:
  - prompt: "knn_predict(84) averages the three closest flats (80, 90, 70 m²): about ₦2.13m."
    tests: |
      got = knn_predict(84)
      assert got is not None and abs(got - 2.1333) < 0.001, f"knn_predict(84) = {got}, expected about 2.1333"
      assert abs(knn_predict(65) - 1.6667) < 0.001, f"knn_predict(65) = {knn_predict(65)}, expected about 1.6667 (60, 70 and 55 m²)"
      assert abs(knn_predict(84, k=1) - 2.1) < 0.001, "with k=1, it's just the single closest flat (80 m², ₦2.1m)"
    hint: "pairs = sorted(zip([abs(s - size) for s in SIZES], RENTS)) puts the closest flats first; then average the rents of pairs[:k]."
  - prompt: "fit_line finds the best line: theta0 ≈ 0.104 and theta1 ≈ 0.0251 (₦25,100 more rent per extra m²)."
    tests: |
      t0, t1 = fit_line(SIZES, RENTS)
      assert abs(t1 - 0.025114) < 0.00001, f"theta1 = {t1}"
      assert abs(t0 - 0.103693) < 0.0001, f"theta0 = {t0}"
      a0, a1 = fit_line([1, 2, 3], [2, 4, 6])
      assert abs(a1 - 2) < 1e-9 and abs(a0) < 1e-9, "fit_line([1,2,3], [2,4,6]) should be the line y = 0 + 2x"
    hint: "x_bar = sum(xs) / len(xs). Then build the top and bottom sums with a loop over zip(xs, ys)."
  - prompt: "predict_line(84, ...) gives about ₦2.21m."
    tests: |
      t0, t1 = fit_line(SIZES, RENTS)
      got = predict_line(84, t0, t1)
      assert abs(got - 2.2132) < 0.001, f"predict_line(84) = {got}"
    hint: "return theta0 + theta1 * size"
