# Week 1 · Day 1 practice
id: ml-w01-d1-spam
kind: python
title: "Two spam filters: rules vs learning"
description: "First a filter that follows rules you wrote, then one that learns its spam words from labelled messages. Then watch a new scam fool one of them."
starter: |
  import re

  def words(text):
      """'Send your BVN!' -> ['send', 'your', 'bvn']  (lowercase, punctuation removed)"""
      return re.sub(r"[^a-z0-9]+", " ", text.lower()).split()

  # Labelled examples: (message, label). This is the training data (Géron: the training set).
  TRAIN = [
      ("Congratulations! You have won N5,000,000 in the MTN promo. Send your BVN to claim", "spam"),
      ("Your account will be blocked today. Send your BVN and PIN to reactivate it", "spam"),
      ("You have won a free iPhone in our promo. Click the link to claim your prize", "spam"),
      ("URGENT: claim your N250,000 bonus now. Send your BVN to this number", "spam"),
      ("Your prize is waiting. Claim it now before midnight", "spam"),
      ("Mummy please call me when you see this", "ham"),
      ("Meeting moved to 3pm, bring the sales report", "ham"),
      ("I will send the money for the rent tomorrow morning", "ham"),
      ("Your order from NaijaMart has been delivered. Thank you", "ham"),
      ("Are you coming to church on Sunday?", "ham"),
  ]

  # ── Filter 1: rules a person wrote ──────────────────────────────
  RULE_WORDS = ["free", "won", "bvn", "prize"]

  def is_spam_rules(text):
      # True if any word of the message is in RULE_WORDS.
      pass

  # ── Filter 2: learn the spam words from TRAIN ───────────────────
  def learn_spam_words(examples):
      # Return the SET of words that appear in at least 2 spam messages
      # and in no ham message. Count each word once per message.
      pass

  def is_spam_learned(text, spam_words):
      # True if at least 2 of the message's words are learned spam words.
      pass

  learned = learn_spam_words(TRAIN)
  print("Learned spam words:", sorted(learned) if learned else learned)

  NEW = "Congrats!!! U don win N5m for d promo. Claim am sharp sharp, send ur B V N"
  print("Rules say spam?  ", is_spam_rules(NEW))
  print("Learner says spam?", is_spam_learned(NEW, learned))
tasks:
  - prompt: "is_spam_rules flags all 5 spam messages in TRAIN and none of the 5 ham messages."
    tests: |
      for text, label in TRAIN:
          assert is_spam_rules(text) == (label == "spam"), f"is_spam_rules got it wrong for: {text!r}"
    hint: "Loop over words(text) and return True as soon as one is in RULE_WORDS; return False after the loop. Or: any(w in RULE_WORDS for w in words(text))."
  - prompt: "learn_spam_words(TRAIN) returns exactly the words found in 2+ spam messages and in no ham message (it should include 'promo', 'claim' and 'bvn', but not 'send')."
    tests: |
      got = learn_spam_words(TRAIN)
      assert isinstance(got, set), "return a set"
      assert {"promo", "claim", "bvn"} <= got, "promo, claim and bvn are in 2+ spam messages and no ham"
      assert "send" not in got, "'send' also appears in a ham message ('I will send the money…'), so it isn't a spam word"
      assert got == {"000", "bvn", "claim", "have", "in", "it", "now", "prize", "promo", "won"}, f"got {sorted(got)}"
    hint: "Count, for each word, how many spam messages contain it (use set(words(text)) so a word counts once per message), and collect every word that appears in any ham message. Keep the words with count ≥ 2 that are not in the ham words."
  - prompt: "The new scam fools the rules (is_spam_rules says False) but the learned filter catches it (is_spam_learned says True)."
    tests: |
      assert is_spam_rules(NEW) is False, "the rules shouldn't catch it: 'win' isn't 'won' and 'B V N' isn't 'bvn'"
      assert is_spam_learned(NEW, learn_spam_words(TRAIN)) is True, "it contains two learned spam words: 'promo' and 'claim'"
      for text, label in TRAIN:
          if label == "ham":
              assert not is_spam_learned(text, learn_spam_words(TRAIN)), f"flagged an honest message: {text!r}"
    hint: "Count how many words of the message are in spam_words; return count >= 2. Look at the printed learned words: odd ones like 'in' and 'have' sneak in because 10 examples are far too few. That's Thursday's lesson."
