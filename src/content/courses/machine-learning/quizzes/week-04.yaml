# Machine Learning · Week 4 quizzes. Format and rules: src/content/QUIZZES.md
week: 4
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 3 review"
      covers: "Week 3: imputing, encoding, scaling, pipelines, cross-validation, tuning, testing once, launch and monitoring"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: ml-w04-d1-g01, difficulty: easy, type: mcq, prompt: "Fill missing sizes with the training median:", choices: ["SimpleImputer(strategy='median')", "OneHotEncoder", "StandardScaler", "GridSearchCV"], answer: 0 }
        - { id: ml-w04-d1-g02, difficulty: easy, type: mcq, prompt: "Turn the area names into yes/no columns:", choices: ["OneHotEncoder", "SimpleImputer", "MinMaxScaler", "cross_val_score"], answer: 0 }
        - { id: ml-w04-d1-g03, difficulty: easy, type: mcq, prompt: "Chains preparation steps in order:", choices: ["Pipeline", "GridSearchCV", "confusion_matrix", "train_test_split"], answer: 0 }
        - { id: ml-w04-d1-g04, difficulty: easy, type: truefalse, prompt: "The test set should be prepared with fit_transform.", answer: false }
        - { id: ml-w04-d1-g05, difficulty: easy, type: mcq, prompt: "Which Week 3 model won?", choices: ["random forest", "linear regression", "decision tree", "k-NN"], answer: 0 }
        - { id: ml-w04-d1-g06, difficulty: easy, type: mcq, prompt: "A model slowly getting worse as Lagos prices change:", choices: ["data drift", "overfitting", "one-hot", "imputation"], answer: 0 }
        - { id: ml-w04-d1-g07, difficulty: medium, type: mcq, prompt: "The decision tree: ₦0 on training data, about ₦46m cross-validated. It was…", choices: ["overfitting", "underfitting", "perfect", "leaking test data"], answer: 0 }
        - { id: ml-w04-d1-g08, difficulty: medium, type: mcq, prompt: "Why standardization rather than min-max for the Lagos sizes?", choices: ["the 2,320 m² typo squashes min-max values", "min-max is slower", "standardization removes outliers", "no reason"], answer: 0 }
        - id: ml-w04-d1-g09
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            import numpy as np
            print(np.sqrt(-np.array([-25.0, -100.0])).mean())
          accept: ["7.5"]
        - { id: ml-w04-d1-g10, difficulty: medium, type: mcq, prompt: "GridSearchCV with 2 × 3 settings and cv=3 trains…", choices: ["18 times (plus a final refit)", "6 times", "3 times", "once"], answer: 0 }
        - { id: ml-w04-d1-g11, difficulty: medium, type: mcq, prompt: "The feature you built, km_to_ikoyi, ranked…", choices: ["second in importance", "last", "first", "it was dropped"], answer: 0 }
        - { id: ml-w04-d1-g12, difficulty: medium, type: mcq, prompt: "ColumnTransformer's job:", choices: ["send different columns through different steps", "split train and test", "tune settings", "draw charts"], answer: 0 }
        - { id: ml-w04-d1-g13, difficulty: medium, type: truefalse, prompt: "A custom transformer's fit should return self.", answer: true }
        - id: ml-w04-d1-g14
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            from sklearn.preprocessing import StandardScaler
            print(StandardScaler().fit_transform([[10], [20], [30]]).ravel().round(2).tolist())
          accept: ["[-1.22, 0.0, 1.22]"]
        - { id: ml-w04-d1-g15, difficulty: medium, type: mcq, prompt: "The tuned model's share of test predictions within 20%:", choices: ["about two-thirds", "half", "all", "a tenth"], answer: 0 }
        - { id: ml-w04-d1-g16, difficulty: hard, type: mcq, prompt: "The test RMSE is disappointing. The honest move?", choices: ["report it; don't tweak the model to fit the test set", "tune until the test score is good", "test on the training set", "delete the bad test rows"], answer: 0 }
        - { id: ml-w04-d1-g17, difficulty: hard, type: mcq, prompt: "Why is the model untrustworthy for homes above ₦500m?", choices: ["training prices were capped at ₦500m", "there are no such homes", "the forest can't handle big numbers", "scaling broke them"], answer: 0 }
        - { id: ml-w04-d1-g18, difficulty: hard, type: mcq, prompt: "An agent starts typing sizes in square feet. What catches it?", choices: ["monitoring the input data", "a bigger forest", "grid search", "nothing can"], answer: 0 }
    quizzes:
      - kind: rapid-fire
        title: "Classification and the digits"
        secondsPerQuestion: 10
        questions:
          - { id: ml-w04-d1-rf01, difficulty: easy, type: mcq, prompt: "Predicting a category, not a number:", choices: ["classification", "regression", "clustering", "scaling"], answer: 0 }
          - { id: ml-w04-d1-rf02, difficulty: easy, type: mcq, prompt: "Is this payment fraud? is…", choices: ["binary classification", "multiclass", "regression", "multioutput"], answer: 0 }
          - { id: ml-w04-d1-rf03, difficulty: easy, type: mcq, prompt: "Which digit 0–9? is…", choices: ["multiclass classification", "binary", "regression", "clustering"], answer: 0 }
          - { id: ml-w04-d1-rf04, difficulty: easy, type: mcq, prompt: "Images in scikit-learn's digits set:", choices: ["1,797", "70,000", "784", "64"], answer: 0 }
          - { id: ml-w04-d1-rf05, difficulty: easy, type: mcq, prompt: "Pixels per digits image:", choices: ["64 (8 × 8)", "784 (28 × 28)", "10", "16"], answer: 0 }
          - { id: ml-w04-d1-rf06, difficulty: easy, type: mcq, prompt: "Ink values in the digits set run from…", choices: ["0 to 16", "0 to 255", "0 to 1", "1 to 10"], answer: 0 }
          - { id: ml-w04-d1-rf07, difficulty: easy, type: mcq, prompt: "Fives in the training set:", choices: ["145", "1,437", "10", "360"], answer: 0 }
          - { id: ml-w04-d1-rf08, difficulty: easy, type: truefalse, prompt: "An SGDClassifier score above 0 means 'yes'.", answer: true }
          - { id: ml-w04-d1-rf09, difficulty: easy, type: mcq, prompt: "SGD stands for…", choices: ["stochastic gradient descent", "simple grid design", "sorted group data", "standard gradient division"], answer: 0 }
          - { id: ml-w04-d1-rf10, difficulty: easy, type: mcq, prompt: "Géron's dataset of 70,000 digits:", choices: ["MNIST", "iris", "Titanic", "California"], answer: 0 }
      - kind: brain-teaser
        title: "Read the digit"
        questions:
          - { id: ml-w04-d1-bt01, difficulty: medium, type: mcq, prompt: "Why use stratify=y when splitting the digits?", choices: ["so each digit keeps its share in both sets", "to shuffle the pixels", "to scale them", "it's required"], answer: 0 }
          - { id: ml-w04-d1-bt02, difficulty: medium, type: mcq, prompt: "y_train == 5 turns the labels into…", choices: ["True/False answers", "pixel values", "scores", "ten columns"], answer: 0 }
          - id: ml-w04-d1-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              import numpy as np
              y = np.array([5, 3, 5, 0, 5])
              print((y == 5).sum())
            accept: ["3"]
          - { id: ml-w04-d1-bt04, difficulty: hard, type: mcq, prompt: "Why does predict need [X_train[0]] in square brackets?", choices: ["it expects a list (2D array) of images, even for one", "for speed", "to copy it", "it doesn't"], answer: 0 }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: classification and the digits"
      covers: "Week 4 · Day 1: binary vs multiclass, pixels as features, the 5-detector, SGDClassifier scores"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: ml-w04-d2-g01, difficulty: easy, type: mcq, prompt: "Tomorrow's price of a bag of rice is…", choices: ["regression", "binary classification", "multiclass", "multilabel"], answer: 0 }
        - { id: ml-w04-d2-g02, difficulty: easy, type: mcq, prompt: "MTN, Airtel, Glo or 9mobile? is…", choices: ["multiclass (4 classes)", "binary", "regression", "multioutput"], answer: 0 }
        - { id: ml-w04-d2-g03, difficulty: easy, type: mcq, prompt: "Each digits image is stored as…", choices: ["64 numbers in a row", "a photo file", "one number", "text"], answer: 0 }
        - { id: ml-w04-d2-g04, difficulty: easy, type: truefalse, prompt: "The digits set needs an internet download.", answer: false }
        - { id: ml-w04-d2-g05, difficulty: easy, type: mcq, prompt: "A 5-detector is a…", choices: ["binary classifier", "multiclass classifier", "regressor", "clusterer"], answer: 0 }
        - { id: ml-w04-d2-g06, difficulty: easy, type: mcq, prompt: "Training / test images after the 80/20 split:", choices: ["1,437 / 360", "1,797 / 0", "60,000 / 10,000", "145 / 1,292"], answer: 0 }
        - id: ml-w04-d2-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            from sklearn.datasets import load_digits
            print(load_digits().data.shape)
          accept: ["(1797, 64)"]
        - id: ml-w04-d2-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            import numpy as np
            print(np.arange(64).reshape(8, 8)[1, 0])
          accept: ["8"]
        - { id: ml-w04-d2-g09, difficulty: medium, type: mcq, prompt: "The 5-detector's score is…", choices: ["the sum of weight × ink over all pixels", "the number of black pixels", "the label", "a probability"], answer: 0 }
        - { id: ml-w04-d2-g10, difficulty: medium, type: mcq, prompt: "Why does SGD suit online learning?", choices: ["it learns from examples one at a time", "it needs all data at once", "it's a tree", "it can't"], answer: 0 }
        - { id: ml-w04-d2-g11, difficulty: medium, type: mcq, prompt: "Why set random_state=42 on SGDClassifier?", choices: ["it uses randomness, so results stay reproducible", "it's faster", "it picks 42 features", "it's required"], answer: 0 }
        - { id: ml-w04-d2-g12, difficulty: medium, type: mcq, prompt: "First training image: score about 179. That means…", choices: ["confidently 'yes, a 5'", "barely a 5", "not a 5", "an error"], answer: 0 }
        - { id: ml-w04-d2-g13, difficulty: medium, type: truefalse, prompt: "One correct prediction shows the model is good.", answer: false }
        - { id: ml-w04-d2-g14, difficulty: medium, type: mcq, prompt: "sgd.decision_function returns…", choices: ["scores", "True/False", "probabilities", "labels"], answer: 0 }
        - { id: ml-w04-d2-g15, difficulty: medium, type: mcq, prompt: "MNIST vs our digits:", choices: ["28 × 28, 0–255 vs 8 × 8, 0–16", "the same", "colour vs black and white", "letters vs numbers"], answer: 0 }
        - { id: ml-w04-d2-g16, difficulty: hard, type: mcq, prompt: "Why is a linear model like SGD sensitive to a digit shifted one pixel left?", choices: ["each pixel has its own fixed weight, and shifting moves the ink to other pixels", "it rotates images", "it ignores pixels", "it isn't"], answer: 0 }
        - { id: ml-w04-d2-g17, difficulty: hard, type: mcq, prompt: "About what share of the digits are 5s?", choices: ["10%", "50%", "1%", "90%"], answer: 0 }
        - { id: ml-w04-d2-g18, difficulty: hard, type: mcq, prompt: "Why might shuffling be a bad idea for stock prices?", choices: ["order in time matters: you'd train on the future", "they're text", "it's slow", "it never is"], answer: 0 }
    quizzes:
      - kind: rapid-fire
        title: "The four boxes"
        secondsPerQuestion: 10
        questions:
          - { id: ml-w04-d2-rf01, difficulty: easy, type: mcq, prompt: "A wrong 'yes':", choices: ["false positive", "false negative", "true positive", "true negative"], answer: 0 }
          - { id: ml-w04-d2-rf02, difficulty: easy, type: mcq, prompt: "A missed fraud:", choices: ["false negative", "false positive", "true negative", "true positive"], answer: 0 }
          - { id: ml-w04-d2-rf03, difficulty: easy, type: mcq, prompt: "A caught fraud:", choices: ["true positive", "false positive", "true negative", "false negative"], answer: 0 }
          - { id: ml-w04-d2-rf04, difficulty: easy, type: mcq, prompt: "Precision =", choices: ["TP / (TP + FP)", "TP / (TP + FN)", "FP / (FP + TN)", "(TP + TN) / all"], answer: 0 }
          - { id: ml-w04-d2-rf05, difficulty: easy, type: mcq, prompt: "Recall =", choices: ["TP / (TP + FN)", "TP / (TP + FP)", "TN / (TN + FP)", "FP / all"], answer: 0 }
          - { id: ml-w04-d2-rf06, difficulty: easy, type: mcq, prompt: "Rows of a confusion matrix are…", choices: ["what it really was", "what the model said", "thresholds", "folds"], answer: 0 }
          - { id: ml-w04-d2-rf07, difficulty: easy, type: mcq, prompt: "A never-ringing alarm's recall:", choices: ["0%", "100%", "98%", "50%"], answer: 0 }
          - { id: ml-w04-d2-rf08, difficulty: easy, type: truefalse, prompt: "High accuracy guarantees a good classifier.", answer: false }
          - { id: ml-w04-d2-rf09, difficulty: easy, type: mcq, prompt: "Predictions from models that never saw each row:", choices: ["cross_val_predict", "predict", "fit", "score"], answer: 0 }
          - { id: ml-w04-d2-rf10, difficulty: easy, type: mcq, prompt: "A dataset where one class is rare is…", choices: ["skewed (imbalanced)", "scaled", "stratified", "sparse"], answer: 0 }
      - kind: brain-teaser
        title: "Count the boxes"
        questions:
          - id: ml-w04-d2-bt01
            difficulty: medium
            type: text
            prompt: "1,000 payments, 20 fraud. An alarm that never rings: accuracy in %?"
            accept: ["98", "98%", "98.0"]
          - id: ml-w04-d2-bt02
            difficulty: medium
            type: text
            prompt: "TP 15, FP 10. Precision in %?"
            accept: ["60", "60%"]
          - id: ml-w04-d2-bt03
            difficulty: medium
            type: text
            prompt: "TP 15, FN 5. Recall in %?"
            accept: ["75", "75%"]
          - { id: ml-w04-d2-bt04, difficulty: hard, type: mcq, prompt: "Kemi's alarm is 98.5% accurate; the lazy one 98.0%. Best summary?", choices: ["accuracy barely separates them; recall (75% vs 0%) does", "they're equally good", "the lazy one is fine", "accuracy is the best measure"], answer: 0 }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: the accuracy trap and the confusion matrix"
      covers: "Week 4 · Day 2: accuracy on skewed data, cross-validated accuracy, the confusion matrix, precision and recall"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: ml-w04-d3-g01, difficulty: easy, type: mcq, prompt: "'When it says yes, how often is it right?' is…", choices: ["precision", "recall", "accuracy", "FPR"], answer: 0 }
        - { id: ml-w04-d3-g02, difficulty: easy, type: mcq, prompt: "'Of all the real yeses, how many did it find?' is…", choices: ["recall", "precision", "accuracy", "specificity"], answer: 0 }
        - { id: ml-w04-d3-g03, difficulty: easy, type: mcq, prompt: "Accuracy of 'never a 5' on the digits:", choices: ["about 90%", "about 10%", "50%", "0%"], answer: 0 }
        - { id: ml-w04-d3-g04, difficulty: easy, type: truefalse, prompt: "A perfect classifier has non-zero counts only on the diagonal.", answer: true }
        - { id: ml-w04-d3-g05, difficulty: easy, type: mcq, prompt: "'Positive' in 'false positive' refers to…", choices: ["what the model said", "what was true", "the threshold", "the score's sign"], answer: 0 }
        - { id: ml-w04-d3-g06, difficulty: easy, type: mcq, prompt: "The 5-detector missed how many of the 145 fives?", choices: ["17", "4", "128", "0"], answer: 0 }
        - id: ml-w04-d3-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            from sklearn.metrics import confusion_matrix
            print(confusion_matrix([0, 0, 1, 1, 1], [0, 1, 1, 1, 0]).tolist())
          accept: ["[[1, 1], [1, 2]]"]
        - id: ml-w04-d3-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            from sklearn.metrics import precision_score, recall_score
            y, p = [1, 1, 1, 0], [1, 0, 0, 0]
            print(precision_score(y, p), round(recall_score(y, p), 2))
          accept: ["1.0 0.33"]
        - id: ml-w04-d3-g09
          difficulty: medium
          type: text
          prompt: "Malaria test: TP 36, FP 9, FN 4, TN 151. Precision in %?"
          accept: ["80", "80%"]
        - id: ml-w04-d3-g10
          difficulty: medium
          type: text
          prompt: "Same test: recall in %?"
          accept: ["90", "90%"]
        - { id: ml-w04-d3-g11, difficulty: medium, type: mcq, prompt: "The 5-detector: precision 97%, recall 88%. In words:", choices: ["its 'yes' is almost always right, but it misses about 1 five in 8", "it misses most fives", "it says yes too often", "it's perfect"], answer: 0 }
        - { id: ml-w04-d3-g12, difficulty: medium, type: mcq, prompt: "Why use cross_val_predict, not predict on the training set?", choices: ["predictions on rows the model trained on are too optimistic", "it's faster", "predict doesn't work", "to use the test set"], answer: 0 }
        - { id: ml-w04-d3-g13, difficulty: medium, type: truefalse, prompt: "One single correct 'yes' gives 100% precision.", answer: true }
        - { id: ml-w04-d3-g14, difficulty: medium, type: mcq, prompt: "Never5Classifier.predict should return…", choices: ["np.zeros(len(X), dtype=bool)", "np.ones(len(X))", "the labels", "None"], answer: 0 }
        - { id: ml-w04-d3-g15, difficulty: medium, type: match, prompt: "Match each box to its meaning (fraud alarm).", pairs: [["TP", "fraud, flagged"], ["FP", "innocent, flagged"], ["FN", "fraud, missed"], ["TN", "innocent, left alone"]] }
        - { id: ml-w04-d3-g16, difficulty: hard, type: mcq, prompt: "Géron's MNIST 5-detector: 53,057 / 1,522 / 1,325 / 4,096 (TN/FP/FN/TP). Its precision is about…", choices: ["73%", "96%", "76%", "90%"], answer: 0 }
        - { id: ml-w04-d3-g17, difficulty: hard, type: mcq, prompt: "Why is accuracy especially misleading for fraud?", choices: ["fraud is rare, so 'never fraud' scores ~97%", "fraud amounts are big", "fraud has no labels", "it isn't"], answer: 0 }
        - { id: ml-w04-d3-g18, difficulty: hard, type: mcq, prompt: "Which box can a model reduce to zero just by always answering 'no'?", choices: ["false positives", "false negatives", "true negatives", "none"], answer: 0 }
    quizzes:
      - kind: rapid-fire
        title: "F1 and the threshold"
        secondsPerQuestion: 10
        questions:
          - { id: ml-w04-d3-rf01, difficulty: easy, type: mcq, prompt: "F1 is the ___ mean of precision and recall:", choices: ["harmonic", "ordinary", "geometric", "median"], answer: 0 }
          - { id: ml-w04-d3-rf02, difficulty: easy, type: mcq, prompt: "Raising the threshold makes recall…", choices: ["fall or stay the same", "rise", "jump to 100%", "unpredictable"], answer: 0 }
          - { id: ml-w04-d3-rf03, difficulty: easy, type: mcq, prompt: "SGDClassifier's default threshold:", choices: ["0", "0.5", "1", "100"], answer: 0 }
          - { id: ml-w04-d3-rf04, difficulty: easy, type: mcq, prompt: "Kids' video filter: favour…", choices: ["precision", "recall", "neither", "accuracy"], answer: 0 }
          - { id: ml-w04-d3-rf05, difficulty: easy, type: mcq, prompt: "Airport weapons scanner: favour…", choices: ["recall", "precision", "neither", "accuracy"], answer: 0 }
          - { id: ml-w04-d3-rf06, difficulty: easy, type: mcq, prompt: "Precision and recall at every threshold:", choices: ["precision_recall_curve", "roc_auc_score", "confusion_matrix", "f1_score"], answer: 0 }
          - { id: ml-w04-d3-rf07, difficulty: easy, type: mcq, prompt: "Get scores instead of yes/no from cross_val_predict:", choices: ["method='decision_function'", "method='predict'", "cv=0", "scoring='f1'"], answer: 0 }
          - { id: ml-w04-d3-rf08, difficulty: easy, type: truefalse, prompt: "Any precision is easy if you may miss almost everything.", answer: true }
          - { id: ml-w04-d3-rf09, difficulty: easy, type: mcq, prompt: "Someone wants 99% precision. Ask:", choices: ["at what recall?", "how fast?", "which threshold?", "nothing"], answer: 0 }
          - { id: ml-w04-d3-rf10, difficulty: easy, type: mcq, prompt: "The 5-detector's F1:", choices: ["about 0.92", "about 0.5", "1.0", "about 0.18"], answer: 0 }
      - kind: brain-teaser
        title: "Move the knob"
        questions:
          - id: ml-w04-d3-bt01
            difficulty: medium
            type: text
            prompt: "F1 for precision 0.6 and recall 0.75? (2 decimals)"
            accept: ["0.67", ".67"]
          - id: ml-w04-d3-bt02
            difficulty: medium
            type: text
            prompt: "F1 for precision 1.0 and recall 0.1? (2 decimals)"
            accept: ["0.18", ".18"]
          - { id: ml-w04-d3-bt03, difficulty: medium, type: mcq, prompt: "Threshold 0 → 0.5 on the eight payments dropped precision from 75% to 67%. Why?", choices: ["the payment no longer flagged was a real fraud", "a bug", "recall rose", "the scores changed"], answer: 0 }
          - { id: ml-w04-d3-bt04, difficulty: hard, type: mcq, prompt: "100% precision on the 5-detector needed threshold ~316. The cost?", choices: ["recall fell to about 61%", "nothing", "precision dropped", "accuracy rose to 100%"], answer: 0 }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: F1 and the threshold"
      covers: "Week 4 · Day 3: F1, which mistake hurts more, decision scores and thresholds, the precision/recall trade-off"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: ml-w04-d4-g01, difficulty: easy, type: mcq, prompt: "A model says 'yes' when its score is…", choices: ["above the threshold", "below 0 always", "exactly 0.5", "a whole number"], answer: 0 }
        - { id: ml-w04-d4-g02, difficulty: easy, type: mcq, prompt: "Lowering the threshold usually makes…", choices: ["recall rise, precision fall", "both rise", "both fall", "nothing change"], answer: 0 }
        - { id: ml-w04-d4-g03, difficulty: easy, type: mcq, prompt: "F1 is high only when…", choices: ["both precision and recall are high", "precision is high", "recall is high", "accuracy is high"], answer: 0 }
        - { id: ml-w04-d4-g04, difficulty: easy, type: truefalse, prompt: "The precision curve can be bumpy as the threshold rises.", answer: true }
        - { id: ml-w04-d4-g05, difficulty: easy, type: mcq, prompt: "A spam filter that permanently deletes mail should favour…", choices: ["precision", "recall", "neither", "speed"], answer: 0 }
        - { id: ml-w04-d4-g06, difficulty: easy, type: mcq, prompt: "A cancer screening test followed by a second test should favour…", choices: ["recall", "precision", "neither", "accuracy"], answer: 0 }
        - id: ml-w04-d4-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            import numpy as np
            scores = np.array([-2.0, 0.5, 1.5, 3.0])
            print((scores >= 1.0).sum())
          accept: ["2"]
        - id: ml-w04-d4-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            import numpy as np
            p = np.array([0.5, 0.8, 0.9, 1.0, 1.0])
            print(np.argmax(p >= 0.9))
          accept: ["2"]
        - id: ml-w04-d4-g09
          difficulty: medium
          type: text
          prompt: "F1 for precision 0.8 and recall 0.4? (2 decimals)"
          accept: ["0.53", ".53"]
        - { id: ml-w04-d4-g10, difficulty: medium, type: mcq, prompt: "Threshold −500 on the 5-detector: recall 97%, precision 29%. In words:", choices: ["catches nearly every 5, but most of its alarms are false", "misses most 5s", "is perfect", "never says yes"], answer: 0 }
        - { id: ml-w04-d4-g11, difficulty: medium, type: mcq, prompt: "np.argmax(precisions >= 0.9) finds…", choices: ["the first (lowest) threshold reaching 90% precision", "the highest precision", "the last threshold", "the best recall"], answer: 0 }
        - { id: ml-w04-d4-g12, difficulty: medium, type: mcq, prompt: "Why can recall never rise when the threshold rises?", choices: ["you flag fewer cases, so you can't catch more", "precision falls", "scores change", "it can"], answer: 0 }
        - { id: ml-w04-d4-g13, difficulty: medium, type: truefalse, prompt: "scikit-learn lets you set SGDClassifier's threshold directly with a parameter.", answer: false }
        - { id: ml-w04-d4-g14, difficulty: medium, type: mcq, prompt: "A bank model that blocks cards instantly should favour…", choices: ["precision (don't strand innocent customers)", "recall", "speed", "accuracy"], answer: 0 }
        - { id: ml-w04-d4-g15, difficulty: medium, type: mcq, prompt: "precision_recall_curve returns…", choices: ["precisions, recalls, thresholds", "one number", "a confusion matrix", "labels"], answer: 0 }
        - { id: ml-w04-d4-g16, difficulty: hard, type: mcq, prompt: "Eight payments, threshold −1.5 flags the last six (4 frauds among them, 4 frauds total). Precision and recall?", choices: ["67% and 100%", "100% and 67%", "50% and 50%", "75% and 75%"], answer: 0 }
        - { id: ml-w04-d4-g17, difficulty: hard, type: mcq, prompt: "Why does Géron plot precisions[:-1] against thresholds?", choices: ["precisions has one more value than thresholds", "to drop an outlier", "for style", "a typo"], answer: 0 }
        - { id: ml-w04-d4-g18, difficulty: hard, type: mcq, prompt: "Shoplifter detection with 30% precision and 99% recall is acceptable because…", choices: ["guards checking false alarms costs little; missed thieves cost more", "precision doesn't matter ever", "it's illegal otherwise", "recall is always 99%"], answer: 0 }
    quizzes:
      - kind: rapid-fire
        title: "ROC and AUC"
        secondsPerQuestion: 10
        questions:
          - { id: ml-w04-d4-rf01, difficulty: easy, type: mcq, prompt: "True positive rate is another name for…", choices: ["recall", "precision", "accuracy", "specificity"], answer: 0 }
          - { id: ml-w04-d4-rf02, difficulty: easy, type: mcq, prompt: "False positive rate =", choices: ["FP / (FP + TN)", "FP / (FP + TP)", "TP / (TP + FN)", "FN / all"], answer: 0 }
          - { id: ml-w04-d4-rf03, difficulty: easy, type: mcq, prompt: "A perfect model's ROC AUC:", choices: ["1.0", "0.5", "0", "100"], answer: 0 }
          - { id: ml-w04-d4-rf04, difficulty: easy, type: mcq, prompt: "Random guessing's ROC AUC:", choices: ["0.5", "1.0", "0", "0.9"], answer: 0 }
          - { id: ml-w04-d4-rf05, difficulty: easy, type: mcq, prompt: "A good ROC curve bends towards…", choices: ["the top-left corner", "the bottom-right", "the diagonal", "the middle"], answer: 0 }
          - { id: ml-w04-d4-rf06, difficulty: easy, type: mcq, prompt: "The random forest gives probabilities with…", choices: ["predict_proba", "decision_function", "transform", "score"], answer: 0 }
          - { id: ml-w04-d4-rf07, difficulty: easy, type: mcq, prompt: "Specificity is…", choices: ["the share of negatives correctly left alone", "recall", "precision", "F1"], answer: 0 }
          - { id: ml-w04-d4-rf08, difficulty: easy, type: truefalse, prompt: "The forest's ROC AUC on the 5-detector beat SGD's.", answer: true }
          - { id: ml-w04-d4-rf09, difficulty: easy, type: mcq, prompt: "Rare positive class: prefer the…", choices: ["precision/recall curve", "ROC curve", "neither", "accuracy"], answer: 0 }
          - { id: ml-w04-d4-rf10, difficulty: easy, type: mcq, prompt: "Compute ROC AUC:", choices: ["roc_auc_score", "roc_curve", "f1_score", "auc_plot"], answer: 0 }
      - kind: brain-teaser
        title: "Rates by hand"
        questions:
          - id: ml-w04-d4-bt01
            difficulty: medium
            type: text
            prompt: "FP 10, TN 970. FPR in % (1 decimal)?"
            accept: ["1.0", "1", "1%", "1.0%"]
          - id: ml-w04-d4-bt02
            difficulty: medium
            type: text
            prompt: "Malaria test: FP 9, TN 151. FPR in % (1 decimal)?"
            accept: ["5.6", "5.6%"]
          - { id: ml-w04-d4-bt03, difficulty: medium, type: mcq, prompt: "An AUC of 0.9 means a random fraud outscores a random innocent payment…", choices: ["90% of the time", "10% of the time", "always", "half the time"], answer: 0 }
          - { id: ml-w04-d4-bt04, difficulty: hard, type: mcq, prompt: "Kemi's alarm: FPR 1%, yet 40% of its alarms are false. How?", choices: ["FPR divides by all 980 innocent payments; precision divides by the 25 alarms", "a calculation error", "the FPR is wrong", "precision is wrong"], answer: 0 }

  # ─────────────────────────── DAY 5 ───────────────────────────
  - day: 5
    gate:
      title: "Checkpoint: ROC and comparing models"
      covers: "Week 4 · Day 4: TPR and FPR, the ROC curve, AUC, predict_proba, ROC vs precision/recall curves"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: ml-w04-d5-g01, difficulty: easy, type: mcq, prompt: "The ROC curve plots…", choices: ["TPR against FPR", "precision against recall", "accuracy against threshold", "price against size"], answer: 0 }
        - { id: ml-w04-d5-g02, difficulty: easy, type: mcq, prompt: "The dashed diagonal on a ROC chart is…", choices: ["a random classifier", "a perfect classifier", "the threshold", "the test set"], answer: 0 }
        - { id: ml-w04-d5-g03, difficulty: easy, type: mcq, prompt: "SGD's ROC AUC on the 5-detector:", choices: ["about 0.98", "about 0.5", "1.0", "about 0.7"], answer: 0 }
        - { id: ml-w04-d5-g04, difficulty: easy, type: truefalse, prompt: "Sensitivity and recall are the same thing.", answer: true }
        - { id: ml-w04-d5-g05, difficulty: easy, type: mcq, prompt: "To use the forest's probabilities as scores, take…", choices: ["column 1 (the probability of 'yes')", "column 0", "both columns added", "the labels"], answer: 0 }
        - { id: ml-w04-d5-g06, difficulty: easy, type: mcq, prompt: "Lowering the threshold moves you…", choices: ["up and right along the ROC curve", "down and left", "off the chart", "nowhere"], answer: 0 }
        - id: ml-w04-d5-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            from sklearn.metrics import roc_auc_score
            print(roc_auc_score([0, 0, 1, 1], [0.1, 0.4, 0.35, 0.8]))
          accept: ["0.75"]
        - id: ml-w04-d5-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            from sklearn.metrics import roc_auc_score
            print(roc_auc_score([0, 0, 1, 1], [0.1, 0.2, 0.7, 0.9]))
          accept: ["1.0"]
        - id: ml-w04-d5-g09
          difficulty: medium
          type: text
          prompt: "Malaria test: TP 36, FN 4. TPR in %?"
          accept: ["90", "90%"]
        - { id: ml-w04-d5-g10, difficulty: medium, type: mcq, prompt: "The forest at probability 0.5: precision 100%, recall ~81%. So…", choices: ["every 'five' it names is right, but it misses about 1 in 5", "it misses most", "it's useless", "it says yes to everything"], answer: 0 }
        - { id: ml-w04-d5-g11, difficulty: medium, type: mcq, prompt: "Why might a high ROC AUC flatter a fraud model?", choices: ["the huge number of innocent payments keeps the FPR small", "AUC is always high", "fraud is common", "it can't"], answer: 0 }
        - { id: ml-w04-d5-g12, difficulty: medium, type: mcq, prompt: "Géron's rule: use ROC when…", choices: ["positives aren't rare and false negatives matter as much", "positives are rare", "always", "never"], answer: 0 }
        - { id: ml-w04-d5-g13, difficulty: medium, type: truefalse, prompt: "Random forests have a decision_function method.", answer: false }
        - { id: ml-w04-d5-g14, difficulty: medium, type: mcq, prompt: "FPR = 1 − ___", choices: ["specificity", "recall", "precision", "accuracy"], answer: 0 }
        - { id: ml-w04-d5-g15, difficulty: medium, type: mcq, prompt: "roc_curve returns…", choices: ["fpr, tpr, thresholds", "one AUC number", "precisions", "a chart"], answer: 0 }
        - { id: ml-w04-d5-g16, difficulty: hard, type: mcq, prompt: "An AUC of 0.3 means…", choices: ["it ranks backwards: flipping its answers would give 0.7", "it's great", "random", "perfect"], answer: 0 }
        - { id: ml-w04-d5-g17, difficulty: hard, type: mcq, prompt: "Only 1% of patients have malaria. Judge the test with…", choices: ["the precision/recall curve", "ROC only", "accuracy", "nothing"], answer: 0 }
        - { id: ml-w04-d5-g18, difficulty: hard, type: mcq, prompt: "AUC compares models without choosing a threshold because…", choices: ["it summarises performance across all thresholds", "it uses 0.5", "it ignores scores", "it uses the test set"], answer: 0 }
    quizzes:
      - kind: rapid-fire
        title: "Many classes"
        secondsPerQuestion: 10
        questions:
          - { id: ml-w04-d5-rf01, difficulty: easy, type: mcq, prompt: "One detector per class, highest score wins:", choices: ["one-versus-the-rest", "one-versus-one", "multilabel", "multioutput"], answer: 0 }
          - { id: ml-w04-d5-rf02, difficulty: easy, type: mcq, prompt: "A detector for every pair of classes:", choices: ["one-versus-one", "one-versus-the-rest", "a forest", "a pipeline"], answer: 0 }
          - { id: ml-w04-d5-rf03, difficulty: easy, type: mcq, prompt: "OvO detectors for 10 digits:", choices: ["45", "10", "100", "90"], answer: 0 }
          - { id: ml-w04-d5-rf04, difficulty: easy, type: mcq, prompt: "Scores SGD gives for one digit image (multiclass):", choices: ["10", "1", "2", "64"], answer: 0 }
          - { id: ml-w04-d5-rf05, difficulty: easy, type: mcq, prompt: "Accuracy after scaling the digits:", choices: ["about 94%", "about 50%", "10%", "100%"], answer: 0 }
          - { id: ml-w04-d5-rf06, difficulty: easy, type: mcq, prompt: "The digit most wrong answers land on:", choices: ["8", "1", "0", "5"], answer: 0 }
          - { id: ml-w04-d5-rf07, difficulty: easy, type: mcq, prompt: "A film tagged comedy AND romance:", choices: ["multilabel", "multiclass", "regression", "binary"], answer: 0 }
          - { id: ml-w04-d5-rf08, difficulty: easy, type: truefalse, prompt: "Random forests can handle many classes directly.", answer: true }
          - { id: ml-w04-d5-rf09, difficulty: easy, type: mcq, prompt: "Cleaning every pixel of a noisy image is…", choices: ["multioutput", "binary", "multilabel only", "regression only"], answer: 0 }
          - { id: ml-w04-d5-rf10, difficulty: easy, type: mcq, prompt: "Random guessing on ten digits gets…", choices: ["10%", "50%", "90%", "0%"], answer: 0 }
      - kind: brain-teaser
        title: "Read the matrix"
        questions:
          - id: ml-w04-d5-bt01
            difficulty: medium
            type: text
            prompt: "One-versus-one for 37 classes (36 states + FCT): how many detectors?"
            accept: ["666"]
          - { id: ml-w04-d5-bt02, difficulty: medium, type: mcq, prompt: "Why divide each row by its total before looking at errors?", choices: ["to compare rates, not raw counts", "to scale features", "to hide the diagonal", "for colour"], answer: 0 }
          - id: ml-w04-d5-bt03
            difficulty: medium
            type: text
            prompt: "What does this print?"
            code: |
              import numpy as np
              cm = np.array([[9, 1], [3, 7]])
              print((cm.sum(axis=0) - np.diag(cm)).tolist())
            accept: ["[3, 1]"]
          - { id: ml-w04-d5-bt04, difficulty: hard, type: mcq, prompt: "A bright 8-column suggests improving the model by…", choices: ["more examples of digits that look like 8s, or a loop-count feature", "removing all 8s", "a lower threshold", "fewer pixels"], answer: 0 }

  # ─────────────────────────── DAY 6 ───────────────────────────
  - day: 6
    gate:
      title: "Checkpoint: many classes and error analysis"
      covers: "Week 4 · Day 5: one-versus-the-rest, one-versus-one, scaling, error analysis, multilabel and multioutput"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: ml-w04-d6-g01, difficulty: easy, type: mcq, prompt: "Give SGDClassifier ten labels and scikit-learn…", choices: ["trains ten detectors (OvR)", "refuses", "trains one detector", "trains 45 always"], answer: 0 }
        - { id: ml-w04-d6-g02, difficulty: easy, type: mcq, prompt: "Rows of the 10 × 10 confusion matrix are…", choices: ["the true digit", "what it was called", "thresholds", "pixels"], answer: 0 }
        - { id: ml-w04-d6-g03, difficulty: easy, type: mcq, prompt: "Scaling raised digit accuracy from about…", choices: ["92% to 94%", "50% to 90%", "10% to 20%", "94% to 92%"], answer: 0 }
        - { id: ml-w04-d6-g04, difficulty: easy, type: truefalse, prompt: "The confusion matrix is always symmetrical.", answer: false }
        - { id: ml-w04-d6-g05, difficulty: easy, type: mcq, prompt: "The worst mistake on the digits:", choices: ["calling a 1 an '8'", "calling a 0 a '6'", "calling a 7 a '1'", "calling a 5 a '3'"], answer: 0 }
        - { id: ml-w04-d6-g06, difficulty: easy, type: mcq, prompt: "Is it 7 or more? Is it odd? Two answers per image is…", choices: ["multilabel", "multiclass", "regression", "one-versus-one"], answer: 0 }
        - id: ml-w04-d6-g07
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            import numpy as np
            rates = np.array([[0.9, 0.1], [0.3, 0.7]])
            np.fill_diagonal(rates, 0)
            print(np.unravel_index(rates.argmax(), rates.shape))
          accept: ["(np.int64(1), np.int64(0))", "(1, 0)"]
        - id: ml-w04-d6-g08
          difficulty: medium
          type: text
          prompt: "What does this print?"
          code: |
            import numpy as np
            y = np.array([5, 8, 2])
            print(np.c_[y >= 7, y % 2 == 1].tolist())
          accept: ["[[False, True], [True, False], [False, False]]"]
        - { id: ml-w04-d6-g09, difficulty: medium, type: mcq, prompt: "One-versus-one suits models that…", choices: ["slow down badly on big training sets", "are already multiclass", "are trees", "need no data"], answer: 0 }
        - { id: ml-w04-d6-g10, difficulty: medium, type: mcq, prompt: "Why did scaling help SGD?", choices: ["linear models work best with features on similar scales", "it removed noise", "it added pixels", "it didn't"], answer: 0 }
        - { id: ml-w04-d6-g11, difficulty: medium, type: mcq, prompt: "Why does a linear model confuse 3s and 5s?", choices: ["they differ by a few pixels, and it weighs pixels separately", "they're the same", "too few 3s", "it doesn't"], answer: 0 }
        - { id: ml-w04-d6-g12, difficulty: medium, type: mcq, prompt: "average='macro' in f1_score means…", choices: ["average the F1 of each label equally", "weight by how common each label is", "use the best label", "ignore labels"], answer: 0 }
        - { id: ml-w04-d6-g13, difficulty: medium, type: truefalse, prompt: "KNeighborsClassifier supports multilabel classification.", answer: true }
        - { id: ml-w04-d6-g14, difficulty: medium, type: mcq, prompt: "WAEC grade in each of nine subjects is…", choices: ["multioutput", "binary", "multilabel only", "one-versus-one"], answer: 0 }
        - { id: ml-w04-d6-g15, difficulty: medium, type: mcq, prompt: "sgd.classes_ stores…", choices: ["the classes it learned, in sorted order", "the scores", "the pixels", "the threshold"], answer: 0 }
        - { id: ml-w04-d6-g16, difficulty: hard, type: mcq, prompt: "Géron's fix for 3/5 confusion:", choices: ["centre and straighten the images before training", "remove 3s", "more trees", "a higher threshold"], answer: 0 }
        - { id: ml-w04-d6-g17, difficulty: hard, type: mcq, prompt: "Why compare error RATES rather than counts per row?", choices: ["a common digit would look worse just for being common", "counts are wrong", "rates are faster", "no reason"], answer: 0 }
        - { id: ml-w04-d6-g18, difficulty: hard, type: mcq, prompt: "The single label with the most errors pointing INTO it shows up as…", choices: ["a bright column", "a bright row", "a dark diagonal", "nothing"], answer: 0 }
    quizzes:
      - kind: rapid-fire
        title: "The fraud flagger"
        secondsPerQuestion: 10
        questions:
          - { id: ml-w04-d6-rf01, difficulty: easy, type: mcq, prompt: "Share of payments that are fraud:", choices: ["about 3%", "about 30%", "50%", "0.1%"], answer: 0 }
          - { id: ml-w04-d6-rf02, difficulty: easy, type: mcq, prompt: "Accuracy of 'never fraud':", choices: ["about 97%", "about 50%", "3%", "100%"], answer: 0 }
          - { id: ml-w04-d6-rf03, difficulty: easy, type: mcq, prompt: "Frauds the forest caught at threshold 0.5 (training, cross-validated):", choices: ["none", "all", "half", "20"], answer: 0 }
          - { id: ml-w04-d6-rf04, difficulty: easy, type: mcq, prompt: "The cost of a missed fraud in the project:", choices: ["its full amount", "₦1,000", "nothing", "₦5m"], answer: 0 }
          - { id: ml-w04-d6-rf05, difficulty: easy, type: mcq, prompt: "The cost of a false alarm in the project:", choices: ["₦1,000", "the payment amount", "₦0", "₦100,000"], answer: 0 }
          - { id: ml-w04-d6-rf06, difficulty: easy, type: mcq, prompt: "The cheapest threshold was around…", choices: ["0.04", "0.5", "0.9", "1.0"], answer: 0 }
          - { id: ml-w04-d6-rf07, difficulty: easy, type: mcq, prompt: "Test frauds caught at that threshold:", choices: ["20 of 23", "23 of 23", "0 of 23", "5 of 23"], answer: 0 }
          - { id: ml-w04-d6-rf08, difficulty: easy, type: truefalse, prompt: "Foreign-card payments were fraud far more often than local ones.", answer: true }
          - { id: ml-w04-d6-rf09, difficulty: easy, type: mcq, prompt: "Which model had the higher ROC AUC?", choices: ["random forest", "SGD", "equal", "never5"], answer: 0 }
          - { id: ml-w04-d6-rf10, difficulty: easy, type: mcq, prompt: "Who should agree the cost of each mistake?", choices: ["the business, with the data scientist", "nobody", "the model", "only the data scientist"], answer: 0 }
      - kind: brain-teaser
        title: "Set it in naira"
        questions:
          - id: ml-w04-d6-bt01
            difficulty: medium
            type: text
            prompt: "Missed frauds worth ₦50,000 and 30 false alarms at ₦1,000. Total cost in naira?"
            accept: ["80000", "80,000", "₦80,000", "₦80000"]
          - { id: ml-w04-d6-bt02, difficulty: medium, type: mcq, prompt: "Precision was only 13%, yet the threshold was right because…", choices: ["a false alarm costs ₦1,000 while a typical fraud costs over ₦30,000", "precision doesn't matter", "recall was 13%", "the test set was small"], answer: 0 }
          - { id: ml-w04-d6-bt03, difficulty: medium, type: mcq, prompt: "False alarms rise to ₦5,000 each. The best threshold…", choices: ["rises (fewer alarms, more missed fraud)", "falls", "stays the same", "becomes 0.5"], answer: 0 }
          - { id: ml-w04-d6-bt04, difficulty: hard, type: mcq, prompt: "Why did the forest flag nothing at 0.5?", choices: ["fraud is rare, so it is almost never more than 50% sure", "it's broken", "it overfit", "the data had no fraud"], answer: 0 }
