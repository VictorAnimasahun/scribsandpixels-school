        - { id: fr-w01-d6-g11, difficulty: medium, type: mcq, prompt: "A French number '06 12 34 56 78' is read…", choices: ["zéro-six, douze, trente-quatre…", "six, un, deux, trois…", "sixty-one million…", "digit by digit only"], answer: 0 }
        - { id: fr-w01-d6-g12, difficulty: medium, type: truefalse, prompt: "You can say 'Ça va ?' to a close friend.", answer: true }
        - { id: fr-w01-d6-g13, difficulty: medium, type: mcq, prompt: "'Enchantée, Tunde. Moi, je suis Madame Leroy.' Who is speaking?", choices: ["A man", "A woman", "A child", "Tunde"], answer: 1, explain: "Enchantée with -e: a woman speaks." }
        - { id: fr-w01-d6-g14, difficulty: medium, type: text, prompt: "Ask a friend how they are (2 words).", accept: ["Ça va ?", "Ça va", "Ca va"] }
        - { id: fr-w01-d6-g15, difficulty: medium, type: mcq, prompt: "Which reply to 'Merci !' is right?", choices: ["De rien !", "Merci !", "Ça va !", "Enchanté !"], answer: 0 }
        - { id: fr-w01-d6-g16, difficulty: hard, type: order, prompt: "Order the whole exchange.", items: ["Bonjour Madame, comment allez-vous ?", "Très bien, merci. Et vous ?", "Je vais bien, merci. Je m'appelle Tunde.", "Enchantée, Tunde.", "Au revoir, Madame. Bonne journée !"] }
        - { id: fr-w01-d6-g17, difficulty: hard, type: mcq, prompt: "Which line mixes tu and vous wrongly?", choices: ["Salut, ça va ? Et toi ?", "Bonjour Monsieur, comment allez-vous ?", "Comment allez-vous ? Et toi ?", "Bonsoir Madame. Bonne soirée !"], answer: 2 }
