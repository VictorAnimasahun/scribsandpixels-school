        - { id: fr-w01-d6-g07, difficulty: medium, type: text, prompt: "Answer formally: 'Comment allez-vous ?' → I'm well, thank you. And you?", accept: ["Je vais bien, merci. Et vous ?", "Je vais bien merci et vous", "Très bien, merci. Et vous ?"] }
