      covers: "Week 1 · Day 5: ça va, comment allez-vous, leaving phrases, phone numbers"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w01-d6-g01, difficulty: easy, type: mcq, prompt: "Ça va ? is…", choices: ["formal", "informal", "a goodbye", "a thank you"], answer: 1 }
        - { id: fr-w01-d6-g02, difficulty: easy, type: mcq, prompt: "Formal 'How are you?'", choices: ["Ça va ?", "Comment allez-vous ?", "Et toi ?", "Quoi de neuf ?"], answer: 1 }
        - { id: fr-w01-d6-g03, difficulty: easy, type: mcq, prompt: "'Bonne journée' is said when…", choices: ["arriving", "leaving", "eating", "sleeping"], answer: 1 }
