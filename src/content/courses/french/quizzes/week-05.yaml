# French · Week 5 quizzes. Format and rules: src/content/QUIZZES.md
week: 5
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 4 review"
      covers: "Week 4: avoir and its expressions, family, possessives, numbers 70–100, describing people"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w05-d1-g01, difficulty: easy, type: text, prompt: "nous ___ (avoir)", accept: ["avons"] }
        - { id: fr-w05-d1-g02, difficulty: easy, type: mcq, prompt: "I'm hungry.", choices: ["J'ai faim.", "Je suis faim.", "J'ai soif.", "Je faim."], answer: 0 }
        - { id: fr-w05-d1-g03, difficulty: easy, type: mcq, prompt: "(my) ___ amie", choices: ["mon", "ma", "mes"], answer: 0 }
        - { id: fr-w05-d1-g04, difficulty: easy, type: text, prompt: "80 in words", accept: ["quatre-vingts", "quatre vingts"] }
        - { id: fr-w05-d1-g05, difficulty: easy, type: truefalse, prompt: "« sa mère » can mean his mother or her mother.", answer: true }
        - { id: fr-w05-d1-g06, difficulty: easy, type: mcq, prompt: "uncle", choices: ["l'oncle", "le neveu", "le cousin", "le père"], answer: 0 }
        - { id: fr-w05-d1-g07, difficulty: medium, type: text, prompt: "La sœur de mon père, c'est ma ___.", accept: ["tante"] }
        - { id: fr-w05-d1-g08, difficulty: medium, type: text, prompt: "sérieux → (feminine)", accept: ["sérieuse"] }
        - { id: fr-w05-d1-g09, difficulty: medium, type: text, prompt: "Translate: She is 25.", accept: ["Elle a vingt-cinq ans.", "Elle a vingt-cinq ans"] }
        - { id: fr-w05-d1-g10, difficulty: medium, type: match, prompt: "Match.", pairs: [["notre", "our (one)"], ["leurs", "their (several)"], ["vos", "your, vous (several)"], ["ses", "his/her (several)"]] }
        - { id: fr-w05-d1-g11, difficulty: medium, type: text, prompt: "97 in words", accept: ["quatre-vingt-dix-sept", "quatre vingt dix sept"] }
        - { id: fr-w05-d1-g12, difficulty: medium, type: mcq, prompt: "they have (with the z liaison)", choices: ["ils ont", "ils sont", "ils a", "ils avons"], answer: 0 }
        - { id: fr-w05-d1-g13, difficulty: medium, type: text, prompt: "Translate: I don't have children.", accept: ["Je n'ai pas d'enfants.", "Je n'ai pas d'enfants", "Je n'ai pas d'enfant."] }
        - { id: fr-w05-d1-g14, difficulty: medium, type: truefalse, prompt: "« quatre-vingt-un » has no et and no s.", answer: true }
        - { id: fr-w05-d1-g15, difficulty: medium, type: text, prompt: "Mes sœurs sont (gentil) ___.", accept: ["gentilles"] }
        - { id: fr-w05-d1-g16, difficulty: hard, type: text, prompt: "Translate: My grandmother is old but sporty.", accept: ["Ma grand-mère est vieille mais sportive.", "Ma grand-mère est vieille mais sportive"] }
        - { id: fr-w05-d1-g17, difficulty: hard, type: mcq, prompt: "Find the sentence with NO mistake.", choices: ["Mon amie a soixante-dix ans.", "Ma ami est vieux.", "Ils sont faim.", "Sa père est grand."], answer: 0 }
        - { id: fr-w05-d1-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["J'ai raison.", "Nous avons froid.", "Leur fille est intelligente.", "Je suis 30 ans."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "-ER endings"
        secondsPerQuestion: 8
        questions:
          - { id: fr-w05-d1-rf01, difficulty: easy, type: text, prompt: "je ___ (parler)", accept: ["parle"] }
          - { id: fr-w05-d1-rf02, difficulty: easy, type: text, prompt: "tu ___ (parler)", accept: ["parles"] }
          - { id: fr-w05-d1-rf03, difficulty: easy, type: text, prompt: "il ___ (parler)", accept: ["parle"] }
          - { id: fr-w05-d1-rf04, difficulty: easy, type: text, prompt: "nous ___ (parler)", accept: ["parlons"] }
          - { id: fr-w05-d1-rf05, difficulty: easy, type: text, prompt: "vous ___ (parler)", accept: ["parlez"] }
          - { id: fr-w05-d1-rf06, difficulty: easy, type: text, prompt: "ils ___ (parler)", accept: ["parlent"] }
          - { id: fr-w05-d1-rf07, difficulty: easy, type: text, prompt: "j'___ (aimer)", accept: ["aime"] }
          - { id: fr-w05-d1-rf08, difficulty: easy, type: text, prompt: "nous ___ (habiter)", accept: ["habitons"] }
          - { id: fr-w05-d1-rf09, difficulty: easy, type: text, prompt: "elles ___ (écouter)", accept: ["écoutent"] }
          - { id: fr-w05-d1-rf10, difficulty: easy, type: truefalse, prompt: "The -ent of « ils parlent » is pronounced.", answer: false }
          - { id: fr-w05-d1-rf11, difficulty: easy, type: text, prompt: "vous ___ (travailler)", accept: ["travaillez"] }
      - kind: brain-teaser
        title: "Sound vs spelling"
        questions:
          - { id: fr-w05-d1-bt01, difficulty: medium, type: multi, prompt: "Which forms of parler sound exactly the same? (Select all.)", choices: ["je parle", "tu parles", "ils parlent", "nous parlons"], answers: [0, 1, 2] }
          - { id: fr-w05-d1-bt02, difficulty: medium, type: text, prompt: "Tu (travailler) ___ où ?", accept: ["travailles"] }
          - { id: fr-w05-d1-bt03, difficulty: medium, type: text, prompt: "Elle (regarder) ___ la télé.", accept: ["regarde"] }
          - { id: fr-w05-d1-bt04, difficulty: hard, type: text, prompt: "Translate: We live in Ibadan and they work in Lagos.", accept: ["Nous habitons à Ibadan et ils travaillent à Lagos.", "Nous habitons à Ibadan et ils travaillent à Lagos", "On habite à Ibadan et ils travaillent à Lagos."] }
          - { id: fr-w05-d1-bt05, difficulty: hard, type: mcq, prompt: "Why « j'écoute » but « je regarde »?", choices: ["je becomes j' before a vowel or silent h", "écouter is irregular", "regarder is reflexive", "random"], answer: 0 }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: -ER verbs in the present"
      covers: "Week 5 · Day 1: -er endings, silent -ent, je → j'"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w05-d2-g01, difficulty: easy, type: text, prompt: "Nous (habiter) ___ à Ibadan.", accept: ["habitons"] }
        - { id: fr-w05-d2-g02, difficulty: easy, type: text, prompt: "Ils (écouter) ___ la radio.", accept: ["écoutent"] }
        - { id: fr-w05-d2-g03, difficulty: easy, type: text, prompt: "J' (aimer) ___ le football.", accept: ["aime"] }
        - { id: fr-w05-d2-g04, difficulty: easy, type: text, prompt: "Vous (parler) ___ yoruba ?", accept: ["parlez"] }
        - { id: fr-w05-d2-g05, difficulty: easy, type: mcq, prompt: "The stem of parler is…", choices: ["parl-", "parle-", "par-", "parler-"], answer: 0 }
        - { id: fr-w05-d2-g06, difficulty: easy, type: truefalse, prompt: "About 90% of French verbs end in -er.", answer: true }
        - { id: fr-w05-d2-g07, difficulty: medium, type: match, prompt: "Match the ending.", pairs: [["je", "-e"], ["tu", "-es"], ["nous", "-ons"], ["vous", "-ez"]] }
        - { id: fr-w05-d2-g08, difficulty: medium, type: text, prompt: "ils (regarder) ___", accept: ["regardent"] }
        - { id: fr-w05-d2-g09, difficulty: medium, type: text, prompt: "tu (habiter) ___", accept: ["habites"] }
        - { id: fr-w05-d2-g10, difficulty: medium, type: mcq, prompt: "Which two forms sound different from the rest?", choices: ["nous and vous", "je and tu", "il and ils", "tu and ils"], answer: 0 }
        - { id: fr-w05-d2-g11, difficulty: medium, type: text, prompt: "Translate: You (tu) work a lot.", accept: ["Tu travailles beaucoup.", "Tu travailles beaucoup"] }
        - { id: fr-w05-d2-g12, difficulty: medium, type: truefalse, prompt: "« J'habite » uses j' because habiter starts with a silent h.", answer: true }
        - { id: fr-w05-d2-g13, difficulty: medium, type: mcq, prompt: "On ___ (parler) français.", choices: ["parle", "parlons", "parlent", "parles"], answer: 0, explain: "on takes the il form." }
        - { id: fr-w05-d2-g14, difficulty: medium, type: text, prompt: "Translate: They (women) listen to the radio.", accept: ["Elles écoutent la radio.", "Elles écoutent la radio"] }
        - { id: fr-w05-d2-g15, difficulty: medium, type: order, prompt: "Order: je, tu, il, nous, vous, ils (aimer)", items: ["j'aime", "tu aimes", "il aime", "nous aimons", "vous aimez", "ils aiment"] }
        - { id: fr-w05-d2-g16, difficulty: hard, type: text, prompt: "Translate: Do you (vous) speak Igbo? (with est-ce que)", accept: ["Est-ce que vous parlez igbo ?", "Est-ce que vous parlez igbo?", "Est-ce que vous parlez igbo"] }
        - { id: fr-w05-d2-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Nous parlez anglais et ils parle français. »", choices: ["parlons … parlent", "Only parlez → parlons", "Only parle → parlent", "No error"], answer: 0 }
        - { id: fr-w05-d2-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["J'écoute un podcast.", "Vous regardez la télé.", "Ils habitent à Abuja.", "Je aime le riz."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Verb meanings"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w05-d2-rf01, difficulty: easy, type: mcq, prompt: "regarder", choices: ["to watch", "to listen", "to look for", "to stay"], answer: 0 }
          - { id: fr-w05-d2-rf02, difficulty: easy, type: mcq, prompt: "écouter", choices: ["to listen", "to watch", "to write", "to eat"], answer: 0 }
          - { id: fr-w05-d2-rf03, difficulty: easy, type: mcq, prompt: "chercher", choices: ["to look for", "to find", "to sing", "to arrive"], answer: 0 }
          - { id: fr-w05-d2-rf04, difficulty: easy, type: mcq, prompt: "rester", choices: ["to stay", "to rest", "to return", "to arrive"], answer: 0 }
          - { id: fr-w05-d2-rf05, difficulty: easy, type: mcq, prompt: "cuisiner", choices: ["to cook", "to clean", "to eat", "to buy"], answer: 0 }
          - { id: fr-w05-d2-rf06, difficulty: easy, type: mcq, prompt: "donner", choices: ["to give", "to sleep", "to take", "to dance"], answer: 0 }
          - { id: fr-w05-d2-rf07, difficulty: easy, type: mcq, prompt: "détester", choices: ["to hate", "to test", "to detect", "to like"], answer: 0 }
          - { id: fr-w05-d2-rf08, difficulty: easy, type: mcq, prompt: "jouer", choices: ["to play", "to enjoy", "to join", "to work"], answer: 0 }
          - { id: fr-w05-d2-rf09, difficulty: easy, type: text, prompt: "nous ___ (manger)", accept: ["mangeons"] }
          - { id: fr-w05-d2-rf10, difficulty: easy, type: text, prompt: "nous ___ (commencer)", accept: ["commençons"] }
          - { id: fr-w05-d2-rf11, difficulty: easy, type: text, prompt: "je ___ (préférer)", accept: ["préfère"] }
      - kind: brain-teaser
        title: "Spelling changes"
        questions:
          - { id: fr-w05-d2-bt01, difficulty: medium, type: mcq, prompt: "Why « nous mangeons » with an e?", choices: ["To keep the soft g sound before o", "It's plural", "e is always added for nous", "A typo that became a rule"], answer: 0 }
          - { id: fr-w05-d2-bt02, difficulty: medium, type: mcq, prompt: "Why « nous commençons » with ç?", choices: ["To keep the soft c (s sound) before o", "ç is the nous marker", "It's a different verb", "To show it's past"], answer: 0 }
          - { id: fr-w05-d2-bt03, difficulty: medium, type: text, prompt: "ils ___ (préférer)", accept: ["préfèrent"] }
          - { id: fr-w05-d2-bt04, difficulty: hard, type: text, prompt: "vous ___ (préférer)", accept: ["préférez"], explain: "nous and vous keep é: préférons, préférez." }
          - { id: fr-w05-d2-bt05, difficulty: hard, type: text, prompt: "Translate: We start at 8 and we eat at noon. (à midi)", accept: ["Nous commençons à 8 heures et nous mangeons à midi.", "Nous commençons à huit heures et nous mangeons à midi.", "Nous commençons à 8 heures et nous mangeons à midi"] }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: 20 essential -ER verbs"
      covers: "Week 5 · Day 2: everyday -er verbs, manger/commencer/préférer spelling changes"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w05-d3-g01, difficulty: easy, type: mcq, prompt: "to look for", choices: ["chercher", "regarder", "trouver", "donner"], answer: 0 }
        - { id: fr-w05-d3-g02, difficulty: easy, type: mcq, prompt: "to visit (a place)", choices: ["visiter", "rester", "arriver", "habiter"], answer: 0 }
        - { id: fr-w05-d3-g03, difficulty: easy, type: mcq, prompt: "to sing", choices: ["chanter", "danser", "jouer", "cuisiner"], answer: 0 }
        - { id: fr-w05-d3-g04, difficulty: easy, type: text, prompt: "nous ___ (manger)", accept: ["mangeons"] }
        - { id: fr-w05-d3-g05, difficulty: easy, type: truefalse, prompt: "« Le bus arrive » means \"the bus is arriving\".", answer: true }
        - { id: fr-w05-d3-g06, difficulty: easy, type: mcq, prompt: "étudier", choices: ["to study", "to stay", "to state", "to stand"], answer: 0 }
        - { id: fr-w05-d3-g07, difficulty: medium, type: text, prompt: "Translate: I'm looking for a job.", accept: ["Je cherche un travail.", "Je cherche un travail", "Je cherche un emploi."] }
        - { id: fr-w05-d3-g08, difficulty: medium, type: text, prompt: "Translate: She sings at church.", accept: ["Elle chante à l'église.", "Elle chante à l'église"] }
        - { id: fr-w05-d3-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["adorer", "to love/adore"], ["rester", "to stay"], ["donner", "to give"], ["arriver", "to arrive"]] }
        - { id: fr-w05-d3-g10, difficulty: medium, type: text, prompt: "nous ___ (commencer)", accept: ["commençons"] }
        - { id: fr-w05-d3-g11, difficulty: medium, type: text, prompt: "tu ___ (préférer)", accept: ["préfères"] }
        - { id: fr-w05-d3-g12, difficulty: medium, type: truefalse, prompt: "« nous préférons » keeps the é.", answer: true }
        - { id: fr-w05-d3-g13, difficulty: medium, type: text, prompt: "Translate: We are staying at home.", accept: ["Nous restons à la maison.", "Nous restons à la maison", "On reste à la maison."] }
        - { id: fr-w05-d3-g14, difficulty: medium, type: text, prompt: "Translate: You (vous) are studying French.", accept: ["Vous étudiez le français.", "Vous étudiez le français"] }
        - { id: fr-w05-d3-g15, difficulty: medium, type: mcq, prompt: "Ils ___ au football.", choices: ["jouent", "jouons", "joue", "jouez"], answer: 0 }
        - { id: fr-w05-d3-g16, difficulty: hard, type: text, prompt: "Translate: I cook on Sundays and my brother dances.", accept: ["Je cuisine le dimanche et mon frère danse.", "Je cuisine le dimanche et mon frère danse"] }
        - { id: fr-w05-d3-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Nous mangons et nous commencons. »", choices: ["mangeons … commençons", "Only mangons", "Only commencons", "No error"], answer: 0 }
        - { id: fr-w05-d3-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["Je préfère le thé.", "Elles préfèrent danser.", "Nous préférons rester.", "Vous préfèrez lire."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Make it negative"
        secondsPerQuestion: 10
        questions:
          - { id: fr-w05-d3-rf01, difficulty: easy, type: mcq, prompt: "I don't speak Chinese.", choices: ["Je ne parle pas chinois.", "Je parle ne pas chinois.", "Je pas parle chinois.", "Ne je parle pas chinois."], answer: 0 }
          - { id: fr-w05-d3-rf02, difficulty: easy, type: mcq, prompt: "ne before a vowel", choices: ["n'", "ne", "no", "non"], answer: 0 }
          - { id: fr-w05-d3-rf03, difficulty: easy, type: mcq, prompt: "J'ai une voiture → negative", choices: ["Je n'ai pas de voiture.", "Je n'ai pas une voiture.", "Je n'ai pas la voiture.", "Je ne pas ai voiture."], answer: 0 }
          - { id: fr-w05-d3-rf04, difficulty: easy, type: mcq, prompt: "J'aime le café → negative", choices: ["Je n'aime pas le café.", "Je n'aime pas de café.", "Je ne aime pas café.", "Je n'aime le café pas."], answer: 0 }
          - { id: fr-w05-d3-rf05, difficulty: easy, type: mcq, prompt: "C'est un livre → negative", choices: ["Ce n'est pas un livre.", "Ce n'est pas de livre.", "Ce ne est pas un livre.", "C'est pas de livre."], answer: 0 }
          - { id: fr-w05-d3-rf06, difficulty: easy, type: mcq, prompt: "Il a des enfants → negative", choices: ["Il n'a pas d'enfants.", "Il n'a pas des enfants.", "Il ne a pas enfants.", "Il n'a pas les enfants."], answer: 0 }
          - { id: fr-w05-d3-rf07, difficulty: easy, type: truefalse, prompt: "Spoken French often drops ne: « J'aime pas ça. »", answer: true }
          - { id: fr-w05-d3-rf08, difficulty: easy, type: mcq, prompt: "ne … pas goes…", choices: ["around the verb", "before the subject", "at the end", "after the object"], answer: 0 }
          - { id: fr-w05-d3-rf09, difficulty: easy, type: mcq, prompt: "Nous travaillons → negative", choices: ["Nous ne travaillons pas.", "Nous travaillons pas ne.", "Ne nous travaillons pas.", "Nous pas travaillons."], answer: 0 }
          - { id: fr-w05-d3-rf10, difficulty: easy, type: mcq, prompt: "In writing, keep…", choices: ["both ne and pas", "only pas", "only ne", "neither"], answer: 0 }
      - kind: brain-teaser
        title: "Negative articles"
        questions:
          - { id: fr-w05-d3-bt01, difficulty: medium, type: text, prompt: "Negative: Elle a un frère.", accept: ["Elle n'a pas de frère.", "Elle n'a pas de frère"] }
          - { id: fr-w05-d3-bt02, difficulty: medium, type: text, prompt: "Negative: Nous aimons le fromage.", accept: ["Nous n'aimons pas le fromage.", "Nous n'aimons pas le fromage"] }
          - { id: fr-w05-d3-bt03, difficulty: medium, type: text, prompt: "Negative: Ils regardent des films.", accept: ["Ils ne regardent pas de films.", "Ils ne regardent pas de films"] }
          - { id: fr-w05-d3-bt04, difficulty: hard, type: text, prompt: "Negative: C'est une banque.", accept: ["Ce n'est pas une banque.", "Ce n'est pas une banque"], explain: "être keeps its article." }
          - { id: fr-w05-d3-bt05, difficulty: hard, type: text, prompt: "Negative: J'ai des amis à Paris.", accept: ["Je n'ai pas d'amis à Paris.", "Je n'ai pas d'amis à Paris"] }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: negation"
      covers: "Week 5 · Day 3: ne … pas, n' before vowels, un/une/des → de, le/la/les unchanged, être keeps its article, spoken pas"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w05-d4-g01, difficulty: easy, type: mcq, prompt: "Je travaille le samedi → negative", choices: ["Je ne travaille pas le samedi.", "Je travaille ne pas le samedi.", "Je ne pas travaille le samedi.", "Je travaille pas ne le samedi."], answer: 0 }
        - { id: fr-w05-d4-g02, difficulty: easy, type: mcq, prompt: "After pas, une becomes…", choices: ["de", "la", "une (unchanged)", "des"], answer: 0 }
        - { id: fr-w05-d4-g03, difficulty: easy, type: mcq, prompt: "After pas, le…", choices: ["stays le", "becomes de", "disappears", "becomes du"], answer: 0 }
        - { id: fr-w05-d4-g04, difficulty: easy, type: truefalse, prompt: "« Je n'aime pas » uses n' because aime starts with a vowel.", answer: true }
        - { id: fr-w05-d4-g05, difficulty: easy, type: mcq, prompt: "C'est pas grave =", choices: ["It's not serious / no problem", "It's a grave", "It's very serious", "It's past"], answer: 0 }
        - { id: fr-w05-d4-g06, difficulty: easy, type: mcq, prompt: "Negative of « J'habite à Kano »", choices: ["Je n'habite pas à Kano.", "Je ne habite pas à Kano.", "J'habite pas ne à Kano.", "Je n'habite à Kano pas."], answer: 0 }
        - { id: fr-w05-d4-g07, difficulty: medium, type: text, prompt: "Negative: Tu as une voiture ?", accept: ["Tu n'as pas de voiture ?", "Tu n'as pas de voiture?", "Tu n'as pas de voiture"] }
        - { id: fr-w05-d4-g08, difficulty: medium, type: text, prompt: "Negative: J'aime la pluie.", accept: ["Je n'aime pas la pluie.", "Je n'aime pas la pluie"] }
        - { id: fr-w05-d4-g09, difficulty: medium, type: text, prompt: "Negative: Ce sont des clés.", accept: ["Ce ne sont pas des clés.", "Ce ne sont pas des clés"], explain: "être keeps its article." }
        - { id: fr-w05-d4-g10, difficulty: medium, type: match, prompt: "Match the article after pas.", pairs: [["un", "de"], ["des", "de"], ["la", "la"], ["les", "les"]] }
        - { id: fr-w05-d4-g11, difficulty: medium, type: text, prompt: "Negative: Il a des enfants.", accept: ["Il n'a pas d'enfants.", "Il n'a pas d'enfants"] }
        - { id: fr-w05-d4-g12, difficulty: medium, type: truefalse, prompt: "« Je n'ai pas une voiture » is the standard negative of « J'ai une voiture ».", answer: false }
        - { id: fr-w05-d4-g13, difficulty: medium, type: mcq, prompt: "Spoken « J'aime pas ça » in writing is…", choices: ["Je n'aime pas ça.", "J'aime ne pas ça.", "Je ne aime ça.", "J'aime pas ça. (always)"], answer: 0 }
        - { id: fr-w05-d4-g14, difficulty: medium, type: text, prompt: "Negative: Nous regardons la télé.", accept: ["Nous ne regardons pas la télé.", "Nous ne regardons pas la télé"] }
        - { id: fr-w05-d4-g15, difficulty: medium, type: order, prompt: "Build: I don't have a car.", items: ["Je", "n'ai", "pas", "de", "voiture"] }
        - { id: fr-w05-d4-g16, difficulty: hard, type: text, prompt: "Translate: She doesn't eat meat and she doesn't like fish. (viande, poisson)", accept: ["Elle ne mange pas de viande et elle n'aime pas le poisson.", "Elle ne mange pas de viande et elle n'aime pas le poisson"] }
        - { id: fr-w05-d4-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Je n'ai pas des frères et je ne aime pas le riz. »", choices: ["pas de frères … je n'aime", "Only des → de", "Only ne → n'", "No error"], answer: 0 }
        - { id: fr-w05-d4-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["Ce n'est pas un problème.", "Je n'ai pas d'argent.", "Il ne parle pas anglais.", "Nous n'avons pas des enfants."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Likes and hobbies"
        secondsPerQuestion: 8
        questions:
