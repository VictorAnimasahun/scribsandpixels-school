          - { id: fr-w10-d1-rf03, difficulty: easy, type: mcq, prompt: "la salle de bains", choices: ["bathroom", "dining room", "bedroom", "toilet"], answer: 0 }
          - { id: fr-w10-d1-rf04, difficulty: easy, type: mcq, prompt: "le salon", choices: ["living room", "saloon", "office", "garden"], answer: 0 }
          - { id: fr-w10-d1-rf05, difficulty: easy, type: mcq, prompt: "l'immeuble", choices: ["building", "furniture", "flat", "lift"], answer: 0 }
          - { id: fr-w10-d1-rf06, difficulty: easy, type: mcq, prompt: "l'ascenseur", choices: ["lift", "stairs", "floor", "balcony"], answer: 0 }
          - { id: fr-w10-d1-rf07, difficulty: easy, type: mcq, prompt: "l'escalier", choices: ["stairs", "lift", "storey", "garage"], answer: 0 }
          - { id: fr-w10-d1-rf08, difficulty: easy, type: mcq, prompt: "le rez-de-chaussée", choices: ["ground floor", "first floor", "basement", "roof"], answer: 0 }
          - { id: fr-w10-d1-rf09, difficulty: easy, type: mcq, prompt: "flat", choices: ["l'appartement", "la maison", "la pièce", "l'étage"], answer: 0 }
          - { id: fr-w10-d1-rf10, difficulty: easy, type: mcq, prompt: "dining room", choices: ["la salle à manger", "la salle de bains", "le séjour", "la cuisine"], answer: 0 }
          - { id: fr-w10-d1-rf11, difficulty: easy, type: mcq, prompt: "la pièce", choices: ["room (any)", "piece of cake", "bedroom", "floor"], answer: 0 }
      - kind: brain-teaser
        title: "Floors and rooms"
        questions:
          - { id: fr-w10-d1-bt01, difficulty: medium, type: mcq, prompt: "« au premier étage » is…", choices: ["one floor above the ground floor", "the ground floor", "the top floor", "the basement"], answer: 0 }
          - { id: fr-w10-d1-bt02, difficulty: medium, type: mcq, prompt: "« C'est un trois-pièces » =", choices: ["three main rooms (kitchen and bathroom not counted)", "three bedrooms exactly", "three floors", "three rooms including the bathroom"], answer: 0 }
          - { id: fr-w10-d1-bt03, difficulty: medium, type: text, prompt: "Translate: I live in a flat on the third floor.", accept: ["J'habite dans un appartement au troisième étage.", "J'habite dans un appartement au troisième étage"] }
          - { id: fr-w10-d1-bt04, difficulty: hard, type: text, prompt: "Translate: There are two bedrooms and a kitchen.", accept: ["Il y a deux chambres et une cuisine.", "Il y a deux chambres et une cuisine"] }
          - { id: fr-w10-d1-bt05, difficulty: hard, type: mcq, prompt: "A US \"second floor\" in French is…", choices: ["le premier étage", "le deuxième étage", "le rez-de-chaussée", "le troisième étage"], answer: 0 }

