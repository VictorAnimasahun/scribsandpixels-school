# French · Week 10 quizzes. Format and rules: src/content/QUIZZES.md
week: 10
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 9 review"
      covers: "Week 9: venir (de), venir de + infinitive, prepositions of place, imperative and directions, transport"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w10-d1-g01, difficulty: easy, type: text, prompt: "ils ___ (venir)", accept: ["viennent"] }
        - { id: fr-w10-d1-g02, difficulty: easy, type: mcq, prompt: "Je viens ___ marché.", choices: ["du", "de le", "au", "des"], answer: 0 }
        - { id: fr-w10-d1-g03, difficulty: easy, type: mcq, prompt: "I've just eaten.", choices: ["Je viens de manger.", "Je vais manger.", "Je mange.", "Je viens manger."], answer: 0 }
        - { id: fr-w10-d1-g04, difficulty: easy, type: mcq, prompt: "en face de =", choices: ["opposite", "next to", "far from", "behind"], answer: 0 }
        - { id: fr-w10-d1-g05, difficulty: easy, type: mcq, prompt: "___ pied", choices: ["à", "en", "au", "par"], answer: 0 }
        - { id: fr-w10-d1-g06, difficulty: easy, type: mcq, prompt: "Go straight on (vous)", choices: ["Allez tout droit.", "Va à droite.", "Tournez tout.", "Allez à gauche."], answer: 0 }
        - { id: fr-w10-d1-g07, difficulty: medium, type: text, prompt: "Translate: She comes from the hospital.", accept: ["Elle vient de l'hôpital.", "Elle vient de l'hôpital"] }
        - { id: fr-w10-d1-g08, difficulty: medium, type: text, prompt: "Imperative (tu) of tourner", accept: ["tourne"] }
        - { id: fr-w10-d1-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["en bus", "by bus"], ["à vélo", "by bike"], ["en avion", "by plane"], ["à moto", "by motorbike"]] }
        - { id: fr-w10-d1-g10, difficulty: medium, type: text, prompt: "Translate: The bank is near the market.", accept: ["La banque est près du marché.", "La banque est près du marché"] }
        - { id: fr-w10-d1-g11, difficulty: medium, type: truefalse, prompt: "« Je viens de France » and « Je viens du Nigeria » are both correct.", answer: true }
        - { id: fr-w10-d1-g12, difficulty: medium, type: text, prompt: "Translate: They (men) have just arrived.", accept: ["Ils viennent d'arriver.", "Ils viennent d'arriver"] }
        - { id: fr-w10-d1-g13, difficulty: medium, type: mcq, prompt: "a return ticket", choices: ["un aller-retour", "un aller simple", "un billet simple", "un retour"], answer: 0 }
        - { id: fr-w10-d1-g14, difficulty: medium, type: text, prompt: "Translate (vous): Take the first street on the right.", accept: ["Prenez la première rue à droite.", "Prenez la première rue à droite"] }
        - { id: fr-w10-d1-g15, difficulty: medium, type: mcq, prompt: "Be patient! (tu)", choices: ["Sois patient !", "Es patient !", "Soyez patient !", "Être patient !"], answer: 0 }
        - { id: fr-w10-d1-g16, difficulty: hard, type: text, prompt: "Translate: I go to work by bus and I come home on foot.", accept: ["Je vais au travail en bus et je rentre à pied.", "Je vais au travail en bus et je rentre à pied"] }
        - { id: fr-w10-d1-g17, difficulty: hard, type: mcq, prompt: "Find the sentence with NO mistake.", choices: ["Le café est à côté de la gare, au coin de la rue.", "Tournes à gauche !", "Il vient d'arrivé.", "Je vais au bureau à bus."], answer: 0 }
        - { id: fr-w10-d1-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["Nous venons des États-Unis.", "Va tout droit !", "La poste est loin de la gare.", "Elle vient de le bureau."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Rooms and housing"
        secondsPerQuestion: 7
        questions:
