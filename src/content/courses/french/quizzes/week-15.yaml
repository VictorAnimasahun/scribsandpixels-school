# French · Week 15 quizzes. Format and rules: src/content/QUIZZES.md
week: 15
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 14 review"
      covers: "Week 14: finir-type, partir-type and -RE verbs, clothes, mettre vs porter, ce/cet/cette/ces, shopping"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w15-d1-g01, difficulty: easy, type: text, prompt: "nous ___ (finir)", accept: ["finissons"] }
        - { id: fr-w15-d1-g02, difficulty: easy, type: text, prompt: "je ___ (partir)", accept: ["pars"] }
        - { id: fr-w15-d1-g03, difficulty: easy, type: truefalse, prompt: "« attendre » takes no preposition: J'attends le bus.", answer: true }
        - { id: fr-w15-d1-g04, difficulty: easy, type: mcq, prompt: "___ hôtel", choices: ["cet", "ce", "cette", "ces"], answer: 0 }
        - { id: fr-w15-d1-g05, difficulty: easy, type: mcq, prompt: "shoe size", choices: ["la pointure", "la taille", "la mesure", "le numéro"], answer: 0 }
        - { id: fr-w15-d1-g06, difficulty: easy, type: mcq, prompt: "la jupe", choices: ["skirt", "jumper", "dress", "jacket"], answer: 0 }
        - { id: fr-w15-d1-g07, difficulty: medium, type: text, prompt: "Ils (réussir) ___ l'examen.", accept: ["réussissent"] }
        - { id: fr-w15-d1-g08, difficulty: medium, type: text, prompt: "il ___ (attendre)", accept: ["attend"] }
        - { id: fr-w15-d1-g09, difficulty: medium, type: match, prompt: "Match verb to family.", pairs: [["choisir", "-IR (-iss-)"], ["dormir", "partir-type"], ["vendre", "-RE"], ["mettre", "irregular"]] }
        - { id: fr-w15-d1-g10, difficulty: medium, type: text, prompt: "Translate: She is wearing a red dress.", accept: ["Elle porte une robe rouge.", "Elle porte une robe rouge"] }
        - { id: fr-w15-d1-g11, difficulty: medium, type: truefalse, prompt: "« porter » = to put on (action).", answer: false }
        - { id: fr-w15-d1-g12, difficulty: medium, type: text, prompt: "Translate: these shoes", accept: ["ces chaussures"] }
        - { id: fr-w15-d1-g13, difficulty: medium, type: mcq, prompt: "It's too tight. Do you have it in black?", choices: ["C'est trop serré. Vous l'avez en noir ?", "C'est très serré. Vous avez noir ?", "C'est trop petit. Avez en noir ?", "Il est serré. En noir vous ?"], answer: 0 }
        - { id: fr-w15-d1-g14, difficulty: medium, type: text, prompt: "ils ___ (mettre)", accept: ["mettent"] }
        - { id: fr-w15-d1-g15, difficulty: medium, type: mcq, prompt: "What size are you?", choices: ["Quelle taille faites-vous ?", "Quelle pointure êtes-vous ?", "Combien taille ?", "Vous êtes quelle taille ?"], answer: 0 }
        - { id: fr-w15-d1-g16, difficulty: hard, type: text, prompt: "Translate: We get off the bus and we wait for Ada.", accept: ["Nous descendons du bus et nous attendons Ada.", "On descend du bus et on attend Ada."] }
        - { id: fr-w15-d1-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Nous choisons ce robe. »", choices: ["choisissons … cette robe", "Only choisons", "Only ce", "No error"], answer: 0 }
        - { id: fr-w15-d1-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["Je mets mon manteau.", "Il dort bien.", "Tu perds tes clés.", "Elle attende le bus."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Big numbers"
        secondsPerQuestion: 8
        questions:
          - { id: fr-w15-d1-rf01, difficulty: easy, type: mcq, prompt: "200", choices: ["deux cents", "deux cent", "deux centes", "deux-cents mille"], answer: 0 }
          - { id: fr-w15-d1-rf02, difficulty: easy, type: mcq, prompt: "250", choices: ["deux cent cinquante", "deux cents cinquante", "deux-cents-cinquante", "deux cent cinquantes"], answer: 0 }
          - { id: fr-w15-d1-rf03, difficulty: easy, type: mcq, prompt: "1 000", choices: ["mille", "un mille", "milles", "mil"], answer: 0 }
          - { id: fr-w15-d1-rf04, difficulty: easy, type: mcq, prompt: "3 000", choices: ["trois mille", "trois milles", "trois mil", "trois mille-s"], answer: 0 }
          - { id: fr-w15-d1-rf05, difficulty: easy, type: mcq, prompt: "1 000 000 people", choices: ["un million de personnes", "un million personnes", "un millions de personnes", "mille mille personnes"], answer: 0 }
          - { id: fr-w15-d1-rf06, difficulty: easy, type: mcq, prompt: "un milliard", choices: ["a billion", "a million", "a thousand", "a trillion"], answer: 0 }
          - { id: fr-w15-d1-rf07, difficulty: easy, type: mcq, prompt: "1 500,50 € =", choices: ["€1,500.50", "€1.50050", "€150,050", "€15.00"], answer: 0 }
          - { id: fr-w15-d1-rf08, difficulty: easy, type: mcq, prompt: "2026", choices: ["deux mille vingt-six", "vingt vingt-six", "deux milles vingt-six", "deux mil vingt-six"], answer: 0 }
          - { id: fr-w15-d1-rf09, difficulty: easy, type: mcq, prompt: "gagner", choices: ["to earn", "to spend", "to save", "to cost"], answer: 0 }
          - { id: fr-w15-d1-rf10, difficulty: easy, type: mcq, prompt: "économiser", choices: ["to save", "to spend", "to economise only fuel", "to earn"], answer: 0 }
      - kind: brain-teaser
        title: "Write the number"
        questions:
          - { id: fr-w15-d1-bt01, difficulty: medium, type: text, prompt: "In words: 310", accept: ["trois cent dix"] }
          - { id: fr-w15-d1-bt02, difficulty: medium, type: text, prompt: "In words: 1 250", accept: ["mille deux cent cinquante"] }
          - { id: fr-w15-d1-bt03, difficulty: medium, type: text, prompt: "In words: 1984", accept: ["mille neuf cent quatre-vingt-quatre"] }
          - { id: fr-w15-d1-bt04, difficulty: hard, type: mcq, prompt: "Why « deux cents » but « deux cent dix »?", choices: ["cent takes -s only when multiplied and ending the number", "random", "dix is plural", "cents is formal"], answer: 0 }
          - { id: fr-w15-d1-bt05, difficulty: hard, type: text, prompt: "In words: 280", accept: ["deux cent quatre-vingts"] }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: big numbers and money"
      covers: "Week 15 · Day 1: cent(s), mille, million/milliard de, years, French number formatting, money verbs"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w15-d2-g01, difficulty: easy, type: mcq, prompt: "300", choices: ["trois cents", "trois cent", "trois-cents", "trois centes"], answer: 0 }
        - { id: fr-w15-d2-g02, difficulty: easy, type: mcq, prompt: "2 000", choices: ["deux mille", "deux milles", "deux mil", "deux-milles"], answer: 0 }
        - { id: fr-w15-d2-g03, difficulty: easy, type: truefalse, prompt: "« mille » never takes -s.", answer: true }
        - { id: fr-w15-d2-g04, difficulty: easy, type: mcq, prompt: "dépenser", choices: ["to spend", "to depend", "to earn", "to save"], answer: 0 }
        - { id: fr-w15-d2-g05, difficulty: easy, type: mcq, prompt: "un virement", choices: ["a bank transfer", "a virus", "a turn", "a salary"], answer: 0 }
        - { id: fr-w15-d2-g06, difficulty: easy, type: mcq, prompt: "French decimal separator", choices: ["comma", "point", "space", "apostrophe"], answer: 0 }
        - { id: fr-w15-d2-g07, difficulty: medium, type: text, prompt: "In words: 500", accept: ["cinq cents"] }
        - { id: fr-w15-d2-g08, difficulty: medium, type: text, prompt: "In words: 5 000", accept: ["cinq mille"] }
        - { id: fr-w15-d2-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["gagner", "to earn"], ["dépenser", "to spend"], ["économiser", "to save"], ["coûter", "to cost"]] }
        - { id: fr-w15-d2-g10, difficulty: medium, type: text, prompt: "Translate: He earns 3,000 euros a month.", accept: ["Il gagne 3 000 euros par mois.", "Il gagne trois mille euros par mois.", "Il gagne 3000 euros par mois."] }
        - { id: fr-w15-d2-g11, difficulty: medium, type: truefalse, prompt: "« deux millions de nairas » needs de.", answer: true }
        - { id: fr-w15-d2-g12, difficulty: medium, type: text, prompt: "In words: 2026", accept: ["deux mille vingt-six"] }
        - { id: fr-w15-d2-g13, difficulty: medium, type: mcq, prompt: "This phone costs 450,000 naira.", choices: ["Ce téléphone coûte 450 000 nairas.", "Ce téléphone coûte 450.000 nairas.", "Cet téléphone coûte 450 000.", "Ce téléphone coûte quatre cents cinquante mille."], answer: 0 }
        - { id: fr-w15-d2-g14, difficulty: medium, type: text, prompt: "In words: 1 999", accept: ["mille neuf cent quatre-vingt-dix-neuf"] }
        - { id: fr-w15-d2-g15, difficulty: medium, type: mcq, prompt: "€3,750.25 written French-style", choices: ["3 750,25 €", "3,750.25 €", "3.750,25€ only", "3750.25 €"], answer: 0 }
        - { id: fr-w15-d2-g16, difficulty: hard, type: text, prompt: "In words: 200 000", accept: ["deux cent mille"] }
        - { id: fr-w15-d2-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « deux milles trois cents euros »", choices: ["milles → mille", "cents → cent", "both", "No error"], answer: 0 }
        - { id: fr-w15-d2-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["quatre cents", "quatre cent vingt", "trois mille", "trois cents dix"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Lire, écrire, dire"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w15-d2-rf01, difficulty: easy, type: text, prompt: "je ___ (lire)", accept: ["lis"] }
          - { id: fr-w15-d2-rf02, difficulty: easy, type: text, prompt: "il ___ (lire)", accept: ["lit"] }
          - { id: fr-w15-d2-rf03, difficulty: easy, type: text, prompt: "nous ___ (lire)", accept: ["lisons"] }
          - { id: fr-w15-d2-rf04, difficulty: easy, type: text, prompt: "j'___ (écrire)", accept: ["écris"] }
          - { id: fr-w15-d2-rf05, difficulty: easy, type: text, prompt: "nous ___ (écrire)", accept: ["écrivons"] }
          - { id: fr-w15-d2-rf06, difficulty: easy, type: text, prompt: "ils ___ (écrire)", accept: ["écrivent"] }
          - { id: fr-w15-d2-rf07, difficulty: easy, type: text, prompt: "vous ___ (dire)", accept: ["dites"] }
          - { id: fr-w15-d2-rf08, difficulty: easy, type: text, prompt: "ils ___ (dire)", accept: ["disent"] }
          - { id: fr-w15-d2-rf09, difficulty: easy, type: mcq, prompt: "la réunion", choices: ["meeting", "reunion party", "region", "report"], answer: 0 }
          - { id: fr-w15-d2-rf10, difficulty: easy, type: mcq, prompt: "un CDI", choices: ["permanent contract", "fixed-term contract", "a CD", "internship"], answer: 0 }
      - kind: brain-teaser
        title: "At the office"
        questions:
          - { id: fr-w15-d2-bt01, difficulty: medium, type: text, prompt: "Nous (écrire) ___ un rapport.", accept: ["écrivons"] }
          - { id: fr-w15-d2-bt02, difficulty: medium, type: text, prompt: "Qu'est-ce que vous (dire) ___ ?", accept: ["dites"] }
          - { id: fr-w15-d2-bt03, difficulty: medium, type: text, prompt: "Tu (écrire) ___ à ton chef ?", accept: ["écris"] }
          - { id: fr-w15-d2-bt04, difficulty: hard, type: mcq, prompt: "What's special about « vous dites »?", choices: ["irregular, like faites and êtes", "it's formal only", "it's a typo of disez", "it's past tense"], answer: 0 }
          - { id: fr-w15-d2-bt05, difficulty: hard, type: match, prompt: "Match.", pairs: [["le/la stagiaire", "intern"], ["la date limite", "deadline"], ["les congés", "leave"], ["un CDD", "fixed-term contract"]] }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: lire, écrire, dire + work words"
      covers: "Week 15 · Day 2: lire, écrire, dire (vous dites); réunion, rendez-vous, dossier, rapport, congés, télétravail, CDI/CDD"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w15-d3-g01, difficulty: easy, type: text, prompt: "Il (lire) ___ ses emails.", accept: ["lit"] }
        - { id: fr-w15-d3-g02, difficulty: easy, type: text, prompt: "Ils (dire) ___ bonjour.", accept: ["disent"] }
        - { id: fr-w15-d3-g03, difficulty: easy, type: truefalse, prompt: "« vous disez » is correct.", answer: false }
        - { id: fr-w15-d3-g04, difficulty: easy, type: mcq, prompt: "le télétravail", choices: ["remote work", "TV work", "phone work", "overtime"], answer: 0 }
        - { id: fr-w15-d3-g05, difficulty: easy, type: mcq, prompt: "le rendez-vous (work)", choices: ["appointment", "date only", "meeting room", "deadline"], answer: 0 }
        - { id: fr-w15-d3-g06, difficulty: easy, type: mcq, prompt: "l'entreprise", choices: ["company", "entrance", "enterprise spirit", "boss"], answer: 0 }
        - { id: fr-w15-d3-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["le dossier", "file/case"], ["le rapport", "report"], ["le chef / la cheffe", "boss"], ["le service", "department"]] }
        - { id: fr-w15-d3-g08, difficulty: medium, type: text, prompt: "vous ___ (écrire)", accept: ["écrivez"] }
        - { id: fr-w15-d3-g09, difficulty: medium, type: text, prompt: "Translate: I have a meeting at 10.", accept: ["J'ai une réunion à 10 h.", "J'ai une réunion à dix heures.", "J'ai une réunion à 10 heures."] }
        - { id: fr-w15-d3-g10, difficulty: medium, type: mcq, prompt: "What are you saying? (vous)", choices: ["Qu'est-ce que vous dites ?", "Qu'est-ce que vous disez ?", "Que vous dire ?", "Vous dit quoi ?"], answer: 0 }
        - { id: fr-w15-d3-g11, difficulty: medium, type: truefalse, prompt: "« un CDD » is a fixed-term contract.", answer: true }
        - { id: fr-w15-d3-g12, difficulty: medium, type: text, prompt: "elles ___ (lire)", accept: ["lisent"] }
        - { id: fr-w15-d3-g13, difficulty: medium, type: mcq, prompt: "I'm on leave next week.", choices: ["Je suis en congé la semaine prochaine.", "Je suis congé semaine prochaine.", "J'ai congés la semaine dernière.", "Je fais congé."], answer: 0 }
        - { id: fr-w15-d3-g14, difficulty: medium, type: text, prompt: "nous ___ (dire)", accept: ["disons"] }
        - { id: fr-w15-d3-g15, difficulty: medium, type: order, prompt: "Order écrire: je → ils.", items: ["écris", "écris", "écrit", "écrivons", "écrivez", "écrivent"] }
        - { id: fr-w15-d3-g16, difficulty: hard, type: text, prompt: "Translate: The intern writes the report and the boss reads it. (le lit)", accept: ["Le stagiaire écrit le rapport et le chef le lit.", "La stagiaire écrit le rapport et la cheffe le lit.", "Le stagiaire écrit le rapport et la cheffe le lit."] }
        - { id: fr-w15-d3-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Nous écrisons un email et vous disez merci. »", choices: ["écrivons … dites", "Only écrisons", "Only disez", "No error"], answer: 0 }
        - { id: fr-w15-d3-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["Tu lis le dossier.", "Il dit la vérité.", "Vous écrivez au client.", "Ils lit le rapport."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "On the phone"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w15-d3-rf01, difficulty: easy, type: mcq, prompt: "Allô ?", choices: ["Hello? (phone only)", "Hi everyone", "Go!", "All right?"], answer: 0 }
          - { id: fr-w15-d3-rf02, difficulty: easy, type: mcq, prompt: "C'est de la part de qui ?", choices: ["Who's calling?", "Which department?", "Who's it for?", "Who's there? (door)"], answer: 0 }
          - { id: fr-w15-d3-rf03, difficulty: easy, type: mcq, prompt: "Ne quittez pas.", choices: ["Hold the line.", "Don't quit your job.", "Don't leave the room.", "Hang up."], answer: 0 }
          - { id: fr-w15-d3-rf04, difficulty: easy, type: mcq, prompt: "Je vous la passe.", choices: ["I'll put you through (to her).", "I pass.", "I'll pass it on.", "I'm passing by."], answer: 0 }
          - { id: fr-w15-d3-rf05, difficulty: easy, type: mcq, prompt: "Elle est en réunion.", choices: ["She's in a meeting.", "She's on holiday.", "She's on the phone.", "She's out."], answer: 0 }
          - { id: fr-w15-d3-rf06, difficulty: easy, type: mcq, prompt: "Can I leave a message?", choices: ["Je peux laisser un message ?", "Je peux quitter un message ?", "Je laisse message ?", "Je dois un message ?"], answer: 0 }
          - { id: fr-w15-d3-rf07, difficulty: easy, type: mcq, prompt: "Can you call me back?", choices: ["Pouvez-vous me rappeler ?", "Pouvez-vous m'appeler arrière ?", "Vous rappelez-moi ?", "Rappel moi ?"], answer: 0 }
          - { id: fr-w15-d3-rf08, difficulty: easy, type: mcq, prompt: "You've got the wrong number.", choices: ["Vous avez fait un faux numéro.", "Vous avez un mauvais téléphone.", "C'est faux.", "Numéro erreur."], answer: 0 }
          - { id: fr-w15-d3-rf09, difficulty: easy, type: mcq, prompt: "C'est noté.", choices: ["Noted.", "It's a note.", "It's famous.", "It's marked wrong."], answer: 0 }
          - { id: fr-w15-d3-rf10, difficulty: easy, type: mcq, prompt: "en ligne (on the phone)", choices: ["on another call", "online shopping", "in line", "offline"], answer: 0 }
      - kind: brain-teaser
        title: "Take a message"
        questions:
          - { id: fr-w15-d3-bt01, difficulty: medium, type: text, prompt: "Translate: I would like to speak to Madame Martin, please.", accept: ["Je voudrais parler à Madame Martin, s'il vous plaît.", "Je voudrais parler à Madame Martin s'il vous plaît.", "Je voudrais parler à Mme Martin, s'il vous plaît."] }
          - { id: fr-w15-d3-bt02, difficulty: medium, type: order, prompt: "Order the call.", items: ["Allô, Société Durand, bonjour !", "Je voudrais parler à Madame Martin.", "C'est de la part de qui ?", "De Monsieur Adeyemi.", "Ne quittez pas…", "Elle est en réunion. Vous voulez laisser un message ?"] }
          - { id: fr-w15-d3-bt03, difficulty: medium, type: mcq, prompt: "Mr Adeyemi's number", choices: ["06 45 12 78 90", "06 54 21 87 09", "06 45 12 87 90", "07 45 12 78 90"], answer: 0 }
          - { id: fr-w15-d3-bt04, difficulty: hard, type: text, prompt: "Translate: He is out. Do you want to leave a message? (vous)", accept: ["Il est absent. Vous voulez laisser un message ?", "Il est absent. Voulez-vous laisser un message ?", "Il est absent. Vous voulez laisser un message?"] }
          - { id: fr-w15-d3-bt05, difficulty: hard, type: mcq, prompt: "French phone numbers are read…", choices: ["in pairs: zéro six, quarante-cinq, douze…", "digit by digit only", "in threes", "as one big number"], answer: 0 }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: on the phone"
      covers: "Week 15 · Day 3: answering, who's calling, hold the line, putting through, absent/in a meeting, messages, call back"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w15-d4-g01, difficulty: easy, type: mcq, prompt: "Who's calling?", choices: ["C'est de la part de qui ?", "Qui est là ?", "Vous êtes qui, toi ?", "C'est pour quoi ?"], answer: 0 }
        - { id: fr-w15-d4-g02, difficulty: easy, type: mcq, prompt: "Hold the line.", choices: ["Ne quittez pas.", "Ne partez pas.", "Attendez la ligne.", "Restez là."], answer: 0 }
        - { id: fr-w15-d4-g03, difficulty: easy, type: truefalse, prompt: "« Allô » is used only on the phone.", answer: true }
        - { id: fr-w15-d4-g04, difficulty: easy, type: mcq, prompt: "He's out.", choices: ["Il est absent.", "Il est dehors.", "Il est parti en ligne.", "Il n'est rien."], answer: 0 }
        - { id: fr-w15-d4-g05, difficulty: easy, type: mcq, prompt: "Noted.", choices: ["C'est noté.", "C'est notable.", "Je note pas.", "Noté c'est."], answer: 0 }
        - { id: fr-w15-d4-g06, difficulty: easy, type: mcq, prompt: "I'll put you through (to him).", choices: ["Je vous le passe.", "Je vous la passe.", "Je le vous passe.", "Je passe lui."], answer: 0 }
        - { id: fr-w15-d4-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["Ne quittez pas.", "Hold the line."], ["Il est en ligne.", "He's on another call."], ["Pouvez-vous me rappeler ?", "Can you call me back?"], ["C'est noté.", "Noted."]] }
        - { id: fr-w15-d4-g08, difficulty: medium, type: text, prompt: "Translate: Can you call me back? (vous, inverted)", accept: ["Pouvez-vous me rappeler ?", "Pouvez-vous me rappeler?"] }
        - { id: fr-w15-d4-g09, difficulty: medium, type: text, prompt: "Translate: She's in a meeting.", accept: ["Elle est en réunion.", "Elle est en réunion"] }
        - { id: fr-w15-d4-g10, difficulty: medium, type: mcq, prompt: "Can you tell her to call me back?", choices: ["Pouvez-vous lui dire de me rappeler ?", "Pouvez-vous la dire me rappeler ?", "Vous dites rappeler moi ?", "Dites-la de rappeler."], answer: 0 }
        - { id: fr-w15-d4-g11, difficulty: medium, type: truefalse, prompt: "« Je vous la passe » means you'll be put through to a woman.", answer: true }
        - { id: fr-w15-d4-g12, difficulty: medium, type: text, prompt: "Translate: My number is 06 45 12 78 90. (Mon numéro, c'est le…)", accept: ["Mon numéro, c'est le 06 45 12 78 90.", "Mon numéro c'est le 06 45 12 78 90."] }
        - { id: fr-w15-d4-g13, difficulty: medium, type: mcq, prompt: "Calling a hotel: I'd like to book a room.", choices: ["Je voudrais réserver une chambre.", "Je veux booker une salle.", "Je voudrais une réservation pièce.", "Je réserve chambre."], answer: 0 }
        - { id: fr-w15-d4-g14, difficulty: medium, type: text, prompt: "Translate: You've got the wrong number.", accept: ["Vous avez fait un faux numéro.", "Vous avez fait un faux numéro"] }
        - { id: fr-w15-d4-g15, difficulty: medium, type: mcq, prompt: "Answering formally", choices: ["Allô, Société Durand, bonjour !", "Ouais ?", "Allô, c'est qui ?", "Quoi ?"], answer: 0 }
