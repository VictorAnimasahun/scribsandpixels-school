# French · Week 16 quizzes. Format and rules: src/content/QUIZZES.md
week: 16
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 15 review"
      covers: "Week 15: big numbers and money, lire/écrire/dire, work words, the phone, formal emails, job ads"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w16-d1-g01, difficulty: easy, type: mcq, prompt: "200", choices: ["deux cents", "deux cent", "deux-cents", "deux centes"], answer: 0 }
        - { id: fr-w16-d1-g02, difficulty: easy, type: mcq, prompt: "1 000", choices: ["mille", "milles", "un mille", "mil"], answer: 0 }
        - { id: fr-w16-d1-g03, difficulty: easy, type: truefalse, prompt: "« vous dites » is irregular, like « faites ».", answer: true }
        - { id: fr-w16-d1-g04, difficulty: easy, type: mcq, prompt: "Hold the line.", choices: ["Ne quittez pas.", "Raccrochez.", "Rappelez.", "Allô."], answer: 0 }
        - { id: fr-w16-d1-g05, difficulty: easy, type: mcq, prompt: "Formal sign-off", choices: ["Cordialement,", "Bises,", "À plus,", "Bisous,"], answer: 0 }
        - { id: fr-w16-d1-g06, difficulty: easy, type: mcq, prompt: "un CDI", choices: ["permanent contract", "fixed-term contract", "internship", "CD"], answer: 0 }
        - { id: fr-w16-d1-g07, difficulty: medium, type: text, prompt: "In words: 280", accept: ["deux cent quatre-vingts"] }
        - { id: fr-w16-d1-g08, difficulty: medium, type: text, prompt: "nous ___ (écrire)", accept: ["écrivons"] }
        - { id: fr-w16-d1-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["C'est de la part de qui ?", "Who's calling?"], ["Ne quittez pas.", "Hold the line."], ["Vous trouverez ci-joint…", "Please find attached…"], ["la lettre de motivation", "cover letter"]] }
        - { id: fr-w16-d1-g10, difficulty: medium, type: text, prompt: "In words: 2026", accept: ["deux mille vingt-six"] }
        - { id: fr-w16-d1-g11, difficulty: medium, type: truefalse, prompt: "French writes €1,500.50 as 1 500,50 €.", answer: true }
        - { id: fr-w16-d1-g12, difficulty: medium, type: text, prompt: "Translate: Can you call me back? (vous, inverted)", accept: ["Pouvez-vous me rappeler ?", "Pouvez-vous me rappeler?"] }
        - { id: fr-w16-d1-g13, difficulty: medium, type: mcq, prompt: "Greeting to an unknown recipient", choices: ["Madame, Monsieur,", "Salut,", "Coucou,", "Cher ami,"], answer: 0 }
        - { id: fr-w16-d1-g14, difficulty: medium, type: text, prompt: "ils ___ (dire)", accept: ["disent"] }
        - { id: fr-w16-d1-g15, difficulty: medium, type: mcq, prompt: "temps partiel", choices: ["part time", "full time", "overtime", "free time"], answer: 0 }
        - { id: fr-w16-d1-g16, difficulty: hard, type: text, prompt: "Translate: I am writing to you about the assistant job. (au sujet du poste d'assistant)", accept: ["Je vous écris au sujet du poste d'assistant.", "Je vous écris au sujet du poste d'assistant"] }
        - { id: fr-w16-d1-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Il gagne trois milles euros et vous disez merci. »", choices: ["mille … dites", "Only milles", "Only disez", "No error"], answer: 0 }
        - { id: fr-w16-d1-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["deux cent mille", "quatre cents", "Elle lit le rapport.", "trois cents dix"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "The body"
        secondsPerQuestion: 6
        questions:
          - { id: fr-w16-d1-rf01, difficulty: easy, type: mcq, prompt: "la tête", choices: ["head", "throat", "chest", "tooth"], answer: 0 }
          - { id: fr-w16-d1-rf02, difficulty: easy, type: mcq, prompt: "la gorge", choices: ["throat", "gorge", "neck", "mouth"], answer: 0 }
          - { id: fr-w16-d1-rf03, difficulty: easy, type: mcq, prompt: "le dos", choices: ["back", "two", "belly", "finger"], answer: 0 }
          - { id: fr-w16-d1-rf04, difficulty: easy, type: mcq, prompt: "le ventre", choices: ["stomach/belly", "wind", "vein", "chest"], answer: 0 }
          - { id: fr-w16-d1-rf05, difficulty: easy, type: mcq, prompt: "la jambe", choices: ["leg", "ham", "foot", "arm"], answer: 0 }
          - { id: fr-w16-d1-rf06, difficulty: easy, type: mcq, prompt: "le genou", choices: ["knee", "elbow", "ankle", "chin"], answer: 0 }
          - { id: fr-w16-d1-rf07, difficulty: easy, type: mcq, prompt: "l'épaule", choices: ["shoulder", "elbow", "hip", "spine"], answer: 0 }
          - { id: fr-w16-d1-rf08, difficulty: easy, type: mcq, prompt: "le cœur", choices: ["heart", "chorus", "core muscle", "lung"], answer: 0 }
          - { id: fr-w16-d1-rf09, difficulty: easy, type: mcq, prompt: "un œil → plural", choices: ["des yeux", "des œils", "des œuils", "des yeuxs"], answer: 0 }
          - { id: fr-w16-d1-rf10, difficulty: easy, type: mcq, prompt: "le doigt", choices: ["finger", "toe only", "nail", "dog"], answer: 0 }
          - { id: fr-w16-d1-rf11, difficulty: easy, type: mcq, prompt: "la poitrine", choices: ["chest", "stomach", "throat", "poitrine bread"], answer: 0 }
      - kind: brain-teaser
        title: "Le, la, les for the body"
        questions:
          - { id: fr-w16-d1-bt01, difficulty: medium, type: text, prompt: "Translate: I brush my teeth.", accept: ["Je me brosse les dents.", "Je me brosse les dents"] }
          - { id: fr-w16-d1-bt02, difficulty: medium, type: text, prompt: "Translate: He washes his hands.", accept: ["Il se lave les mains.", "Il se lave les mains"] }
          - { id: fr-w16-d1-bt03, difficulty: medium, type: mcq, prompt: "Close your eyes! (vous)", choices: ["Fermez les yeux !", "Fermez vos yeux !", "Fermez les œils !", "Fermer les yeux !"], answer: 0 }
          - { id: fr-w16-d1-bt04, difficulty: hard, type: mcq, prompt: "Why « Je me brosse les dents » and not « mes dents »?", choices: ["The reflexive already shows whose; French uses le/la/les", "Random", "mes is rude", "dents is masculine"], answer: 0 }
          - { id: fr-w16-d1-bt05, difficulty: hard, type: mcq, prompt: "Spot the error: « Levez votre bras et touchez votre tête ! »", choices: ["French prefers le bras / la tête", "Levez → Lever", "touchez → touche", "No error at all, it's more natural"], answer: 0 }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: the body"
      covers: "Week 16 · Day 1: body parts, œil/yeux, le/la/les with your own body"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w16-d2-g01, difficulty: easy, type: mcq, prompt: "nose", choices: ["le nez", "la bouche", "l'oreille", "le cou"], answer: 0 }
        - { id: fr-w16-d2-g02, difficulty: easy, type: mcq, prompt: "hand", choices: ["la main", "le bras", "le pied", "le doigt"], answer: 0 }
        - { id: fr-w16-d2-g03, difficulty: easy, type: truefalse, prompt: "The plural of « œil » is « yeux ».", answer: true }
        - { id: fr-w16-d2-g04, difficulty: easy, type: mcq, prompt: "ear", choices: ["l'oreille", "l'œil", "l'épaule", "le cou"], answer: 0 }
        - { id: fr-w16-d2-g05, difficulty: easy, type: mcq, prompt: "foot", choices: ["le pied", "la jambe", "le genou", "la main"], answer: 0 }
        - { id: fr-w16-d2-g06, difficulty: easy, type: mcq, prompt: "teeth", choices: ["les dents", "les doigts", "les yeux", "la bouche"], answer: 0 }
        - { id: fr-w16-d2-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["le cou", "neck"], ["l'estomac", "stomach (organ)"], ["le bras", "arm"], ["la bouche", "mouth"]] }
        - { id: fr-w16-d2-g08, difficulty: medium, type: text, prompt: "Translate: the eyes", accept: ["les yeux"] }
        - { id: fr-w16-d2-g09, difficulty: medium, type: text, prompt: "Translate: She brushes her hair. (se brosser les cheveux)", accept: ["Elle se brosse les cheveux.", "Elle se brosse les cheveux"] }
        - { id: fr-w16-d2-g10, difficulty: medium, type: mcq, prompt: "Raise your arm! (vous)", choices: ["Levez le bras !", "Levez votre bras !", "Lève le bras !", "Lever le bras !"], answer: 0 }
        - { id: fr-w16-d2-g11, difficulty: medium, type: truefalse, prompt: "« l'épaule » is feminine.", answer: true }
        - { id: fr-w16-d2-g12, difficulty: medium, type: text, prompt: "Translate: the knee", accept: ["le genou"] }
        - { id: fr-w16-d2-g13, difficulty: medium, type: mcq, prompt: "Simon says", choices: ["Jacques a dit", "Simon dit", "Pierre a dit", "Jacques dit-il"], answer: 0 }
        - { id: fr-w16-d2-g14, difficulty: medium, type: text, prompt: "Translate: the shoulders", accept: ["les épaules"] }
        - { id: fr-w16-d2-g15, difficulty: medium, type: order, prompt: "Order top to bottom.", items: ["la tête", "le cou", "la poitrine", "le ventre", "le genou", "le pied"] }
        - { id: fr-w16-d2-g16, difficulty: hard, type: text, prompt: "Translate: I wash my face and I brush my teeth. (le visage)", accept: ["Je me lave le visage et je me brosse les dents.", "Je me lave le visage et je me brosse les dents"] }
        - { id: fr-w16-d2-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Il a deux œils bleus. »", choices: ["œils → yeux", "bleus → bleu", "deux → des", "No error"], answer: 0 }
        - { id: fr-w16-d2-g18, difficulty: hard, type: multi, prompt: "Which are masculine? (Select all.)", choices: ["le dos", "le ventre", "le pied", "la gorge"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Avoir mal à"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w16-d2-rf01, difficulty: easy, type: mcq, prompt: "I have a headache.", choices: ["J'ai mal à la tête.", "J'ai mal au tête.", "Je suis mal à la tête.", "J'ai la tête mal."], answer: 0 }
          - { id: fr-w16-d2-rf02, difficulty: easy, type: mcq, prompt: "J'ai mal ___ dos.", choices: ["au", "à la", "aux", "à l'"], answer: 0 }
          - { id: fr-w16-d2-rf03, difficulty: easy, type: mcq, prompt: "J'ai mal ___ dents.", choices: ["aux", "au", "à la", "des"], answer: 0 }
          - { id: fr-w16-d2-rf04, difficulty: easy, type: mcq, prompt: "J'ai mal ___ oreille.", choices: ["à l'", "au", "à la", "aux"], answer: 0 }
          - { id: fr-w16-d2-rf05, difficulty: easy, type: mcq, prompt: "I have a fever.", choices: ["J'ai de la fièvre.", "Je suis fièvre.", "J'ai fièvre la.", "Je fais de la fièvre."], answer: 0 }
          - { id: fr-w16-d2-rf06, difficulty: easy, type: mcq, prompt: "Je tousse.", choices: ["I'm coughing.", "I'm sneezing.", "I'm touching.", "I'm tired."], answer: 0 }
          - { id: fr-w16-d2-rf07, difficulty: easy, type: mcq, prompt: "le paludisme", choices: ["malaria", "flu", "cold", "typhoid"], answer: 0 }
          - { id: fr-w16-d2-rf08, difficulty: easy, type: mcq, prompt: "J'ai des vertiges.", choices: ["I feel dizzy.", "I have vertigo of heights only.", "I have green spots.", "I'm thirsty."], answer: 0 }
          - { id: fr-w16-d2-rf09, difficulty: easy, type: mcq, prompt: "Where does it hurt? (vous)", choices: ["Où avez-vous mal ?", "Où êtes-vous mal ?", "Vous avez mal où-t-il ?", "Où mal ?"], answer: 0 }
          - { id: fr-w16-d2-rf10, difficulty: easy, type: mcq, prompt: "un rhume", choices: ["a cold", "rum", "the flu", "a rash"], answer: 0 }
      - kind: brain-teaser
        title: "Where does it hurt?"
        questions:
          - { id: fr-w16-d2-bt01, difficulty: medium, type: text, prompt: "J'ai mal ___ gorge.", accept: ["à la"] }
          - { id: fr-w16-d2-bt02, difficulty: medium, type: text, prompt: "Nous avons mal ___ jambes.", accept: ["aux"] }
          - { id: fr-w16-d2-bt03, difficulty: medium, type: text, prompt: "Tu as mal ___ estomac ?", accept: ["à l'"] }
          - { id: fr-w16-d2-bt04, difficulty: hard, type: text, prompt: "Translate: I have a runny nose and I'm coughing.", accept: ["J'ai le nez qui coule et je tousse.", "J'ai le nez qui coule et je tousse"] }
          - { id: fr-w16-d2-bt05, difficulty: hard, type: text, prompt: "Translate: I'm allergic to penicillin.", accept: ["Je suis allergique à la pénicilline.", "Je suis allergique à la pénicilline"] }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: avoir mal à + symptoms"
      covers: "Week 16 · Day 2: avoir mal à + au/à la/à l'/aux, fever, cough, cold/flu, malaria, nausea, allergies"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w16-d3-g01, difficulty: easy, type: mcq, prompt: "Il a mal ___ genou.", choices: ["au", "à la", "aux", "à l'"], answer: 0 }
        - { id: fr-w16-d3-g02, difficulty: easy, type: mcq, prompt: "Elle a mal ___ yeux.", choices: ["aux", "au", "à la", "à l'"], answer: 0 }
        - { id: fr-w16-d3-g03, difficulty: easy, type: truefalse, prompt: "« J'ai mal au ventre » = I have a stomach ache.", answer: true }
        - { id: fr-w16-d3-g04, difficulty: easy, type: mcq, prompt: "I'm ill.", choices: ["Je suis malade.", "J'ai malade.", "Je suis mal.", "J'ai maladie."], answer: 0 }
        - { id: fr-w16-d3-g05, difficulty: easy, type: mcq, prompt: "la grippe", choices: ["the flu", "a grip", "a cold", "a cramp"], answer: 0 }
        - { id: fr-w16-d3-g06, difficulty: easy, type: mcq, prompt: "Ça fait mal !", choices: ["It hurts!", "It's bad!", "It's done!", "Do it badly!"], answer: 0 }
        - { id: fr-w16-d3-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["à + le", "au"], ["à + la", "à la"], ["à + l'", "à l'"], ["à + les", "aux"]] }
        - { id: fr-w16-d3-g08, difficulty: medium, type: text, prompt: "Translate: I have a sore throat.", accept: ["J'ai mal à la gorge.", "J'ai mal à la gorge"] }
        - { id: fr-w16-d3-g09, difficulty: medium, type: text, prompt: "Translate: My feet hurt.", accept: ["J'ai mal aux pieds.", "J'ai mal aux pieds"] }
        - { id: fr-w16-d3-g10, difficulty: medium, type: mcq, prompt: "I feel sick (nausea).", choices: ["J'ai des nausées.", "Je suis nausée.", "J'ai nausée.", "Je fais nausées."], answer: 0 }
        - { id: fr-w16-d3-g11, difficulty: medium, type: truefalse, prompt: "« J'ai mal à le dos » is correct.", answer: false }
        - { id: fr-w16-d3-g12, difficulty: medium, type: text, prompt: "Translate: I have malaria. (le palu or le paludisme)", accept: ["J'ai le paludisme.", "J'ai le palu.", "J'ai le paludisme", "J'ai le palu"] }
        - { id: fr-w16-d3-g13, difficulty: medium, type: mcq, prompt: "I've cut myself. (fixed phrase)", choices: ["Je me suis coupé(e).", "Je me coupe hier.", "J'ai coupé moi.", "Je suis coupe."], answer: 0 }
        - { id: fr-w16-d3-g14, difficulty: medium, type: text, prompt: "Translate: I'm very tired.", accept: ["Je suis très fatigué.", "Je suis très fatiguée.", "Je suis très fatigué(e)."] }
        - { id: fr-w16-d3-g15, difficulty: medium, type: mcq, prompt: "J'ai envie de vomir.", choices: ["I feel like throwing up.", "I want to vote.", "I envy vomit.", "I'm hungry."], answer: 0 }
        - { id: fr-w16-d3-g16, difficulty: hard, type: text, prompt: "Translate: I have a headache, a fever and I feel dizzy.", accept: ["J'ai mal à la tête, de la fièvre et des vertiges.", "J'ai mal à la tête, j'ai de la fièvre et j'ai des vertiges.", "J'ai mal à la tête, de la fièvre et j'ai des vertiges."] }
        - { id: fr-w16-d3-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « J'ai mal à les dents et au tête. »", choices: ["aux dents … à la tête", "Only les dents", "Only au tête", "No error"], answer: 0 }
        - { id: fr-w16-d3-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["J'ai mal à l'épaule.", "Il a mal aux oreilles.", "Nous avons mal au cœur.", "Tu as mal à la dos."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Advice"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w16-d3-rf01, difficulty: easy, type: mcq, prompt: "You must drink lots of water. (general)", choices: ["Il faut boire beaucoup d'eau.", "Il faut boit beaucoup d'eau.", "Il faut de boire beaucoup.", "Faut eau."], answer: 0 }
          - { id: fr-w16-d3-rf02, difficulty: easy, type: mcq, prompt: "You mustn't smoke.", choices: ["Il ne faut pas fumer.", "Il faut ne fumer pas.", "Il ne faut fumer pas.", "Pas il faut fumer."], answer: 0 }
          - { id: fr-w16-d3-rf03, difficulty: easy, type: mcq, prompt: "Rest! (tu)", choices: ["Repose-toi !", "Te repose !", "Repose-te !", "Reposes-toi !"], answer: 0 }
          - { id: fr-w16-d3-rf04, difficulty: easy, type: mcq, prompt: "Rest! (vous)", choices: ["Reposez-vous !", "Vous reposez !", "Reposez-toi !", "Repose-vous !"], answer: 0 }
          - { id: fr-w16-d3-rf05, difficulty: easy, type: mcq, prompt: "Don't go to bed late! (tu)", choices: ["Ne te couche pas tard !", "Ne couche-toi pas tard !", "Couche-toi pas tard !", "Ne toi couche pas !"], answer: 0 }
          - { id: fr-w16-d3-rf06, difficulty: easy, type: mcq, prompt: "Hurry up! (tu)", choices: ["Dépêche-toi !", "Te dépêche !", "Dépêches-toi !", "Dépêche-te !"], answer: 0 }
          - { id: fr-w16-d3-rf07, difficulty: easy, type: mcq, prompt: "Stay in bed! (tu)", choices: ["Reste au lit !", "Restes au lit !", "Rester au lit !", "Reste à lit !"], answer: 0 }
          - { id: fr-w16-d3-rf08, difficulty: easy, type: mcq, prompt: "You (vous) must take this medicine.", choices: ["Vous devez prendre ce médicament.", "Vous devez prenez ce médicament.", "Vous dois prendre…", "Il faut vous prend…"], answer: 0 }
          - { id: fr-w16-d3-rf09, difficulty: easy, type: mcq, prompt: "manger léger", choices: ["eat light", "eat lightly coloured food", "eat fast", "eat late"], answer: 0 }
          - { id: fr-w16-d3-rf10, difficulty: easy, type: truefalse, prompt: "In the reflexive imperative, te becomes toi after the verb.", answer: true }
      - kind: brain-teaser
        title: "Doctor's orders"
        questions:
          - { id: fr-w16-d3-bt01, difficulty: medium, type: text, prompt: "Advice with il faut for « J'ai de la fièvre » : (drink lots of water)", accept: ["Il faut boire beaucoup d'eau.", "Il faut boire beaucoup d'eau"] }
          - { id: fr-w16-d3-bt02, difficulty: medium, type: text, prompt: "Imperative (tu): Go to the doctor!", accept: ["Va chez le médecin !", "Va chez le médecin!"] }
          - { id: fr-w16-d3-bt03, difficulty: medium, type: text, prompt: "Translate: You (tu) must rest.", accept: ["Tu dois te reposer.", "Tu dois te reposer"] }
          - { id: fr-w16-d3-bt04, difficulty: hard, type: text, prompt: "Negative imperative (vous): Don't get up!", accept: ["Ne vous levez pas !", "Ne vous levez pas!"] }
          - { id: fr-w16-d3-bt05, difficulty: hard, type: mcq, prompt: "Spot the error: « Repose-te et bois de l'eau ! »", choices: ["Repose-toi", "bois → boit", "de l'eau → du eau", "No error"], answer: 0 }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: giving advice"
      covers: "Week 16 · Day 3: il faut / il ne faut pas, devoir + infinitive, imperatives including reflexives (repose-toi)"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w16-d4-g01, difficulty: easy, type: mcq, prompt: "Il faut + …", choices: ["infinitive", "past participle", "conjugated verb", "noun only"], answer: 0 }
        - { id: fr-w16-d4-g02, difficulty: easy, type: mcq, prompt: "Get up! (tu)", choices: ["Lève-toi !", "Te lève !", "Lèves-toi !", "Lève-te !"], answer: 0 }
        - { id: fr-w16-d4-g03, difficulty: easy, type: truefalse, prompt: "« Il ne faut pas fumer » means you mustn't smoke.", answer: true }
        - { id: fr-w16-d4-g04, difficulty: easy, type: mcq, prompt: "Drink water! (vous)", choices: ["Buvez de l'eau !", "Boivez de l'eau !", "Buvez du eau !", "Boire de l'eau !"], answer: 0 }
        - { id: fr-w16-d4-g05, difficulty: easy, type: mcq, prompt: "se reposer", choices: ["to rest", "to repose a question", "to sleep only", "to reply"], answer: 0 }
        - { id: fr-w16-d4-g06, difficulty: easy, type: mcq, prompt: "stop smoking", choices: ["arrêter de fumer", "arrêter fumer", "stopper à fumer", "finir fumer"], answer: 0 }
        - { id: fr-w16-d4-g07, difficulty: medium, type: match, prompt: "Match the structure.", pairs: [["Il faut se reposer.", "general advice"], ["Tu dois te reposer.", "personal advice"], ["Repose-toi !", "imperative"], ["Il ne faut pas fumer.", "prohibition"]] }
        - { id: fr-w16-d4-g08, difficulty: medium, type: text, prompt: "Imperative (vous) of se coucher", accept: ["Couchez-vous !", "Couchez-vous", "couchez-vous"] }
        - { id: fr-w16-d4-g09, difficulty: medium, type: text, prompt: "Translate: You must sleep eight hours. (il faut)", accept: ["Il faut dormir huit heures.", "Il faut dormir huit heures"] }
        - { id: fr-w16-d4-g10, difficulty: medium, type: mcq, prompt: "Negative of « Repose-toi ! »", choices: ["Ne te repose pas !", "Ne repose-toi pas !", "Repose-toi pas !", "Ne toi repose pas !"], answer: 0 }
        - { id: fr-w16-d4-g11, difficulty: medium, type: truefalse, prompt: "« Repose-te ! » is correct.", answer: false }
        - { id: fr-w16-d4-g12, difficulty: medium, type: text, prompt: "Translate: You (vous) must take medicine.", accept: ["Vous devez prendre des médicaments.", "Vous devez prendre des médicaments", "Vous devez prendre un médicament."] }
