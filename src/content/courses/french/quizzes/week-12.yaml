# French · Week 12 quizzes. Format and rules: src/content/QUIZZES.md
week: 12
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 11 review"
      covers: "Week 11: appearance, personality and irregular feminines, nuance words, c'est vs il/elle est, portraits"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w12-d1-g01, difficulty: easy, type: mcq, prompt: "Hair and eyes use…", choices: ["avoir", "être", "faire", "porter"], answer: 0 }
        - { id: fr-w12-d1-g02, difficulty: easy, type: mcq, prompt: "généreux (fem.)", choices: ["généreuse", "généreuxe", "généreux", "généreusse"], answer: 0 }
        - { id: fr-w12-d1-g03, difficulty: easy, type: truefalse, prompt: "« trop » means too (negative); « très » means very.", answer: true }
        - { id: fr-w12-d1-g04, difficulty: easy, type: mcq, prompt: "___ mon frère.", choices: ["C'est", "Il est"], answer: 0 }
        - { id: fr-w12-d1-g05, difficulty: easy, type: mcq, prompt: "___ médecin. (Kofi)", choices: ["Il est", "C'est"], answer: 0 }
        - { id: fr-w12-d1-g06, difficulty: easy, type: mcq, prompt: "têtu", choices: ["stubborn", "shy", "chatty", "polite"], answer: 0 }
        - { id: fr-w12-d1-g07, difficulty: medium, type: text, prompt: "travailleur (fem.)", accept: ["travailleuse"] }
        - { id: fr-w12-d1-g08, difficulty: medium, type: text, prompt: "Translate: She has long hair and brown eyes.", accept: ["Elle a les cheveux longs et les yeux marron.", "Elle a les cheveux longs et les yeux marron"] }
        - { id: fr-w12-d1-g09, difficulty: medium, type: match, prompt: "Match the opposites.", pairs: [["généreux", "égoïste"], ["travailleur", "paresseux"], ["poli", "impoli"], ["calme", "nerveux"]] }
        - { id: fr-w12-d1-g10, difficulty: medium, type: text, prompt: "Translate: He's a good engineer.", accept: ["C'est un bon ingénieur.", "C'est un bon ingénieur"] }
        - { id: fr-w12-d1-g11, difficulty: medium, type: truefalse, prompt: "« Il est un médecin » is correct.", answer: false }
        - { id: fr-w12-d1-g12, difficulty: medium, type: text, prompt: "créateur (fem.)", accept: ["créatrice"] }
        - { id: fr-w12-d1-g13, difficulty: medium, type: mcq, prompt: "Diplomatic for « Il est méchant »", choices: ["Il n'est pas très sympa.", "Il est trop méchant.", "Il est un peu gentil.", "Il est méchant, voilà."], answer: 0 }
        - { id: fr-w12-d1-g14, difficulty: medium, type: text, prompt: "Translate: She is a bit stubborn.", accept: ["Elle est un peu têtue.", "Elle est un peu têtue"] }
        - { id: fr-w12-d1-g15, difficulty: medium, type: mcq, prompt: "Paris ? ___ magnifique !", choices: ["C'est", "Il est"], answer: 0 }
        - { id: fr-w12-d1-g16, difficulty: hard, type: text, prompt: "Translate: My sister is a nurse. She's very generous, but a bit impatient.", accept: ["Ma sœur est infirmière. Elle est très généreuse, mais un peu impatiente.", "Ma sœur est infirmière. Elle est très généreuse mais un peu impatiente."] }
        - { id: fr-w12-d1-g17, difficulty: hard, type: mcq, prompt: "Find the sentence with NO mistake.", choices: ["C'est une personne formidable.", "Elle a très grande.", "Il est un professeur.", "Elle est les yeux verts."], answer: 0 }
        - { id: fr-w12-d1-g18, difficulty: hard, type: multi, prompt: "Which feminine forms are correct? (Select all.)", choices: ["sportive", "naturelle", "douce", "fiere"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Futur proche"
        secondsPerQuestion: 8
        questions:
          - { id: fr-w12-d1-rf01, difficulty: easy, type: mcq, prompt: "I'm going to eat.", choices: ["Je vais manger.", "Je viens de manger.", "Je mange.", "Je vais mangé."], answer: 0 }
          - { id: fr-w12-d1-rf02, difficulty: easy, type: mcq, prompt: "We're going to travel.", choices: ["Nous allons voyager.", "Nous allez voyager.", "Nous vont voyager.", "Nous allons voyagé."], answer: 0 }
          - { id: fr-w12-d1-rf03, difficulty: easy, type: mcq, prompt: "They're going to work.", choices: ["Ils vont travailler.", "Ils vont travaillent.", "Ils allons travailler.", "Ils va travailler."], answer: 0 }
          - { id: fr-w12-d1-rf04, difficulty: easy, type: mcq, prompt: "futur proche =", choices: ["aller + infinitive", "venir de + infinitive", "être + participle", "avoir + infinitive"], answer: 0 }
          - { id: fr-w12-d1-rf05, difficulty: easy, type: mcq, prompt: "Negative: I'm not going to work.", choices: ["Je ne vais pas travailler.", "Je vais ne pas travailler.", "Je ne vais travailler pas.", "Je vais pas ne travailler."], answer: 0 }
          - { id: fr-w12-d1-rf06, difficulty: easy, type: mcq, prompt: "demain", choices: ["tomorrow", "tonight", "soon", "the day after"], answer: 0 }
          - { id: fr-w12-d1-rf07, difficulty: easy, type: mcq, prompt: "la semaine prochaine", choices: ["next week", "last week", "this week", "every week"], answer: 0 }
          - { id: fr-w12-d1-rf08, difficulty: easy, type: mcq, prompt: "bientôt", choices: ["soon", "well", "early", "late"], answer: 0 }
          - { id: fr-w12-d1-rf09, difficulty: easy, type: mcq, prompt: "dans deux jours", choices: ["in two days", "two days ago", "for two days", "every two days"], answer: 0 }
          - { id: fr-w12-d1-rf10, difficulty: easy, type: mcq, prompt: "après-demain", choices: ["the day after tomorrow", "after lunch", "yesterday", "later today"], answer: 0 }
          - { id: fr-w12-d1-rf11, difficulty: easy, type: mcq, prompt: "ce soir", choices: ["tonight", "this morning", "tomorrow", "this year"], answer: 0 }
      - kind: brain-teaser
        title: "Going to…"
        questions:
          - { id: fr-w12-d1-bt01, difficulty: medium, type: text, prompt: "Futur proche: Tu te couches tard.", accept: ["Tu vas te coucher tard.", "Tu vas te coucher tard"] }
          - { id: fr-w12-d1-bt02, difficulty: medium, type: text, prompt: "Futur proche: Elle n'achète pas de voiture.", accept: ["Elle ne va pas acheter de voiture.", "Elle ne va pas acheter de voiture"] }
          - { id: fr-w12-d1-bt03, difficulty: medium, type: text, prompt: "Futur proche: Ils font les courses.", accept: ["Ils vont faire les courses.", "Ils vont faire les courses"] }
          - { id: fr-w12-d1-bt04, difficulty: hard, type: text, prompt: "Futur proche of se lever for nous, negative.", accept: ["Nous n'allons pas nous lever.", "Nous n'allons pas nous lever"] }
          - { id: fr-w12-d1-bt05, difficulty: hard, type: mcq, prompt: "Spot the error: « Ils vont se marier et nous allons les aider demain. Je vais me couche tôt. »", choices: ["me couche → me coucher", "se marier → marier", "les aider → aider les", "No error"], answer: 0 }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: futur proche"
      covers: "Week 12 · Day 1: aller + infinitive, reflexives, negation around aller, future time markers"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w12-d2-g01, difficulty: easy, type: text, prompt: "Je ___ travailler. (aller)", accept: ["vais"] }
        - { id: fr-w12-d2-g02, difficulty: easy, type: text, prompt: "Vous ___ partir. (aller)", accept: ["allez"] }
        - { id: fr-w12-d2-g03, difficulty: easy, type: truefalse, prompt: "In the futur proche, the second verb stays in the infinitive.", answer: true }
        - { id: fr-w12-d2-g04, difficulty: easy, type: mcq, prompt: "next year", choices: ["l'année prochaine", "l'année dernière", "cette année", "un an"], answer: 0 }
        - { id: fr-w12-d2-g05, difficulty: easy, type: mcq, prompt: "this weekend", choices: ["ce week-end", "le week-end dernier", "chaque week-end", "un week-end"], answer: 0 }
        - { id: fr-w12-d2-g06, difficulty: easy, type: text, prompt: "Ils ___ voyager. (aller)", accept: ["vont"] }
        - { id: fr-w12-d2-g07, difficulty: medium, type: text, prompt: "Futur proche: Nous partons à Abuja.", accept: ["Nous allons partir à Abuja.", "Nous allons partir à Abuja"] }
        - { id: fr-w12-d2-g08, difficulty: medium, type: text, prompt: "Translate: I'm not going to work tomorrow.", accept: ["Je ne vais pas travailler demain.", "Je ne vais pas travailler demain"] }
        - { id: fr-w12-d2-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["ce soir", "tonight"], ["le mois prochain", "next month"], ["un jour", "one day"], ["dans deux jours", "in two days"]] }
        - { id: fr-w12-d2-g10, difficulty: medium, type: mcq, prompt: "They're going to get married.", choices: ["Ils vont se marier.", "Ils se vont marier.", "Ils vont marier se.", "Ils vont se mariés."], answer: 0 }
        - { id: fr-w12-d2-g11, difficulty: medium, type: truefalse, prompt: "In « Je vais me lever », the reflexive pronoun goes with the infinitive.", answer: true }
        - { id: fr-w12-d2-g12, difficulty: medium, type: text, prompt: "Translate: We're going to travel in December.", accept: ["Nous allons voyager en décembre.", "Nous allons voyager en décembre", "On va voyager en décembre."] }
        - { id: fr-w12-d2-g13, difficulty: medium, type: mcq, prompt: "She's not going to buy a car.", choices: ["Elle ne va pas acheter de voiture.", "Elle ne va pas acheter une voiture.", "Elle va ne pas acheter de voiture.", "Elle ne va acheter pas de voiture."], answer: 0 }
        - { id: fr-w12-d2-g14, difficulty: medium, type: text, prompt: "Translate: You (tu) are going to go to bed late.", accept: ["Tu vas te coucher tard.", "Tu vas te coucher tard"] }
        - { id: fr-w12-d2-g15, difficulty: medium, type: order, prompt: "Build: I'm not going to eat tonight.", items: ["Je", "ne", "vais", "pas", "manger", "ce soir"] }
        - { id: fr-w12-d2-g16, difficulty: hard, type: text, prompt: "Translate: Next week, my parents are going to visit Lagos.", accept: ["La semaine prochaine, mes parents vont visiter Lagos.", "La semaine prochaine mes parents vont visiter Lagos.", "La semaine prochaine, mes parents vont visiter Lagos"] }
        - { id: fr-w12-d2-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Demain, nous allons faisons les courses. »", choices: ["faisons → faire", "allons → allez", "Demain → Hier", "No error"], answer: 0 }
        - { id: fr-w12-d2-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["Je vais partir bientôt.", "Elle ne va pas venir.", "Nous allons nous reposer.", "Ils vont mangent."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Quel temps fait-il ?"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w12-d2-rf01, difficulty: easy, type: mcq, prompt: "It's nice weather.", choices: ["Il fait beau.", "Il est beau.", "Il a beau.", "C'est beau temps."], answer: 0 }
          - { id: fr-w12-d2-rf02, difficulty: easy, type: mcq, prompt: "It's raining.", choices: ["Il pleut.", "Il fait pluie.", "Il pleure.", "Il y a pleut."], answer: 0 }
          - { id: fr-w12-d2-rf03, difficulty: easy, type: mcq, prompt: "It's hot.", choices: ["Il fait chaud.", "Il est chaud.", "J'ai chaud.", "C'est chaud."], answer: 0 }
          - { id: fr-w12-d2-rf04, difficulty: easy, type: mcq, prompt: "It's windy.", choices: ["Il y a du vent.", "Il fait vent.", "Il vente beaucoup.", "Il est vent."], answer: 0 }
          - { id: fr-w12-d2-rf05, difficulty: easy, type: mcq, prompt: "It's snowing.", choices: ["Il neige.", "Il fait neige.", "Il y a neiger.", "Il est neige."], answer: 0 }
          - { id: fr-w12-d2-rf06, difficulty: easy, type: mcq, prompt: "un orage", choices: ["a storm", "an orange", "a cloud", "a rainbow"], answer: 0 }
          - { id: fr-w12-d2-rf07, difficulty: easy, type: mcq, prompt: "in spring", choices: ["au printemps", "en printemps", "à printemps", "dans printemps"], answer: 0 }
          - { id: fr-w12-d2-rf08, difficulty: easy, type: mcq, prompt: "in winter", choices: ["en hiver", "au hiver", "à l'hiver only", "dans hiver"], answer: 0 }
          - { id: fr-w12-d2-rf09, difficulty: easy, type: mcq, prompt: "Il fait doux.", choices: ["It's mild.", "It's sweet.", "It's cold.", "It's soft rain."], answer: 0 }
          - { id: fr-w12-d2-rf10, difficulty: easy, type: mcq, prompt: "It's going to rain.", choices: ["Il va pleuvoir.", "Il va pleut.", "Il vient de pleuvoir.", "Il pleuvra va."], answer: 0 }
      - kind: brain-teaser
        title: "La météo"
        questions:
          - { id: fr-w12-d2-bt01, difficulty: medium, type: text, prompt: "Translate: It's 30 degrees.", accept: ["Il fait 30 degrés.", "Il fait trente degrés.", "Il fait 30 degrés"] }
          - { id: fr-w12-d2-bt02, difficulty: medium, type: text, prompt: "Translate: Tomorrow, it's going to be hot.", accept: ["Demain, il va faire chaud.", "Demain il va faire chaud.", "Demain, il va faire chaud"] }
          - { id: fr-w12-d2-bt03, difficulty: medium, type: mcq, prompt: "Which season takes « au »?", choices: ["le printemps", "l'été", "l'automne", "l'hiver"], answer: 0 }
          - { id: fr-w12-d2-bt04, difficulty: hard, type: text, prompt: "Translate: In winter in Montréal, it's minus twenty!", accept: ["En hiver à Montréal, il fait moins vingt !", "En hiver à Montréal, il fait moins vingt!", "En hiver à Montréal il fait moins vingt !"] }
          - { id: fr-w12-d2-bt05, difficulty: hard, type: mcq, prompt: "Spot the error: « Il fait du soleil et il fait pluie. »", choices: ["Il y a du soleil … il pleut", "Only soleil", "Only pluie", "No error"], answer: 0 }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: weather and seasons"
      covers: "Week 12 · Day 2: il fait…, il pleut/neige, il y a du soleil/vent, seasons with au/en, future weather"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w12-d3-g01, difficulty: easy, type: mcq, prompt: "What's the weather like?", choices: ["Quel temps fait-il ?", "Quelle heure est-il ?", "Comment est le temps ?", "Il fait quoi ?"], answer: 0 }
        - { id: fr-w12-d3-g02, difficulty: easy, type: mcq, prompt: "It's cold.", choices: ["Il fait froid.", "Il est froid.", "Il a froid.", "C'est froid temps."], answer: 0 }
        - { id: fr-w12-d3-g03, difficulty: easy, type: truefalse, prompt: "« Il pleut » doesn't use faire.", answer: true }
        - { id: fr-w12-d3-g04, difficulty: easy, type: mcq, prompt: "in summer", choices: ["en été", "au été", "à l'été", "dans été"], answer: 0 }
        - { id: fr-w12-d3-g05, difficulty: easy, type: mcq, prompt: "It's cloudy.", choices: ["Il y a des nuages.", "Il fait nuages.", "Il nuage.", "Il est nuageux temps."], answer: 0 }
        - { id: fr-w12-d3-g06, difficulty: easy, type: mcq, prompt: "Il fait mauvais.", choices: ["The weather is bad.", "He's bad.", "It's evil.", "It's done badly."], answer: 0 }
        - { id: fr-w12-d3-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["la pluie", "rain"], ["la neige", "snow"], ["le vent", "wind"], ["le soleil", "sun"]] }
        - { id: fr-w12-d3-g08, difficulty: medium, type: text, prompt: "Translate: It's sunny.", accept: ["Il y a du soleil.", "Il y a du soleil", "Il fait soleil."] }
        - { id: fr-w12-d3-g09, difficulty: medium, type: text, prompt: "Translate: in autumn", accept: ["en automne"] }
        - { id: fr-w12-d3-g10, difficulty: medium, type: mcq, prompt: "the rainy season", choices: ["la saison des pluies", "la saison sèche", "l'harmattan", "le printemps"], answer: 0 }
        - { id: fr-w12-d3-g11, difficulty: medium, type: truefalse, prompt: "« Il fait frais » means it's cool.", answer: true }
        - { id: fr-w12-d3-g12, difficulty: medium, type: text, prompt: "Translate: It's going to snow.", accept: ["Il va neiger.", "Il va neiger"] }
        - { id: fr-w12-d3-g13, difficulty: medium, type: mcq, prompt: "The sky is grey.", choices: ["Le ciel est gris.", "Le ciel fait gris.", "Il y a gris ciel.", "Le ciel a gris."], answer: 0 }
        - { id: fr-w12-d3-g14, difficulty: medium, type: text, prompt: "Translate: There's a storm.", accept: ["Il y a un orage.", "Il y a un orage"] }
        - { id: fr-w12-d3-g15, difficulty: medium, type: mcq, prompt: "Lagos in the dry season: the dusty wind from the Sahara is…", choices: ["l'harmattan", "l'orage", "la neige", "le printemps"], answer: 0 }
        - { id: fr-w12-d3-g16, difficulty: hard, type: text, prompt: "Translate: Tomorrow in Lagos, it's going to rain and it's going to be 28 degrees.", accept: ["Demain à Lagos, il va pleuvoir et il va faire 28 degrés.", "Demain à Lagos il va pleuvoir et il va faire 28 degrés.", "Demain à Lagos, il va pleuvoir et il va faire vingt-huit degrés."] }
        - { id: fr-w12-d3-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « En printemps, il fait beau. »", choices: ["En printemps → Au printemps", "il fait → il est", "beau → belle", "No error"], answer: 0 }
        - { id: fr-w12-d3-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["Il fait chaud.", "Il pleut.", "Il y a du vent.", "Il fait neige."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Invitations"
        secondsPerQuestion: 8
        questions:
          - { id: fr-w12-d3-rf01, difficulty: easy, type: mcq, prompt: "Are you free on Saturday?", choices: ["Tu es libre samedi ?", "Tu es gratuit samedi ?", "Tu as libre samedi ?", "Tu libres samedi ?"], answer: 0 }
          - { id: fr-w12-d3-rf02, difficulty: easy, type: mcq, prompt: "Ça te dit d'aller au cinéma ?", choices: ["Do you fancy going to the cinema?", "Did you tell the cinema?", "Is the cinema open?", "You said cinema?"], answer: 0 }
          - { id: fr-w12-d3-rf03, difficulty: easy, type: mcq, prompt: "Volontiers !", choices: ["Gladly!", "Volunteers!", "Never!", "Maybe."], answer: 0 }
          - { id: fr-w12-d3-rf04, difficulty: easy, type: mcq, prompt: "Je suis pris(e).", choices: ["I'm busy.", "I'm caught.", "I'm taken to hospital.", "I'm ready."], answer: 0 }
          - { id: fr-w12-d3-rf05, difficulty: easy, type: mcq, prompt: "Sorry, I can't.", choices: ["Désolé(e), je ne peux pas.", "Pardon, je ne veux pas.", "Désolé, je n'ai pas.", "Excuse, je ne sais pas."], answer: 0 }
          - { id: fr-w12-d3-rf06, difficulty: easy, type: mcq, prompt: "Ça marche !", choices: ["Deal!", "It walks!", "It's broken!", "Let's walk!"], answer: 0 }
          - { id: fr-w12-d3-rf07, difficulty: easy, type: mcq, prompt: "Une autre fois, peut-être ?", choices: ["Another time, maybe?", "Another one, please?", "Once more?", "Maybe now?"], answer: 0 }
          - { id: fr-w12-d3-rf08, difficulty: easy, type: mcq, prompt: "Where shall we meet?", choices: ["On se retrouve où ?", "On se trouve quand ?", "Où tu vas ?", "On va où ?"], answer: 0 }
          - { id: fr-w12-d3-rf09, difficulty: easy, type: mcq, prompt: "je dois", choices: ["I must / I have to", "I owe nothing", "I can", "I want"], answer: 0 }
          - { id: fr-w12-d3-rf10, difficulty: easy, type: mcq, prompt: "Pourquoi pas !", choices: ["Why not!", "Why?", "Because!", "Not now!"], answer: 0 }
      - kind: brain-teaser
        title: "Say yes, say no"
        questions:
          - { id: fr-w12-d3-bt01, difficulty: medium, type: text, prompt: "Translate: Do you want to come to my birthday? (tu)", accept: ["Tu veux venir à mon anniversaire ?", "Tu veux venir à mon anniversaire?", "Est-ce que tu veux venir à mon anniversaire ?"] }
          - { id: fr-w12-d3-bt02, difficulty: medium, type: text, prompt: "Translate: Sorry, I have to work.", accept: ["Désolé, je dois travailler.", "Désolée, je dois travailler.", "Désolé(e), je dois travailler."] }
          - { id: fr-w12-d3-bt03, difficulty: medium, type: order, prompt: "Order the conversation.", items: ["Tu es libre samedi ?", "Oui, pourquoi ?", "Ça te dit d'aller au cinéma ?", "Bonne idée ! À quelle heure ?", "À 19 h, devant le cinéma.", "Ça marche ! À samedi !"] }
          - { id: fr-w12-d3-bt04, difficulty: hard, type: text, prompt: "Decline politely and propose another time: \"That's a shame, I'm busy. Another time, maybe?\"", accept: ["C'est dommage, je suis pris. Une autre fois, peut-être ?", "C'est dommage, je suis prise. Une autre fois, peut-être ?", "C'est dommage, je suis pris(e). Une autre fois, peut-être ?"] }
          - { id: fr-w12-d3-bt05, difficulty: hard, type: mcq, prompt: "Which is NOT a way to accept?", choices: ["Je suis pris(e).", "Avec plaisir !", "Volontiers !", "Bonne idée !"], answer: 0 }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: invitations"
      covers: "Week 12 · Day 3: inviting, accepting, declining, settling details, pouvoir/devoir previews"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w12-d4-g01, difficulty: easy, type: mcq, prompt: "Avec plaisir !", choices: ["With pleasure!", "No thanks!", "Please!", "Have fun!"], answer: 0 }
        - { id: fr-w12-d4-g02, difficulty: easy, type: mcq, prompt: "At what time?", choices: ["À quelle heure ?", "Quelle heure est-il ?", "Quand ?", "Combien de temps ?"], answer: 0 }
        - { id: fr-w12-d4-g03, difficulty: easy, type: truefalse, prompt: "« Je ne peux pas » means I can't.", answer: true }
        - { id: fr-w12-d4-g04, difficulty: easy, type: mcq, prompt: "See you Saturday!", choices: ["À samedi !", "Au samedi !", "Bon samedi !", "Samedi, au revoir !"], answer: 0 }
        - { id: fr-w12-d4-g05, difficulty: easy, type: mcq, prompt: "Good idea!", choices: ["Bonne idée !", "Bon idée !", "Belle idée !", "Idée bonne !"], answer: 0 }
        - { id: fr-w12-d4-g06, difficulty: easy, type: mcq, prompt: "Je t'invite à dîner.", choices: ["I'm inviting you to dinner (my treat).", "Invite me to dinner.", "You invite me.", "Dinner is cancelled."], answer: 0 }
        - { id: fr-w12-d4-g07, difficulty: medium, type: match, prompt: "Match: invite / accept / decline.", pairs: [["Tu es libre samedi ?", "invite"], ["Volontiers !", "accept"], ["Je suis prise.", "decline"], ["Ça marche !", "agree on details"]] }
