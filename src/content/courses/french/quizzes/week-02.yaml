# French · Week 2 quizzes. Format and rules: src/content/QUIZZES.md
week: 2
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 1 review"
      covers: "Week 1: greetings, tu/vous, alphabet and accents, je m'appelle, numbers 0–10, sounds, small talk"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w02-d1-g01, difficulty: easy, type: mcq, prompt: "You walk into a shop at 10 am. You say…", choices: ["Bonjour, Madame.", "Bonsoir.", "Salut !", "Au revoir."], answer: 0 }
        - { id: fr-w02-d1-g02, difficulty: easy, type: mcq, prompt: "Which \"you\" for your new manager?", choices: ["vous", "tu", "toi", "on"], answer: 0 }
        - { id: fr-w02-d1-g03, difficulty: easy, type: mcq, prompt: "Merci beaucoup ! — …", choices: ["De rien.", "Pardon.", "Salut.", "Enchanté."], answer: 0 }
        - { id: fr-w02-d1-g04, difficulty: easy, type: text, prompt: "Write 7 in French.", accept: ["sept"] }
        - { id: fr-w02-d1-g05, difficulty: easy, type: truefalse, prompt: "Salut is fine with friends but not with strangers.", answer: true }
        - { id: fr-w02-d1-g06, difficulty: easy, type: mcq, prompt: "My name is Tunde.", choices: ["Je m'appelle Tunde.", "Je suis appelle Tunde.", "Mon appelle Tunde.", "J'appelle Tunde."], answer: 0 }
        - { id: fr-w02-d1-g07, difficulty: medium, type: match, prompt: "Match the accent to its name.", pairs: [["é", "accent aigu"], ["è", "accent grave"], ["ê", "accent circonflexe"], ["ç", "cédille"]] }
        - { id: fr-w02-d1-g08, difficulty: medium, type: mcq, prompt: "Comment allez-vous ? — the best reply:", choices: ["Je vais bien, merci. Et vous ?", "Ça va. Et toi ?", "Je m'appelle bien.", "De rien."], answer: 0 }
        - { id: fr-w02-d1-g09, difficulty: medium, type: mcq, prompt: "You leave the office at 7 pm. You say to the guard…", choices: ["Bonne soirée !", "Bonjour !", "Bonne journée !", "Enchanté !"], answer: 0 }
        - { id: fr-w02-d1-g10, difficulty: medium, type: text, prompt: "Write the digits of \"zéro, huit, trois, neuf\".", accept: ["0839", "0 8 3 9"] }
        - { id: fr-w02-d1-g11, difficulty: medium, type: truefalse, prompt: "The final letters of \"Paris\" and \"petit\" are silent.", answer: true }
        - { id: fr-w02-d1-g12, difficulty: medium, type: mcq, prompt: "Which pair shows the u / ou difference?", choices: ["tu / tout", "bon / bonne", "il / elle", "vous / nous"], answer: 0 }
        - { id: fr-w02-d1-g13, difficulty: medium, type: mcq, prompt: "Someone holds the door for you. You say…", choices: ["Merci !", "De rien !", "Salut !", "Bonsoir !"], answer: 0 }
        - { id: fr-w02-d1-g14, difficulty: medium, type: order, prompt: "Order the formal exchange.", items: ["Bonjour, Madame. Comment allez-vous ?", "Très bien, merci. Et vous ?", "Je vais bien, merci.", "Au revoir, Madame. Bonne journée !"] }
        - { id: fr-w02-d1-g15, difficulty: medium, type: mcq, prompt: "\"Please\" to a friend:", choices: ["S'il te plaît", "S'il vous plaît", "Merci", "De rien"], answer: 0 }
        - { id: fr-w02-d1-g16, difficulty: hard, type: mcq, prompt: "What's wrong? A student says to an older stranger: « Salut ! Ça va ? Tu es Madame Leroy ? »", choices: ["Too familiar: use Bonjour, vous and Comment allez-vous", "Nothing", "Madame should be Monsieur", "Ça va must be Ça vais"], answer: 0 }
        - { id: fr-w02-d1-g17, difficulty: hard, type: text, prompt: "Spell \"ça\" letter by letter in French, as you would on the phone (name the letters and the accent).", accept: ["c cédille a", "c cedille a", "c cédille, a", "c-cédille-a"], explain: "The cédille makes c sound like s." }
        - { id: fr-w02-d1-g18, difficulty: hard, type: multi, prompt: "Which are polite in a French shop? (Select all.)", choices: ["Bonjour, Monsieur.", "S'il vous plaît.", "Merci, au revoir !", "Salut, toi !"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Être sprint"
        secondsPerQuestion: 8
        questions:
          - { id: fr-w02-d1-rf01, difficulty: easy, type: text, prompt: "je ___ (être)", accept: ["suis"] }
          - { id: fr-w02-d1-rf02, difficulty: easy, type: text, prompt: "tu ___ (être)", accept: ["es"] }
          - { id: fr-w02-d1-rf03, difficulty: easy, type: text, prompt: "il ___ (être)", accept: ["est"] }
          - { id: fr-w02-d1-rf04, difficulty: easy, type: text, prompt: "nous ___ (être)", accept: ["sommes"] }
          - { id: fr-w02-d1-rf05, difficulty: easy, type: text, prompt: "vous ___ (être)", accept: ["êtes"] }
          - { id: fr-w02-d1-rf06, difficulty: easy, type: text, prompt: "elles ___ (être)", accept: ["sont"] }
          - { id: fr-w02-d1-rf07, difficulty: easy, type: text, prompt: "on ___ (être)", accept: ["est"] }
          - { id: fr-w02-d1-rf08, difficulty: easy, type: mcq, prompt: "on, in everyday French, means…", choices: ["we", "one person only", "they (women)", "you"], answer: 0 }
          - { id: fr-w02-d1-rf09, difficulty: easy, type: mcq, prompt: "A group of 3 women and 1 man =", choices: ["ils", "elles", "on", "vous"], answer: 0 }
          - { id: fr-w02-d1-rf10, difficulty: easy, type: mcq, prompt: "A group of only women =", choices: ["elles", "ils", "nous", "on"], answer: 0 }
          - { id: fr-w02-d1-rf11, difficulty: easy, type: truefalse, prompt: "\"vous êtes\" has a liaison: voo-zet.", answer: true }
      - kind: brain-teaser
        title: "Who is it?"
        questions:
          - { id: fr-w02-d1-bt01, difficulty: medium, type: text, prompt: "Complete: Amina et moi, nous ___ à Abuja.", accept: ["sommes"] }
          - { id: fr-w02-d1-bt02, difficulty: medium, type: mcq, prompt: "Which is correct?", choices: ["On est à Lagos.", "On sommes à Lagos.", "On êtes à Lagos.", "On sont à Lagos."], answer: 0, explain: "on always takes the il form, even when it means \"we\"." }
          - { id: fr-w02-d1-bt03, difficulty: medium, type: match, prompt: "Match the subject to the verb.", pairs: [["Tu", "es prêt ?"], ["Vous", "êtes Monsieur Okafor ?"], ["Ils", "sont étudiants."], ["Nous", "sommes ici."]] }
          - { id: fr-w02-d1-bt04, difficulty: hard, type: text, prompt: "Translate: They (women) are here.", accept: ["Elles sont ici.", "Elles sont ici", "Elles sont là.", "Elles sont là"] }
          - { id: fr-w02-d1-bt05, difficulty: hard, type: mcq, prompt: "Why is there no liaison in \"ils sont\"?", choices: ["sont starts with a consonant", "ils is singular", "liaison only happens with être", "s is always silent"], answer: 0 }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: être and subject pronouns"
      covers: "Week 2 · Day 1: être in all persons, ils/elles, on = we, liaison"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w02-d2-g01, difficulty: easy, type: text, prompt: "Nous ___ à Abuja. (être)", accept: ["sommes"] }
        - { id: fr-w02-d2-g02, difficulty: easy, type: text, prompt: "Ils ___ étudiants. (être)", accept: ["sont"] }
        - { id: fr-w02-d2-g03, difficulty: easy, type: text, prompt: "Vous ___ Monsieur Okafor ? (être)", accept: ["êtes"] }
        - { id: fr-w02-d2-g04, difficulty: easy, type: text, prompt: "Tu ___ prêt ? (être)", accept: ["es"] }
        - { id: fr-w02-d2-g05, difficulty: easy, type: mcq, prompt: "I am =", choices: ["je suis", "je es", "j'est", "je sommes"], answer: 0 }
        - { id: fr-w02-d2-g06, difficulty: easy, type: truefalse, prompt: "elles is used only for a group of women.", answer: true }
        - { id: fr-w02-d2-g07, difficulty: medium, type: text, prompt: "On ___ fatigués. (être)", accept: ["est"], explain: "on takes the il form." }
        - { id: fr-w02-d2-g08, difficulty: medium, type: mcq, prompt: "Chidi and Ngozi (a man and a woman) → ___ sont à Enugu.", choices: ["Ils", "Elles", "On", "Nous"], answer: 0 }
        - { id: fr-w02-d2-g09, difficulty: medium, type: order, prompt: "Order être: singular, then plural.", items: ["je suis", "tu es", "il est", "nous sommes", "vous êtes", "ils sont"] }
        - { id: fr-w02-d2-g10, difficulty: medium, type: match, prompt: "Match.", pairs: [["je", "suis"], ["tu", "es"], ["nous", "sommes"], ["vous", "êtes"]] }
        - { id: fr-w02-d2-g11, difficulty: medium, type: mcq, prompt: "Which two forms sound the same?", choices: ["tu es / il est", "je suis / nous sommes", "vous êtes / ils sont", "il est / ils sont"], answer: 0 }
        - { id: fr-w02-d2-g12, difficulty: medium, type: text, prompt: "Translate: We are in Lagos. (use on)", accept: ["On est à Lagos.", "On est à Lagos"] }
        - { id: fr-w02-d2-g13, difficulty: medium, type: mcq, prompt: "vous can mean…", choices: ["you (formal) or you (plural)", "only we", "only they", "only you (a friend)"], answer: 0 }
        - { id: fr-w02-d2-g14, difficulty: medium, type: truefalse, prompt: "\"Elles sont ici\" could describe Ada, Bisi and their brother.", answer: false, explain: "One man in the group makes it ils." }
        - { id: fr-w02-d2-g15, difficulty: medium, type: text, prompt: "Translate: You (a friend) are ready?", accept: ["Tu es prêt ?", "Tu es prêt?", "Tu es prête ?", "Tu es prête?", "Tu es prêt", "Tu es prête"] }
        - { id: fr-w02-d2-g16, difficulty: hard, type: mcq, prompt: "Spot the error: « Nous est étudiants et vous sont ici. »", choices: ["nous sommes … vous êtes", "étudiants needs a capital", "ici should be là", "No error"], answer: 0 }
        - { id: fr-w02-d2-g17, difficulty: hard, type: text, prompt: "Translate: They (Funke and Kemi) are in Abuja.", accept: ["Elles sont à Abuja.", "Elles sont à Abuja"] }
        - { id: fr-w02-d2-g18, difficulty: hard, type: multi, prompt: "Which sentences are correct? (Select all.)", choices: ["On est prêts.", "Vous êtes ici ?", "Ils est étudiants.", "Je suis à Lagos."], answers: [0, 1, 3] }
    quizzes:
      - kind: rapid-fire
        title: "Nationalities: masculine → feminine"
        secondsPerQuestion: 10
        questions:
          - { id: fr-w02-d2-rf01, difficulty: easy, type: text, prompt: "nigérian → (feminine)", accept: ["nigériane"] }
          - { id: fr-w02-d2-rf02, difficulty: easy, type: text, prompt: "français → (feminine)", accept: ["française"] }
          - { id: fr-w02-d2-rf03, difficulty: easy, type: text, prompt: "canadien → (feminine)", accept: ["canadienne"] }
          - { id: fr-w02-d2-rf04, difficulty: easy, type: text, prompt: "belge → (feminine)", accept: ["belge"] }
          - { id: fr-w02-d2-rf05, difficulty: easy, type: text, prompt: "ghanéen → (feminine)", accept: ["ghanéenne"] }
          - { id: fr-w02-d2-rf06, difficulty: easy, type: text, prompt: "anglais → (feminine)", accept: ["anglaise"] }
          - { id: fr-w02-d2-rf07, difficulty: easy, type: text, prompt: "ivoirien → (feminine)", accept: ["ivoirienne"] }
          - { id: fr-w02-d2-rf08, difficulty: easy, type: text, prompt: "sénégalais → (feminine)", accept: ["sénégalaise"] }
          - { id: fr-w02-d2-rf09, difficulty: easy, type: text, prompt: "suisse → (feminine)", accept: ["suisse"] }
          - { id: fr-w02-d2-rf10, difficulty: easy, type: truefalse, prompt: "Nationality adjectives take a capital letter: Je suis Nigérian.", answer: false }
          - { id: fr-w02-d2-rf11, difficulty: easy, type: mcq, prompt: "Plural adjectives usually add…", choices: ["a silent -s", "-x", "-es always", "nothing"], answer: 0 }
      - kind: brain-teaser
        title: "Make it agree"
        questions:
          - { id: fr-w02-d2-bt01, difficulty: medium, type: text, prompt: "Marie et Claire sont (français) ___.", accept: ["françaises"] }
          - { id: fr-w02-d2-bt02, difficulty: medium, type: text, prompt: "Nous sommes (canadien) ___. (a group of women)", accept: ["canadiennes"] }
          - { id: fr-w02-d2-bt03, difficulty: medium, type: mcq, prompt: "Which one ends with a \"z\" sound?", choices: ["française", "français", "nigérian", "canadien"], answer: 0 }
          - { id: fr-w02-d2-bt04, difficulty: hard, type: text, prompt: "Translate: Amina and Kofi are Ghanaian.", accept: ["Amina et Kofi sont ghanéens.", "Amina et Kofi sont ghanéens"], explain: "A mixed group takes the masculine plural." }
          - { id: fr-w02-d2-bt05, difficulty: hard, type: mcq, prompt: "Spot the error: « Elle est camerounais et ils sont belges. »", choices: ["camerounais → camerounaise", "belges → belge", "est → sont", "No error"], answer: 0 }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: nationalities and agreement"
      covers: "Week 2 · Day 2: masculine/feminine/plural nationalities, -ien → -ienne, -e stays, no capitals"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w02-d3-g01, difficulty: easy, type: mcq, prompt: "Amina est…", choices: ["nigériane", "nigérian", "nigérians", "Nigériane"], answer: 0 }
        - { id: fr-w02-d3-g02, difficulty: easy, type: mcq, prompt: "Kofi est…", choices: ["ghanéen", "ghanéenne", "ghanéens", "Ghanéen"], answer: 0 }
        - { id: fr-w02-d3-g03, difficulty: easy, type: text, prompt: "américain → (feminine)", accept: ["américaine"] }
        - { id: fr-w02-d3-g04, difficulty: easy, type: truefalse, prompt: "belge is the same in masculine and feminine.", answer: true }
        - { id: fr-w02-d3-g05, difficulty: easy, type: mcq, prompt: "Feminine of canadien:", choices: ["canadienne", "canadiene", "canadiense", "canadienes"], answer: 0 }
        - { id: fr-w02-d3-g06, difficulty: easy, type: mcq, prompt: "Most feminine adjectives…", choices: ["add -e", "add -s", "drop the last letter", "add -x"], answer: 0 }
        - { id: fr-w02-d3-g07, difficulty: medium, type: text, prompt: "Elles sont (ivoirien) ___.", accept: ["ivoiriennes"] }
        - { id: fr-w02-d3-g08, difficulty: medium, type: text, prompt: "Ils sont (sénégalais) ___.", accept: ["sénégalais"], explain: "Already ends in -s: the plural doesn't change." }
        - { id: fr-w02-d3-g09, difficulty: medium, type: match, prompt: "Match masculine → feminine.", pairs: [["camerounais", "camerounaise"], ["ivoirien", "ivoirienne"], ["ghanéen", "ghanéenne"], ["suisse", "suisse"]] }
        - { id: fr-w02-d3-g10, difficulty: medium, type: mcq, prompt: "In which pair does the ending sound change?", choices: ["anglais / anglaise", "belge / belge", "suisse / suisse", "nigérians / nigérian"], answer: 0 }
        - { id: fr-w02-d3-g11, difficulty: medium, type: text, prompt: "Translate: She is Canadian.", accept: ["Elle est canadienne.", "Elle est canadienne"] }
        - { id: fr-w02-d3-g12, difficulty: medium, type: mcq, prompt: "Bisi (a woman) says: « Je suis… »", choices: ["nigériane", "nigérian", "nigérianne", "Nigériane"], answer: 0 }
        - { id: fr-w02-d3-g13, difficulty: medium, type: truefalse, prompt: "The plural -s of nigérians is pronounced.", answer: false }
        - { id: fr-w02-d3-g14, difficulty: medium, type: text, prompt: "Translate: We (women) are French. (use nous)", accept: ["Nous sommes françaises.", "Nous sommes françaises"] }
        - { id: fr-w02-d3-g15, difficulty: medium, type: mcq, prompt: "Ada and Emeka →", choices: ["Ils sont nigérians.", "Elles sont nigérianes.", "Ils sont nigérianes.", "Ils est nigérians."], answer: 0 }
        - { id: fr-w02-d3-g16, difficulty: hard, type: mcq, prompt: "Spot the error: « Marie est Française et Paul est belge. »", choices: ["Française → française (no capital)", "belge → belgee", "est → sont", "No error"], answer: 0 }
        - { id: fr-w02-d3-g17, difficulty: hard, type: text, prompt: "Translate: They (Awa and Fatou) are Senegalese.", accept: ["Elles sont sénégalaises.", "Elles sont sénégalaises"] }
        - { id: fr-w02-d3-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["Elle est suisse.", "Ils sont canadiens.", "Elle est ghanéene.", "Nous sommes anglaises."], answers: [0, 1, 3], explain: "ghanéen → ghanéenne (double n)." }
    quizzes:
      - kind: rapid-fire
        title: "en, au, aux or à?"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w02-d3-rf01, difficulty: easy, type: mcq, prompt: "___ Nigeria", choices: ["au", "en", "aux", "à"], answer: 0 }
          - { id: fr-w02-d3-rf02, difficulty: easy, type: mcq, prompt: "___ France", choices: ["en", "au", "aux", "à"], answer: 0 }
          - { id: fr-w02-d3-rf03, difficulty: easy, type: mcq, prompt: "___ Lagos", choices: ["à", "au", "en", "aux"], answer: 0 }
          - { id: fr-w02-d3-rf04, difficulty: easy, type: mcq, prompt: "___ États-Unis", choices: ["aux", "au", "en", "à"], answer: 0 }
          - { id: fr-w02-d3-rf05, difficulty: easy, type: mcq, prompt: "___ Canada", choices: ["au", "en", "à", "aux"], answer: 0 }
          - { id: fr-w02-d3-rf06, difficulty: easy, type: mcq, prompt: "___ Belgique", choices: ["en", "au", "à", "aux"], answer: 0 }
          - { id: fr-w02-d3-rf07, difficulty: easy, type: mcq, prompt: "___ Montréal", choices: ["à", "au", "en", "aux"], answer: 0 }
          - { id: fr-w02-d3-rf08, difficulty: easy, type: mcq, prompt: "___ Sénégal", choices: ["au", "en", "à", "aux"], answer: 0 }
          - { id: fr-w02-d3-rf09, difficulty: easy, type: mcq, prompt: "___ Côte d'Ivoire", choices: ["en", "au", "à", "aux"], answer: 0 }
          - { id: fr-w02-d3-rf10, difficulty: easy, type: mcq, prompt: "___ Ghana", choices: ["au", "en", "à", "aux"], answer: 0 }
          - { id: fr-w02-d3-rf11, difficulty: easy, type: mcq, prompt: "___ Toronto", choices: ["à", "au", "en", "aux"], answer: 0 }
          - { id: fr-w02-d3-rf12, difficulty: easy, type: mcq, prompt: "___ Angleterre", choices: ["en", "au", "à", "aux"], answer: 0 }
      - kind: brain-teaser
        title: "Where in the world?"
        questions:
          - { id: fr-w02-d3-bt01, difficulty: medium, type: text, prompt: "Elle habite ___ Dakar, ___ Sénégal. (two words, separated by a comma)", accept: ["à, au", "à,au", "à au"] }
          - { id: fr-w02-d3-bt02, difficulty: medium, type: text, prompt: "Translate: I am in Lagos, in Nigeria.", accept: ["Je suis à Lagos, au Nigeria.", "Je suis à Lagos, au Nigeria", "Je suis à Lagos au Nigeria."] }
          - { id: fr-w02-d3-bt03, difficulty: medium, type: mcq, prompt: "I'm from Ibadan =", choices: ["Je suis d'Ibadan.", "Je suis à Ibadan.", "Je suis au Ibadan.", "Je suis en Ibadan."], answer: 0, explain: "de + city = from; de becomes d' before a vowel." }
          - { id: fr-w02-d3-bt04, difficulty: hard, type: mcq, prompt: "Why is it en France but au Canada?", choices: ["France is feminine (ends in -e); Canada is masculine", "France is in Europe", "Canada is plural", "It's random; no rule"], answer: 0 }
          - { id: fr-w02-d3-bt05, difficulty: hard, type: text, prompt: "Translate: We work in the United States. (nous travaillons)", accept: ["Nous travaillons aux États-Unis.", "Nous travaillons aux États-Unis"] }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: countries and cities"
      covers: "Week 2 · Day 3: en (feminine), au (masculine), aux (plural), à (city), de + city"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w02-d4-g01, difficulty: easy, type: mcq, prompt: "Je travaille ___ Canada.", choices: ["au", "en", "à", "aux"], answer: 0 }
        - { id: fr-w02-d4-g02, difficulty: easy, type: mcq, prompt: "Ils sont ___ France.", choices: ["en", "au", "à", "aux"], answer: 0 }
        - { id: fr-w02-d4-g03, difficulty: easy, type: mcq, prompt: "Tu es ___ Montréal ?", choices: ["à", "au", "en", "aux"], answer: 0 }
        - { id: fr-w02-d4-g04, difficulty: easy, type: mcq, prompt: "Nous sommes ___ États-Unis.", choices: ["aux", "au", "en", "à"], answer: 0 }
        - { id: fr-w02-d4-g05, difficulty: easy, type: truefalse, prompt: "Cities always take à.", answer: true }
        - { id: fr-w02-d4-g06, difficulty: easy, type: mcq, prompt: "Most countries ending in -e are…", choices: ["feminine", "masculine", "plural", "cities"], answer: 0 }
        - { id: fr-w02-d4-g07, difficulty: medium, type: match, prompt: "Match the place to its word.", pairs: [["Belgique", "en"], ["Bénin", "au"], ["États-Unis", "aux"], ["Abuja", "à"]] }
        - { id: fr-w02-d4-g08, difficulty: medium, type: text, prompt: "Translate: She lives in Toronto. (habite)", accept: ["Elle habite à Toronto.", "Elle habite à Toronto"] }
        - { id: fr-w02-d4-g09, difficulty: medium, type: text, prompt: "Translate: I live in Canada. (j'habite)", accept: ["J'habite au Canada.", "J'habite au Canada"] }
        - { id: fr-w02-d4-g10, difficulty: medium, type: mcq, prompt: "« Je suis de Lagos » means…", choices: ["I'm from Lagos", "I'm in Lagos", "I'm going to Lagos", "I love Lagos"], answer: 0 }
        - { id: fr-w02-d4-g11, difficulty: medium, type: mcq, prompt: "Ils habitent ___ Cameroun.", choices: ["au", "en", "à", "aux"], answer: 0 }
        - { id: fr-w02-d4-g12, difficulty: medium, type: mcq, prompt: "Elle est ___ Côte d'Ivoire.", choices: ["en", "au", "à la", "aux"], answer: 0 }
        - { id: fr-w02-d4-g13, difficulty: medium, type: truefalse, prompt: "« Je suis en Lagos » is correct.", answer: false, explain: "Cities take à: à Lagos." }
        - { id: fr-w02-d4-g14, difficulty: medium, type: text, prompt: "Je voudrais habiter ___ Canada, ___ Montréal. (two words, comma)", accept: ["au, à", "au,à", "au à"] }
        - { id: fr-w02-d4-g15, difficulty: medium, type: mcq, prompt: "« Je voudrais » means…", choices: ["I would like", "I want to go", "I live", "I am from"], answer: 0 }
        - { id: fr-w02-d4-g16, difficulty: hard, type: text, prompt: "Translate: I am from Enugu but I live in Lagos, in Nigeria.", accept: ["Je suis d'Enugu, mais j'habite à Lagos, au Nigeria.", "Je suis d'Enugu mais j'habite à Lagos, au Nigeria.", "Je suis d'Enugu, mais j'habite à Lagos au Nigeria.", "Je suis d'Enugu mais j'habite à Lagos au Nigeria."] }
        - { id: fr-w02-d4-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Il habite au Paris, en France. »", choices: ["au Paris → à Paris", "en France → au France", "habite → habitez", "No error"], answer: 0 }
