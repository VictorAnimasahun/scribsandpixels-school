# French · Week 7 quizzes. Format and rules: src/content/QUIZZES.md
week: 7
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 6 review"
      covers: "Week 6: days, months and dates, telling the time, faire, reflexive verbs, routine and frequency"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w07-d1-g01, difficulty: easy, type: mcq, prompt: "Wednesday", choices: ["mercredi", "mardi", "jeudi", "vendredi"], answer: 0 }
        - { id: fr-w07-d1-g02, difficulty: easy, type: mcq, prompt: "half past three", choices: ["trois heures et demie", "trois heures et quart", "quatre heures moins le quart", "trois heures moins demie"], answer: 0 }
        - { id: fr-w07-d1-g03, difficulty: easy, type: text, prompt: "nous ___ (faire)", accept: ["faisons"] }
        - { id: fr-w07-d1-g04, difficulty: easy, type: mcq, prompt: "je ___ lève", choices: ["me", "se", "te", "nous"], answer: 0 }
        - { id: fr-w07-d1-g05, difficulty: easy, type: truefalse, prompt: "Days and months don't take a capital letter in French.", answer: true }
        - { id: fr-w07-d1-g06, difficulty: easy, type: mcq, prompt: "never", choices: ["ne … jamais", "ne … pas", "toujours", "souvent"], answer: 0 }
        - { id: fr-w07-d1-g07, difficulty: medium, type: text, prompt: "01/05 in words", accept: ["le premier mai"] }
        - { id: fr-w07-d1-g08, difficulty: medium, type: text, prompt: "vous ___ (faire)", accept: ["faites"] }
        - { id: fr-w07-d1-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["d'abord", "first"], ["ensuite", "then"], ["enfin", "finally"], ["souvent", "often"]] }
        - { id: fr-w07-d1-g10, difficulty: medium, type: text, prompt: "Elle (s'habiller) ___.", accept: ["s'habille"] }
        - { id: fr-w07-d1-g11, difficulty: medium, type: mcq, prompt: "7:45 pm (official)", choices: ["dix-neuf heures quarante-cinq", "sept heures quarante-cinq", "huit heures moins le quart du matin", "vingt heures quarante-cinq"], answer: 0 }
        - { id: fr-w07-d1-g12, difficulty: medium, type: truefalse, prompt: "« le lundi » means \"every Monday\".", answer: true }
        - { id: fr-w07-d1-g13, difficulty: medium, type: text, prompt: "Negative: Ils se reposent le dimanche.", accept: ["Ils ne se reposent pas le dimanche.", "Ils ne se reposent pas le dimanche"] }
        - { id: fr-w07-d1-g14, difficulty: medium, type: text, prompt: "Translate: It's hot in Lagos.", accept: ["Il fait chaud à Lagos.", "Il fait chaud à Lagos"] }
        - { id: fr-w07-d1-g15, difficulty: medium, type: mcq, prompt: "ils ___ (faire)", choices: ["font", "faisent", "fait", "faisons"], answer: 0 }
        - { id: fr-w07-d1-g16, difficulty: hard, type: text, prompt: "Translate: I never get up early.", accept: ["Je ne me lève jamais tôt.", "Je ne me lève jamais tôt"] }
        - { id: fr-w07-d1-g17, difficulty: hard, type: mcq, prompt: "Find the sentence with NO mistake.", choices: ["Le samedi, je fais les courses.", "Vous faisez la cuisine.", "Je me lève à sept heure.", "Elle se ne couche pas."], answer: 0 }
        - { id: fr-w07-d1-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["midi et demi", "minuit", "le vingt-cinq décembre", "le un janvier"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "À table : vocabulary"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w07-d1-rf01, difficulty: easy, type: mcq, prompt: "bread", choices: ["le pain", "le riz", "le poisson", "le lait"], answer: 0 }
          - { id: fr-w07-d1-rf02, difficulty: easy, type: mcq, prompt: "chicken", choices: ["le poulet", "le poisson", "la viande", "le porc"], answer: 0 }
          - { id: fr-w07-d1-rf03, difficulty: easy, type: mcq, prompt: "fish", choices: ["le poisson", "le poulet", "le fromage", "la poisson"], answer: 0 }
          - { id: fr-w07-d1-rf04, difficulty: easy, type: mcq, prompt: "eggs", choices: ["les œufs", "les haricots", "les fruits", "les légumes"], answer: 0 }
          - { id: fr-w07-d1-rf05, difficulty: easy, type: mcq, prompt: "beans", choices: ["les haricots", "les pâtes", "les œufs", "le riz"], answer: 0 }
          - { id: fr-w07-d1-rf06, difficulty: easy, type: mcq, prompt: "yam", choices: ["l'igname", "l'oignon", "la banane", "le piment"], answer: 0 }
          - { id: fr-w07-d1-rf07, difficulty: easy, type: mcq, prompt: "breakfast", choices: ["le petit-déjeuner", "le déjeuner", "le dîner", "le goûter"], answer: 0 }
          - { id: fr-w07-d1-rf08, difficulty: easy, type: mcq, prompt: "lunch", choices: ["le déjeuner", "le petit-déjeuner", "le dîner", "la cuisine"], answer: 0 }
          - { id: fr-w07-d1-rf09, difficulty: easy, type: mcq, prompt: "chilli", choices: ["le piment", "le poivre", "la tomate", "l'oignon"], answer: 0 }
          - { id: fr-w07-d1-rf10, difficulty: easy, type: mcq, prompt: "water", choices: ["l'eau", "le lait", "le jus", "la bière"], answer: 0 }
          - { id: fr-w07-d1-rf11, difficulty: easy, type: truefalse, prompt: "« l'eau » is feminine.", answer: true }
      - kind: brain-teaser
        title: "Le, la or les?"
        questions:
          - { id: fr-w07-d1-bt01, difficulty: medium, type: mcq, prompt: "___ viande", choices: ["la", "le", "l'", "les"], answer: 0 }
          - { id: fr-w07-d1-bt02, difficulty: medium, type: mcq, prompt: "___ fromage", choices: ["le", "la", "l'", "les"], answer: 0 }
          - { id: fr-w07-d1-bt03, difficulty: medium, type: mcq, prompt: "___ pâtes", choices: ["les", "le", "la", "l'"], answer: 0 }
          - { id: fr-w07-d1-bt04, difficulty: hard, type: text, prompt: "Translate: I like chicken and fish. (general taste)", accept: ["J'aime le poulet et le poisson.", "J'aime le poulet et le poisson"] }
          - { id: fr-w07-d1-bt05, difficulty: hard, type: match, prompt: "Match the meal.", pairs: [["le petit-déjeuner", "breakfast"], ["le déjeuner", "lunch"], ["le dîner", "dinner"], ["le goûter", "afternoon snack"]] }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: food and drink"
      covers: "Week 7 · Day 1: meals, foods and drinks with their genders"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w07-d2-g01, difficulty: easy, type: mcq, prompt: "le riz =", choices: ["rice", "milk", "bread", "cheese"], answer: 0 }
        - { id: fr-w07-d2-g02, difficulty: easy, type: mcq, prompt: "les légumes =", choices: ["vegetables", "beans", "fruit", "eggs"], answer: 0 }
        - { id: fr-w07-d2-g03, difficulty: easy, type: mcq, prompt: "dinner", choices: ["le dîner", "le déjeuner", "le petit-déjeuner", "le goûter"], answer: 0 }
        - { id: fr-w07-d2-g04, difficulty: easy, type: truefalse, prompt: "« le lait » means milk.", answer: true }
        - { id: fr-w07-d2-g05, difficulty: easy, type: mcq, prompt: "une boisson =", choices: ["a drink", "a bottle", "a fish", "a meal"], answer: 0 }
        - { id: fr-w07-d2-g06, difficulty: easy, type: mcq, prompt: "orange juice", choices: ["le jus d'orange", "l'orange jus", "le lait d'orange", "la boisson orange"], answer: 0 }
        - { id: fr-w07-d2-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["la viande", "meat"], ["le fromage", "cheese"], ["l'oignon", "onion"], ["la banane plantain", "plantain"]] }
        - { id: fr-w07-d2-g08, difficulty: medium, type: mcq, prompt: "Gender of « œufs » (singular œuf)", choices: ["masculine", "feminine"], answer: 0 }
        - { id: fr-w07-d2-g09, difficulty: medium, type: mcq, prompt: "Gender of « igname »", choices: ["feminine", "masculine"], answer: 0 }
        - { id: fr-w07-d2-g10, difficulty: medium, type: text, prompt: "Translate: the tomatoes", accept: ["les tomates"] }
        - { id: fr-w07-d2-g11, difficulty: medium, type: truefalse, prompt: "« le goûter » is the afternoon snack.", answer: true }
        - { id: fr-w07-d2-g12, difficulty: medium, type: text, prompt: "Translate: I like tea.", accept: ["J'aime le thé.", "J'aime le thé"] }
        - { id: fr-w07-d2-g13, difficulty: medium, type: mcq, prompt: "Which is plantain in Côte d'Ivoire?", choices: ["l'alloco", "l'igname", "le piment", "le pain"], answer: 0 }
        - { id: fr-w07-d2-g14, difficulty: medium, type: text, prompt: "Translate: I hate beer.", accept: ["Je déteste la bière.", "Je déteste la bière"] }
        - { id: fr-w07-d2-g15, difficulty: medium, type: order, prompt: "Order the meals of the day.", items: ["le petit-déjeuner", "le déjeuner", "le goûter", "le dîner"] }
        - { id: fr-w07-d2-g16, difficulty: hard, type: text, prompt: "Translate: I love yam but I don't like fish.", accept: ["J'adore l'igname mais je n'aime pas le poisson.", "J'adore l'igname, mais je n'aime pas le poisson.", "J'aime l'igname mais je n'aime pas le poisson."] }
        - { id: fr-w07-d2-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « J'aime la riz et le viande. »", choices: ["le riz … la viande", "Only riz", "Only viande", "No error"], answer: 0 }
        - { id: fr-w07-d2-g18, difficulty: hard, type: multi, prompt: "Which are masculine? (Select all.)", choices: ["pain", "poulet", "fromage", "viande"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "du, de la, de l', des"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w07-d2-rf01, difficulty: easy, type: mcq, prompt: "Je mange ___ riz.", choices: ["du", "de la", "de l'", "des"], answer: 0 }
          - { id: fr-w07-d2-rf02, difficulty: easy, type: mcq, prompt: "Il boit ___ bière.", choices: ["de la", "du", "de l'", "des"], answer: 0 }
          - { id: fr-w07-d2-rf03, difficulty: easy, type: mcq, prompt: "Nous buvons ___ eau.", choices: ["de l'", "du", "de la", "des"], answer: 0 }
          - { id: fr-w07-d2-rf04, difficulty: easy, type: mcq, prompt: "Tu achètes ___ tomates.", choices: ["des", "du", "de la", "de l'"], answer: 0 }
          - { id: fr-w07-d2-rf05, difficulty: easy, type: mcq, prompt: "Le matin, je bois ___ café.", choices: ["du", "le", "de la", "un de"], answer: 0 }
          - { id: fr-w07-d2-rf06, difficulty: easy, type: mcq, prompt: "J'adore ___ poulet.", choices: ["le", "du", "de", "des"], answer: 0 }
          - { id: fr-w07-d2-rf07, difficulty: easy, type: mcq, prompt: "Elle mange ___ salade.", choices: ["de la", "du", "le", "de l'"], answer: 0 }
          - { id: fr-w07-d2-rf08, difficulty: easy, type: mcq, prompt: "Nous ne mangeons pas ___ porc.", choices: ["de", "du", "le", "des"], answer: 0 }
          - { id: fr-w07-d2-rf09, difficulty: easy, type: mcq, prompt: "Tu veux ___ œufs ?", choices: ["des", "du", "de l'", "les"], answer: 0 }
          - { id: fr-w07-d2-rf10, difficulty: easy, type: mcq, prompt: "Je mange ___ banane. (one)", choices: ["une", "de la", "des", "du"], answer: 0 }
      - kind: brain-teaser
        title: "Some, general or one?"
        questions:
          - { id: fr-w07-d2-bt01, difficulty: medium, type: text, prompt: "Translate: I eat rice. (some rice)", accept: ["Je mange du riz.", "Je mange du riz"] }
          - { id: fr-w07-d2-bt02, difficulty: medium, type: text, prompt: "Translate: I don't drink coffee.", accept: ["Je ne bois pas de café.", "Je ne bois pas de café"] }
          - { id: fr-w07-d2-bt03, difficulty: medium, type: text, prompt: "Translate: He doesn't drink alcohol. (l'alcool)", accept: ["Il ne boit pas d'alcool.", "Il ne boit pas d'alcool"] }
          - { id: fr-w07-d2-bt04, difficulty: hard, type: mcq, prompt: "« J'aime le riz » vs « Je mange du riz »:", choices: ["rice in general vs some rice now", "same meaning", "some rice vs all rice", "the rice here vs rice in general"], answer: 0 }
          - { id: fr-w07-d2-bt05, difficulty: hard, type: text, prompt: "Translate: At breakfast, I eat bread and I drink tea.", accept: ["Au petit-déjeuner, je mange du pain et je bois du thé.", "Au petit-déjeuner je mange du pain et je bois du thé.", "Au petit-déjeuner, je mange du pain et je bois du thé"] }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: partitive articles"
      covers: "Week 7 · Day 2: du/de la/de l'/des, le/la/les for general taste, un/une for one, de after negatives"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w07-d3-g01, difficulty: easy, type: mcq, prompt: "Some rice", choices: ["du riz", "de la riz", "le riz", "des riz"], answer: 0 }
        - { id: fr-w07-d3-g02, difficulty: easy, type: mcq, prompt: "Some water", choices: ["de l'eau", "du eau", "de la eau", "des eau"], answer: 0 }
        - { id: fr-w07-d3-g03, difficulty: easy, type: mcq, prompt: "Some meat", choices: ["de la viande", "du viande", "des viande", "de l'viande"], answer: 0 }
        - { id: fr-w07-d3-g04, difficulty: easy, type: truefalse, prompt: "After a negative, du/de la/des become de.", answer: true }
        - { id: fr-w07-d3-g05, difficulty: easy, type: mcq, prompt: "Some beans", choices: ["des haricots", "du haricots", "de la haricots", "les haricot"], answer: 0 }
        - { id: fr-w07-d3-g06, difficulty: easy, type: mcq, prompt: "General taste: I like cheese.", choices: ["J'aime le fromage.", "J'aime du fromage.", "J'aime de fromage.", "J'aime fromage."], answer: 0 }
        - { id: fr-w07-d3-g07, difficulty: medium, type: text, prompt: "Ils boivent ___ eau.", accept: ["de l'"] }
        - { id: fr-w07-d3-g08, difficulty: medium, type: text, prompt: "Nous ne mangeons pas ___ porc.", accept: ["de"] }
        - { id: fr-w07-d3-g09, difficulty: medium, type: match, prompt: "Match the article to the meaning.", pairs: [["le riz", "rice in general"], ["du riz", "some rice"], ["un riz", "(odd: rice isn't counted)"], ["pas de riz", "no rice"]] }
        - { id: fr-w07-d3-g10, difficulty: medium, type: text, prompt: "Translate: She drinks milk. (some)", accept: ["Elle boit du lait.", "Elle boit du lait"] }
        - { id: fr-w07-d3-g11, difficulty: medium, type: truefalse, prompt: "« J'aime du chocolat » is the normal way to say \"I like chocolate\".", answer: false, explain: "Likes take le/la/les: j'aime le chocolat." }
        - { id: fr-w07-d3-g12, difficulty: medium, type: text, prompt: "Translate: I don't eat eggs.", accept: ["Je ne mange pas d'œufs.", "Je ne mange pas d'œufs", "Je ne mange pas d'oeufs."] }
        - { id: fr-w07-d3-g13, difficulty: medium, type: mcq, prompt: "Je mange ___ banane et ___ riz.", choices: ["une … du", "de la … du", "la … le", "des … de"], answer: 0 }
        - { id: fr-w07-d3-g14, difficulty: medium, type: text, prompt: "Translate: We eat vegetables.", accept: ["Nous mangeons des légumes.", "Nous mangeons des légumes", "On mange des légumes."] }
        - { id: fr-w07-d3-g15, difficulty: medium, type: mcq, prompt: "Ce n'est pas ___ eau, c'est ___ vin.", choices: ["de l' … du", "d' … du", "de … de", "l' … le"], answer: 0, explain: "With être, the article stays." }
        - { id: fr-w07-d3-g16, difficulty: hard, type: text, prompt: "Translate: I like fish, but today I'm eating chicken.", accept: ["J'aime le poisson, mais aujourd'hui je mange du poulet.", "J'aime le poisson mais aujourd'hui je mange du poulet.", "J'aime le poisson, mais aujourd'hui, je mange du poulet."] }
        - { id: fr-w07-d3-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Je ne bois pas du café, je bois de la thé. »", choices: ["pas de café … du thé", "Only du → de", "Only de la → du", "No error"], answer: 0 }
        - { id: fr-w07-d3-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["Il mange de la salade.", "Elle ne mange pas de viande.", "J'adore les fruits.", "Nous buvons du eau."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Quantities and prices"
        secondsPerQuestion: 8
        questions:
          - { id: fr-w07-d3-rf01, difficulty: easy, type: mcq, prompt: "a lot of rice", choices: ["beaucoup de riz", "beaucoup du riz", "beaucoup riz", "beaucoup des riz"], answer: 0 }
          - { id: fr-w07-d3-rf02, difficulty: easy, type: mcq, prompt: "a little sugar", choices: ["un peu de sucre", "un peu du sucre", "peu sucre", "un petit sucre"], answer: 0 }
          - { id: fr-w07-d3-rf03, difficulty: easy, type: mcq, prompt: "a bottle of water", choices: ["une bouteille d'eau", "une bouteille de l'eau", "un bouteille d'eau", "une bouteille eau"], answer: 0 }
          - { id: fr-w07-d3-rf04, difficulty: easy, type: mcq, prompt: "a dozen eggs", choices: ["une douzaine d'œufs", "une douzaine des œufs", "un douze œufs", "douze de œufs"], answer: 0 }
          - { id: fr-w07-d3-rf05, difficulty: easy, type: mcq, prompt: "How much is it?", choices: ["C'est combien ?", "C'est quoi ?", "Combien c'est cher ?", "Il est combien ?"], answer: 0 }
          - { id: fr-w07-d3-rf06, difficulty: easy, type: mcq, prompt: "It's expensive!", choices: ["C'est cher !", "C'est chaud !", "C'est chair !", "C'est cheap !"], answer: 0 }
          - { id: fr-w07-d3-rf07, difficulty: easy, type: mcq, prompt: "a slice of bread", choices: ["une tranche de pain", "une tranche du pain", "un morceau pain", "une tranche pain"], answer: 0 }
          - { id: fr-w07-d3-rf08, difficulty: easy, type: mcq, prompt: "too much salt", choices: ["trop de sel", "trop du sel", "très sel", "trop sel"], answer: 0 }
          - { id: fr-w07-d3-rf09, difficulty: easy, type: mcq, prompt: "How much do I owe you?", choices: ["Je vous dois combien ?", "Combien vous devez ?", "C'est combien de moi ?", "Je dois quoi ?"], answer: 0 }
          - { id: fr-w07-d3-rf10, difficulty: easy, type: truefalse, prompt: "After a quantity, use de alone (no article).", answer: true }
      - kind: brain-teaser
        title: "At the market"
        questions:
          - { id: fr-w07-d3-bt01, difficulty: medium, type: text, prompt: "Translate: a kilo of rice", accept: ["un kilo de riz"] }
          - { id: fr-w07-d3-bt02, difficulty: medium, type: text, prompt: "Translate: a lot of friends", accept: ["beaucoup d'amis"] }
          - { id: fr-w07-d3-bt03, difficulty: medium, type: text, prompt: "Translate: enough water", accept: ["assez d'eau"] }
          - { id: fr-w07-d3-bt04, difficulty: hard, type: text, prompt: "Translate: How much is it? It's 20 euros.", accept: ["C'est combien ? Ça fait vingt euros.", "C'est combien ? Ça fait 20 euros.", "Ça coûte combien ? Ça fait vingt euros."] }
          - { id: fr-w07-d3-bt05, difficulty: hard, type: mcq, prompt: "Bargaining: \"It's too expensive! Can you give me a price?\"", choices: ["C'est trop cher ! Vous faites un prix ?", "C'est très chaud ! Vous avez un prix ?", "C'est cher trop ! Faites prix ?", "Trop combien ! Un prix ?"], answer: 0 }

