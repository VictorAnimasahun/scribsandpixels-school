        - { id: fr-w08-d4-g08, difficulty: medium, type: text, prompt: "Translate: I'm going to the market to buy some rice.", accept: ["Je vais au marché pour acheter du riz.", "Je vais au marché pour acheter du riz"] }
        - { id: fr-w08-d4-g09, difficulty: medium, type: text, prompt: "Correct: Je ne mange pas des fruits.", accept: ["Je ne mange pas de fruits.", "Je ne mange pas de fruits"] }
        - { id: fr-w08-d4-g10, difficulty: medium, type: mcq, prompt: "C'est ___ livre. → Ce n'est pas ___ livre.", choices: ["un … un", "un … de", "le … de", "du … de"], answer: 0, explain: "être keeps its article." }
        - { id: fr-w08-d4-g11, difficulty: medium, type: truefalse, prompt: "« Je viens du marché » uses de + le = du.", answer: true }
        - { id: fr-w08-d4-g12, difficulty: medium, type: text, prompt: "Translate: She is coming from the bank. (Elle revient…)", accept: ["Elle revient de la banque.", "Elle revient de la banque"] }
        - { id: fr-w08-d4-g13, difficulty: medium, type: mcq, prompt: "Nous achetons ___ huile.", choices: ["de l'", "du", "de la", "des"], answer: 0 }
        - { id: fr-w08-d4-g14, difficulty: medium, type: text, prompt: "Translate: I don't like fish.", accept: ["Je n'aime pas le poisson.", "Je n'aime pas le poisson"] }
        - { id: fr-w08-d4-g15, difficulty: medium, type: mcq, prompt: "beaucoup ___ légumes", choices: ["de", "des", "les", "du"], answer: 0 }
        - { id: fr-w08-d4-g16, difficulty: hard, type: text, prompt: "Translate: We are going to the market to buy some rice and tomatoes.", accept: ["Nous allons au marché pour acheter du riz et des tomates.", "Nous allons au marché pour acheter du riz et des tomates", "On va au marché pour acheter du riz et des tomates."] }
        - { id: fr-w08-d4-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Il va à le bureau et il ne mange pas du pain. »", choices: ["au bureau … pas de pain", "Only à le", "Only du", "No error"], answer: 0 }
        - { id: fr-w08-d4-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["Je ne bois pas d'eau.", "J'adore les mangues.", "Elle vient de l'école.", "Nous mangeons de le riz."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Correct it fast"
        secondsPerQuestion: 10
        questions:
          - { id: fr-w08-d4-rf01, difficulty: easy, type: mcq, prompt: "Je suis 30 ans →", choices: ["J'ai 30 ans", "Je fais 30 ans", "Je vais 30 ans", "No change"], answer: 0 }
          - { id: fr-w08-d4-rf02, difficulty: easy, type: mcq, prompt: "Elle ne mange pas du poisson →", choices: ["pas de poisson", "pas le poisson", "pas un poisson", "No change"], answer: 0 }
          - { id: fr-w08-d4-rf03, difficulty: easy, type: mcq, prompt: "Nous faisez du sport →", choices: ["faisons", "faites", "font", "No change"], answer: 0 }
          - { id: fr-w08-d4-rf04, difficulty: easy, type: mcq, prompt: "Il se lève pas tôt (written) →", choices: ["Il ne se lève pas tôt", "Il se ne lève pas tôt", "Il se lève ne pas tôt", "No change"], answer: 0 }
