# French · Week 8 quizzes. Format and rules: src/content/QUIZZES.md
week: 8
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 7 review"
      covers: "Week 7: food, partitive articles, quantities and prices, vouloir/prendre/boire, at the restaurant"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w08-d1-g01, difficulty: easy, type: mcq, prompt: "Je mange ___ riz.", choices: ["du", "de la", "le", "des"], answer: 0 }
        - { id: fr-w08-d1-g02, difficulty: easy, type: mcq, prompt: "J'adore ___ poulet.", choices: ["le", "du", "de", "un"], answer: 0 }
        - { id: fr-w08-d1-g03, difficulty: easy, type: mcq, prompt: "the bill", choices: ["l'addition", "la carte", "le menu", "le plat"], answer: 0 }
        - { id: fr-w08-d1-g04, difficulty: easy, type: text, prompt: "ils ___ (prendre)", accept: ["prennent"] }
        - { id: fr-w08-d1-g05, difficulty: easy, type: truefalse, prompt: "After a negative, du/de la/des become de.", answer: true }
        - { id: fr-w08-d1-g06, difficulty: easy, type: mcq, prompt: "a bottle of water", choices: ["une bouteille d'eau", "une bouteille de l'eau", "une bouteille eau", "un bouteille d'eau"], answer: 0 }
        - { id: fr-w08-d1-g07, difficulty: medium, type: text, prompt: "Translate: I don't drink coffee.", accept: ["Je ne bois pas de café.", "Je ne bois pas de café"] }
        - { id: fr-w08-d1-g08, difficulty: medium, type: text, prompt: "nous ___ (boire)", accept: ["buvons"] }
        - { id: fr-w08-d1-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["la carte", "the full menu"], ["le menu", "set menu"], ["l'entrée", "starter"], ["le plat", "main course"]] }
        - { id: fr-w08-d1-g10, difficulty: medium, type: text, prompt: "Translate: a lot of friends", accept: ["beaucoup d'amis"] }
        - { id: fr-w08-d1-g11, difficulty: medium, type: mcq, prompt: "Polite \"I would like\"", choices: ["je voudrais", "je veux", "j'exige", "donne-moi"], answer: 0 }
        - { id: fr-w08-d1-g12, difficulty: medium, type: truefalse, prompt: "« J'aime du chocolat » is the normal way to say you like chocolate.", answer: false }
        - { id: fr-w08-d1-g13, difficulty: medium, type: text, prompt: "Translate: How much is it?", accept: ["C'est combien ?", "C'est combien?", "Ça coûte combien ?", "C'est combien"] }
        - { id: fr-w08-d1-g14, difficulty: medium, type: text, prompt: "Je ne (comprendre) ___ pas.", accept: ["comprends"] }
        - { id: fr-w08-d1-g15, difficulty: medium, type: mcq, prompt: "Ils boivent ___ eau.", choices: ["de l'", "du", "de la", "des"], answer: 0 }
        - { id: fr-w08-d1-g16, difficulty: hard, type: text, prompt: "Translate: I'd like a kilo of rice and some tomatoes, please.", accept: ["Je voudrais un kilo de riz et des tomates, s'il vous plaît.", "Je voudrais un kilo de riz et des tomates s'il vous plaît.", "Je voudrais un kilo de riz et des tomates, s'il vous plaît"] }
        - { id: fr-w08-d1-g17, difficulty: hard, type: mcq, prompt: "Find the sentence with NO mistake.", choices: ["Comme entrée, je voudrais la salade.", "Je ne bois pas du lait.", "Ils prenent le bus.", "Un kilo des tomates."], answer: 0 }
        - { id: fr-w08-d1-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["un peu de sucre", "une douzaine d'œufs", "assez d'argent", "beaucoup des amis"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Aller + places"
        secondsPerQuestion: 8
        questions:
          - { id: fr-w08-d1-rf01, difficulty: easy, type: text, prompt: "je ___ (aller)", accept: ["vais"] }
          - { id: fr-w08-d1-rf02, difficulty: easy, type: text, prompt: "tu ___ (aller)", accept: ["vas"] }
          - { id: fr-w08-d1-rf03, difficulty: easy, type: text, prompt: "il ___ (aller)", accept: ["va"] }
          - { id: fr-w08-d1-rf04, difficulty: easy, type: text, prompt: "nous ___ (aller)", accept: ["allons"] }
          - { id: fr-w08-d1-rf05, difficulty: easy, type: text, prompt: "vous ___ (aller)", accept: ["allez"] }
          - { id: fr-w08-d1-rf06, difficulty: easy, type: text, prompt: "ils ___ (aller)", accept: ["vont"] }
          - { id: fr-w08-d1-rf07, difficulty: easy, type: mcq, prompt: "Je vais ___ marché.", choices: ["au", "à la", "à le", "aux"], answer: 0 }
          - { id: fr-w08-d1-rf08, difficulty: easy, type: mcq, prompt: "Elle va ___ banque.", choices: ["à la", "au", "à l'", "aux"], answer: 0 }
          - { id: fr-w08-d1-rf09, difficulty: easy, type: mcq, prompt: "Nous allons ___ aéroport.", choices: ["à l'", "au", "à la", "aux"], answer: 0 }
          - { id: fr-w08-d1-rf10, difficulty: easy, type: mcq, prompt: "Je vais ___ ma mère.", choices: ["chez", "à", "au", "à la"], answer: 0 }
          - { id: fr-w08-d1-rf11, difficulty: easy, type: mcq, prompt: "la gare =", choices: ["train station", "garage", "airport", "market"], answer: 0 }
      - kind: brain-teaser
        title: "Où vas-tu ?"
        questions:
          - { id: fr-w08-d1-bt01, difficulty: medium, type: text, prompt: "Vous allez ___ le dentiste ?", accept: ["chez"] }
          - { id: fr-w08-d1-bt02, difficulty: medium, type: text, prompt: "Ils vont ___ États-Unis.", accept: ["aux"] }
          - { id: fr-w08-d1-bt03, difficulty: medium, type: text, prompt: "Translate: I'm going to the pharmacy.", accept: ["Je vais à la pharmacie.", "Je vais à la pharmacie"] }
          - { id: fr-w08-d1-bt04, difficulty: hard, type: text, prompt: "Translate: On Sundays, we go to church.", accept: ["Le dimanche, nous allons à l'église.", "Le dimanche nous allons à l'église.", "Le dimanche, on va à l'église."] }
          - { id: fr-w08-d1-bt05, difficulty: hard, type: mcq, prompt: "Why « chez le médecin » but « à l'hôpital »?", choices: ["chez + person, à + place", "médecin is feminine", "hôpital is plural", "random"], answer: 0 }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: aller and places"
      covers: "Week 8 · Day 1: aller, à + le/la/l'/les, places in town, chez + person"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w08-d2-g01, difficulty: easy, type: text, prompt: "vous ___ (aller)", accept: ["allez"] }
        - { id: fr-w08-d2-g02, difficulty: easy, type: text, prompt: "elles ___ (aller)", accept: ["vont"] }
        - { id: fr-w08-d2-g03, difficulty: easy, type: mcq, prompt: "à + le =", choices: ["au", "à le", "aux", "à l'"], answer: 0 }
        - { id: fr-w08-d2-g04, difficulty: easy, type: mcq, prompt: "à + les =", choices: ["aux", "à les", "au", "des"], answer: 0 }
        - { id: fr-w08-d2-g05, difficulty: easy, type: truefalse, prompt: "« à la » doesn't change: Je vais à la poste.", answer: true }
        - { id: fr-w08-d2-g06, difficulty: easy, type: mcq, prompt: "la salle de sport =", choices: ["the gym", "the sports shop", "the stadium", "the classroom"], answer: 0 }
        - { id: fr-w08-d2-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["au", "le marché"], ["à la", "la plage"], ["à l'", "l'école"], ["aux", "les toilettes"]] }
        - { id: fr-w08-d2-g08, difficulty: medium, type: text, prompt: "Translate: She goes to the supermarket.", accept: ["Elle va au supermarché.", "Elle va au supermarché"] }
        - { id: fr-w08-d2-g09, difficulty: medium, type: text, prompt: "Translate: I'm going to my brother's place.", accept: ["Je vais chez mon frère.", "Je vais chez mon frère"] }
        - { id: fr-w08-d2-g10, difficulty: medium, type: mcq, prompt: "the bus station", choices: ["la gare routière", "la gare", "l'arrêt", "le bus"], answer: 0 }
        - { id: fr-w08-d2-g11, difficulty: medium, type: truefalse, prompt: "« Je vais à le cinéma » is correct.", answer: false }
        - { id: fr-w08-d2-g12, difficulty: medium, type: text, prompt: "Translate: We are going to the hospital.", accept: ["Nous allons à l'hôpital.", "Nous allons à l'hôpital", "On va à l'hôpital."] }
        - { id: fr-w08-d2-g13, difficulty: medium, type: mcq, prompt: "Ils vont ___ mosquée.", choices: ["à la", "au", "à l'", "chez"], answer: 0 }
        - { id: fr-w08-d2-g14, difficulty: medium, type: text, prompt: "Translate: Are you going to the bank? (tu)", accept: ["Tu vas à la banque ?", "Tu vas à la banque?", "Est-ce que tu vas à la banque ?", "Tu vas à la banque"] }
        - { id: fr-w08-d2-g15, difficulty: medium, type: order, prompt: "Build the sentence.", items: ["Le lundi,", "je", "vais", "au", "bureau"] }
        - { id: fr-w08-d2-g16, difficulty: hard, type: text, prompt: "Translate: They (men) go to the restaurant, then to the cinema.", accept: ["Ils vont au restaurant, puis au cinéma.", "Ils vont au restaurant puis au cinéma.", "Ils vont au restaurant, ensuite au cinéma."] }
        - { id: fr-w08-d2-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Je vais à la marché puis à le médecin. »", choices: ["au marché … chez le médecin", "Only à la → au", "Only à le → au", "No error"], answer: 0 }
        - { id: fr-w08-d2-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["Je vais à l'université.", "Elle va chez sa tante.", "Nous allons aux États-Unis.", "Tu vas au plage ?"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "The big four verbs"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w08-d2-rf01, difficulty: easy, type: text, prompt: "ils ___ (être)", accept: ["sont"] }
          - { id: fr-w08-d2-rf02, difficulty: easy, type: text, prompt: "ils ___ (avoir)", accept: ["ont"] }
          - { id: fr-w08-d2-rf03, difficulty: easy, type: text, prompt: "ils ___ (faire)", accept: ["font"] }
          - { id: fr-w08-d2-rf04, difficulty: easy, type: text, prompt: "ils ___ (aller)", accept: ["vont"] }
          - { id: fr-w08-d2-rf05, difficulty: easy, type: text, prompt: "nous ___ (être)", accept: ["sommes"] }
          - { id: fr-w08-d2-rf06, difficulty: easy, type: text, prompt: "nous ___ (avoir)", accept: ["avons"] }
          - { id: fr-w08-d2-rf07, difficulty: easy, type: text, prompt: "vous ___ (faire)", accept: ["faites"] }
          - { id: fr-w08-d2-rf08, difficulty: easy, type: text, prompt: "vous ___ (être)", accept: ["êtes"] }
          - { id: fr-w08-d2-rf09, difficulty: easy, type: text, prompt: "tu ___ (aller)", accept: ["vas"] }
          - { id: fr-w08-d2-rf10, difficulty: easy, type: text, prompt: "j'___ (avoir)", accept: ["ai"] }
          - { id: fr-w08-d2-rf11, difficulty: easy, type: text, prompt: "il ___ (faire)", accept: ["fait"] }
      - kind: brain-teaser
        title: "Pick the verb"
        questions:
          - { id: fr-w08-d2-bt01, difficulty: medium, type: text, prompt: "Nous ___ nigérians.", accept: ["sommes"] }
          - { id: fr-w08-d2-bt02, difficulty: medium, type: text, prompt: "Ils ___ trois enfants.", accept: ["ont"] }
          - { id: fr-w08-d2-bt03, difficulty: medium, type: text, prompt: "Elles ___ au cinéma.", accept: ["vont"] }
          - { id: fr-w08-d2-bt04, difficulty: hard, type: text, prompt: "Vous ___ la cuisine ? (faire)", accept: ["faites"] }
          - { id: fr-w08-d2-bt05, difficulty: hard, type: mcq, prompt: "What do sont, ont, font and vont have in common?", choices: ["They're the short irregular ils forms of être, avoir, faire, aller", "They're all regular", "They're all past tense", "They're all reflexive"], answer: 0 }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: être, avoir, faire, aller"
      covers: "Week 8 · Day 2: the four key verbs in all persons and choosing the right one"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w08-d3-g01, difficulty: easy, type: text, prompt: "tu ___ (être)", accept: ["es"] }
        - { id: fr-w08-d3-g02, difficulty: easy, type: text, prompt: "tu ___ (avoir)", accept: ["as"] }
        - { id: fr-w08-d3-g03, difficulty: easy, type: text, prompt: "tu ___ (faire)", accept: ["fais"] }
        - { id: fr-w08-d3-g04, difficulty: easy, type: text, prompt: "nous ___ (aller)", accept: ["allons"] }
        - { id: fr-w08-d3-g05, difficulty: easy, type: truefalse, prompt: "« J'ai faim » uses avoir.", answer: true }
        - { id: fr-w08-d3-g06, difficulty: easy, type: text, prompt: "On ___ fatigués. (être)", accept: ["est"] }
        - { id: fr-w08-d3-g07, difficulty: medium, type: match, prompt: "Match the ils form.", pairs: [["être", "sont"], ["avoir", "ont"], ["faire", "font"], ["aller", "vont"]] }
        - { id: fr-w08-d3-g08, difficulty: medium, type: text, prompt: "J'___ faim.", accept: ["ai"] }
        - { id: fr-w08-d3-g09, difficulty: medium, type: text, prompt: "Il ___ à la banque.", accept: ["va"] }
        - { id: fr-w08-d3-g10, difficulty: medium, type: text, prompt: "Tu ___ du sport ?", accept: ["fais"] }
        - { id: fr-w08-d3-g11, difficulty: medium, type: truefalse, prompt: "« Il fait chaud » talks about the weather.", answer: true }
        - { id: fr-w08-d3-g12, difficulty: medium, type: mcq, prompt: "They are 20 (years old).", choices: ["Ils ont vingt ans.", "Ils sont vingt ans.", "Ils font vingt ans.", "Ils vont vingt ans."], answer: 0 }
        - { id: fr-w08-d3-g13, difficulty: medium, type: text, prompt: "Translate: We do the shopping and we go to the market.", accept: ["Nous faisons les courses et nous allons au marché.", "Nous faisons les courses et nous allons au marché", "On fait les courses et on va au marché."] }
        - { id: fr-w08-d3-g14, difficulty: medium, type: mcq, prompt: "Vous ___ ingénieur ?", choices: ["êtes", "avez", "faites", "allez"], answer: 0 }
        - { id: fr-w08-d3-g15, difficulty: medium, type: order, prompt: "Order être: je → ils.", items: ["suis", "es", "est", "sommes", "êtes", "sont"] }
        - { id: fr-w08-d3-g16, difficulty: hard, type: text, prompt: "Translate: They (women) are tired because they go to the gym.", accept: ["Elles sont fatiguées parce qu'elles vont à la salle de sport.", "Elles sont fatiguées parce qu'elles vont à la salle de sport"] }
        - { id: fr-w08-d3-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Nous faisez du sport et ils sont faim. »", choices: ["faisons … ont faim", "Only faisez", "Only sont", "No error"], answer: 0 }
        - { id: fr-w08-d3-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["Ils font la vaisselle.", "Vous avez raison.", "Elles vont chez Ada.", "Nous sont prêts."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Article roundup"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w08-d3-rf01, difficulty: easy, type: mcq, prompt: "a (masc.)", choices: ["un", "une", "le", "du"], answer: 0 }
          - { id: fr-w08-d3-rf02, difficulty: easy, type: mcq, prompt: "some (fem.)", choices: ["de la", "du", "une", "la"], answer: 0 }
          - { id: fr-w08-d3-rf03, difficulty: easy, type: mcq, prompt: "the (plural)", choices: ["les", "des", "aux", "le"], answer: 0 }
          - { id: fr-w08-d3-rf04, difficulty: easy, type: mcq, prompt: "à + le", choices: ["au", "du", "à le", "aux"], answer: 0 }
          - { id: fr-w08-d3-rf05, difficulty: easy, type: mcq, prompt: "de + le", choices: ["du", "au", "de le", "des"], answer: 0 }
          - { id: fr-w08-d3-rf06, difficulty: easy, type: mcq, prompt: "de + les", choices: ["des", "du", "aux", "les"], answer: 0 }
          - { id: fr-w08-d3-rf07, difficulty: easy, type: mcq, prompt: "After pas, un/une/des become…", choices: ["de", "le", "du", "unchanged"], answer: 0 }
          - { id: fr-w08-d3-rf08, difficulty: easy, type: mcq, prompt: "After pas, le/la/les…", choices: ["stay the same", "become de", "disappear", "become du"], answer: 0 }
          - { id: fr-w08-d3-rf09, difficulty: easy, type: mcq, prompt: "some water", choices: ["de l'eau", "du eau", "de la eau", "des eau"], answer: 0 }
          - { id: fr-w08-d3-rf10, difficulty: easy, type: mcq, prompt: "à + l'", choices: ["à l'", "au", "aux", "al"], answer: 0 }
      - kind: brain-teaser
        title: "Au marché avec ma sœur"
        questions:
          - { id: fr-w08-d3-bt01, difficulty: medium, type: text, prompt: "Le samedi, je vais ___ marché avec ___ sœur. (two words, comma)", accept: ["au, ma", "au,ma", "au ma"] }
          - { id: fr-w08-d3-bt02, difficulty: medium, type: text, prompt: "Nous achetons ___ tomates, ___ riz et ___ huile. (three words, commas)", accept: ["des, du, de l'", "des,du,de l'", "des du de l'"] }
          - { id: fr-w08-d3-bt03, difficulty: medium, type: text, prompt: "Ma sœur n'achète pas ___ viande.", accept: ["de"] }
          - { id: fr-w08-d3-bt04, difficulty: hard, type: text, prompt: "Elle adore ___ légumes.", accept: ["les"] }
          - { id: fr-w08-d3-bt05, difficulty: hard, type: text, prompt: "Ensuite, nous allons ___ pharmacie et ___ ma grand-mère. (two, comma)", accept: ["à la, chez", "à la,chez", "à la chez"] }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: all the articles"
      covers: "Week 8 · Day 3: indefinite, definite, partitive, à + article, de + article, after negation"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w08-d4-g01, difficulty: easy, type: mcq, prompt: "Je mange ___ banane. (one)", choices: ["une", "de la", "la", "des"], answer: 0 }
        - { id: fr-w08-d4-g02, difficulty: easy, type: mcq, prompt: "J'aime ___ musique.", choices: ["la", "de la", "une", "du"], answer: 0 }
        - { id: fr-w08-d4-g03, difficulty: easy, type: mcq, prompt: "Je vais ___ toilettes.", choices: ["aux", "au", "à les", "des"], answer: 0 }
        - { id: fr-w08-d4-g04, difficulty: easy, type: truefalse, prompt: "« Je n'aime pas les légumes » keeps les after pas.", answer: true }
        - { id: fr-w08-d4-g05, difficulty: easy, type: mcq, prompt: "Il boit ___ lait. (some)", choices: ["du", "le", "de la", "un"], answer: 0 }
