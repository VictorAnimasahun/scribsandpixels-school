        - { id: fr-w14-d2-g01, difficulty: easy, type: text, prompt: "tu ___ (finir)", accept: ["finis"] }
        - { id: fr-w14-d2-g02, difficulty: easy, type: text, prompt: "nous ___ (choisir)", accept: ["choisissons"] }
        - { id: fr-w14-d2-g03, difficulty: easy, type: truefalse, prompt: "The plural of finir-type verbs contains -iss-.", answer: true }
