# French · Week 14 quizzes. Format and rules: src/content/QUIZZES.md
week: 14
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 13 review"
      covers: "Week 13: question words, three registers, inversion, quel, pouvoir/devoir/vouloir, savoir vs connaître, reception desk"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w14-d1-g01, difficulty: easy, type: mcq, prompt: "why", choices: ["pourquoi", "parce que", "quoi", "comment"], answer: 0 }
        - { id: fr-w14-d1-g02, difficulty: easy, type: mcq, prompt: "Standard: Where are you going?", choices: ["Où est-ce que tu vas ?", "Tu vas où-t-il ?", "Où vas tu est-ce ?", "Est-ce où tu vas ?"], answer: 0 }
        - { id: fr-w14-d1-g03, difficulty: easy, type: truefalse, prompt: "« Où va-t-il ? » adds -t- between two vowels.", answer: true }
        - { id: fr-w14-d1-g04, difficulty: easy, type: mcq, prompt: "___ heure est-il ?", choices: ["Quelle", "Quel", "Quels", "Quelles"], answer: 0 }
        - { id: fr-w14-d1-g05, difficulty: easy, type: mcq, prompt: "Je ___ nager.", choices: ["sais", "connais", "peux savoir", "connaît"], answer: 0 }
        - { id: fr-w14-d1-g06, difficulty: easy, type: text, prompt: "ils ___ (pouvoir)", accept: ["peuvent"] }
        - { id: fr-w14-d1-g07, difficulty: medium, type: text, prompt: "Invert: Elle a un frère.", accept: ["A-t-elle un frère ?", "A-t-elle un frère?"] }
        - { id: fr-w14-d1-g08, difficulty: medium, type: text, prompt: "Translate: Can you repeat, please? (vous)", accept: ["Vous pouvez répéter, s'il vous plaît ?", "Pouvez-vous répéter, s'il vous plaît ?", "Vous pouvez répéter s'il vous plaît ?"] }
        - { id: fr-w14-d1-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["savoir + infinitive", "know how to"], ["connaître + person", "know someone"], ["devoir", "must"], ["pouvoir", "can"]] }
        - { id: fr-w14-d1-g10, difficulty: medium, type: text, prompt: "ils ___ (devoir)", accept: ["doivent"] }
        - { id: fr-w14-d1-g11, difficulty: medium, type: truefalse, prompt: "« Qu'est-ce que votre adresse ? » is correct.", answer: false }
        - { id: fr-w14-d1-g12, difficulty: medium, type: text, prompt: "Tu ___ Montréal ? (know)", accept: ["connais"] }
        - { id: fr-w14-d1-g13, difficulty: medium, type: mcq, prompt: "Formal: What are you doing?", choices: ["Que fais-tu ?", "Tu fais quoi ?", "Qu'est-ce que tu fais ?", "Quoi fais-tu ?"], answer: 0 }
        - { id: fr-w14-d1-g14, difficulty: medium, type: text, prompt: "Translate: Where is the nearest pharmacy located? (Où se trouve…)", accept: ["Où se trouve la pharmacie la plus proche ?", "Où se trouve la pharmacie la plus proche?"] }
        - { id: fr-w14-d1-g15, difficulty: medium, type: mcq, prompt: "___ langues parlez-vous ?", choices: ["Quelles", "Quels", "Quelle", "Quel"], answer: 0 }
        - { id: fr-w14-d1-g16, difficulty: hard, type: text, prompt: "Translate: I know Tunde, but I don't know where he lives.", accept: ["Je connais Tunde, mais je ne sais pas où il habite.", "Je connais Tunde mais je ne sais pas où il habite."] }
        - { id: fr-w14-d1-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Parle-il anglais ? Tu sais mon frère ? »", choices: ["Parle-t-il … Tu connais mon frère", "Only the first", "Only the second", "No error"], answer: 0 }
        - { id: fr-w14-d1-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["Pouvez-vous m'aider ?", "Quel est ton numéro ?", "Nous devons partir.", "Ils peut venir."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "-IR verbs (finir)"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w14-d1-rf01, difficulty: easy, type: text, prompt: "je ___ (finir)", accept: ["finis"] }
          - { id: fr-w14-d1-rf02, difficulty: easy, type: text, prompt: "il ___ (finir)", accept: ["finit"] }
          - { id: fr-w14-d1-rf03, difficulty: easy, type: text, prompt: "nous ___ (finir)", accept: ["finissons"] }
          - { id: fr-w14-d1-rf04, difficulty: easy, type: text, prompt: "vous ___ (finir)", accept: ["finissez"] }
          - { id: fr-w14-d1-rf05, difficulty: easy, type: text, prompt: "ils ___ (finir)", accept: ["finissent"] }
          - { id: fr-w14-d1-rf06, difficulty: easy, type: mcq, prompt: "The signature of this family in the plural", choices: ["-iss-", "-ons only", "-ent", "-ir"], answer: 0 }
          - { id: fr-w14-d1-rf07, difficulty: easy, type: mcq, prompt: "choisir", choices: ["to choose", "to cheer", "to chop", "to sit"], answer: 0 }
          - { id: fr-w14-d1-rf08, difficulty: easy, type: mcq, prompt: "réussir", choices: ["to succeed / pass", "to repeat", "to rest", "to wake up"], answer: 0 }
          - { id: fr-w14-d1-rf09, difficulty: easy, type: mcq, prompt: "remplir", choices: ["to fill in", "to remember", "to replace", "to empty"], answer: 0 }
          - { id: fr-w14-d1-rf10, difficulty: easy, type: mcq, prompt: "réfléchir", choices: ["to think", "to reflect light only", "to refuse", "to relax"], answer: 0 }
      - kind: brain-teaser
        title: "Conjugate it"
        questions:
          - { id: fr-w14-d1-bt01, difficulty: medium, type: text, prompt: "Vous (choisir) ___ quoi ?", accept: ["choisissez"] }
          - { id: fr-w14-d1-bt02, difficulty: medium, type: text, prompt: "Ils (réussir) ___ l'examen.", accept: ["réussissent"] }
          - { id: fr-w14-d1-bt03, difficulty: medium, type: text, prompt: "Les enfants (grandir) ___ vite.", accept: ["grandissent"] }
          - { id: fr-w14-d1-bt04, difficulty: hard, type: text, prompt: "Translate: We choose a restaurant and we finish at 6 pm.", accept: ["Nous choisissons un restaurant et nous finissons à 18 h.", "Nous choisissons un restaurant et nous finissons à dix-huit heures.", "Nous choisissons un restaurant et nous finissons à 18 heures."] }
          - { id: fr-w14-d1-bt05, difficulty: hard, type: mcq, prompt: "Spot the error: « Je remplit le formulaire et tu réussis. »", choices: ["remplit → remplis", "réussis → réussit", "both", "No error"], answer: 0 }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
