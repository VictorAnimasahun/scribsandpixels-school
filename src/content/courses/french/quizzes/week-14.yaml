        - { id: fr-w14-d2-g12, difficulty: medium, type: text, prompt: "vous ___ (réussir)", accept: ["réussissez"] }
        - { id: fr-w14-d2-g13, difficulty: medium, type: mcq, prompt: "Children obey their parents.", choices: ["Les enfants obéissent à leurs parents.", "Les enfants obéit leurs parents.", "Les enfants obéissons à leurs parents.", "Les enfants obéir leurs parents."], answer: 0 }
        - { id: fr-w14-d2-g14, difficulty: medium, type: text, prompt: "il ___ (choisir)", accept: ["choisit"] }
        - { id: fr-w14-d2-g15, difficulty: medium, type: order, prompt: "Order finir: je → ils.", items: ["finis", "finis", "finit", "finissons", "finissez", "finissent"] }
        - { id: fr-w14-d2-g16, difficulty: hard, type: text, prompt: "Translate: My children grow up fast and they always succeed.", accept: ["Mes enfants grandissent vite et ils réussissent toujours.", "Mes enfants grandissent vite et ils réussissent toujours"] }
        - { id: fr-w14-d2-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Nous choisons une robe. »", choices: ["choisons → choisissons", "une → un", "Nous → On", "No error"], answer: 0 }
        - { id: fr-w14-d2-g18, difficulty: hard, type: multi, prompt: "Which follow the finir pattern? (Select all.)", choices: ["choisir", "remplir", "réussir", "partir"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "partir-type and -RE"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w14-d2-rf01, difficulty: easy, type: text, prompt: "je ___ (partir)", accept: ["pars"] }
          - { id: fr-w14-d2-rf02, difficulty: easy, type: text, prompt: "il ___ (sortir)", accept: ["sort"] }
          - { id: fr-w14-d2-rf03, difficulty: easy, type: text, prompt: "il ___ (dormir)", accept: ["dort"] }
          - { id: fr-w14-d2-rf04, difficulty: easy, type: text, prompt: "nous ___ (partir)", accept: ["partons"] }
