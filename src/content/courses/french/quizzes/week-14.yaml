          - { id: fr-w14-d2-rf06, difficulty: easy, type: text, prompt: "j'___ (attendre)", accept: ["attends"] }
          - { id: fr-w14-d2-rf07, difficulty: easy, type: text, prompt: "il ___ (attendre)", accept: ["attend"] }
          - { id: fr-w14-d2-rf08, difficulty: easy, type: text, prompt: "ils ___ (vendre)", accept: ["vendent"] }
