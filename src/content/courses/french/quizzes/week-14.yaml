          - { id: fr-w14-d2-bt03, difficulty: medium, type: text, prompt: "Vous (sortir) ___ ce soir ?", accept: ["sortez"] }
          - { id: fr-w14-d2-bt04, difficulty: hard, type: mcq, prompt: "Why « il attend » with no ending?", choices: ["-RE verbs take no ending in the il form (the d stays)", "it's irregular", "a typo", "il drops letters always"], answer: 0 }
          - { id: fr-w14-d2-bt05, difficulty: hard, type: text, prompt: "Translate: I answer the teacher. (répondre à)", accept: ["Je réponds au professeur.", "Je réponds au professeur", "Je réponds à la professeure."] }

