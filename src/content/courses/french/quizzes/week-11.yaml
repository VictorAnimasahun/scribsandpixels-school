        - { id: fr-w11-d4-g03, difficulty: easy, type: truefalse, prompt: "« un peu » is used to soften negative traits.", answer: true }
        - { id: fr-w11-d4-g04, difficulty: easy, type: mcq, prompt: "optimiste ↔", choices: ["pessimiste", "timide", "nerveux", "paresseux"], answer: 0 }
        - { id: fr-w11-d4-g05, difficulty: easy, type: mcq, prompt: "very kind", choices: ["très gentil", "trop gentil", "assez gentille only", "pas gentil"], answer: 0 }
        - { id: fr-w11-d4-g06, difficulty: easy, type: mcq, prompt: "ouvert ↔", choices: ["fermé", "timide", "impoli", "nerveux"], answer: 0 }
        - { id: fr-w11-d4-g07, difficulty: medium, type: match, prompt: "Match the opposites.", pairs: [["généreux", "égoïste"], ["patient", "impatient"], ["travailleur", "paresseux"], ["calme", "nerveux"]] }
        - { id: fr-w11-d4-g08, difficulty: medium, type: text, prompt: "Translate: She is quite patient.", accept: ["Elle est assez patiente.", "Elle est assez patiente"] }
        - { id: fr-w11-d4-g09, difficulty: medium, type: text, prompt: "Translate: You (tu) are too chatty!", accept: ["Tu es trop bavard !", "Tu es trop bavarde !", "Tu es trop bavard!", "Tu es trop bavarde!"] }
        - { id: fr-w11-d4-g10, difficulty: medium, type: mcq, prompt: "« Il a un caractère difficile » =", choices: ["He has a difficult personality", "He has difficult handwriting", "His character in the film is hard", "He is in a difficult situation"], answer: 0 }
        - { id: fr-w11-d4-g11, difficulty: medium, type: truefalse, prompt: "« trop » and « très » mean the same thing.", answer: false }
        - { id: fr-w11-d4-g12, difficulty: medium, type: text, prompt: "Translate: She isn't lazy at all.", accept: ["Elle n'est pas du tout paresseuse.", "Elle n'est pas du tout paresseuse"] }
        - { id: fr-w11-d4-g13, difficulty: medium, type: mcq, prompt: "Job interview: your flaw, softened", choices: ["Je suis un peu impatient.", "Je suis trop paresseux.", "Je suis très égoïste.", "Je suis méchant."], answer: 0 }
        - { id: fr-w11-d4-g14, difficulty: medium, type: text, prompt: "Translate: He is very hard-working.", accept: ["Il est très travailleur.", "Il est très travailleur"] }
        - { id: fr-w11-d4-g15, difficulty: medium, type: mcq, prompt: "nerveuse is the feminine of…", choices: ["nerveux", "nerveur", "nervif", "nerveul"], answer: 0 }
