# French · Week 11 quizzes. Format and rules: src/content/QUIZZES.md
week: 11
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 10 review"
      covers: "Week 10: rooms and housing, furniture, colour agreement, BANGS, bel/nouvel/vieil, rental ads, il n'y a pas de"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w11-d1-g01, difficulty: easy, type: mcq, prompt: "la chambre", choices: ["bedroom", "room (any)", "chamber", "kitchen"], answer: 0 }
        - { id: fr-w11-d1-g02, difficulty: easy, type: mcq, prompt: "une armoire (blanc)", choices: ["blanche", "blanc", "blance", "blancs"], answer: 0 }
        - { id: fr-w11-d1-g03, difficulty: easy, type: truefalse, prompt: "« marron » never changes, even in the plural.", answer: true }
        - { id: fr-w11-d1-g04, difficulty: easy, type: mcq, prompt: "a big kitchen", choices: ["une grande cuisine", "une cuisine grande", "un grand cuisine", "une grand cuisine"], answer: 0 }
        - { id: fr-w11-d1-g05, difficulty: easy, type: mcq, prompt: "le loyer", choices: ["the rent", "the landlord", "the lawyer", "the tenant"], answer: 0 }
        - { id: fr-w11-d1-g06, difficulty: easy, type: mcq, prompt: "au premier étage", choices: ["one floor above the ground floor", "on the ground floor", "on the top floor", "in the basement"], answer: 0 }
        - { id: fr-w11-d1-g07, difficulty: medium, type: text, prompt: "un appartement (beau)", accept: ["un bel appartement"] }
        - { id: fr-w11-d1-g08, difficulty: medium, type: text, prompt: "Translate: There is no garden.", accept: ["Il n'y a pas de jardin.", "Il n'y a pas de jardin"] }
        - { id: fr-w11-d1-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["beau", "bel"], ["nouveau", "nouvel"], ["vieux", "vieil"], ["blanc (fem.)", "blanche"]] }
        - { id: fr-w11-d1-g10, difficulty: medium, type: text, prompt: "des maisons (grand), written French", accept: ["de grandes maisons"] }
        - { id: fr-w11-d1-g11, difficulty: medium, type: truefalse, prompt: "« meublé » means furnished.", answer: true }
        - { id: fr-w11-d1-g12, difficulty: medium, type: text, prompt: "des rideaux (noir)", accept: ["noirs"] }
        - { id: fr-w11-d1-g13, difficulty: medium, type: mcq, prompt: "BANGS stands for…", choices: ["Beauty, Age, Number, Goodness, Size", "Big, Accent, Noun, Gender, Sound", "Before, After, Noun, Gender, Size", "Beauty, Accent, Number, Grammar, Style"], answer: 0 }
        - { id: fr-w11-d1-g14, difficulty: medium, type: text, prompt: "un hôtel (vieux)", accept: ["un vieil hôtel"] }
        - { id: fr-w11-d1-g15, difficulty: medium, type: mcq, prompt: "Québec 4 ½", choices: ["4 rooms + a bathroom", "4.5 bedrooms", "4th floor", "4 rooms half-furnished"], answer: 0 }
        - { id: fr-w11-d1-g16, difficulty: hard, type: text, prompt: "Translate: I live in an old building, but my flat is bright.", accept: ["J'habite dans un vieil immeuble, mais mon appartement est lumineux.", "J'habite dans un vieil immeuble mais mon appartement est lumineux.", "J'habite dans un vieil immeuble, mais mon appartement est lumineux"] }
        - { id: fr-w11-d1-g17, difficulty: hard, type: mcq, prompt: "Correct: « un beau appartement, un vieux hôtel, des grandes maisons »", choices: ["un bel appartement, un vieil hôtel, de grandes maisons", "un belle appartement, un vieille hôtel, des grandes maisons", "un appartement beau, un hôtel vieux, des maisons grandes", "No changes"], answer: 0 }
        - { id: fr-w11-d1-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["une petite maison blanche", "des chaises marron", "Il n'y a pas d'ascenseur.", "un nouveau appartement"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Appearance"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w11-d1-rf01, difficulty: easy, type: mcq, prompt: "mince", choices: ["slim", "tall", "short", "strong"], answer: 0 }
          - { id: fr-w11-d1-rf02, difficulty: easy, type: mcq, prompt: "de taille moyenne", choices: ["medium height", "average age", "small size", "middle-aged"], answer: 0 }
          - { id: fr-w11-d1-rf03, difficulty: easy, type: mcq, prompt: "chauve", choices: ["bald", "hot", "curly", "bearded"], answer: 0 }
          - { id: fr-w11-d1-rf04, difficulty: easy, type: mcq, prompt: "les cheveux bouclés", choices: ["curly hair", "braided hair", "short hair", "grey hair"], answer: 0 }
          - { id: fr-w11-d1-rf05, difficulty: easy, type: mcq, prompt: "les cheveux tressés", choices: ["braided hair", "curly hair", "long hair", "dyed hair"], answer: 0 }
          - { id: fr-w11-d1-rf06, difficulty: easy, type: mcq, prompt: "une barbe", choices: ["a beard", "a barber", "a moustache", "a bar"], answer: 0 }
          - { id: fr-w11-d1-rf07, difficulty: easy, type: mcq, prompt: "Il porte des lunettes.", choices: ["He wears glasses.", "He carries glasses.", "He buys glasses.", "He has bad eyes."], answer: 0 }
          - { id: fr-w11-d1-rf08, difficulty: easy, type: mcq, prompt: "Hair and eyes use…", choices: ["avoir", "être", "faire", "porter"], answer: 0 }
          - { id: fr-w11-d1-rf09, difficulty: easy, type: mcq, prompt: "âgé(e)", choices: ["elderly (polite)", "angry", "aged cheese", "young"], answer: 0 }
          - { id: fr-w11-d1-rf10, difficulty: easy, type: mcq, prompt: "mignon (fem.)", choices: ["mignonne", "mignone", "mignon", "mignonnes"], answer: 0 }
          - { id: fr-w11-d1-rf11, difficulty: easy, type: mcq, prompt: "fort(e) for a person", choices: ["well-built (kinder than gros)", "loud", "fortunate", "short"], answer: 0 }
      - kind: brain-teaser
        title: "Describe them"
        questions:
          - { id: fr-w11-d1-bt01, difficulty: medium, type: text, prompt: "Translate: She has long hair.", accept: ["Elle a les cheveux longs.", "Elle a les cheveux longs"] }
          - { id: fr-w11-d1-bt02, difficulty: medium, type: text, prompt: "Translate: He has brown eyes.", accept: ["Il a les yeux marron.", "Il a les yeux marron"] }
          - { id: fr-w11-d1-bt03, difficulty: medium, type: mcq, prompt: "« Elle a un cheveu long » means…", choices: ["She has one long hair (a single strand)", "She has long hair", "She has a long horse", "She has long eyelashes"], answer: 0 }
          - { id: fr-w11-d1-bt04, difficulty: hard, type: text, prompt: "Translate: She has long, braided hair and brown eyes.", accept: ["Elle a les cheveux longs et tressés et les yeux marron.", "Elle a les cheveux longs et tressés et les yeux marron"] }
          - { id: fr-w11-d1-bt05, difficulty: hard, type: mcq, prompt: "Spot the error: « Il est les cheveux courts et il a grand. »", choices: ["Il a les cheveux courts … il est grand", "Only cheveux", "Only grand", "No error"], answer: 0 }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: appearance"
      covers: "Week 11 · Day 1: il/elle est + build and age, il/elle a + hair, eyes, beard; porter des lunettes"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w11-d2-g01, difficulty: easy, type: mcq, prompt: "tall (fem.)", choices: ["grande", "grand", "grosse", "longue"], answer: 0 }
        - { id: fr-w11-d2-g02, difficulty: easy, type: mcq, prompt: "Elle a ___ cheveux noirs.", choices: ["les", "des", "un", "la"], answer: 0 }
        - { id: fr-w11-d2-g03, difficulty: easy, type: truefalse, prompt: "« les cheveux » is always plural.", answer: true }
        - { id: fr-w11-d2-g04, difficulty: easy, type: mcq, prompt: "les yeux", choices: ["the eyes", "the ears", "the eyebrows", "the yes"], answer: 0 }
        - { id: fr-w11-d2-g05, difficulty: easy, type: mcq, prompt: "Il ___ chauve.", choices: ["est", "a", "porte", "fait"], answer: 0 }
        - { id: fr-w11-d2-g06, difficulty: easy, type: mcq, prompt: "short hair", choices: ["les cheveux courts", "les cheveux petits", "les cheveux bas", "le cheveu court"], answer: 0 }
        - { id: fr-w11-d2-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["crépus", "kinky/afro"], ["bouclés", "curly"], ["tressés", "braided"], ["gris", "grey"]] }
        - { id: fr-w11-d2-g08, difficulty: medium, type: text, prompt: "Translate: He wears glasses.", accept: ["Il porte des lunettes.", "Il porte des lunettes"] }
        - { id: fr-w11-d2-g09, difficulty: medium, type: text, prompt: "Translate: She is slim.", accept: ["Elle est mince.", "Elle est mince"] }
        - { id: fr-w11-d2-g10, difficulty: medium, type: mcq, prompt: "Politer than « vieux » for a person", choices: ["âgé", "ancien", "fort", "chauve"], answer: 0 }
        - { id: fr-w11-d2-g11, difficulty: medium, type: truefalse, prompt: "« Il a une barbe » means he has a beard.", answer: true }
        - { id: fr-w11-d2-g12, difficulty: medium, type: text, prompt: "Translate: He is of medium height.", accept: ["Il est de taille moyenne.", "Il est de taille moyenne"] }
        - { id: fr-w11-d2-g13, difficulty: medium, type: mcq, prompt: "green eyes", choices: ["les yeux verts", "les yeux vertes", "les œils verts", "les yeux vert"], answer: 0 }
        - { id: fr-w11-d2-g14, difficulty: medium, type: text, prompt: "Translate: She has curly hair.", accept: ["Elle a les cheveux bouclés.", "Elle a les cheveux bouclés"] }
        - { id: fr-w11-d2-g15, difficulty: medium, type: mcq, prompt: "Kinder than « gros »", choices: ["fort", "mince", "petit", "grand"], answer: 0 }
        - { id: fr-w11-d2-g16, difficulty: hard, type: text, prompt: "Translate: My father is tall, he is bald and he has a beard.", accept: ["Mon père est grand, il est chauve et il a une barbe.", "Mon père est grand, il est chauve et il a une barbe", "Mon père est grand il est chauve et il a une barbe."] }
        - { id: fr-w11-d2-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Ma sœur a les yeux marrons et elle est petit. »", choices: ["marron (no -s) … petite", "Only marrons", "Only petit", "No error"], answer: 0 }
        - { id: fr-w11-d2-g18, difficulty: hard, type: multi, prompt: "Which are correct? (Select all.)", choices: ["Elle a les cheveux courts.", "Il est de taille moyenne.", "Il porte des lunettes.", "Elle est les yeux bleus."], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Feminine forms"
        secondsPerQuestion: 8
        questions:
          - { id: fr-w11-d2-rf01, difficulty: easy, type: mcq, prompt: "généreux →", choices: ["généreuse", "généreuxe", "généreusse", "généreux"], answer: 0 }
          - { id: fr-w11-d2-rf02, difficulty: easy, type: mcq, prompt: "travailleur →", choices: ["travailleuse", "travailleure", "travailleusse", "travailleur"], answer: 0 }
          - { id: fr-w11-d2-rf03, difficulty: easy, type: mcq, prompt: "sportif →", choices: ["sportive", "sportife", "sportiffe", "sportif"], answer: 0 }
          - { id: fr-w11-d2-rf04, difficulty: easy, type: mcq, prompt: "naturel →", choices: ["naturelle", "naturele", "naturel", "naturelles"], answer: 0 }
          - { id: fr-w11-d2-rf05, difficulty: easy, type: mcq, prompt: "bon →", choices: ["bonne", "bone", "bonn", "bon"], answer: 0 }
          - { id: fr-w11-d2-rf06, difficulty: easy, type: mcq, prompt: "fier →", choices: ["fière", "fiere", "fieré", "fierre"], answer: 0 }
          - { id: fr-w11-d2-rf07, difficulty: easy, type: mcq, prompt: "créateur →", choices: ["créatrice", "créateuse", "créatrise", "créateure"], answer: 0 }
          - { id: fr-w11-d2-rf08, difficulty: easy, type: mcq, prompt: "doux →", choices: ["douce", "douse", "douxe", "douche"], answer: 0 }
          - { id: fr-w11-d2-rf09, difficulty: easy, type: mcq, prompt: "gentil →", choices: ["gentille", "gentile", "gentil", "gentilles"], answer: 0 }
          - { id: fr-w11-d2-rf10, difficulty: easy, type: mcq, prompt: "sympa (fem.)", choices: ["sympa", "sympae", "sympathe", "sympas"], answer: 0 }
      - kind: brain-teaser
        title: "Make it feminine"
        questions:
          - { id: fr-w11-d2-bt01, difficulty: medium, type: text, prompt: "ambitieux →", accept: ["ambitieuse"] }
          - { id: fr-w11-d2-bt02, difficulty: medium, type: text, prompt: "conservateur →", accept: ["conservatrice"] }
          - { id: fr-w11-d2-bt03, difficulty: medium, type: text, prompt: "créatif →", accept: ["créative"] }
          - { id: fr-w11-d2-bt04, difficulty: hard, type: text, prompt: "Translate: My sister is hard-working and generous.", accept: ["Ma sœur est travailleuse et généreuse.", "Ma sœur est travailleuse et généreuse"] }
          - { id: fr-w11-d2-bt05, difficulty: hard, type: match, prompt: "Match the irregular feminine.", pairs: [["long", "longue"], ["frais", "fraîche"], ["fou", "folle"], ["blanc", "blanche"]] }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: personality and feminine forms"
      covers: "Week 11 · Day 2: -eux/-euse, -eur/-euse, -teur/-trice, -if/-ive, -el/-elle, -on/-onne, -er/-ère, irregulars, personality words"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w11-d3-g01, difficulty: easy, type: mcq, prompt: "paresseux", choices: ["lazy", "patient", "generous", "stubborn"], answer: 0 }
        - { id: fr-w11-d3-g02, difficulty: easy, type: mcq, prompt: "bavard", choices: ["chatty", "brave", "shy", "rude"], answer: 0 }
        - { id: fr-w11-d3-g03, difficulty: easy, type: truefalse, prompt: "-if adjectives become -ive in the feminine.", answer: true }
        - { id: fr-w11-d3-g04, difficulty: easy, type: mcq, prompt: "têtu", choices: ["stubborn", "head", "polite", "funny"], answer: 0 }
        - { id: fr-w11-d3-g05, difficulty: easy, type: mcq, prompt: "drôle", choices: ["funny", "strange only", "droll and sad", "drunk"], answer: 0 }
        - { id: fr-w11-d3-g06, difficulty: easy, type: mcq, prompt: "sérieux →", choices: ["sérieuse", "sérieuxe", "sérieusse", "sérieux"], answer: 0 }
        - { id: fr-w11-d3-g07, difficulty: medium, type: match, prompt: "Match the pattern.", pairs: [["-eux", "-euse"], ["-teur", "-trice"], ["-if", "-ive"], ["-er", "-ère"]] }
        - { id: fr-w11-d3-g08, difficulty: medium, type: text, prompt: "travailleur →", accept: ["travailleuse"] }
        - { id: fr-w11-d3-g09, difficulty: medium, type: text, prompt: "naturel →", accept: ["naturelle"] }
        - { id: fr-w11-d3-g10, difficulty: medium, type: mcq, prompt: "italien →", choices: ["italienne", "italiene", "italienn", "italien"], answer: 0 }
        - { id: fr-w11-d3-g11, difficulty: medium, type: truefalse, prompt: "« ouvert » means open-minded when describing a person.", answer: true }
        - { id: fr-w11-d3-g12, difficulty: medium, type: text, prompt: "fier →", accept: ["fière"] }
        - { id: fr-w11-d3-g13, difficulty: medium, type: mcq, prompt: "menteur", choices: ["liar", "mentor", "minder", "mental"], answer: 0 }
        - { id: fr-w11-d3-g14, difficulty: medium, type: text, prompt: "doux →", accept: ["douce"] }
        - { id: fr-w11-d3-g15, difficulty: medium, type: mcq, prompt: "Which don't change in the feminine?", choices: ["sympa, calme, timide, honnête", "gentil, poli, têtu, ouvert", "sportif, actif, naïf, créatif", "bon, mignon, italien, cruel"], answer: 0 }
        - { id: fr-w11-d3-g16, difficulty: hard, type: text, prompt: "Translate: My mother is creative, sporty and very kind.", accept: ["Ma mère est créative, sportive et très gentille.", "Ma mère est créative, sportive et très gentille"] }
        - { id: fr-w11-d3-g17, difficulty: hard, type: mcq, prompt: "Spot the error: « Ma tante est généreuse, travailleuse et créatrice, mais un peu paresseux. »", choices: ["paresseux → paresseuse", "créatrice → créative", "travailleuse → travailleure", "No error"], answer: 0 }
        - { id: fr-w11-d3-g18, difficulty: hard, type: multi, prompt: "Which feminine forms are correct? (Select all.)", choices: ["courageuse", "active", "cruelle", "fiere"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Nuance and opposites"
        secondsPerQuestion: 7
        questions:
          - { id: fr-w11-d3-rf01, difficulty: easy, type: mcq, prompt: "très", choices: ["very", "too", "quite", "a bit"], answer: 0 }
          - { id: fr-w11-d3-rf02, difficulty: easy, type: mcq, prompt: "trop", choices: ["too (negative)", "very", "quite", "a lot of fun"], answer: 0 }
          - { id: fr-w11-d3-rf03, difficulty: easy, type: mcq, prompt: "assez", choices: ["quite", "enough only", "too", "not at all"], answer: 0 }
          - { id: fr-w11-d3-rf04, difficulty: easy, type: mcq, prompt: "un peu (for flaws)", choices: ["a bit", "a lot", "very", "never"], answer: 0 }
          - { id: fr-w11-d3-rf05, difficulty: easy, type: mcq, prompt: "pas du tout", choices: ["not at all", "not all", "not yet", "everything"], answer: 0 }
          - { id: fr-w11-d3-rf06, difficulty: easy, type: mcq, prompt: "généreux ↔", choices: ["égoïste", "paresseux", "timide", "impoli"], answer: 0 }
          - { id: fr-w11-d3-rf07, difficulty: easy, type: mcq, prompt: "travailleur ↔", choices: ["paresseux", "égoïste", "nerveux", "fermé"], answer: 0 }
          - { id: fr-w11-d3-rf08, difficulty: easy, type: mcq, prompt: "calme ↔", choices: ["nerveux", "timide", "poli", "drôle"], answer: 0 }
          - { id: fr-w11-d3-rf09, difficulty: easy, type: mcq, prompt: "sociable ↔", choices: ["timide", "généreux", "patient", "ouvert"], answer: 0 }
          - { id: fr-w11-d3-rf10, difficulty: easy, type: mcq, prompt: "une qualité / un défaut", choices: ["a strength / a flaw", "a quality / a default setting", "a gift / a fault line", "a level / a defeat"], answer: 0 }
      - kind: brain-teaser
        title: "Say it nicely"
        questions:
          - { id: fr-w11-d3-bt01, difficulty: medium, type: mcq, prompt: "« Il est trop bavard » sounds…", choices: ["critical", "like a compliment", "neutral", "very polite"], answer: 0 }
          - { id: fr-w11-d3-bt02, difficulty: medium, type: text, prompt: "Translate: She is quite shy.", accept: ["Elle est assez timide.", "Elle est assez timide"] }
          - { id: fr-w11-d3-bt03, difficulty: medium, type: text, prompt: "Translate: He isn't selfish at all.", accept: ["Il n'est pas du tout égoïste.", "Il n'est pas du tout égoïste"] }
          - { id: fr-w11-d3-bt04, difficulty: hard, type: mcq, prompt: "Diplomatic for « Il est méchant »", choices: ["Il n'est pas très sympa. / Il a un caractère difficile.", "Il est très méchant.", "Il est un peu gentil.", "Il est trop sympa."], answer: 0 }
          - { id: fr-w11-d3-bt05, difficulty: hard, type: text, prompt: "Translate: He is very kind, but a bit stubborn.", accept: ["Il est très gentil, mais un peu têtu.", "Il est très gentil mais un peu têtu.", "Il est très gentil, mais un peu têtu"] }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: nuance and opposites"
      covers: "Week 11 · Day 3: très, assez, trop, un peu, pas du tout; opposite pairs; diplomatic French"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: fr-w11-d4-g01, difficulty: easy, type: mcq, prompt: "too chatty", choices: ["trop bavard", "très bavard", "assez bavard", "un peu bavard"], answer: 0 }
