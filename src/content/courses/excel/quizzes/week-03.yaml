# Excel · Week 3 quizzes. Format and rules: src/content/QUIZZES.md
week: 3
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 2 review"
      covers: "Week 2: formatting, operators, SUM/AVERAGE/MIN/MAX/COUNT, errors, readability"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w03-d1-g01, difficulty: easy, type: text, prompt: "=10+2*5", accept: ["20"] }
        - { id: xl-w03-d1-g02, difficulty: easy, type: mcq, prompt: "Format Cells dialog", choices: ["Ctrl+1", "Ctrl+F", "F4", "Alt+="], answer: 0 }
        - { id: xl-w03-d1-g03, difficulty: easy, type: mcq, prompt: "Counts text cells too", choices: ["COUNTA", "COUNT", "SUM", "MAX"], answer: 0 }
        - { id: xl-w03-d1-g04, difficulty: easy, type: mcq, prompt: "=SUMM(A1:A5) shows…", choices: ["#NAME?", "#VALUE!", "#REF!", "#DIV/0!"], answer: 0 }
        - { id: xl-w03-d1-g05, difficulty: easy, type: truefalse, prompt: "Formatting never changes the stored value.", answer: true }
        - { id: xl-w03-d1-g06, difficulty: easy, type: mcq, prompt: "AutoSum (Windows)", choices: ["Alt+=", "Ctrl+=", "F2", "Ctrl+S"], answer: 0 }
        - { id: xl-w03-d1-g07, difficulty: medium, type: mcq, prompt: "Net sales with DiscountPct as a whole number in L2:", choices: ["=J2*K2*(1-L2/100)", "=J2*K2*(1-L2)", "=J2*K2-L2", "=J2*K2*L2/100"], answer: 0 }
        - { id: xl-w03-d1-g08, difficulty: medium, type: text, prompt: "=(2+3)*4-6/2", accept: ["17"] }
        - { id: xl-w03-d1-g09, difficulty: medium, type: match, prompt: "Match the error to its cause.", pairs: [["#DIV/0!", "divide by an empty cell"], ["#VALUE!", "number + text"], ["#REF!", "deleted reference"], ["#####", "column too narrow"]] }
        - { id: xl-w03-d1-g10, difficulty: medium, type: text, prompt: "NaijaMart 2025 net sales (digits only)", accept: ["834046700"] }
        - { id: xl-w03-d1-g11, difficulty: medium, type: text, prompt: "A1:A4 = 10, \"x\", 30, (empty). =AVERAGE(A1:A4)?", accept: ["20"] }
        - { id: xl-w03-d1-g12, difficulty: medium, type: mcq, prompt: "A cell shows 12.5%. The formula bar shows…", choices: ["0.125", "12.5", "125", "12.5%"], answer: 0 }
        - { id: xl-w03-d1-g13, difficulty: medium, type: truefalse, prompt: "=SUM(A1:A3) gives #VALUE! if A2 contains text.", answer: false, explain: "SUM skips text in a range." }
        - { id: xl-w03-d1-g14, difficulty: medium, type: mcq, prompt: "Show all formulas in the sheet", choices: ["Ctrl+`", "Ctrl+1", "F4", "Ctrl+Shift+F"], answer: 0 }
        - { id: xl-w03-d1-g15, difficulty: medium, type: text, prompt: "=ROUND(9.2208,1)", accept: ["9.2"] }
        - { id: xl-w03-d1-g16, difficulty: hard, type: text, prompt: "Total discount given in 2025: gross ₦907,677,800 − net ₦834,046,700 (digits only)", accept: ["73631100"] }
        - { id: xl-w03-d1-g17, difficulty: hard, type: mcq, prompt: "Order IDs (NM-00001…) are in A2:A2401. Which counts the orders?", choices: ["=COUNTA(A2:A2401)", "=COUNT(A2:A2401)", "=SUM(A2:A2401)", "=MAX(A2:A2401)"], answer: 0 }
        - { id: xl-w03-d1-g18, difficulty: hard, type: multi, prompt: "Which give #VALUE!? (Select all.)", choices: ["=5+\"five\"", "=\"a\"*2", "=SUM(A1:A3) with text in A2", "=10/2"], answers: [0, 1], explain: "SUM skips text inside a range." }
    quizzes:
      - kind: rapid-fire
        title: "Where does it move?"
        secondsPerQuestion: 9
        questions:
          - { id: xl-w03-d1-rf01, difficulty: easy, type: text, prompt: "=A1*2 in B1, copied to B2 becomes…", accept: ["=A2*2"] }
          - { id: xl-w03-d1-rf02, difficulty: easy, type: text, prompt: "=J2*K2 in N2, copied to N3 becomes…", accept: ["=J3*K3"] }
          - { id: xl-w03-d1-rf03, difficulty: easy, type: text, prompt: "=J2*K2 in N2, copied to O2 becomes…", accept: ["=K2*L2"] }
          - { id: xl-w03-d1-rf04, difficulty: easy, type: text, prompt: "=A1+B1 in C1, copied to C10 becomes…", accept: ["=A10+B10"] }
          - { id: xl-w03-d1-rf05, difficulty: easy, type: mcq, prompt: "By default, references are…", choices: ["relative", "absolute", "mixed", "fixed"], answer: 0 }
          - { id: xl-w03-d1-rf06, difficulty: easy, type: mcq, prompt: "Show which cells a formula uses (coloured boxes)", choices: ["F2", "F4", "F9", "Ctrl+1"], answer: 0 }
          - { id: xl-w03-d1-rf07, difficulty: easy, type: truefalse, prompt: "Relative references move by the same rows and columns as the copy.", answer: true }
          - { id: xl-w03-d1-rf08, difficulty: easy, type: text, prompt: "=A5*2 when A5 = 5 →", accept: ["10"] }
          - { id: xl-w03-d1-rf09, difficulty: easy, type: text, prompt: "=A1*2 in B1, copied to B5 becomes…", accept: ["=A5*2"] }
          - { id: xl-w03-d1-rf10, difficulty: easy, type: text, prompt: "=C1 in D1, copied to E1 becomes…", accept: ["=D1"] }
      - kind: brain-teaser
        title: "Copy and predict"
        questions:
          - { id: xl-w03-d1-bt01, difficulty: medium, type: text, prompt: "=A1*2 in B1 is copied and pasted into D3. What formula appears?", accept: ["=C3*2"], explain: "Moved 2 columns right and 2 rows down." }
          - { id: xl-w03-d1-bt02, difficulty: medium, type: text, prompt: "=J2*K2 in N2. What's in N500 after fill-down?", accept: ["=J500*K500"] }
          - { id: xl-w03-d1-bt03, difficulty: medium, type: text, prompt: "=B3-A3 in C3, copied to E7 becomes…", accept: ["=D7-C7"] }
          - { id: xl-w03-d1-bt04, difficulty: hard, type: mcq, prompt: "=A2+B2 in C2 is copied to C1 (one row UP). It becomes…", choices: ["=A1+B1", "=A3+B3", "=A2+B2", "#REF!"], answer: 0 }
          - { id: xl-w03-d1-bt05, difficulty: hard, type: mcq, prompt: "=A1+1 in B1 is copied to A2 (one column LEFT, one row down). It becomes…", choices: ["#REF!: there's no column left of A", "=A2+1", "=B2+1", "=A1+1"], answer: 0 }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: relative references"
      covers: "Week 3 · Day 1: how references move when copied, F2"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w03-d2-g01, difficulty: easy, type: text, prompt: "=A1*3 in B1, copied to B2 becomes…", accept: ["=A2*3"] }
        - { id: xl-w03-d2-g02, difficulty: easy, type: text, prompt: "=A1+B1 in C1, copied to C2 becomes…", accept: ["=A2+B2"] }
        - { id: xl-w03-d2-g03, difficulty: easy, type: mcq, prompt: "Which key shows coloured boxes around a formula's cells?", choices: ["F2", "F4", "F11", "Esc"], answer: 0 }
        - { id: xl-w03-d2-g04, difficulty: easy, type: truefalse, prompt: "One GrossSales formula filled down worked for 2,400 rows because references are relative.", answer: true }
        - { id: xl-w03-d2-g05, difficulty: easy, type: mcq, prompt: "A relative reference looks like…", choices: ["A1", "$A$1", "$A1", "A$1"], answer: 0 }
        - { id: xl-w03-d2-g06, difficulty: easy, type: text, prompt: "=D4 in E4, copied to E5 becomes…", accept: ["=D5"] }
        - { id: xl-w03-d2-g07, difficulty: medium, type: text, prompt: "=J2*K2 in N2, copied to P2 becomes…", accept: ["=L2*M2"] }
        - { id: xl-w03-d2-g08, difficulty: medium, type: text, prompt: "=A1*2 in B1, pasted into C4 becomes…", accept: ["=B4*2"] }
        - { id: xl-w03-d2-g09, difficulty: medium, type: mcq, prompt: "Copying a formula one row down changes…", choices: ["every row number by +1", "every column letter by +1", "nothing", "only the first reference"], answer: 0 }
        - { id: xl-w03-d2-g10, difficulty: medium, type: mcq, prompt: "Copying a formula one column right changes…", choices: ["every column letter by one", "every row number by one", "nothing", "only numbers in the formula"], answer: 0 }
        - { id: xl-w03-d2-g11, difficulty: medium, type: text, prompt: "A1:A5 = 1–5. B1 = =A1*2, filled down. Value in B5?", accept: ["10"] }
        - { id: xl-w03-d2-g12, difficulty: medium, type: truefalse, prompt: "Typed numbers inside a formula (like the 2 in =A1*2) change when copied.", answer: false }
        - { id: xl-w03-d2-g13, difficulty: medium, type: text, prompt: "=SUM(A1:A3) in A4, copied to B4 becomes…", accept: ["=SUM(B1:B3)"] }
        - { id: xl-w03-d2-g14, difficulty: medium, type: text, prompt: "=SUM(A1:A3) in A4, copied to A5 becomes…", accept: ["=SUM(A2:A4)"] }
        - { id: xl-w03-d2-g15, difficulty: medium, type: mcq, prompt: "Why does a relative reference move?", choices: ["Excel stores it as \"so many rows/columns away from this cell\"", "Excel guesses", "It's a bug", "Because of formatting"], answer: 0 }
        - { id: xl-w03-d2-g16, difficulty: hard, type: text, prompt: "=B2*C2-D1 in E2, copied to G5 becomes…", accept: ["=D5*E5-F4"] }
        - { id: xl-w03-d2-g17, difficulty: hard, type: mcq, prompt: "=A3 in B3 is copied to B1. It becomes…", choices: ["=A1", "=A5", "=A3", "#REF!"], answer: 0 }
        - { id: xl-w03-d2-g18, difficulty: hard, type: mcq, prompt: "=A2 in B2 is copied to A1. It becomes…", choices: ["#REF!", "=A1", "=Z1", "=A2"], answer: 0, explain: "One column left of A doesn't exist." }
    quizzes:
      - kind: rapid-fire
        title: "Lock it"
        secondsPerQuestion: 8
        questions:
          - { id: xl-w03-d2-rf01, difficulty: easy, type: mcq, prompt: "Column AND row locked", choices: ["$A$1", "A1", "$A1", "A$1"], answer: 0 }
          - { id: xl-w03-d2-rf02, difficulty: easy, type: mcq, prompt: "Only the column locked", choices: ["$A1", "A$1", "$A$1", "A1"], answer: 0 }
          - { id: xl-w03-d2-rf03, difficulty: easy, type: mcq, prompt: "Only the row locked", choices: ["A$1", "$A1", "$A$1", "A1"], answer: 0 }
          - { id: xl-w03-d2-rf04, difficulty: easy, type: mcq, prompt: "Cycle through reference types", choices: ["F4", "F2", "F9", "Ctrl+$"], answer: 0 }
          - { id: xl-w03-d2-rf05, difficulty: easy, type: mcq, prompt: "Nigerian VAT rate", choices: ["7.5%", "5%", "10%", "15%"], answer: 0 }
          - { id: xl-w03-d2-rf06, difficulty: easy, type: text, prompt: "=O2*$R$1 in Q2, filled to Q3 becomes…", accept: ["=O3*$R$1"] }
          - { id: xl-w03-d2-rf07, difficulty: easy, type: mcq, prompt: "$A$1 is called…", choices: ["absolute", "relative", "mixed", "fixed-row"], answer: 0 }
          - { id: xl-w03-d2-rf08, difficulty: easy, type: mcq, prompt: "F4 order starting from A1", choices: ["$A$1 → A$1 → $A1 → A1", "A$1 → $A1 → $A$1", "$A1 → A$1 → $A$1", "A1 → A1"], answer: 0 }
          - { id: xl-w03-d2-rf09, difficulty: easy, type: truefalse, prompt: "Put the VAT rate in one cell and point every formula at it.", answer: true }
          - { id: xl-w03-d2-rf10, difficulty: easy, type: text, prompt: "₦10,000 × 7.5% VAT = ? (digits only)", accept: ["750"] }
      - kind: brain-teaser
        title: "Why are they zero?"
        questions:
          - { id: xl-w03-d2-bt01, difficulty: medium, type: mcq, prompt: "=O2*R1 in Q2, filled down. Most of column Q is 0. Why?", choices: ["R1 moved to R2, R3…, which are empty", "VAT is 0", "O is empty", "Excel can't multiply percentages"], answer: 0 }
          - { id: xl-w03-d2-bt02, difficulty: medium, type: text, prompt: "Fix the formula so the rate stays in R1: =O2*R1 →", accept: ["=O2*$R$1"] }
          - { id: xl-w03-d2-bt03, difficulty: medium, type: text, prompt: "Total VAT on ₦834,046,700 at 7.5%? (digits only, with .5 if any)", accept: ["62553502.5", "62553502.50"] }
          - { id: xl-w03-d2-bt04, difficulty: hard, type: mcq, prompt: "The rate in R1 changes from 7.5% to 10%. What happens to 2,400 VAT formulas using $R$1?", choices: ["They all update at once", "Nothing until you retype them", "Only Q2 updates", "They show #REF!"], answer: 0 }
          - { id: xl-w03-d2-bt05, difficulty: hard, type: text, prompt: "=A2*$D$1 in B2 is copied to C5. It becomes…", accept: ["=B5*$D$1"] }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: absolute references"
      covers: "Week 3 · Day 2: $ references, F4, a single rate cell, VAT"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w03-d3-g01, difficulty: easy, type: mcq, prompt: "Lock both column and row", choices: ["$A$1", "A$1", "$A1", "A1"], answer: 0 }
        - { id: xl-w03-d3-g02, difficulty: easy, type: mcq, prompt: "Which key adds the $ signs for you?", choices: ["F4", "F2", "Ctrl+$", "Shift+4"], answer: 0 }
        - { id: xl-w03-d3-g03, difficulty: easy, type: text, prompt: "=B2*$F$1 in C2, filled to C3 becomes…", accept: ["=B3*$F$1"] }
        - { id: xl-w03-d3-g04, difficulty: easy, type: truefalse, prompt: "An absolute reference never moves when copied.", answer: true }
        - { id: xl-w03-d3-g05, difficulty: easy, type: mcq, prompt: "Nigeria's VAT rate", choices: ["7.5%", "7%", "10%", "5%"], answer: 0 }
        - { id: xl-w03-d3-g06, difficulty: easy, type: mcq, prompt: "VAT on O2 with the rate in R1:", choices: ["=O2*$R$1", "=O2*R1", "=O2+R1", "=$O$2*R1"], answer: 0 }
        - { id: xl-w03-d3-g07, difficulty: medium, type: match, prompt: "Match the reference to what's locked.", pairs: [["A1", "nothing"], ["$A$1", "column and row"], ["$A1", "column only"], ["A$1", "row only"]] }
        - { id: xl-w03-d3-g08, difficulty: medium, type: text, prompt: "=O2*$R$1 in Q2, copied to Q500 becomes…", accept: ["=O500*$R$1"] }
        - { id: xl-w03-d3-g09, difficulty: medium, type: mcq, prompt: "Why keep the VAT rate in one cell?", choices: ["Change it once and every formula updates", "Excel requires it", "It's faster to type", "Percentages can't go in formulas"], answer: 0 }
        - { id: xl-w03-d3-g10, difficulty: medium, type: text, prompt: "₦145,000 × 7.5% VAT = ? (digits only)", accept: ["10875"] }
        - { id: xl-w03-d3-g11, difficulty: medium, type: mcq, prompt: "You type =O2*R1 and press F4 once with the cursor on R1. You get…", choices: ["=O2*$R$1", "=O2*R$1", "=O2*$R1", "=$O$2*R1"], answer: 0 }
        - { id: xl-w03-d3-g12, difficulty: medium, type: truefalse, prompt: "=O2*R1 filled down gives the same VAT in every row.", answer: false, explain: "R1 becomes R2, R3… (empty), so most results are 0." }
        - { id: xl-w03-d3-g13, difficulty: medium, type: text, prompt: "Total VAT at 7.5% on NaijaMart's ₦834,046,700 net sales? (digits only)", accept: ["62553502.5", "62553502.50"] }
        - { id: xl-w03-d3-g14, difficulty: medium, type: mcq, prompt: "=A2*$B$1 copied one column right becomes…", choices: ["=B2*$B$1", "=B2*$C$1", "=A2*$B$1", "=B2*C1"], answer: 0 }
        - { id: xl-w03-d3-g15, difficulty: medium, type: text, prompt: "Price incl. VAT on ₦10,000 at 7.5%? (digits only)", accept: ["10750"] }
        - { id: xl-w03-d3-g16, difficulty: hard, type: text, prompt: "=C3*$H$2+D3 in E3, copied to G7 becomes…", accept: ["=E7*$H$2+F7"] }
        - { id: xl-w03-d3-g17, difficulty: hard, type: mcq, prompt: "Price incl. VAT in P2 (price in K2, rate in $R$1):", choices: ["=K2*(1+$R$1)", "=K2*$R$1", "=K2+$R$1", "=K2*(1-$R$1)"], answer: 0 }
        - { id: xl-w03-d3-g18, difficulty: hard, type: multi, prompt: "Which formulas keep pointing at R1 when filled down AND across? (Select all.)", choices: ["=O2*$R$1", "=O2*R$1", "=O2*$R1", "=O2*R1"], answers: [0], explain: "R$1 moves across columns; $R1 moves down rows." }
    quizzes:
      - kind: rapid-fire
        title: "Percent sprint"
        secondsPerQuestion: 9
        questions:
          - { id: xl-w03-d3-rf01, difficulty: easy, type: mcq, prompt: "What % is part of total?", choices: ["=part/total", "=total/part", "=part*total", "=part-total"], answer: 0 }
          - { id: xl-w03-d3-rf02, difficulty: easy, type: mcq, prompt: "Increase by 15%", choices: ["=value*(1+15%)", "=value+15%", "=value*15%", "=value/15%"], answer: 0 }
          - { id: xl-w03-d3-rf03, difficulty: easy, type: mcq, prompt: "Decrease by 15%", choices: ["=value*(1-15%)", "=value-15%", "=value*15%", "=value/(1-15%)"], answer: 0 }
          - { id: xl-w03-d3-rf04, difficulty: easy, type: mcq, prompt: "% change from old to new", choices: ["=(new-old)/old", "=(old-new)/new", "=new/old", "=new-old"], answer: 0 }
          - { id: xl-w03-d3-rf05, difficulty: easy, type: text, prompt: "50 of 200 as a %", accept: ["25%", "0.25"] }
          - { id: xl-w03-d3-rf06, difficulty: easy, type: text, prompt: "1,000 increased by 10% = ?", accept: ["1100", "1,100"] }
          - { id: xl-w03-d3-rf07, difficulty: easy, type: text, prompt: "1,000 decreased by 20% = ?", accept: ["800"] }
          - { id: xl-w03-d3-rf08, difficulty: easy, type: text, prompt: "Old 100, new 150. % change?", accept: ["50%", "0.5", "+50%"] }
          - { id: xl-w03-d3-rf09, difficulty: easy, type: mcq, prompt: "% of total with the total in B8", choices: ["=B2/$B$8", "=B2/B8", "=$B$2/B8", "=B8/B2"], answer: 0 }
          - { id: xl-w03-d3-rf10, difficulty: easy, type: truefalse, prompt: "=B2/B8 filled down breaks because B8 moves.", answer: true }
      - kind: brain-teaser
        title: "Regional shares"
        questions:
          - { id: xl-w03-d3-bt01, difficulty: medium, type: mcq, prompt: "Lagos ₦321,703,800 of ₦834,046,700 total. Share (1 decimal)?", choices: ["38.6%", "32.2%", "61.4%", "3.9%"], answer: 0 }
          - { id: xl-w03-d3-bt02, difficulty: medium, type: text, prompt: "Old 80, new 60. % change? (e.g. -10%)", accept: ["-25%", "-0.25"] }
          - { id: xl-w03-d3-bt03, difficulty: medium, type: text, prompt: "January ₦43,211,125, December ₦109,612,345. % change, 1 decimal? (e.g. +12.3%)", accept: ["+153.7%", "153.7%", "1.537"] }
          - { id: xl-w03-d3-bt04, difficulty: hard, type: mcq, prompt: "% of total shows 100% in C2, then #DIV/0! below. The formula was =B2/B8. Why?", choices: ["B8 moved to B9, B10… (empty): lock it with $B$8", "B8 is text", "Percent format is wrong", "C2 is circular"], answer: 0 }
          - { id: xl-w03-d3-bt05, difficulty: hard, type: text, prompt: "A ₦20,000 item rises 10%, then falls 10%. New price? (digits only)", accept: ["19800"], explain: "20,000 × 1.1 × 0.9 = 19,800: not back to 20,000." }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: percentages"
      covers: "Week 3 · Day 3: part of total, increase/decrease by %, % change, % of total with a locked total"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w03-d4-g01, difficulty: easy, type: mcq, prompt: "% change formula", choices: ["=(new-old)/old", "=(new-old)/new", "=new/old-old", "=old/new"], answer: 0 }
        - { id: xl-w03-d4-g02, difficulty: easy, type: text, prompt: "30 of 120 as a %", accept: ["25%", "0.25"] }
        - { id: xl-w03-d4-g03, difficulty: easy, type: text, prompt: "₦5,000 increased by 20%? (digits only)", accept: ["6000"] }
        - { id: xl-w03-d4-g04, difficulty: easy, type: truefalse, prompt: "% of total needs an absolute reference to the total.", answer: true }
        - { id: xl-w03-d4-g05, difficulty: easy, type: mcq, prompt: "Decrease A2 by 5%", choices: ["=A2*(1-5%)", "=A2-5%", "=A2*5%", "=A2*(1+5%)"], answer: 0 }
        - { id: xl-w03-d4-g06, difficulty: easy, type: text, prompt: "₦8,000 decreased by 25%? (digits only)", accept: ["6000"] }
        - { id: xl-w03-d4-g07, difficulty: medium, type: text, prompt: "Old ₦40,000, new ₦50,000. % change?", accept: ["25%", "+25%", "0.25"] }
        - { id: xl-w03-d4-g08, difficulty: medium, type: text, prompt: "Old ₦50,000, new ₦40,000. % change?", accept: ["-20%", "-0.2"] }
        - { id: xl-w03-d4-g09, difficulty: medium, type: mcq, prompt: "Enugu ₦77,467,230 of ₦834,046,700. Share (1 decimal)?", choices: ["9.3%", "7.7%", "10.8%", "93%"], answer: 0 }
        - { id: xl-w03-d4-g10, difficulty: medium, type: match, prompt: "Match the question to the formula.", pairs: [["Part of total", "=B2/$B$8"], ["Up 15%", "=A2*(1+15%)"], ["Down 15%", "=A2*(1-15%)"], ["Change", "=(C2-B2)/B2"]] }
        - { id: xl-w03-d4-g11, difficulty: medium, type: mcq, prompt: "=B2/$B$8 in C2, filled to C7. C7 contains…", choices: ["=B7/$B$8", "=B7/$B$13", "=B2/$B$8", "=B7/B13"], answer: 0 }
        - { id: xl-w03-d4-g12, difficulty: medium, type: truefalse, prompt: "The % of total column should add up to 100%.", answer: true }
        - { id: xl-w03-d4-g13, difficulty: medium, type: text, prompt: "Price ₦200,000; staff discount 20%. Staff price? (digits only)", accept: ["160000"] }
