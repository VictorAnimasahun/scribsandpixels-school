          - { id: xl-w13-d3-rf07, difficulty: easy, type: text, prompt: "Company variance % (1 decimal)?", accept: ["-1.3%", "-1.3", "−1.3%"] }
          - { id: xl-w13-d3-rf08, difficulty: easy, type: text, prompt: "Worst miss: region?", accept: ["Lagos"] }
          - { id: xl-w13-d3-rf09, difficulty: easy, type: truefalse, prompt: "NaijaMart beat its 2025 company target.", answer: false }
          - { id: xl-w13-d3-rf10, difficulty: easy, type: mcq, prompt: "Actual per region-month uses…", choices: ["SUMIFS on tblSales", "VLOOKUP", "COUNTIF", "a slicer"], answer: 0 }
      - kind: brain-teaser
        title: "Hits and misses"
        questions:
          - { id: xl-w13-d3-bt01, difficulty: medium, type: text, prompt: "Company variance (₦, no symbol, with sign)?", accept: ["-10853300", "-10,853,300"] }
          - { id: xl-w13-d3-bt02, difficulty: medium, type: mcq, prompt: "Worst miss", choices: ["Lagos, December (−₦5,896,200)", "Kano, January", "Lagos, October", "Enugu, May"], answer: 0 }
