# Excel · Week 13 quizzes. Format and rules: src/content/QUIZZES.md
# Figures verified against datasets/ (sales_2025.csv, products.csv, targets_2025.csv).
week: 13
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 12 review"
      covers: "Week 12: PivotTable areas, refresh, drill-down, cross-tabs, grouping, Show Values As, filters, PivotCharts"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w13-d1-g01, difficulty: easy, type: mcq, prompt: "The 4 pivot areas", choices: ["Rows, Columns, Values, Filters", "Top, Side, Middle, Bottom", "Data, Chart, Table, Sheet", "Sum, Count, Max, Min"], answer: 0 }
        - { id: xl-w13-d1-g02, difficulty: easy, type: mcq, prompt: "Refresh one pivot", choices: ["Alt+F5", "F5", "Ctrl+R", "F9"], answer: 0 }
        - { id: xl-w13-d1-g03, difficulty: easy, type: truefalse, prompt: "Double-clicking a pivot value shows the rows behind it.", answer: true }
        - { id: xl-w13-d1-g04, difficulty: easy, type: mcq, prompt: "Month-on-month growth", choices: ["% Difference From (previous)", "% of Grand Total", "Running Total", "Rank"], answer: 0 }
        - { id: xl-w13-d1-g05, difficulty: easy, type: mcq, prompt: "One pivot sheet per region", choices: ["Show Report Filter Pages", "Group", "Drill-down", "Copy sheet"], answer: 0 }
        - { id: xl-w13-d1-g06, difficulty: easy, type: mcq, prompt: "Most-used payment method", choices: ["Transfer", "Cash", "POS", "Card"], answer: 0 }
        - { id: xl-w13-d1-g07, difficulty: medium, type: text, prompt: "Average wholesale order (₦, no symbol)?", accept: ["1156902", "1,156,902"] }
        - { id: xl-w13-d1-g08, difficulty: medium, type: text, prompt: "Month with the biggest jump vs the month before?", accept: ["March", "Mar", "2025-03"] }
        - { id: xl-w13-d1-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["% of Grand Total", "share of everything"], ["Running Total In", "year-to-date"], ["Rank Largest to Smallest", "ranking"], ["% of Column Total", "mix within a column"]] }
        - { id: xl-w13-d1-g10, difficulty: medium, type: text, prompt: "South (all but Kano and Abuja) net sales (₦, no symbol)?", accept: ["570636550", "570,636,550"] }
        - { id: xl-w13-d1-g11, difficulty: medium, type: truefalse, prompt: "Pivots update by themselves when tblSales changes.", answer: false }
        - { id: xl-w13-d1-g12, difficulty: medium, type: text, prompt: "Rank 1 salesperson?", accept: ["Tolu Eze"] }
        - { id: xl-w13-d1-g13, difficulty: medium, type: mcq, prompt: "Phones' best quarter", choices: ["Q4 (₦44.7M)", "Q1", "Q2", "Q3"], answer: 0 }
        - { id: xl-w13-d1-g14, difficulty: medium, type: text, prompt: "Weekend share of net sales (1 decimal %)?", accept: ["23.2%", "23.2"] }
        - { id: xl-w13-d1-g15, difficulty: medium, type: mcq, prompt: "Stores above ₦100M", choices: ["Lagos - Ikeja, Abuja - Wuse, Lagos - Lekki", "every Lagos store", "Abuja - Wuse only", "none"], answer: 0 }
        - { id: xl-w13-d1-g16, difficulty: hard, type: mcq, prompt: "Region most dependent on Groceries", choices: ["Port Harcourt (32.9%)", "Lagos", "Abuja", "Kano"], answer: 0 }
        - { id: xl-w13-d1-g17, difficulty: hard, type: text, prompt: "December vs November growth (1 decimal %)?", accept: ["42.5%", "42.5", "+42.5%"] }
        - { id: xl-w13-d1-g18, difficulty: hard, type: multi, prompt: "A pivot can group… (Select all.)", choices: ["dates", "numbers into bins", "chosen text items", "the source formulas"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Slicers and timelines"
        secondsPerQuestion: 8
        questions:
          - { id: xl-w13-d1-rf01, difficulty: easy, type: mcq, prompt: "Big clickable filter buttons", choices: ["Slicer", "Timeline", "Sparkline", "Data bar"], answer: 0 }
          - { id: xl-w13-d1-rf02, difficulty: easy, type: mcq, prompt: "Filter by dragging across months", choices: ["Timeline", "Slicer", "Group", "Sort"], answer: 0 }
          - { id: xl-w13-d1-rf03, difficulty: easy, type: mcq, prompt: "Select several slicer items", choices: ["Ctrl+click", "Alt+click", "double-click", "F2"], answer: 0 }
          - { id: xl-w13-d1-rf04, difficulty: easy, type: mcq, prompt: "One slicer, many pivots", choices: ["Report Connections", "Group", "Refresh", "Drill-down"], answer: 0 }
          - { id: xl-w13-d1-rf05, difficulty: easy, type: mcq, prompt: "Insert a slicer from…", choices: ["PivotTable Analyze → Insert Slicer", "Data → Slicer only", "Home → Slicer", "Review → Slicer"], answer: 0 }
          - { id: xl-w13-d1-rf06, difficulty: easy, type: truefalse, prompt: "A timeline needs a date field.", answer: true }
          - { id: xl-w13-d1-rf07, difficulty: easy, type: mcq, prompt: "Style a slicer on the…", choices: ["Slicer tab", "Home tab", "Data tab", "View tab"], answer: 0 }
          - { id: xl-w13-d1-rf08, difficulty: easy, type: text, prompt: "Rows in tblTargets?", accept: ["72"] }
          - { id: xl-w13-d1-rf09, difficulty: easy, type: mcq, prompt: "tblTargets columns", choices: ["Region, Month, SalesTarget", "OrderID, Target", "Store, Year", "Product, Target"], answer: 0 }
          - { id: xl-w13-d1-rf10, difficulty: easy, type: mcq, prompt: "Heart of an Excel dashboard", choices: ["slicers connected to several pivots", "one big pie", "macros", "merged cells"], answer: 0 }
      - kind: brain-teaser
        title: "The targets table"
        questions:
          - { id: xl-w13-d1-bt01, difficulty: medium, type: text, prompt: "Total annual target (₦, no symbol)?", accept: ["844900000", "844,900,000"] }
          - { id: xl-w13-d1-bt02, difficulty: medium, type: mcq, prompt: "72 rows because…", choices: ["6 regions × 12 months", "72 stores", "72 products", "one per week"], answer: 0 }
          - { id: xl-w13-d1-bt03, difficulty: medium, type: mcq, prompt: "You click \"Wholesale\" but only one of 3 pivots changes. Fix:", choices: ["Report Connections: tick all three", "Refresh", "Delete the slicer", "Group"], answer: 0 }
          - { id: xl-w13-d1-bt04, difficulty: hard, type: mcq, prompt: "A slicer can only connect pivots that…", choices: ["share the same data source (cache)", "are on one sheet", "have the same layout", "use the same style"], answer: 0 }
          - { id: xl-w13-d1-bt05, difficulty: hard, type: text, prompt: "Lagos annual target (₦, no symbol)?", accept: ["323500000", "323,500,000"] }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: slicers and timelines"
      covers: "Week 13 · Day 1: slicers, timelines, Report Connections, tblTargets"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w13-d2-g01, difficulty: easy, type: mcq, prompt: "A slicer filters…", choices: ["the pivots connected to it", "every sheet", "only charts", "the source table"], answer: 0 }
        - { id: xl-w13-d2-g02, difficulty: easy, type: mcq, prompt: "Timelines filter by…", choices: ["date periods", "text", "numbers only", "colour"], answer: 0 }
        - { id: xl-w13-d2-g03, difficulty: easy, type: truefalse, prompt: "Report Connections lets one slicer control several pivots.", answer: true }
        - { id: xl-w13-d2-g04, difficulty: easy, type: mcq, prompt: "Clear a slicer's filter", choices: ["the Clear Filter button (funnel with ×)", "Delete key", "Refresh", "Ctrl+Z"], answer: 0 }
        - { id: xl-w13-d2-g05, difficulty: easy, type: mcq, prompt: "Timeline levels", choices: ["Years, Quarters, Months, Days", "Hours only", "Weeks only", "Regions"], answer: 0 }
        - { id: xl-w13-d2-g06, difficulty: easy, type: mcq, prompt: "Import targets as…", choices: ["tblTargets", "Sheet2", "Targets 2025 table", "T1"], answer: 0 }
        - { id: xl-w13-d2-g07, difficulty: medium, type: text, prompt: "Total target (₦, no symbol)?", accept: ["844900000", "844,900,000"] }
        - { id: xl-w13-d2-g08, difficulty: medium, type: mcq, prompt: "Slicer showing 6 regions in 2 rows", choices: ["Slicer → Columns: 3", "Resize only", "Group regions", "Impossible"], answer: 0 }
        - { id: xl-w13-d2-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["Slicer", "click to filter items"], ["Timeline", "drag to filter dates"], ["Report Connections", "link to more pivots"], ["Ctrl+click", "select several items"]] }
        - { id: xl-w13-d2-g10, difficulty: medium, type: truefalse, prompt: "Slicers work on Excel Tables too, not only pivots.", answer: true }
        - { id: xl-w13-d2-g11, difficulty: medium, type: text, prompt: "Kano annual target (₦, no symbol)?", accept: ["94400000", "94,400,000"] }
        - { id: xl-w13-d2-g12, difficulty: medium, type: mcq, prompt: "Wholesale + Q4 selected: what do the 3 pivots show?", choices: ["only wholesale orders from Oct–Dec", "all orders", "Q4 only for one pivot", "an error"], answer: 0 }
        - { id: xl-w13-d2-g13, difficulty: medium, type: text, prompt: "Abuja annual target (₦, no symbol)?", accept: ["176100000", "176,100,000"] }
        - { id: xl-w13-d2-g14, difficulty: medium, type: mcq, prompt: "Remove an obvious slicer header", choices: ["Slicer Settings → untick Display header", "Delete the slicer", "Hide the row", "Refresh"], answer: 0 }
        - { id: xl-w13-d2-g15, difficulty: medium, type: multi, prompt: "Dashboard filters (Select all.)", choices: ["CustomerType slicer", "PaymentMethod slicer", "OrderDate timeline", "A merged cell"], answers: [0, 1, 2] }
        - { id: xl-w13-d2-g16, difficulty: hard, type: mcq, prompt: "Report Connections doesn't list your pivot. Likely…", choices: ["it uses a different source/cache", "it's sorted", "it's on another sheet", "the slicer is styled"], answer: 0 }
        - { id: xl-w13-d2-g17, difficulty: hard, type: text, prompt: "Port Harcourt annual target (₦, no symbol)?", accept: ["88300000", "88,300,000"] }
        - { id: xl-w13-d2-g18, difficulty: hard, type: multi, prompt: "True about slicers (Select all.)", choices: ["they show the current filter visibly", "they can drive several pivots", "they can be styled", "they edit tblSales"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Calculated fields"
        secondsPerQuestion: 8
        questions:
          - { id: xl-w13-d2-rf01, difficulty: easy, type: mcq, prompt: "Add a calculated field from…", choices: ["PivotTable Analyze → Fields, Items & Sets", "Data → Calculate", "Home → Insert", "Formulas → Name"], answer: 0 }
          - { id: xl-w13-d2-rf02, difficulty: easy, type: mcq, prompt: "Calculated fields work on…", choices: ["sums of fields", "each row", "text", "dates only"], answer: 0 }
          - { id: xl-w13-d2-rf03, difficulty: easy, type: mcq, prompt: "Correct calculated field", choices: ["Margin % = Profit / NetSales", "GrossSales = Units * UnitPrice", "both", "neither"], answer: 0 }
          - { id: xl-w13-d2-rf04, difficulty: easy, type: mcq, prompt: "Row-level maths belongs…", choices: ["in a table column", "in a calculated field", "in a slicer", "in a timeline"], answer: 0 }
          - { id: xl-w13-d2-rf05, difficulty: easy, type: text, prompt: "Overall margin (1 decimal %)?", accept: ["15.5%", "15.5"] }
          - { id: xl-w13-d2-rf06, difficulty: easy, type: text, prompt: "Category with the most profit?", accept: ["Fashion"] }
          - { id: xl-w13-d2-rf07, difficulty: easy, type: text, prompt: "Category with the lowest margin %?", accept: ["Groceries"] }
          - { id: xl-w13-d2-rf08, difficulty: easy, type: mcq, prompt: "Commission = NetSales * 0.03 as a calculated field is…", choices: ["fine (sum × constant)", "wrong", "impossible", "only for counts"], answer: 0 }
          - { id: xl-w13-d2-rf09, difficulty: easy, type: mcq, prompt: "Calculated item combines…", choices: ["items inside one field", "two tables", "two workbooks", "slicers"], answer: 0 }
          - { id: xl-w13-d2-rf10, difficulty: easy, type: truefalse, prompt: "Calculated items should be used sparingly.", answer: true }
      - kind: brain-teaser
        title: "Sum × sum"
        questions:
          - { id: xl-w13-d2-bt01, difficulty: medium, type: mcq, prompt: "Why is =Units*UnitPrice wrong as a calculated field?", choices: ["It multiplies the sum of Units by the sum of UnitPrice", "UnitPrice is text", "Pivots can't multiply", "It ignores discounts only"], answer: 0 }
          - { id: xl-w13-d2-bt02, difficulty: medium, type: text, prompt: "Real GrossSales total (₦, no symbol)?", accept: ["907677800", "907,677,800"] }
          - { id: xl-w13-d2-bt03, difficulty: medium, type: text, prompt: "Fashion profit (₦, no symbol)?", accept: ["23344525", "23,344,525"] }
          - { id: xl-w13-d2-bt04, difficulty: hard, type: mcq, prompt: "Margin by category, best to worst ends", choices: ["Fashion 32.7% … Groceries 7.3%", "Groceries … Fashion", "Phones … Office", "all 15.5%"], answer: 0 }
          - { id: xl-w13-d2-bt05, difficulty: hard, type: mcq, prompt: "Groceries is the top category by sales but has the lowest margin. So…", choices: ["big revenue, thin profit; watch discounts there", "it's the most profitable", "the pivot is wrong", "drop margins"], answer: 0 }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: calculated fields"
      covers: "Week 13 · Day 2: calculated fields on sums, Margin %, why sum × sum fails, calculated items"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w13-d3-g01, difficulty: easy, type: mcq, prompt: "Margin % as a calculated field", choices: ["=Profit/NetSales", "=NetSales/Profit", "=Profit*NetSales", "=Units*UnitPrice"], answer: 0 }
        - { id: xl-w13-d3-g02, difficulty: easy, type: mcq, prompt: "Cost column in tblSales", choices: ["=[@Units]*[@UnitCost]", "=Units*UnitCost as a calculated field", "=SUM(Units)", "=[@NetSales]-[@Units]"], answer: 0 }
        - { id: xl-w13-d3-g03, difficulty: easy, type: truefalse, prompt: "A ratio of two sums (Profit/NetSales) is right as a calculated field.", answer: true }
        - { id: xl-w13-d3-g04, difficulty: easy, type: mcq, prompt: "Format Margin % as…", choices: ["percentage", "currency", "date", "text"], answer: 0 }
        - { id: xl-w13-d3-g05, difficulty: easy, type: text, prompt: "Overall margin (1 decimal %)?", accept: ["15.5%", "15.5"] }
        - { id: xl-w13-d3-g06, difficulty: easy, type: mcq, prompt: "Most profit (₦)", choices: ["Fashion", "Groceries", "Phones", "Office"], answer: 0 }
        - { id: xl-w13-d3-g07, difficulty: medium, type: text, prompt: "Fashion margin (1 decimal %)?", accept: ["32.7%", "32.7"] }
        - { id: xl-w13-d3-g08, difficulty: medium, type: text, prompt: "Groceries margin (1 decimal %)?", accept: ["7.3%", "7.3"] }
        - { id: xl-w13-d3-g09, difficulty: medium, type: match, prompt: "Match category to margin.", pairs: [["Fashion", "32.7%"], ["Accessories", "30.8%"], ["Phones", "12.2%"], ["Groceries", "7.3%"]] }
        - { id: xl-w13-d3-g10, difficulty: medium, type: truefalse, prompt: "=Units*UnitPrice as a calculated field gives the real GrossSales.", answer: false }
        - { id: xl-w13-d3-g11, difficulty: medium, type: text, prompt: "Second-most profitable category (₦)?", accept: ["Accessories"] }
        - { id: xl-w13-d3-g12, difficulty: medium, type: mcq, prompt: "Calculated item \"Lagos total\" = Lagos - Ikeja + Lagos - Lekki + Lagos - Surulere lives in…", choices: ["the Store field", "the Values area", "a slicer", "tblSales"], answer: 0 }
        - { id: xl-w13-d3-g13, difficulty: medium, type: text, prompt: "Phones profit (₦, no symbol)?", accept: ["17083700", "17,083,700"] }
        - { id: xl-w13-d3-g14, difficulty: medium, type: mcq, prompt: "Calculated item risk", choices: ["grand totals can double-count", "it deletes data", "slower refresh only", "no risk"], answer: 0 }
        - { id: xl-w13-d3-g15, difficulty: medium, type: text, prompt: "Computers margin (1 decimal %)?", accept: ["8.2%", "8.2"] }
        - { id: xl-w13-d3-g16, difficulty: hard, type: mcq, prompt: "Average Margin % of the 10 categories vs overall 15.5%", choices: ["differs: overall is weighted by sales", "always equal", "always higher", "can't compute"], answer: 0 }
        - { id: xl-w13-d3-g17, difficulty: hard, type: text, prompt: "Total profit (₦, no symbol)?", accept: ["129531600", "129,531,600"] }
        - { id: xl-w13-d3-g18, difficulty: hard, type: multi, prompt: "Safe calculated fields (Select all.)", choices: ["=Profit/NetSales", "=NetSales*0.03", "=NetSales-Cost", "=Units*UnitPrice"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Target vs actual"
        secondsPerQuestion: 8
        questions:
          - { id: xl-w13-d3-rf01, difficulty: easy, type: mcq, prompt: "Targets are per…", choices: ["region per month", "order", "product", "store per day"], answer: 0 }
          - { id: xl-w13-d3-rf02, difficulty: easy, type: mcq, prompt: "Variance", choices: ["Actual − Target", "Target − Actual", "Actual / Target", "Actual + Target"], answer: 0 }
