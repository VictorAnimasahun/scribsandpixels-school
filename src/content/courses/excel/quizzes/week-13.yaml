        - { id: xl-w13-d4-g11, difficulty: medium, type: text, prompt: "Best beat amount (₦, with sign)?", accept: ["5437245", "5,437,245", "+5437245", "+5,437,245"] }
        - { id: xl-w13-d4-g12, difficulty: medium, type: mcq, prompt: "Colour the Variance % column", choices: ["red-white-green colour scale", "data bars only", "icon sets on text", "bold"], answer: 0 }
