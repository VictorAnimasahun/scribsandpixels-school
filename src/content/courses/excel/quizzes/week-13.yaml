          - { id: xl-w13-d3-rf04, difficulty: easy, type: mcq, prompt: "Text \"2025-03\" → first day", choices: ["=DATEVALUE([@Month]&\"-01\")", "=DATE([@Month])", "=VALUE([@Month])", "=[@Month]+1"], answer: 0 }
          - { id: xl-w13-d3-rf05, difficulty: easy, type: mcq, prompt: "Hit?", choices: ["=IF([@Actual]>=[@SalesTarget],\"✓\",\"✗\")", "=[@Actual]=[@SalesTarget]", "=MAX(Actual)", "=IF(Target)"], answer: 0 }
