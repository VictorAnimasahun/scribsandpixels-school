# Excel · Week 4 quizzes. Format and rules: src/content/QUIZZES.md
week: 4
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 3 review"
      covers: "Week 3: relative, absolute and mixed references, F4, percentages, Fill Series, Flash Fill"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w04-d1-g01, difficulty: easy, type: mcq, prompt: "Lock column and row", choices: ["$A$1", "A1", "$A1", "A$1"], answer: 0 }
        - { id: xl-w04-d1-g02, difficulty: easy, type: mcq, prompt: "Cycle reference types", choices: ["F4", "F2", "F9", "Ctrl+E"], answer: 0 }
        - { id: xl-w04-d1-g03, difficulty: easy, type: mcq, prompt: "Flash Fill", choices: ["Ctrl+E", "Ctrl+F", "Ctrl+D", "Ctrl+R"], answer: 0 }
        - { id: xl-w04-d1-g04, difficulty: easy, type: text, prompt: "=A1*2 in B1, copied to B2 becomes…", accept: ["=A2*2"] }
        - { id: xl-w04-d1-g05, difficulty: easy, type: truefalse, prompt: "Flash Fill results update when the source changes.", answer: false }
        - { id: xl-w04-d1-g06, difficulty: easy, type: mcq, prompt: "% change", choices: ["=(new-old)/old", "=new/old", "=(old-new)/new", "=new-old"], answer: 0 }
        - { id: xl-w04-d1-g07, difficulty: medium, type: text, prompt: "=O2*$R$1 in Q2, copied to Q40 becomes…", accept: ["=O40*$R$1"] }
        - { id: xl-w04-d1-g08, difficulty: medium, type: text, prompt: "=$A2*B$1 copied to D5 becomes…", accept: ["=$A5*D$1"] }
        - { id: xl-w04-d1-g09, difficulty: medium, type: match, prompt: "Match the reference to what's locked.", pairs: [["A1", "nothing"], ["$A$1", "both"], ["$A1", "column"], ["A$1", "row"]] }
        - { id: xl-w04-d1-g10, difficulty: medium, type: text, prompt: "₦145,000 incl. 7.5% VAT? (digits only)", accept: ["155875"] }
        - { id: xl-w04-d1-g11, difficulty: medium, type: mcq, prompt: "% of total with the total in B8", choices: ["=B2/$B$8", "=B2/B8", "=$B2/B8", "=B8/B2"], answer: 0 }
        - { id: xl-w04-d1-g12, difficulty: medium, type: text, prompt: "649,000 at 20% off? (digits only)", accept: ["519200"] }
        - { id: xl-w04-d1-g13, difficulty: medium, type: truefalse, prompt: "=O2*R1 filled down keeps pointing at R1.", answer: false }
        - { id: xl-w04-d1-g14, difficulty: medium, type: mcq, prompt: "Lagos share of 2025 net sales (1 decimal)", choices: ["38.6%", "32.2%", "9.3%", "61.4%"], answer: 0 }
        - { id: xl-w04-d1-g15, difficulty: medium, type: mcq, prompt: "Dates every Monday", choices: ["Fill → Series, step 7", "Flash Fill", "F4", "Paste Special"], answer: 0 }
        - { id: xl-w04-d1-g16, difficulty: hard, type: text, prompt: "=C3*$H$2+D3 in E3, copied to F5 becomes…", accept: ["=D5*$H$2+E5"] }
        - { id: xl-w04-d1-g17, difficulty: hard, type: text, prompt: "₦10,000: 10% off, then 7.5% VAT. Final price? (digits only)", accept: ["9675"] }
        - { id: xl-w04-d1-g18, difficulty: hard, type: multi, prompt: "Which update when the rate in $C$1 changes? (Select all.)", choices: ["=K2*(1+$C$1)", "=K2*$C$1", "A Flash-Filled column", "A typed number"], answers: [0, 1] }
    quizzes:
      - kind: rapid-fire
        title: "Sorting reflexes"
        secondsPerQuestion: 8
        questions:
          - { id: xl-w04-d1-rf01, difficulty: easy, type: mcq, prompt: "Smallest first (text: A first)", choices: ["A→Z", "Z→A", "Custom", "Filter"], answer: 0 }
          - { id: xl-w04-d1-rf02, difficulty: easy, type: mcq, prompt: "Largest first", choices: ["Z→A", "A→Z", "Custom", "Freeze"], answer: 0 }
          - { id: xl-w04-d1-rf03, difficulty: easy, type: mcq, prompt: "Sort by two columns", choices: ["Data → Sort → Add Level", "A→Z twice", "Filter", "Ctrl+Shift+L"], answer: 0 }
          - { id: xl-w04-d1-rf04, difficulty: easy, type: truefalse, prompt: "Sorting a single column on its own is safe.", answer: false }
          - { id: xl-w04-d1-rf05, difficulty: easy, type: mcq, prompt: "Excel warns you. You choose…", choices: ["Expand the selection", "Continue with the current selection", "Cancel always", "Delete"], answer: 0 }
          - { id: xl-w04-d1-rf06, difficulty: easy, type: mcq, prompt: "Restore the original order", choices: ["Sort by OrderID A→Z", "Ctrl+Z only", "Filter", "Freeze panes"], answer: 0 }
          - { id: xl-w04-d1-rf07, difficulty: easy, type: mcq, prompt: "Sort Low, Medium, High in that order", choices: ["Custom List", "A→Z", "Z→A", "Number filter"], answer: 0 }
          - { id: xl-w04-d1-rf08, difficulty: easy, type: mcq, prompt: "Biggest 2025 single order (net)", choices: ["₦13,239,600", "₦6,490,000", "₦347,519", "₦25,824,000"], answer: 0 }
          - { id: xl-w04-d1-rf09, difficulty: easy, type: mcq, prompt: "Product of that order", choices: ["Dell Inspiron 15", "iPhone 15", "JBL Flip 6", "Tecno Spark 20"], answer: 0 }
          - { id: xl-w04-d1-rf10, difficulty: easy, type: truefalse, prompt: "Quick sort keeps each row together when you click one cell in the table.", answer: true }
      - kind: brain-teaser
        title: "Sort it out"
        questions:
          - { id: xl-w04-d1-bt01, difficulty: medium, type: mcq, prompt: "You selected column K alone and sorted it. What went wrong?", choices: ["Prices no longer match their products: rows were split", "Nothing", "Excel deleted the column", "Only the format changed"], answer: 0 }
          - { id: xl-w04-d1-bt02, difficulty: medium, type: order, prompt: "Order a two-level sort.", items: ["Click any cell in the table", "Data → Sort", "Sort by Region, A→Z", "Add Level: NetSales, largest to smallest", "OK"] }
          - { id: xl-w04-d1-bt03, difficulty: medium, type: mcq, prompt: "Sorted by Region A→Z, which region comes first?", choices: ["Abuja", "Lagos", "Enugu", "Kano"], answer: 0 }
          - { id: xl-w04-d1-bt04, difficulty: hard, type: mcq, prompt: "Two orders tie at ₦13,239,600. Which region's comes first when sorted Region A→Z, then NetSales Z→A?", choices: ["Enugu (NM-00460)", "Lagos (NM-01787)", "They're merged", "Random"], answer: 0 }
          - { id: xl-w04-d1-bt05, difficulty: hard, type: mcq, prompt: "Highest margin % in the price list (from Week 3's project)", choices: ["Phone Charger (Fast), 44%", "Tecno Spark 20, 18.6%", "Dell Inspiron 15", "Indomie Carton"], answer: 0 }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: sorting"
      covers: "Week 4 · Day 1: quick sort, never sort one column alone, multi-level sort, custom lists, restoring order"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w04-d2-g01, difficulty: easy, type: mcq, prompt: "Where is multi-level sort?", choices: ["Data → Sort", "Home → Format", "View → Sort", "Insert → Sort"], answer: 0 }
        - { id: xl-w04-d2-g02, difficulty: easy, type: mcq, prompt: "Z→A on numbers gives…", choices: ["largest first", "smallest first", "alphabetical", "random"], answer: 0 }
        - { id: xl-w04-d2-g03, difficulty: easy, type: truefalse, prompt: "An ID column lets you get back to the original order.", answer: true }
        - { id: xl-w04-d2-g04, difficulty: easy, type: mcq, prompt: "To sort the whole table quickly you…", choices: ["click one cell in the column, then A→Z", "select only that column", "select row 1", "press F4"], answer: 0 }
        - { id: xl-w04-d2-g05, difficulty: easy, type: mcq, prompt: "Custom order like Low/Medium/High", choices: ["Order → Custom List", "Z→A", "A→Z", "Filter"], answer: 0 }
        - { id: xl-w04-d2-g06, difficulty: easy, type: mcq, prompt: "The second level of a sort is used…", choices: ["to break ties in the first level", "always first", "only for text", "never"], answer: 0 }
        - { id: xl-w04-d2-g07, difficulty: medium, type: mcq, prompt: "Excel shows a \"Sort Warning\". Best choice?", choices: ["Expand the selection", "Continue with the current selection", "Ignore and close Excel", "Undo everything"], answer: 0 }
        - { id: xl-w04-d2-g08, difficulty: medium, type: text, prompt: "Biggest 2025 net order? (digits only)", accept: ["13239600"] }
        - { id: xl-w04-d2-g09, difficulty: medium, type: mcq, prompt: "Region A→Z, then NetSales Z→A. Within Lagos, the first row is…", choices: ["Lagos's biggest order", "Lagos's smallest order", "the first Lagos order by date", "random"], answer: 0 }
        - { id: xl-w04-d2-g10, difficulty: medium, type: match, prompt: "Match.", pairs: [["A→Z", "ascending"], ["Z→A", "descending"], ["Add Level", "second sort key"], ["Custom List", "your own order"]] }
        - { id: xl-w04-d2-g11, difficulty: medium, type: truefalse, prompt: "Sorting by text A→Z puts \"Abuja\" before \"Lagos\".", answer: true }
        - { id: xl-w04-d2-g12, difficulty: medium, type: mcq, prompt: "Which region had the company's biggest order (first by OrderID)?", choices: ["Enugu", "Lagos", "Abuja", "Kano"], answer: 0 }
        - { id: xl-w04-d2-g13, difficulty: medium, type: mcq, prompt: "Months as text (Jan, Feb…) sorted A→Z come out…", choices: ["alphabetical: Apr, Aug, Dec…", "Jan to Dec", "Dec to Jan", "unchanged"], answer: 0, explain: "Use the built-in month Custom List instead." }
        - { id: xl-w04-d2-g14, difficulty: medium, type: mcq, prompt: "Undo a sort you made 10 steps ago?", choices: ["Re-sort by the ID column", "Ctrl+Z ten times only", "Delete the sheet", "Impossible"], answer: 0 }
        - { id: xl-w04-d2-g15, difficulty: medium, type: truefalse, prompt: "Merged cells inside a table can stop sorting.", answer: true }
        - { id: xl-w04-d2-g16, difficulty: hard, type: mcq, prompt: "Which is the top order after sorting NetSales Z→A (the first of the tie, in original order)?", choices: ["NM-00460", "NM-01787", "NM-00001", "NM-02400"], answer: 0, explain: "Excel's sort is stable: tied rows keep their original order." }
        - { id: xl-w04-d2-g17, difficulty: hard, type: mcq, prompt: "You sorted, then realise UnitPrice was a separate selection and no longer matches its products. Fix?", choices: ["Undo immediately (Ctrl+Z), or restore from Data_backup", "Sort the column again A→Z", "Format as currency", "Freeze panes"], answer: 0 }
        - { id: xl-w04-d2-g18, difficulty: hard, type: multi, prompt: "Which are good sorting habits? (Select all.)", choices: ["Keep an ID column", "Sort the whole table, not one column", "Keep a backup sheet", "Sort with merged cells in the data"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Filter sprint"
        secondsPerQuestion: 8
        questions:
          - { id: xl-w04-d2-rf01, difficulty: easy, type: mcq, prompt: "Filters on/off", choices: ["Ctrl+Shift+L", "Ctrl+L", "Ctrl+F", "Alt+F"], answer: 0 }
          - { id: xl-w04-d2-rf02, difficulty: easy, type: mcq, prompt: "Sum only the visible rows", choices: ["=SUBTOTAL(9,range)", "=SUM(range)", "=VISIBLE(range)", "=SUMIF(range)"], answer: 0 }
          - { id: xl-w04-d2-rf03, difficulty: easy, type: mcq, prompt: "In SUBTOTAL, 9 means…", choices: ["SUM", "COUNT", "AVERAGE", "MAX"], answer: 0 }
          - { id: xl-w04-d2-rf04, difficulty: easy, type: mcq, prompt: "Filtering two columns at once is…", choices: ["AND", "OR", "XOR", "NOT"], answer: 0 }
          - { id: xl-w04-d2-rf05, difficulty: easy, type: mcq, prompt: "Product names containing \"iPhone\"", choices: ["Text Filter → Contains", "Number Filter", "Sort A→Z", "Freeze"], answer: 0 }
          - { id: xl-w04-d2-rf06, difficulty: easy, type: mcq, prompt: "Net sales ≥ ₦1,000,000", choices: ["Number Filter → Greater Than Or Equal To", "Text Filter", "Date Filter", "Custom List"], answer: 0 }
          - { id: xl-w04-d2-rf07, difficulty: easy, type: truefalse, prompt: "A normal SUM includes rows hidden by a filter.", answer: true }
          - { id: xl-w04-d2-rf08, difficulty: easy, type: mcq, prompt: "The status bar shows…", choices: ["x of 2400 records found", "the filter formula", "SUBTOTAL", "the sort order"], answer: 0 }
          - { id: xl-w04-d2-rf09, difficulty: easy, type: mcq, prompt: "Remove every filter", choices: ["Data → Clear", "Delete row 1", "Ctrl+Z", "F4"], answer: 0 }
          - { id: xl-w04-d2-rf10, difficulty: easy, type: mcq, prompt: "Orders in December", choices: ["Date Filter", "Text Filter", "Custom List", "Flash Fill"], answer: 0 }
      - kind: brain-teaser
        title: "Filter the data"
        questions:
          - { id: xl-w04-d2-bt01, difficulty: medium, type: text, prompt: "How many orders came from the Lagos - Lekki store?", accept: ["331"] }
          - { id: xl-w04-d2-bt02, difficulty: medium, type: text, prompt: "How many orders were in December 2025?", accept: ["330"] }
          - { id: xl-w04-d2-bt03, difficulty: medium, type: text, prompt: "How many orders had net sales ≥ ₦1,000,000?", accept: ["140"] }
          - { id: xl-w04-d2-bt04, difficulty: hard, type: mcq, prompt: "Kano + Phones: how many orders and what net total?", choices: ["17 orders, ₦19,551,300", "11 orders, ₦25,824,000", "17 orders, ₦25,824,000", "140 orders, ₦19,551,300"], answer: 0 }
          - { id: xl-w04-d2-bt05, difficulty: hard, type: mcq, prompt: "Filtered to iPhones, =SUM(O2:O2401) shows the whole year's total. Why?", choices: ["SUM includes hidden rows; use SUBTOTAL(9,…)", "The filter failed", "iPhones aren't in column O", "SUM needs a $"], answer: 0 }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: filtering"
      covers: "Week 4 · Day 2: Ctrl+Shift+L, text/number/date filters, AND across columns, SUBTOTAL"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w04-d3-g01, difficulty: easy, type: mcq, prompt: "Turn filters on", choices: ["Ctrl+Shift+L", "Ctrl+Shift+F", "Ctrl+T", "F4"], answer: 0 }
        - { id: xl-w04-d3-g02, difficulty: easy, type: mcq, prompt: "Which respects filters?", choices: ["SUBTOTAL", "SUM", "COUNT", "MAX"], answer: 0 }
        - { id: xl-w04-d3-g03, difficulty: easy, type: truefalse, prompt: "Filtering hides rows; it doesn't delete them.", answer: true }
        - { id: xl-w04-d3-g04, difficulty: easy, type: mcq, prompt: "=SUBTOTAL(9,O2:O2401) is the visible…", choices: ["sum", "count", "average", "maximum"], answer: 0 }
        - { id: xl-w04-d3-g05, difficulty: easy, type: mcq, prompt: "Filter for names containing a word", choices: ["Text Filters → Contains", "Number Filters", "Sort", "Find"], answer: 0 }
        - { id: xl-w04-d3-g06, difficulty: easy, type: mcq, prompt: "Where do filter arrows appear?", choices: ["In the header row", "In column A", "In the status bar", "On the ribbon only"], answer: 0 }
        - { id: xl-w04-d3-g07, difficulty: medium, type: text, prompt: "How many iPhone orders were there in 2025?", accept: ["11"] }
        - { id: xl-w04-d3-g08, difficulty: medium, type: text, prompt: "How many Online orders were paid by Transfer?", accept: ["445"] }
        - { id: xl-w04-d3-g09, difficulty: medium, type: mcq, prompt: "Filter Region = Kano AND Category = Phones gives…", choices: ["rows that are both Kano and Phones", "every Kano row plus every Phones row", "nothing", "an error"], answer: 0 }
        - { id: xl-w04-d3-g10, difficulty: medium, type: match, prompt: "Match the filter type.", pairs: [["contains \"Milo\"", "Text Filter"], ["≥ 1,000,000", "Number Filter"], ["this month", "Date Filter"], ["Top 10", "Number Filter"]] }
        - { id: xl-w04-d3-g11, difficulty: medium, type: text, prompt: "Net total of iPhone orders? (digits only)", accept: ["25824000"] }
        - { id: xl-w04-d3-g12, difficulty: medium, type: truefalse, prompt: "SUBTOTAL(9,…) gives the same as SUM when no filter is on.", answer: true }
        - { id: xl-w04-d3-g13, difficulty: medium, type: mcq, prompt: "Count the visible rows of OrderID (text):", choices: ["=SUBTOTAL(3,A2:A2401)", "=SUBTOTAL(9,A2:A2401)", "=COUNT(A2:A2401)", "=SUM(A2:A2401)"], answer: 0, explain: "3 = COUNTA." }
        - { id: xl-w04-d3-g14, difficulty: medium, type: mcq, prompt: "The status bar says \"330 of 2400 records found\". The filter is probably…", choices: ["December", "Lagos - Lekki", "iPhones", "≥ ₦1,000,000"], answer: 0 }
        - { id: xl-w04-d3-g15, difficulty: medium, type: mcq, prompt: "Clear all filters at once", choices: ["Data → Clear", "Untick each value", "Delete the arrows", "Ctrl+Z"], answer: 0 }
        - { id: xl-w04-d3-g16, difficulty: hard, type: text, prompt: "Kano Phones orders: net total? (digits only)", accept: ["19551300"] }
        - { id: xl-w04-d3-g17, difficulty: hard, type: mcq, prompt: "A SUBTOTAL sits in row 2402 under the data. You add 100 rows at the bottom. Problem?", choices: ["The range stops at row 2401, so the new rows aren't counted", "SUBTOTAL breaks", "Filters turn off", "No problem"], answer: 0 }
        - { id: xl-w04-d3-g18, difficulty: hard, type: multi, prompt: "Which questions can you answer with filters + SUBTOTAL? (Select all.)", choices: ["Net sales of Lagos Phones orders", "How many December orders", "Orders ≥ ₦1m", "Next year's sales"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Find and freeze"
        secondsPerQuestion: 8
        questions:
          - { id: xl-w04-d3-rf01, difficulty: easy, type: mcq, prompt: "Find", choices: ["Ctrl+F", "Ctrl+H", "F5", "Ctrl+G"], answer: 0 }
          - { id: xl-w04-d3-rf02, difficulty: easy, type: mcq, prompt: "Replace", choices: ["Ctrl+H", "Ctrl+R", "Ctrl+F", "Ctrl+E"], answer: 0 }
          - { id: xl-w04-d3-rf03, difficulty: easy, type: mcq, prompt: "Go To (then Special)", choices: ["F5", "F4", "F2", "F9"], answer: 0 }
          - { id: xl-w04-d3-rf04, difficulty: easy, type: mcq, prompt: "Wildcard: any text", choices: ["*", "?", "#", "%"], answer: 0 }
          - { id: xl-w04-d3-rf05, difficulty: easy, type: mcq, prompt: "Wildcard: exactly one character", choices: ["?", "*", "_", "."], answer: 0 }
          - { id: xl-w04-d3-rf06, difficulty: easy, type: mcq, prompt: "Keep row 1 visible when scrolling", choices: ["Freeze Top Row", "Filter", "Group", "Hide"], answer: 0 }
          - { id: xl-w04-d3-rf07, difficulty: easy, type: mcq, prompt: "Freeze row 1 AND column A: select…", choices: ["B2", "A1", "A2", "B1"], answer: 0 }
          - { id: xl-w04-d3-rf08, difficulty: easy, type: mcq, prompt: "Select every blank cell at once", choices: ["Go To Special → Blanks", "Ctrl+A", "Find → blank", "Filter"], answer: 0 }
          - { id: xl-w04-d3-rf09, difficulty: easy, type: truefalse, prompt: "Grouping columns lets you collapse and expand them.", answer: true }
          - { id: xl-w04-d3-rf10, difficulty: easy, type: mcq, prompt: "Freeze Panes lives on the…", choices: ["View tab", "Data tab", "Home tab", "Insert tab"], answer: 0 }
      - kind: brain-teaser
        title: "Find it fast"
        questions:
          - { id: xl-w04-d3-bt01, difficulty: medium, type: text, prompt: "How many cells contain \"Milo\" in sales_2025 (Find All)?", accept: ["128"] }
          - { id: xl-w04-d3-bt02, difficulty: medium, type: mcq, prompt: "Find \"Lagos*\" matches…", choices: ["any cell starting with Lagos", "only \"Lagos*\"", "only \"Lagos\"", "nothing"], answer: 0 }
          - { id: xl-w04-d3-bt03, difficulty: medium, type: mcq, prompt: "Replace \"Ikeja\" changed \"Ikeja\" inside other words too. Which option prevents that?", choices: ["Match entire cell contents", "Match case", "Within: Workbook", "Look in: Values"], answer: 0 }
          - { id: xl-w04-d3-bt04, difficulty: hard, type: mcq, prompt: "Audit a sheet: which columns hold formulas?", choices: ["Go To Special → Formulas", "Ctrl+F for =", "Filter", "Freeze panes"], answer: 0 }
          - { id: xl-w04-d3-bt05, difficulty: hard, type: mcq, prompt: "Hide vs Group for columns F–I?", choices: ["Group: one click to expand/collapse, and it's visible that something's tucked away", "Hide is always better", "Same thing", "Group deletes columns"], answer: 0 }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: freeze, find and Go To Special"
      covers: "Week 4 · Day 3: freeze panes, find & replace with options and wildcards, Go To Special, hide/group"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w04-d4-g01, difficulty: easy, type: mcq, prompt: "Replace shortcut", choices: ["Ctrl+H", "Ctrl+F", "Ctrl+R", "Ctrl+P"], answer: 0 }
        - { id: xl-w04-d4-g02, difficulty: easy, type: mcq, prompt: "Freeze row 1 only", choices: ["View → Freeze Panes → Freeze Top Row", "Data → Freeze", "Home → Lock", "Ctrl+1"], answer: 0 }
        - { id: xl-w04-d4-g03, difficulty: easy, type: truefalse, prompt: "* in Find means \"any text\".", answer: true }
        - { id: xl-w04-d4-g04, difficulty: easy, type: mcq, prompt: "Go To dialog", choices: ["F5", "F2", "F4", "F11"], answer: 0 }
        - { id: xl-w04-d4-g05, difficulty: easy, type: mcq, prompt: "Find across every sheet", choices: ["Within: Workbook", "Within: Sheet", "Match case", "Look in: Notes"], answer: 0 }
        - { id: xl-w04-d4-g06, difficulty: easy, type: mcq, prompt: "Collapse columns with a +/− button", choices: ["Data → Group", "Hide", "Freeze", "Filter"], answer: 0 }
        - { id: xl-w04-d4-g07, difficulty: medium, type: mcq, prompt: "To freeze row 1 and column A together, select ___ then Freeze Panes.", choices: ["B2", "A1", "A2", "B1"], answer: 0 }
        - { id: xl-w04-d4-g08, difficulty: medium, type: match, prompt: "Match.", pairs: [["*", "any text"], ["?", "one character"], ["Ctrl+F", "find"], ["Ctrl+H", "replace"]] }
        - { id: xl-w04-d4-g09, difficulty: medium, type: mcq, prompt: "With Match entire cell contents ticked, Find \"Spark ??\" matches…", choices: ["\"Spark 20\" and \"Spark 10\"", "\"Spark 2000\"", "only \"Spark ??\"", "\"Spark\""], answer: 0 }
        - { id: xl-w04-d4-g10, difficulty: medium, type: mcq, prompt: "Select every error cell in a sheet", choices: ["Go To Special → Formulas → Errors", "Ctrl+A", "Filter errors", "F4"], answer: 0 }
        - { id: xl-w04-d4-g11, difficulty: medium, type: truefalse, prompt: "Find All shows how many cells match.", answer: true }
        - { id: xl-w04-d4-g12, difficulty: medium, type: text, prompt: "Cells containing \"Milo\" in sales_2025?", accept: ["128"] }
        - { id: xl-w04-d4-g13, difficulty: medium, type: mcq, prompt: "Replacing \"Lagos - Surulere\" by mistake affected 300 cells. Fix?", choices: ["Ctrl+Z right away", "Replace back by hand, cell by cell", "Delete the column", "Freeze panes"], answer: 0 }
        - { id: xl-w04-d4-g14, difficulty: medium, type: mcq, prompt: "Headers scroll out of view on 2,400 rows. Fix?", choices: ["Freeze Top Row", "Bold the headers", "Filter", "Sort"], answer: 0 }
        - { id: xl-w04-d4-g15, difficulty: medium, type: mcq, prompt: "Go To Special → Constants selects…", choices: ["typed values, not formulas", "only formulas", "only blanks", "only errors"], answer: 0 }
        - { id: xl-w04-d4-g16, difficulty: hard, type: mcq, prompt: "Replace \"Lagos\" with \"Lagos State\" without touching \"Lagos - Lekki\" etc.:", choices: ["Tick Match entire cell contents", "Tick Match case", "Use *Lagos*", "Within: Workbook"], answer: 0 }
        - { id: xl-w04-d4-g17, difficulty: hard, type: mcq, prompt: "Fill every blank in a column with 0 in one go:", choices: ["Select column → Go To Special → Blanks → type 0 → Ctrl+Enter", "Find blanks and type 0 in each", "Sort then type 0", "Filter then delete"], answer: 0 }
