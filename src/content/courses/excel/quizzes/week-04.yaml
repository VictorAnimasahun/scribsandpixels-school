    quizzes:
      - kind: rapid-fire
        title: "Sheets and 3D"
        secondsPerQuestion: 9
        questions:
          - { id: xl-w04-d4-rf01, difficulty: easy, type: mcq, prompt: "O2 on the Data sheet", choices: ["=Data!O2", "=Data.O2", "=O2@Data", "=[Data]O2"], answer: 0 }
          - { id: xl-w04-d4-rf02, difficulty: easy, type: mcq, prompt: "Sheet name with a space", choices: ["='Jan Sales'!B5", "=Jan Sales!B5", "=\"Jan Sales\"!B5", "=[Jan Sales]B5"], answer: 0 }
          - { id: xl-w04-d4-rf03, difficulty: easy, type: mcq, prompt: "B5 on every sheet from Jan to Mar", choices: ["=SUM(Jan:Mar!B5)", "=SUM(Jan!B5:Mar!B5)", "=Jan+Feb+Mar", "=SUM(B5)"], answer: 0 }
          - { id: xl-w04-d4-rf04, difficulty: easy, type: mcq, prompt: "Select several sheet tabs", choices: ["Ctrl+click", "Alt+click", "Double-click", "Right-drag"], answer: 0 }
          - { id: xl-w04-d4-rf05, difficulty: easy, type: truefalse, prompt: "Grouped sheets all receive what you type.", answer: true }
          - { id: xl-w04-d4-rf06, difficulty: easy, type: mcq, prompt: "After editing grouped sheets you must…", choices: ["ungroup them", "save as CSV", "freeze them", "sort them"], answer: 0 }
