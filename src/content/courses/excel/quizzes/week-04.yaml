          - { id: xl-w04-d4-rf08, difficulty: easy, type: truefalse, prompt: "3D references need identical layouts on each sheet.", answer: true }
          - { id: xl-w04-d4-rf09, difficulty: easy, type: mcq, prompt: "Links to other workbooks are…", choices: ["fragile if the file moves", "always safe", "faster than sheet links", "not allowed"], answer: 0 }
          - { id: xl-w04-d4-rf10, difficulty: easy, type: mcq, prompt: "=SUM(Jan:Dec!C5) adds…", choices: ["C5 from every sheet Jan to Dec", "C5 on Jan and Dec only", "C5 to C12", "nothing"], answer: 0 }
      - kind: brain-teaser
        title: "Quarterly workbook"
        questions:
          - { id: xl-w04-d4-bt01, difficulty: medium, type: mcq, prompt: "You insert sheet Feb2 between Jan and Mar. Does =SUM(Jan:Mar!B2) include it?", choices: ["Yes: every sheet between the first and last", "No", "Only if you rename it", "Only after F9"], answer: 0 }
          - { id: xl-w04-d4-bt02, difficulty: medium, type: text, prompt: "Jan!B2 = 100, Feb!B2 = 250, Mar!B2 = 150. =SUM(Jan:Mar!B2)?", accept: ["500"] }
          - { id: xl-w04-d4-bt03, difficulty: medium, type: mcq, prompt: "You forgot to ungroup and typed a note in Jan!E1. What happened?", choices: ["The note went into E1 of every grouped sheet", "Only Jan got it", "Excel blocked it", "It deleted E1 everywhere"], answer: 0 }
          - { id: xl-w04-d4-bt04, difficulty: hard, type: mcq, prompt: "You move sheet Mar to the far right after Q1. =SUM(Jan:Mar!B2) in Q1 now…", choices: ["also includes Q1 itself: a circular reference", "is unchanged", "excludes Feb", "shows #REF!"], answer: 0, explain: "The range runs Jan → Mar in tab order, which now contains Q1." }
          - { id: xl-w04-d4-bt05, difficulty: hard, type: text, prompt: "Write the reference to cell C7 on a sheet named Q1 Totals.", accept: ["='Q1 Totals'!C7", "'Q1 Totals'!C7"] }

  # ─────────────────────────── DAY 5 ───────────────────────────
  - day: 5
    gate:
      title: "Checkpoint: working across sheets"
      covers: "Week 4 · Day 4: sheet references, quoted names, other workbooks, 3D SUM, grouping sheets"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w04-d5-g01, difficulty: easy, type: mcq, prompt: "Cell B5 on sheet Summary", choices: ["=Summary!B5", "=Summary.B5", "=B5!Summary", "=[Summary]B5"], answer: 0 }
        - { id: xl-w04-d5-g02, difficulty: easy, type: mcq, prompt: "A 3D reference adds the same cell across…", choices: ["a run of sheets", "a run of rows", "one sheet only", "other workbooks only"], answer: 0 }
        - { id: xl-w04-d5-g03, difficulty: easy, type: truefalse, prompt: "Sheet names with spaces need single quotes in a reference.", answer: true }
        - { id: xl-w04-d5-g04, difficulty: easy, type: mcq, prompt: "Group sheets", choices: ["Ctrl+click their tabs", "Data → Group", "Alt+G", "Freeze"], answer: 0 }
        - { id: xl-w04-d5-g05, difficulty: easy, type: mcq, prompt: "=SUM(Jan:Mar!B5) needs…", choices: ["the same layout on Jan, Feb and Mar", "identical sheet colours", "a Q1 sheet first", "macros"], answer: 0 }
        - { id: xl-w04-d5-g06, difficulty: easy, type: mcq, prompt: "Avoid links to other workbooks because…", choices: ["they break if the file moves", "they're slow to type", "Excel forbids them", "they're always wrong"], answer: 0 }
        - { id: xl-w04-d5-g07, difficulty: medium, type: text, prompt: "Write: B5 summed across every sheet from Jan to Dec.", accept: ["=SUM(Jan:Dec!B5)"] }
        - { id: xl-w04-d5-g08, difficulty: medium, type: text, prompt: "Write a reference to B5 on the sheet Jan Sales.", accept: ["='Jan Sales'!B5", "'Jan Sales'!B5"] }
        - { id: xl-w04-d5-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["=Data!O2", "another sheet"], ["='Jan Sales'!B5", "sheet name with a space"], ["=SUM(Jan:Mar!B2)", "3D reference"], ["=[Budget.xlsx]Sheet1!B2", "another workbook"]] }
        - { id: xl-w04-d5-g10, difficulty: medium, type: mcq, prompt: "The fastest way to give 12 monthly sheets an identical layout:", choices: ["Build one, then Move or Copy it (or group sheets while typing)", "Type each by hand", "Flash Fill", "Copy the whole workbook 12 times"], answer: 0 }
        - { id: xl-w04-d5-g11, difficulty: medium, type: truefalse, prompt: "Grouped sheets show [Group] in the title bar.", answer: true }
        - { id: xl-w04-d5-g12, difficulty: medium, type: text, prompt: "Jan!C5 = 40, Feb!C5 = 60, Mar!C5 = 0. =SUM(Jan:Mar!C5)?", accept: ["100"] }
        - { id: xl-w04-d5-g13, difficulty: medium, type: mcq, prompt: "=SUM(Jan:Mar!B2) where Feb's B2 holds text \"n/a\". Result?", choices: ["Sum of Jan and Mar (text is skipped)", "#VALUE!", "0", "#REF!"], answer: 0 }
        - { id: xl-w04-d5-g14, difficulty: medium, type: mcq, prompt: "You delete the Mar sheet. =SUM(Jan:Mar!B2) becomes…", choices: ["=SUM(Jan:Feb!B2)", "#REF!", "unchanged", "0"], answer: 0, explain: "Deleting an end sheet moves the range to the next sheet in." }
        - { id: xl-w04-d5-g15, difficulty: medium, type: mcq, prompt: "A formula on Summary: =Data!O2*Inputs!$B$1. Copied down one row, it becomes…", choices: ["=Data!O3*Inputs!$B$1", "=Data!O2*Inputs!$B$2", "=Data!O3*Inputs!$B$2", "#REF!"], answer: 0 }
        - { id: xl-w04-d5-g16, difficulty: hard, type: mcq, prompt: "Why put a Q1 summary sheet OUTSIDE the Jan:Mar run?", choices: ["Otherwise the 3D SUM includes Q1 itself (circular reference)", "Excel requires Q1 to be first", "Colours", "Printing"], answer: 0 }
        - { id: xl-w04-d5-g17, difficulty: hard, type: mcq, prompt: "Household budget: Year!B3 should total B3 on Jan…Dec. Formula?", choices: ["=SUM(Jan:Dec!B3)", "=Jan!B3+Dec!B3", "=SUM(B3:B14)", "=SUM(Jan!B3:Dec!B3)"], answer: 0 }
        - { id: xl-w04-d5-g18, difficulty: hard, type: multi, prompt: "Which are true about grouped sheets? (Select all.)", choices: ["Typing goes into every grouped sheet", "Formatting goes into every grouped sheet", "You should ungroup after editing", "They become one sheet"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Print ready"
        secondsPerQuestion: 8
        questions:
          - { id: xl-w04-d5-rf01, difficulty: easy, type: mcq, prompt: "Wide table orientation", choices: ["Landscape", "Portrait", "Square", "Auto"], answer: 0 }
          - { id: xl-w04-d5-rf02, difficulty: easy, type: mcq, prompt: "Headers on every printed page", choices: ["Print Titles → Rows to repeat at top", "Freeze panes", "Header/Footer", "Print Area"], answer: 0 }
          - { id: xl-w04-d5-rf03, difficulty: easy, type: mcq, prompt: "Print only a range", choices: ["Set Print Area", "Hide the rest", "Filter", "Group"], answer: 0 }
          - { id: xl-w04-d5-rf04, difficulty: easy, type: mcq, prompt: "Fit everything across one page", choices: ["Fit All Columns on One Page", "Landscape only", "Smaller font by hand", "Print Area"], answer: 0 }
          - { id: xl-w04-d5-rf05, difficulty: easy, type: mcq, prompt: "See and drag page breaks", choices: ["Page Break Preview", "Normal view", "Freeze panes", "Zoom"], answer: 0 }
          - { id: xl-w04-d5-rf06, difficulty: easy, type: mcq, prompt: "Usual way to send a report", choices: ["Export to PDF", "Email the .csv", "Screenshot", "Print and scan"], answer: 0 }
          - { id: xl-w04-d5-rf07, difficulty: easy, type: mcq, prompt: "Page X of Y goes in…", choices: ["the header or footer", "cell A1", "the file name", "a comment"], answer: 0 }
          - { id: xl-w04-d5-rf08, difficulty: easy, type: truefalse, prompt: "Freeze panes also repeats headers when printing.", answer: false, explain: "Printing needs Print Titles." }
          - { id: xl-w04-d5-rf09, difficulty: easy, type: mcq, prompt: "Rows to repeat at top for row 1", choices: ["$1:$1", "A1", "1:1!", "$A$1"], answer: 0 }
          - { id: xl-w04-d5-rf10, difficulty: easy, type: mcq, prompt: "Print settings live mostly on…", choices: ["the Page Layout tab and File → Print", "the Data tab", "the Formulas tab", "the Review tab"], answer: 0 }
      - kind: brain-teaser
        title: "Fix the printout"
        questions:
          - { id: xl-w04-d5-bt01, difficulty: medium, type: mcq, prompt: "The printed Data sheet's page 2 has no headers. Fix?", choices: ["Page Layout → Print Titles → Rows to repeat at top: $1:$1", "Freeze Top Row", "Bold row 1", "Print Area"], answer: 0 }
          - { id: xl-w04-d5-bt02, difficulty: medium, type: mcq, prompt: "The last two columns print on separate pages. Fix?", choices: ["Landscape + Fit All Columns on One Page", "Delete the columns", "Portrait", "Print Area = A1"], answer: 0 }
          - { id: xl-w04-d5-bt03, difficulty: medium, type: mcq, prompt: "Only the Summary table should print, not the notes beside it.", choices: ["Select the table → Set Print Area", "Hide the notes forever", "Delete the notes", "Freeze panes"], answer: 0 }
          - { id: xl-w04-d5-bt04, difficulty: hard, type: order, prompt: "Order: a one-page landscape PDF report.", items: ["Set Print Area", "Orientation: Landscape", "Scaling: Fit Sheet on One Page", "Add header and page-number footer", "File → Save As → PDF"] }
          - { id: xl-w04-d5-bt05, difficulty: hard, type: mcq, prompt: "Why export a report to PDF instead of sending the .xlsx?", choices: ["Layout is fixed and it can't be edited by accident", "PDFs recalculate", "It's required by Excel", "PDFs keep formulas"], answer: 0 }

