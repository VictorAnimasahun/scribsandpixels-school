      bank:
        - { id: xl-w04-d6-g01, difficulty: easy, type: mcq, prompt: "Print a wide table on one page", choices: ["Landscape + fit to one page", "Portrait + zoom out", "Hide columns", "Bigger paper only"], answer: 0 }
