        - { id: xl-w04-d6-g10, difficulty: medium, type: mcq, prompt: "Print Preview shows a column cut off on the right. First try:", choices: ["Fit All Columns on One Page", "Delete the column", "Set Print Area to A1", "Portrait"], answer: 0 }
        - { id: xl-w04-d6-g11, difficulty: medium, type: mcq, prompt: "Household budget milestone: 12 monthly sheets should be…", choices: ["identical in layout, so 3D references work", "all different", "on one sheet", "in 12 workbooks"], answer: 0 }
        - { id: xl-w04-d6-g12, difficulty: medium, type: mcq, prompt: "Difference column in the budget = ", choices: ["budgeted − actual", "actual − income", "budgeted + actual", "actual × %"], answer: 0 }
        - { id: xl-w04-d6-g13, difficulty: medium, type: truefalse, prompt: "Changing salary on the Inputs sheet should update every month if you used $ references.", answer: true }
        - { id: xl-w04-d6-g14, difficulty: medium, type: mcq, prompt: "% of income for rent (B5) with income in Inputs!$B$2:", choices: ["=B5/Inputs!$B$2", "=B5/Inputs!B2", "=Inputs!$B$2/B5", "=B5*Inputs!$B$2"], answer: 0 }
