# Excel · Week 9 quizzes. Format and rules: src/content/QUIZZES.md
# Figures verified against datasets/ (products.csv, sales_2025.csv, employees.csv).
week: 9
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 8 review"
      covers: "Week 8: date serials, DATEDIF, EDATE/EOMONTH/WORKDAY/NETWORKDAYS, time calculations, payroll from the timesheet"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w09-d1-g01, difficulty: easy, type: mcq, prompt: "Last day of the month, n months later", choices: ["EOMONTH", "EDATE", "WORKDAY", "DAY"], answer: 0 }
        - { id: xl-w09-d1-g02, difficulty: easy, type: mcq, prompt: "Hours worked from ClockIn (C2) and ClockOut (D2)", choices: ["=(D2-C2)*24", "=D2-C2", "=(D2-C2)/24", "=HOUR(D2)-C2"], answer: 0 }
        - { id: xl-w09-d1-g03, difficulty: easy, type: truefalse, prompt: "In Excel, a date is a whole number of days and a time is a fraction of a day.", answer: true }
        - { id: xl-w09-d1-g04, difficulty: easy, type: mcq, prompt: "Overtime above 8 hours (E2 = hours)", choices: ["=MAX(0,E2-8)", "=MIN(0,E2-8)", "=E2-8", "=IF(E2>8,8)"], answer: 0 }
        - { id: xl-w09-d1-g05, difficulty: easy, type: mcq, prompt: "Working days between two dates", choices: ["NETWORKDAYS", "WORKDAY", "DAYS", "DATEDIF"], answer: 0 }
        - { id: xl-w09-d1-g06, difficulty: easy, type: mcq, prompt: "Show durations over 24 hours", choices: ["[h]:mm", "hh:mm", "h:mm AM/PM", "General"], answer: 0 }
        - { id: xl-w09-d1-g07, difficulty: medium, type: text, prompt: "Working days in March 2025 (no holidays)?", accept: ["21"] }
        - { id: xl-w09-d1-g08, difficulty: medium, type: text, prompt: "08:07 → 18:31, hours to 2 decimals?", accept: ["10.40", "10.4"] }
        - { id: xl-w09-d1-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["EDATE", "same day n months later"], ["EOMONTH", "last day of a month"], ["WORKDAY", "n working days later"], ["NETWORKDAYS", "count working days"]] }
        - { id: xl-w09-d1-g10, difficulty: medium, type: mcq, prompt: "Night shift 22:00 → 06:00", choices: ["=MOD(D2-C2,1)*24", "=(D2-C2)*24", "=ABS(D2-C2)", "=(C2-D2)*24"], answer: 0 }
        - { id: xl-w09-d1-g11, difficulty: medium, type: truefalse, prompt: "=IF(C2>TIME(8,30,0),\"Late\",\"On time\") flags 08:30 exactly as Late.", answer: false }
        - { id: xl-w09-d1-g12, difficulty: medium, type: text, prompt: "Late arrivals in the March timesheet?", accept: ["81"] }
        - { id: xl-w09-d1-g13, difficulty: medium, type: mcq, prompt: "Hourly rate for ₦176,000/month on 22 days × 8 h", choices: ["₦1,000", "₦8,000", "₦800", "₦1,100"], answer: 0 }
        - { id: xl-w09-d1-g14, difficulty: medium, type: mcq, prompt: "=EOMONTH(DATE(2025,1,15),1)", choices: ["28/02/2025", "15/02/2025", "31/01/2025", "01/03/2025"], answer: 0 }
        - { id: xl-w09-d1-g15, difficulty: medium, type: text, prompt: "Total overtime hours in the March timesheet (2 decimals)?", accept: ["383.65"] }
        - { id: xl-w09-d1-g16, difficulty: hard, type: mcq, prompt: "Order on Friday 7 March 2025, ships in 5 working days.", choices: ["Friday 14 March 2025", "Wednesday 12 March 2025", "Thursday 13 March 2025", "Monday 17 March 2025"], answer: 0 }
        - { id: xl-w09-d1-g17, difficulty: hard, type: mcq, prompt: "Rate ₦1,000/h, 176 regular hours, 10 overtime hours at 1.5×. Pay?", choices: ["₦191,000", "₦186,000", "₦176,000", "₦201,000"], answer: 0 }
        - { id: xl-w09-d1-g18, difficulty: hard, type: multi, prompt: "Which return 28/02/2025? (Select all.)", choices: ["=EDATE(DATE(2025,1,31),1)", "=EOMONTH(DATE(2025,2,10),0)", "=DATE(2025,3,0)", "=EDATE(DATE(2025,1,28),2)"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "VLOOKUP basics"
        secondsPerQuestion: 9
        questions:
          - { id: xl-w09-d1-rf01, difficulty: easy, type: mcq, prompt: "VLOOKUP searches in…", choices: ["the first column of the table", "any column", "the last column", "the header row"], answer: 0 }
          - { id: xl-w09-d1-rf02, difficulty: easy, type: mcq, prompt: "The 4th argument for an exact match", choices: ["FALSE", "TRUE", "1", "blank"], answer: 0 }
          - { id: xl-w09-d1-rf03, difficulty: easy, type: mcq, prompt: "Products: A ID, B Product, C Category, D Supplier, E UnitCost. Column number for UnitCost?", choices: ["5", "4", "6", "E"], answer: 0 }
          - { id: xl-w09-d1-rf04, difficulty: easy, type: mcq, prompt: "…and for Supplier?", choices: ["4", "3", "5", "D"], answer: 0 }
          - { id: xl-w09-d1-rf05, difficulty: easy, type: mcq, prompt: "Lock the table range with…", choices: ["$A$2:$G$41", "A2:G41", "A$2:G41", "#A2:G41"], answer: 0 }
          - { id: xl-w09-d1-rf06, difficulty: easy, type: truefalse, prompt: "VLOOKUP can return a value from a column to the LEFT of the lookup column.", answer: false }
          - { id: xl-w09-d1-rf07, difficulty: easy, type: mcq, prompt: "P040's UnitCost", choices: ["₦9,800", "₦14,500", "₦98,000", "₦4,700"], answer: 0 }
          - { id: xl-w09-d1-rf08, difficulty: easy, type: mcq, prompt: "P040's Supplier", choices: ["HP Nigeria", "Dell Nigeria", "Oraimo", "Transsion Nigeria"], answer: 0 }
          - { id: xl-w09-d1-rf09, difficulty: easy, type: mcq, prompt: "Not found →", choices: ["#N/A", "#VALUE!", "#REF!", "0"], answer: 0 }
          - { id: xl-w09-d1-rf10, difficulty: easy, type: mcq, prompt: "Someone inserts a column inside the table. VLOOKUP's col_index…", choices: ["now points at the wrong column", "updates itself", "turns into #REF!", "is unaffected"], answer: 0 }
      - kind: brain-teaser
        title: "Why FALSE matters"
        questions:
          - { id: xl-w09-d1-bt01, difficulty: medium, type: mcq, prompt: "VLOOKUP with TRUE on IDs that aren't sorted…", choices: ["can silently return a wrong row", "always returns #N/A", "sorts the table first", "is just slower"], answer: 0 }
          - { id: xl-w09-d1-bt02, difficulty: medium, type: text, prompt: "=VLOOKUP(\"P001\",Products!$A$2:$G$41,4,FALSE)", accept: ["Transsion Nigeria"] }
          - { id: xl-w09-d1-bt03, difficulty: medium, type: text, prompt: "=VLOOKUP(\"P026\",Products!$A$2:$G$41,2,FALSE)", accept: ["Indomie Carton (40)"] }
          - { id: xl-w09-d1-bt04, difficulty: hard, type: mcq, prompt: "You need the ProductID for the name in B2. VLOOKUP can't, because…", choices: ["ID is left of Product, and VLOOKUP only looks right", "names aren't unique", "IDs are text", "it needs TRUE"], answer: 0 }
          - { id: xl-w09-d1-bt05, difficulty: hard, type: text, prompt: "=VLOOKUP(\"P005\",Products!$A$2:$G$41,6,FALSE)-VLOOKUP(\"P005\",Products!$A$2:$G$41,5,FALSE) (UnitPrice − UnitCost)", accept: ["6500", "6,500", "₦6,500"] }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: VLOOKUP"
      covers: "Week 9 · Day 1: VLOOKUP, exact match, column numbers, locked ranges, its weaknesses"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w09-d2-g01, difficulty: easy, type: mcq, prompt: "=VLOOKUP(G2, Products!$A$2:$G$41, 5, FALSE) returns…", choices: ["UnitCost for the ID in G2", "the 5th product", "the row number", "Supplier"], answer: 0 }
        - { id: xl-w09-d2-g02, difficulty: easy, type: truefalse, prompt: "Always end VLOOKUP with FALSE unless you mean an approximate match.", answer: true }
        - { id: xl-w09-d2-g03, difficulty: easy, type: mcq, prompt: "VLOOKUP's lookup column must be…", choices: ["the first column of the table", "sorted descending", "numbers only", "column A of the sheet"], answer: 0 }
        - { id: xl-w09-d2-g04, difficulty: easy, type: mcq, prompt: "Why $ on the table range?", choices: ["So it doesn't move when filled down", "To show currency", "To make it faster", "To sort it"], answer: 0 }
        - { id: xl-w09-d2-g05, difficulty: easy, type: mcq, prompt: "The V in VLOOKUP", choices: ["Vertical", "Value", "Variable", "Visual"], answer: 0 }
        - { id: xl-w09-d2-g06, difficulty: easy, type: text, prompt: "Products!A:G: column number of UnitPrice (F)?", accept: ["6"] }
        - { id: xl-w09-d2-g07, difficulty: medium, type: text, prompt: "=VLOOKUP(\"P040\",Products!$A$2:$G$41,5,FALSE)", accept: ["9800", "9,800", "₦9,800"] }
        - { id: xl-w09-d2-g08, difficulty: medium, type: text, prompt: "=VLOOKUP(\"P024\",Products!$A$2:$G$41,4,FALSE)", accept: ["Mama Gold Mills"] }
        - { id: xl-w09-d2-g09, difficulty: medium, type: multi, prompt: "VLOOKUP weaknesses (Select all.)", choices: ["Can't look left", "Column number breaks when columns are inserted", "Slow on huge data", "Can't do exact matches"], answers: [0, 1, 2] }
        - { id: xl-w09-d2-g10, difficulty: medium, type: mcq, prompt: "=VLOOKUP(\"P999\",Products!$A$2:$G$41,5,FALSE)", choices: ["#N/A", "0", "#REF!", "blank"], answer: 0 }
        - { id: xl-w09-d2-g11, difficulty: medium, type: truefalse, prompt: "A col_index larger than the table's width gives #REF!.", answer: true }
        - { id: xl-w09-d2-g12, difficulty: medium, type: text, prompt: "=VLOOKUP(\"P012\",Products!$A$2:$G$41,3,FALSE)", accept: ["TV & Audio"] }
        - { id: xl-w09-d2-g13, difficulty: medium, type: mcq, prompt: "The lookup table lives on the Products sheet. Write the range as…", choices: ["Products!$A$2:$G$41", "Products:$A$2:$G$41", "[Products]A2:G41", "Products.A2:G41"], answer: 0 }
        - { id: xl-w09-d2-g14, difficulty: medium, type: mcq, prompt: "Why still learn VLOOKUP?", choices: ["It's in millions of old files", "It's faster than XLOOKUP", "XLOOKUP can't do exact match", "It looks left"], answer: 0 }
        - { id: xl-w09-d2-g15, difficulty: medium, type: text, prompt: "=VLOOKUP(\"P010\",Products!$A$2:$G$41,6,FALSE)", accept: ["649000", "649,000", "₦649,000"] }
        - { id: xl-w09-d2-g16, difficulty: hard, type: mcq, prompt: "=VLOOKUP(G2,Products!A2:G41,5,FALSE) filled down 2,400 rows without $. Row 3 uses…", choices: ["A3:G42, so P001 drops out of the table", "the same range", "an error everywhere", "A2:G41 plus one column"], answer: 0 }
        - { id: xl-w09-d2-g17, difficulty: hard, type: text, prompt: "Units 3 of P026: =3*VLOOKUP(\"P026\",Products!$A$2:$G$41,6,FALSE)", accept: ["40500", "40,500", "₦40,500"] }
        - { id: xl-w09-d2-g18, difficulty: hard, type: mcq, prompt: "A lookup returns 14500 for P040 instead of the cost 9800. Most likely…", choices: ["col_index 6 (UnitPrice) instead of 5", "missing FALSE", "the table isn't locked", "P040 is text"], answer: 0 }
    quizzes:
      - kind: rapid-fire
        title: "XLOOKUP"
        secondsPerQuestion: 9
        questions:
          - { id: xl-w09-d2-rf01, difficulty: easy, type: mcq, prompt: "XLOOKUP's 3 required arguments", choices: ["lookup_value, lookup_array, return_array", "value, table, col_index", "range, criteria, sum_range", "value, row, column"], answer: 0 }
          - { id: xl-w09-d2-rf02, difficulty: easy, type: mcq, prompt: "XLOOKUP's default match", choices: ["exact", "approximate", "wildcard", "next larger"], answer: 0 }
          - { id: xl-w09-d2-rf03, difficulty: easy, type: truefalse, prompt: "XLOOKUP can look to the left.", answer: true }
          - { id: xl-w09-d2-rf04, difficulty: easy, type: mcq, prompt: "4th argument", choices: ["if_not_found", "match_mode", "col_index", "search_mode"], answer: 0 }
          - { id: xl-w09-d2-rf05, difficulty: easy, type: mcq, prompt: "match_mode -1", choices: ["exact or next smaller", "exact or next larger", "wildcard", "last to first"], answer: 0 }
          - { id: xl-w09-d2-rf06, difficulty: easy, type: mcq, prompt: "Return array Products!D2:E41 →", choices: ["spills Supplier and UnitCost", "#VALUE!", "only Supplier", "a sum"], answer: 0 }
          - { id: xl-w09-d2-rf07, difficulty: easy, type: mcq, prompt: "Profit per order", choices: ["NetSales − Units × UnitCost", "UnitPrice − UnitCost", "NetSales × margin", "Units × UnitPrice"], answer: 0 }
          - { id: xl-w09-d2-rf08, difficulty: easy, type: mcq, prompt: "Margin", choices: ["profit ÷ net sales", "net sales ÷ profit", "cost ÷ price", "profit − cost"], answer: 0 }
          - { id: xl-w09-d2-rf09, difficulty: easy, type: mcq, prompt: "Older Excel without XLOOKUP? Use…", choices: ["INDEX/MATCH", "HLOOKUP only", "SUMIFS", "Nothing"], answer: 0 }
          - { id: xl-w09-d2-rf10, difficulty: easy, type: mcq, prompt: "=XLOOKUP(\"P999\",ids,costs,\"Not found\")", choices: ["Not found", "#N/A", "0", "blank"], answer: 0 }
      - kind: brain-teaser
        title: "NaijaMart's profit"
        questions:
          - { id: xl-w09-d2-bt01, difficulty: medium, type: text, prompt: "Total profit for 2025 (₦, no symbol)?", accept: ["129531600", "129,531,600"] }
          - { id: xl-w09-d2-bt02, difficulty: medium, type: text, prompt: "Overall margin, 1 decimal %?", accept: ["15.5%", "15.5"] }
          - { id: xl-w09-d2-bt03, difficulty: medium, type: text, prompt: "How many orders made a loss?", accept: ["21"] }
          - { id: xl-w09-d2-bt04, difficulty: hard, type: mcq, prompt: "Every loss order is Rice 50kg (Local): cost ₦68,000, price ₦78,000. Why the loss?", choices: ["Sold at 15% off: ₦66,300 < ₦68,000", "Sold at 5% off", "The price is below cost", "Returned goods"], answer: 0 }
          - { id: xl-w09-d2-bt05, difficulty: hard, type: mcq, prompt: "Tiers 0→2%, 500000→3%, 2000000→5%. =XLOOKUP(2000000,tiers,rates,,-1)", choices: ["5%", "3%", "2%", "#N/A"], answer: 0 }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: XLOOKUP"
      covers: "Week 9 · Day 2: XLOOKUP, if_not_found, multiple columns, approximate bands, profit and margin"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w09-d3-g01, difficulty: easy, type: mcq, prompt: "=XLOOKUP(G2, Products!$A$2:$A$41, Products!$E$2:$E$41)", choices: ["UnitCost for G2's ID", "Supplier", "the row number", "the price"], answer: 0 }
        - { id: xl-w09-d3-g02, difficulty: easy, type: truefalse, prompt: "XLOOKUP needs FALSE for an exact match.", answer: false }
        - { id: xl-w09-d3-g03, difficulty: easy, type: mcq, prompt: "A built-in not-found message goes in argument…", choices: ["4", "3", "5", "6"], answer: 0 }
        - { id: xl-w09-d3-g04, difficulty: easy, type: mcq, prompt: "Commission tiers or tax bands need…", choices: ["approximate match (-1)", "exact match", "wildcards", "search_mode -1"], answer: 0 }
        - { id: xl-w09-d3-g05, difficulty: easy, type: truefalse, prompt: "Inserting a column doesn't break XLOOKUP.", answer: true }
        - { id: xl-w09-d3-g06, difficulty: easy, type: mcq, prompt: "Profit", choices: ["NetSales − Units × UnitCost", "UnitPrice × Units", "NetSales ÷ Units", "UnitCost − UnitPrice"], answer: 0 }
        - { id: xl-w09-d3-g07, difficulty: medium, type: text, prompt: "Tiers 0→2%, 500000→3%, 2000000→5%. =XLOOKUP(1200000,tiers,rates,,-1)", accept: ["3%", "0.03"] }
        - { id: xl-w09-d3-g08, difficulty: medium, type: text, prompt: "Same tiers: =XLOOKUP(499999,tiers,rates,,-1)", accept: ["2%", "0.02"] }
        - { id: xl-w09-d3-g09, difficulty: medium, type: match, prompt: "Match the match_mode.", pairs: [["0", "exact"], ["-1", "exact or next smaller"], ["1", "exact or next larger"], ["2", "wildcard"]] }
        - { id: xl-w09-d3-g10, difficulty: medium, type: text, prompt: "Profit on row 2 (P040, 1 unit, ₦14,500, no discount, cost ₦9,800)?", accept: ["4700", "4,700", "₦4,700"] }
        - { id: xl-w09-d3-g11, difficulty: medium, type: truefalse, prompt: "search_mode -1 searches from last to first.", answer: true }
        - { id: xl-w09-d3-g12, difficulty: medium, type: text, prompt: "NaijaMart 2025 margin (1 decimal %)?", accept: ["15.5%", "15.5"] }
        - { id: xl-w09-d3-g13, difficulty: medium, type: mcq, prompt: "=XLOOKUP(\"P001\",Products!A2:A41,Products!D2:E41)", choices: ["Transsion Nigeria | 118000 (spills 2 cells)", "#VALUE!", "Transsion Nigeria only", "118000 only"], answer: 0 }
        - { id: xl-w09-d3-g14, difficulty: medium, type: mcq, prompt: "A product name in B2; return its ID from column A.", choices: ["=XLOOKUP(B2,Products!B2:B41,Products!A2:A41)", "=VLOOKUP(B2,Products!A2:G41,1,FALSE)", "=XLOOKUP(B2,Products!A2:A41,Products!B2:B41)", "Impossible"], answer: 0 }
        - { id: xl-w09-d3-g15, difficulty: medium, type: text, prompt: "Loss-making orders in 2025?", accept: ["21"] }
        - { id: xl-w09-d3-g16, difficulty: hard, type: text, prompt: "Profit on 2 × Rice 50kg (Local) at 15% off (price ₦78,000, cost ₦68,000)?", accept: ["-3400", "-3,400", "-₦3,400"] }
        - { id: xl-w09-d3-g17, difficulty: hard, type: mcq, prompt: "Tiers listed as 0, 2000000, 500000 (unsorted). Approximate XLOOKUP…", choices: ["still works: XLOOKUP's match_mode doesn't need sorted data", "needs them sorted like VLOOKUP TRUE", "returns #N/A", "returns the first tier always"], answer: 0 }
        - { id: xl-w09-d3-g18, difficulty: hard, type: multi, prompt: "Advantages of XLOOKUP over VLOOKUP (Select all.)", choices: ["Exact match by default", "Looks left", "Built-in not-found value", "Works in Excel 2010"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "INDEX and MATCH"
        secondsPerQuestion: 9
        questions:
          - { id: xl-w09-d3-rf01, difficulty: easy, type: mcq, prompt: "MATCH returns…", choices: ["a position", "a value", "TRUE/FALSE", "a range"], answer: 0 }
          - { id: xl-w09-d3-rf02, difficulty: easy, type: mcq, prompt: "INDEX returns…", choices: ["the value at a position", "a position", "a count", "an address"], answer: 0 }
          - { id: xl-w09-d3-rf03, difficulty: easy, type: mcq, prompt: "MATCH's exact-match argument", choices: ["0", "1", "-1", "FALSE only"], answer: 0 }
          - { id: xl-w09-d3-rf04, difficulty: easy, type: text, prompt: "=MATCH(\"P005\",Products!A2:A41,0) (IDs P001…P040 in order)", accept: ["5"] }
          - { id: xl-w09-d3-rf05, difficulty: easy, type: text, prompt: "=INDEX({10,20,30},2)", accept: ["20"] }
          - { id: xl-w09-d3-rf06, difficulty: easy, type: truefalse, prompt: "INDEX/MATCH works in every version of Excel.", answer: true }
          - { id: xl-w09-d3-rf07, difficulty: easy, type: mcq, prompt: "The modern MATCH", choices: ["XMATCH", "XINDEX", "MATCHX", "FIND"], answer: 0 }
          - { id: xl-w09-d3-rf08, difficulty: easy, type: mcq, prompt: "Two-way lookup needs…", choices: ["INDEX with two MATCHes", "two VLOOKUPs", "SUMIFS only", "HLOOKUP"], answer: 0 }
          - { id: xl-w09-d3-rf09, difficulty: easy, type: mcq, prompt: "=MATCH(\"P999\",Products!A2:A41,0)", choices: ["#N/A", "0", "41", "#REF!"], answer: 0 }
          - { id: xl-w09-d3-rf10, difficulty: easy, type: text, prompt: "=INDEX(Products!F2:F41,26) (P026's UnitPrice)", accept: ["13500", "13,500", "₦13,500"] }
      - kind: brain-teaser
        title: "Look it up"
        questions:
          - { id: xl-w09-d3-bt01, difficulty: medium, type: order, prompt: "Build: UnitCost for the ID in G2.", items: ["=INDEX(", "Products!$E$2:$E$41,", "MATCH(G2,", "Products!$A$2:$A$41,", "0))"] }
          - { id: xl-w09-d3-bt02, difficulty: medium, type: text, prompt: "HR: JobTitle of E042?", accept: ["Senior Sales Associate"] }
          - { id: xl-w09-d3-bt03, difficulty: medium, type: text, prompt: "HR: E042's region?", accept: ["Abuja"] }
          - { id: xl-w09-d3-bt04, difficulty: hard, type: mcq, prompt: "Two-way: categories in A2:A8, regions in B1:E1, values B2:E8. Phones (H1) in Lagos (H2)?", choices: ["=INDEX(B2:E8,MATCH(H1,A2:A8,0),MATCH(H2,B1:E1,0))", "=INDEX(B2:E8,MATCH(H2,B1:E1,0),MATCH(H1,A2:A8,0))", "=VLOOKUP(H1,A2:E8,H2,FALSE)", "=MATCH(H1,H2,0)"], answer: 0 }
          - { id: xl-w09-d3-bt05, difficulty: hard, type: mcq, prompt: "Why doesn't INDEX/MATCH break when a column is inserted?", choices: ["It points at real ranges, not a column count", "It recalculates column numbers", "It locks the sheet", "It does break"], answer: 0 }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: INDEX and MATCH"
      covers: "Week 9 · Day 3: MATCH positions, INDEX values, INDEX/MATCH, two-way lookups, XMATCH"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w09-d4-g01, difficulty: easy, type: mcq, prompt: "MATCH(value, range, 0) returns…", choices: ["the position of the value", "the value", "TRUE if found", "the row of the sheet always"], answer: 0 }
        - { id: xl-w09-d4-g02, difficulty: easy, type: mcq, prompt: "INDEX(range, n) returns…", choices: ["the nth value in the range", "the position of n", "n", "the address"], answer: 0 }
        - { id: xl-w09-d4-g03, difficulty: easy, type: truefalse, prompt: "INDEX/MATCH can look to the left.", answer: true }
        - { id: xl-w09-d4-g04, difficulty: easy, type: text, prompt: "=MATCH(\"C\",{\"A\",\"B\",\"C\",\"D\"},0)", accept: ["3"] }
        - { id: xl-w09-d4-g05, difficulty: easy, type: text, prompt: "=INDEX({\"Lagos\",\"Abuja\",\"Kano\"},3)", accept: ["Kano"] }
        - { id: xl-w09-d4-g06, difficulty: easy, type: mcq, prompt: "XMATCH is…", choices: ["the modern MATCH", "a two-way XLOOKUP", "an error catcher", "a text function"], answer: 0 }
        - { id: xl-w09-d4-g07, difficulty: medium, type: text, prompt: "=MATCH(\"P026\",Products!A2:A41,0)", accept: ["26"] }
