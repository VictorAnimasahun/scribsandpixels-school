# Excel · Week 11 quizzes. Format and rules: src/content/QUIZZES.md
# Figures verified against datasets/sales_2025.csv (columns: A OrderID, B OrderDate, C Region, D Store, E Salesperson, F CustomerType, G ProductID, H Product…).
week: 11
days:

  # ─────────────────────────── DAY 1 ───────────────────────────
  - day: 1
    gate:
      title: "Checkpoint: Week 10 review"
      covers: "Week 10: Excel Tables, structured references, data validation, dependent drop-downs, cleaning tools, protection"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w11-d1-g01, difficulty: easy, type: mcq, prompt: "Make a table", choices: ["Ctrl+T", "Ctrl+E", "Ctrl+1", "F5"], answer: 0 }
        - { id: xl-w11-d1-g02, difficulty: easy, type: mcq, prompt: "This row's Units in a table", choices: ["[@Units]", "tblSales[Units]", "$Units", "Units!"], answer: 0 }
        - { id: xl-w11-d1-g03, difficulty: easy, type: truefalse, prompt: "Locked cells are only protected once the sheet is protected.", answer: true }
        - { id: xl-w11-d1-g04, difficulty: easy, type: mcq, prompt: "Drop-down list", choices: ["Data Validation → List", "Insert → List", "Filter", "Home → Drop-down"], answer: 0 }
        - { id: xl-w11-d1-g05, difficulty: easy, type: mcq, prompt: "Flash Fill", choices: ["Ctrl+E", "Ctrl+F", "Ctrl+T", "Ctrl+D"], answer: 0 }
        - { id: xl-w11-d1-g06, difficulty: easy, type: mcq, prompt: "$H$2# means…", choices: ["the whole spill range from H2", "H2 only", "a hidden cell", "an error"], answer: 0 }
        - { id: xl-w11-d1-g07, difficulty: medium, type: text, prompt: "=SUM(tblSales[NetSales]) (₦, no symbol)", accept: ["834046700", "834,046,700"] }
        - { id: xl-w11-d1-g08, difficulty: medium, type: text, prompt: "=COUNTA(UNIQUE(tblSales[Salesperson]))", accept: ["27"] }
        - { id: xl-w11-d1-g09, difficulty: medium, type: match, prompt: "Match.", pairs: [["Text to Columns", "split by a delimiter"], ["Remove Duplicates", "delete repeated rows"], ["Go To Special", "select blanks"], ["Circle Invalid Data", "find entries breaking validation"]] }
        - { id: xl-w11-d1-g10, difficulty: medium, type: mcq, prompt: "Dependent list helper (category in B2)", choices: ["=FILTER(tblProducts[Product],tblProducts[Category]=B2)", "=VLOOKUP(B2,tblProducts,2)", "=UNIQUE(B2)", "=COUNTIF(B2)"], answer: 0 }
        - { id: xl-w11-d1-g11, difficulty: medium, type: truefalse, prompt: "Excel sheet passwords are real security for confidential data.", answer: false }
        - { id: xl-w11-d1-g12, difficulty: medium, type: text, prompt: "Phones in tblProducts?", accept: ["4"] }
        - { id: xl-w11-d1-g13, difficulty: medium, type: mcq, prompt: "Fill selected blanks with the value above", choices: ["Type = and the cell above, Ctrl+Enter", "Ctrl+D", "Enter", "Paste Special"], answer: 0 }
        - { id: xl-w11-d1-g14, difficulty: medium, type: mcq, prompt: "Custom rule for unique IDs in A", choices: ["=COUNTIF($A:$A,A2)=1", "=UNIQUE(A2)", "=A2<>A1", "=COUNT(A2)=1"], answer: 0 }
        - { id: xl-w11-d1-g15, difficulty: medium, type: multi, prompt: "Table advantages (Select all.)", choices: ["Auto-expanding", "Calculated columns", "Total Row", "Real passwords"], answers: [0, 1, 2] }
        - { id: xl-w11-d1-g16, difficulty: hard, type: mcq, prompt: "Users must type only in yellow inputs. Steps:", choices: ["Unlock the inputs (Ctrl+1 → Protection), then Review → Protect Sheet", "Protect the sheet, then lock the inputs", "Hide formulas only", "Protect Workbook"], answer: 0 }
        - { id: xl-w11-d1-g17, difficulty: hard, type: text, prompt: "=\"NM-\"&TEXT(ROW()-1,\"00000\") in row 101", accept: ["NM-00100"] }
        - { id: xl-w11-d1-g18, difficulty: hard, type: multi, prompt: "Tidy-data rules (Select all.)", choices: ["One row per record", "One value per cell", "No merged cells inside data", "Blank rows between groups"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Conditional formatting"
        secondsPerQuestion: 8
        questions:
          - { id: xl-w11-d1-rf01, difficulty: easy, type: mcq, prompt: "Where is Conditional Formatting?", choices: ["Home tab", "Data tab", "Insert tab", "Review tab"], answer: 0 }
          - { id: xl-w11-d1-rf02, difficulty: easy, type: mcq, prompt: "In-cell bar charts", choices: ["Data Bars", "Sparklines", "Icon Sets", "Colour Scales"], answer: 0 }
          - { id: xl-w11-d1-rf03, difficulty: easy, type: mcq, prompt: "Heat map", choices: ["Colour Scales", "Data Bars", "Icon Sets", "Top 10"], answer: 0 }
          - { id: xl-w11-d1-rf04, difficulty: easy, type: mcq, prompt: "Arrows and traffic lights", choices: ["Icon Sets", "Data Bars", "Colour Scales", "Sparklines"], answer: 0 }
          - { id: xl-w11-d1-rf05, difficulty: easy, type: mcq, prompt: "Flag repeated phone numbers", choices: ["Highlight Cells → Duplicate Values", "Top 10", "Data Bars", "Remove Duplicates"], answer: 0 }
          - { id: xl-w11-d1-rf06, difficulty: easy, type: mcq, prompt: "See the order and scope of rules", choices: ["Manage Rules", "Clear Rules", "Format Painter", "Name Manager"], answer: 0 }
          - { id: xl-w11-d1-rf07, difficulty: easy, type: truefalse, prompt: "More rules on one table is usually better.", answer: false }
          - { id: xl-w11-d1-rf08, difficulty: easy, type: mcq, prompt: "Outliers above the mean", choices: ["Top/Bottom → Above Average", "Data Bars", "Duplicate Values", "Icon Sets"], answer: 0 }
          - { id: xl-w11-d1-rf09, difficulty: easy, type: text, prompt: "Orders with NetSales ≥ ₦1,000,000 in 2025?", accept: ["140"] }
          - { id: xl-w11-d1-rf10, difficulty: easy, type: mcq, prompt: "Highlight NetSales ≥ ₦1M", choices: ["Highlight Cells → Greater Than (999,999) or a formula rule", "Top 10", "Colour Scale", "Data Bars"], answer: 0 }
      - kind: brain-teaser
        title: "Pick the rule"
        questions:
          - { id: xl-w11-d1-bt01, difficulty: medium, type: mcq, prompt: "Category × region grid: which cells are big at a glance?", choices: ["3-colour scale", "Duplicate values", "Icon sets on text", "Text contains"], answer: 0 }
          - { id: xl-w11-d1-bt02, difficulty: medium, type: mcq, prompt: "\"% change vs previous month\" column", choices: ["Icon set: up/flat/down arrows", "Data bars", "Duplicate values", "Colour scale on text"], answer: 0 }
          - { id: xl-w11-d1-bt03, difficulty: medium, type: mcq, prompt: "Two rules hit the same cell. Which wins?", choices: ["The one higher in Manage Rules (unless Stop If True matters)", "The newest always", "Both blend colours", "The one with green"], answer: 0 }
          - { id: xl-w11-d1-bt04, difficulty: hard, type: mcq, prompt: "Greater Than 1000000 highlights ₦1,000,000 itself?", choices: ["No: use ≥ via a formula rule or Greater Than 999,999", "Yes", "Only in tables", "Only with data bars"], answer: 0 }
          - { id: xl-w11-d1-bt05, difficulty: hard, type: text, prompt: "Of the 140 orders ≥ ₦1M, how many are Wholesale?", accept: ["107"] }

  # ─────────────────────────── DAY 2 ───────────────────────────
  - day: 2
    gate:
      title: "Checkpoint: built-in conditional formatting"
      covers: "Week 11 · Day 1: highlight rules, top/bottom, data bars, colour scales, icon sets, Manage Rules"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w11-d2-g01, difficulty: easy, type: mcq, prompt: "Conditional Formatting is on the…", choices: ["Home tab", "Data tab", "Formulas tab", "View tab"], answer: 0 }
        - { id: xl-w11-d2-g02, difficulty: easy, type: mcq, prompt: "Green → red heat map", choices: ["Colour Scale", "Data Bars", "Icon Set", "Highlight Cells"], answer: 0 }
        - { id: xl-w11-d2-g03, difficulty: easy, type: truefalse, prompt: "Data Bars draw a bar inside each cell.", answer: true }
        - { id: xl-w11-d2-g04, difficulty: easy, type: mcq, prompt: "Find duplicate phones visually", choices: ["Duplicate Values rule", "Remove Duplicates", "Sort", "Data Bars"], answer: 0 }
        - { id: xl-w11-d2-g05, difficulty: easy, type: mcq, prompt: "Top 10 is under…", choices: ["Top/Bottom Rules", "Highlight Cells", "Icon Sets", "Data Bars"], answer: 0 }
        - { id: xl-w11-d2-g06, difficulty: easy, type: mcq, prompt: "Less is more:", choices: ["one or two rules per table", "a rule per column", "five colours minimum", "always icons"], answer: 0 }
        - { id: xl-w11-d2-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["Data Bars", "in-cell bars"], ["Colour Scales", "heat map"], ["Icon Sets", "arrows / traffic lights"], ["Highlight Cells", "flag specific values"]] }
        - { id: xl-w11-d2-g08, difficulty: medium, type: text, prompt: "Orders with NetSales ≥ ₦1,000,000?", accept: ["140"] }
        - { id: xl-w11-d2-g09, difficulty: medium, type: mcq, prompt: "Monthly sales table: show size at a glance without a chart", choices: ["Data Bars", "Duplicate Values", "Text Contains", "Icon Sets on months"], answer: 0 }
        - { id: xl-w11-d2-g10, difficulty: medium, type: truefalse, prompt: "Manage Rules shows which range each rule applies to.", answer: true }
        - { id: xl-w11-d2-g11, difficulty: medium, type: mcq, prompt: "Highlight Cells → Text that Contains \"Lagos\" on the Store column finds…", choices: ["every Lagos store (e.g. Lagos - Surulere)", "only cells exactly \"Lagos\"", "nothing", "regions only"], answer: 0 }
        - { id: xl-w11-d2-g12, difficulty: medium, type: text, prompt: "Highest month of 2025 (e.g. 2025-12)?", accept: ["2025-12", "December", "Dec"] }
        - { id: xl-w11-d2-g13, difficulty: medium, type: mcq, prompt: "Remove all formatting rules from a sheet", choices: ["Conditional Formatting → Clear Rules → Entire Sheet", "Delete key", "Ctrl+Z", "Clear Contents"], answer: 0 }
        - { id: xl-w11-d2-g14, difficulty: medium, type: text, prompt: "Lowest month of 2025?", accept: ["2025-01", "January", "Jan"] }
        - { id: xl-w11-d2-g15, difficulty: medium, type: multi, prompt: "Built-in rule families (Select all.)", choices: ["Highlight Cells", "Top/Bottom", "Data Bars", "Pivot Rules"], answers: [0, 1, 2] }
        - { id: xl-w11-d2-g16, difficulty: hard, type: mcq, prompt: "A colour scale on a grid that includes the Total row/column…", choices: ["makes the totals the only dark cells; apply it to the inner grid only", "is fine", "ignores totals automatically", "errors"], answer: 0 }
        - { id: xl-w11-d2-g17, difficulty: hard, type: text, prompt: "December 2025 net sales in ₦ millions (1 decimal)?", accept: ["109.6", "109.6M", "₦109.6M"] }
        - { id: xl-w11-d2-g18, difficulty: hard, type: multi, prompt: "Good uses (Select all.)", choices: ["Heat map on a category × region grid", "Duplicate highlight on phone numbers", "Arrows on % change", "Rainbow colours on every column"], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Formula rules"
        secondsPerQuestion: 9
        questions:
          - { id: xl-w11-d2-rf01, difficulty: easy, type: mcq, prompt: "A formula rule must return…", choices: ["TRUE or FALSE", "a colour", "a number", "text"], answer: 0 }
          - { id: xl-w11-d2-rf02, difficulty: easy, type: mcq, prompt: "Write the formula for…", choices: ["the first row of the selection", "the last row", "every row separately", "the header"], answer: 0 }
          - { id: xl-w11-d2-rf03, difficulty: easy, type: mcq, prompt: "Whole row where Region (C) = Lagos", choices: ["=$C2=\"Lagos\"", "=C$2=\"Lagos\"", "=$C$2=\"Lagos\"", "=C:C=\"Lagos\""], answer: 0 }
          - { id: xl-w11-d2-rf04, difficulty: easy, type: mcq, prompt: "The $ in $C2 locks…", choices: ["the column", "the row", "both", "nothing"], answer: 0 }
          - { id: xl-w11-d2-rf05, difficulty: easy, type: mcq, prompt: "Weekends (date in B)", choices: ["=WEEKDAY($B2,2)>=6", "=WEEKDAY($B2)>5", "=DAY($B2)>=6", "=$B2=\"Saturday\""], answer: 0 }
          - { id: xl-w11-d2-rf06, difficulty: easy, type: mcq, prompt: "Row matches a selector cell Z1", choices: ["=$C2=$Z$1", "=C2=Z1", "=$C$2=Z1", "=$C2=Z$1$"], answer: 0 }
          - { id: xl-w11-d2-rf07, difficulty: easy, type: mcq, prompt: "Search box on Product (H)", choices: ["=ISNUMBER(SEARCH($Z$1,$H2))", "=SEARCH(Z1)", "=FIND($H2)", "=$H2=$Z$1"], answer: 0 }
          - { id: xl-w11-d2-rf08, difficulty: easy, type: truefalse, prompt: "SEARCH is case-insensitive, so \"tecno\" finds \"Tecno Spark 20\".", answer: true }
          - { id: xl-w11-d2-rf09, difficulty: easy, type: mcq, prompt: "Late arrival (clock-in in C)", choices: ["=$C2>TIME(8,30,0)", "=$C2>8.30", "=HOUR($C2)>8", "=$C2>\"08:30\""], answer: 0 }
          - { id: xl-w11-d2-rf10, difficulty: easy, type: mcq, prompt: "Below reorder level (stock H, level G)", choices: ["=$H2<$G2", "=H$2<G$2", "=$H$2<$G$2", "=H:H<G:G"], answer: 0 }
      - kind: brain-teaser
        title: "Highlight the rows"
        questions:
          - { id: xl-w11-d2-bt01, difficulty: medium, type: mcq, prompt: "Wholesale (F) orders with NetSales (O) ≥ 1M, whole row", choices: ["=AND($F2=\"Wholesale\",$O2>=1000000)", "=OR($F2=\"Wholesale\",$O2>=1000000)", "=$F2=\"Wholesale\"*O2", "=AND(F$2=\"Wholesale\",O$2>=1000000)"], answer: 0 }
          - { id: xl-w11-d2-bt02, difficulty: medium, type: text, prompt: "How many rows does that rule highlight?", accept: ["107"] }
          - { id: xl-w11-d2-bt03, difficulty: medium, type: mcq, prompt: "Rule =C2=\"Lagos\" (no $) on A2:Q2401 highlights…", choices: ["cells whose own column-relative cell is Lagos (patchy, not whole rows)", "whole Lagos rows", "nothing", "only column C"], answer: 0 }
          - { id: xl-w11-d2-bt04, difficulty: hard, type: mcq, prompt: "Rule =$C$2=\"Lagos\" on A2:Q2401…", choices: ["highlights everything or nothing, based on C2 only", "highlights Lagos rows", "highlights column C", "errors"], answer: 0 }
          - { id: xl-w11-d2-bt05, difficulty: hard, type: mcq, prompt: "Search box empty: =ISNUMBER(SEARCH($Z$1,$H2)) highlights…", choices: ["every row (an empty search matches position 1)", "no rows", "only blanks", "an error"], answer: 0 }

  # ─────────────────────────── DAY 3 ───────────────────────────
  - day: 3
    gate:
      title: "Checkpoint: formula-based formatting"
      covers: "Week 11 · Day 2: TRUE/FALSE rules, first-row formulas, $ on the column for whole rows, selector cells, search box"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w11-d3-g01, difficulty: easy, type: mcq, prompt: "New Rule type for custom logic", choices: ["Use a formula to determine which cells to format", "Format only top values", "Format all cells based on values", "Format unique values"], answer: 0 }
        - { id: xl-w11-d3-g02, difficulty: easy, type: mcq, prompt: "Whole row where Region (C) = Abuja", choices: ["=$C2=\"Abuja\"", "=C2=\"Abuja\"", "=$C$2=\"Abuja\"", "=C$2=\"Abuja\""], answer: 0 }
        - { id: xl-w11-d3-g03, difficulty: easy, type: truefalse, prompt: "The rule formula is written for the first row of the selected range.", answer: true }
        - { id: xl-w11-d3-g04, difficulty: easy, type: mcq, prompt: "Selector in Z1, lock it as…", choices: ["$Z$1", "Z1", "$Z1", "Z$1 only"], answer: 0 }
        - { id: xl-w11-d3-g05, difficulty: easy, type: mcq, prompt: "WEEKDAY(date,2) returns 6 and 7 for…", choices: ["Saturday and Sunday", "Friday and Saturday", "Sunday and Monday", "the 6th and 7th"], answer: 0 }
        - { id: xl-w11-d3-g06, difficulty: easy, type: mcq, prompt: "Rules return…", choices: ["TRUE/FALSE", "colours", "numbers", "text"], answer: 0 }
        - { id: xl-w11-d3-g07, difficulty: medium, type: match, prompt: "Match the rule.", pairs: [["=$C2=\"Lagos\"", "Lagos rows"], ["=WEEKDAY($B2,2)>=6", "weekend orders"], ["=$C2=$Z$1", "rows matching a selector"], ["=ISNUMBER(SEARCH($Z$1,$H2))", "product search box"]] }
        - { id: xl-w11-d3-g08, difficulty: medium, type: text, prompt: "Weekend orders the weekend rule highlights (from Week 8)?", accept: ["546"] }
        - { id: xl-w11-d3-g09, difficulty: medium, type: mcq, prompt: "Why ISNUMBER around SEARCH?", choices: ["SEARCH returns a position or #VALUE!; ISNUMBER turns that into TRUE/FALSE", "To round", "To count matches", "No reason"], answer: 0 }
        - { id: xl-w11-d3-g10, difficulty: medium, type: truefalse, prompt: "Without the $ on the column, a whole-row rule breaks: each column of the row checks a different column.", answer: true }
        - { id: xl-w11-d3-g11, difficulty: medium, type: text, prompt: "Wholesale orders ≥ ₦1M (the Day 2 practice rule)?", accept: ["107"] }
        - { id: xl-w11-d3-g12, difficulty: medium, type: mcq, prompt: "Orange late arrivals in the timesheet (clock-in in C)", choices: ["=$C2>TIME(8,30,0)", "=$C2>830", "=C$2>TIME(8,30,0)", "=HOUR($C2)>=8"], answer: 0 }
        - { id: xl-w11-d3-g13, difficulty: medium, type: text, prompt: "Late arrivals that rule colours in the March timesheet?", accept: ["81"] }
        - { id: xl-w11-d3-g14, difficulty: medium, type: mcq, prompt: "Region drop-down in Z1 drives the highlight. Changing Z1…", choices: ["re-highlights instantly", "needs the rule re-created", "breaks the rule", "only works after saving"], answer: 0 }
        - { id: xl-w11-d3-g15, difficulty: medium, type: mcq, prompt: "Rows with NetSales (O) above the average", choices: ["=$O2>AVERAGE($O$2:$O$2401)", "=$O2>AVERAGE(O2:O2401)", "=O$2>AVERAGE", "=AVERAGE($O2)"], answer: 0 }
        - { id: xl-w11-d3-g16, difficulty: hard, type: mcq, prompt: "Search box for \"tecno\" in Product: which rows light up?", choices: ["Tecno Spark 20 orders (SEARCH ignores case)", "none (case matters)", "all rows", "#VALUE! everywhere"], answer: 0 }
        - { id: xl-w11-d3-g17, difficulty: hard, type: mcq, prompt: "Rule =$O2>AVERAGE(O2:O2401) (no $ on the range)…", choices: ["drifts row by row, comparing against shrinking ranges", "works perfectly", "errors", "highlights nothing"], answer: 0 }
        - { id: xl-w11-d3-g18, difficulty: hard, type: multi, prompt: "Which highlight whole rows correctly on A2:Q2401? (Select all.)", choices: ["=$C2=\"Kano\"", "=WEEKDAY($B2,2)>=6", "=$F2=$Z$1", "=$C$2=\"Kano\""], answers: [0, 1, 2] }
    quizzes:
      - kind: rapid-fire
        title: "Which chart?"
        secondsPerQuestion: 8
        questions:
          - { id: xl-w11-d3-rf01, difficulty: easy, type: mcq, prompt: "Change over time", choices: ["line", "pie", "scatter", "doughnut"], answer: 0 }
          - { id: xl-w11-d3-rf02, difficulty: easy, type: mcq, prompt: "Compare categories", choices: ["bar/column, sorted", "line", "pie with 10 slices", "3D cone"], answer: 0 }
          - { id: xl-w11-d3-rf03, difficulty: easy, type: mcq, prompt: "Part of a whole, 3 parts", choices: ["pie/doughnut or 100% stacked bar", "line", "scatter", "histogram"], answer: 0 }
          - { id: xl-w11-d3-rf04, difficulty: easy, type: mcq, prompt: "Relationship between two numbers", choices: ["scatter", "pie", "line", "column"], answer: 0 }
          - { id: xl-w11-d3-rf05, difficulty: easy, type: mcq, prompt: "Distribution", choices: ["histogram", "pie", "line", "doughnut"], answer: 0 }
          - { id: xl-w11-d3-rf06, difficulty: easy, type: mcq, prompt: "Two measures, different scales", choices: ["combo with a secondary axis", "two pies", "3D column", "scatter"], answer: 0 }
          - { id: xl-w11-d3-rf07, difficulty: easy, type: mcq, prompt: "Instant chart shortcut", choices: ["Alt+F1", "F11 only", "Ctrl+C", "Alt+="], answer: 0 }
          - { id: xl-w11-d3-rf08, difficulty: easy, type: truefalse, prompt: "3D charts make comparisons clearer.", answer: false }
          - { id: xl-w11-d3-rf09, difficulty: easy, type: mcq, prompt: "A good title…", choices: ["states the insight", "says \"Chart 1\"", "lists the columns", "is blank"], answer: 0 }
          - { id: xl-w11-d3-rf10, difficulty: easy, type: mcq, prompt: "Colours", choices: ["few, with one highlight colour", "one per bar", "rainbow", "black only"], answer: 0 }
      - kind: brain-teaser
        title: "Insight titles"
        questions:
          - { id: xl-w11-d3-bt01, difficulty: medium, type: text, prompt: "Lagos share of 2025 net sales, whole %?", accept: ["39%", "39", "38.6%", "38.6"] }
          - { id: xl-w11-d3-bt02, difficulty: medium, type: mcq, prompt: "Best title for the region chart", choices: ["Lagos drives 39% of sales", "Net sales by region", "Chart 1", "Regions"], answer: 0 }
          - { id: xl-w11-d3-bt03, difficulty: medium, type: text, prompt: "Second-biggest region?", accept: ["Abuja"] }
          - { id: xl-w11-d3-bt04, difficulty: hard, type: text, prompt: "Top category by net sales?", accept: ["Groceries"] }
          - { id: xl-w11-d3-bt05, difficulty: hard, type: mcq, prompt: "Customer type with nearly half of net sales", choices: ["Wholesale (49.1%)", "Retail (37.0%)", "Online (13.9%)", "All equal"], answer: 0 }

  # ─────────────────────────── DAY 4 ───────────────────────────
  - day: 4
    gate:
      title: "Checkpoint: choosing the right chart"
      covers: "Week 11 · Day 3: chart types for comparison, trend, part of whole, relationship, distribution; Alt+F1; design rules"
      blueprint: { easy: 2, medium: 3, hard: 1 }
      bank:
        - { id: xl-w11-d4-g01, difficulty: easy, type: mcq, prompt: "Monthly net sales for 2025", choices: ["line chart", "pie chart", "scatter", "doughnut"], answer: 0 }
        - { id: xl-w11-d4-g02, difficulty: easy, type: mcq, prompt: "Net sales by region", choices: ["sorted bar/column", "line", "pie with 6 slices only", "3D pie"], answer: 0 }
        - { id: xl-w11-d4-g03, difficulty: easy, type: truefalse, prompt: "Bar charts should usually be sorted so the ranking is visible.", answer: true }
        - { id: xl-w11-d4-g04, difficulty: easy, type: mcq, prompt: "Alt+F1 makes…", choices: ["an instant chart on the sheet", "a new sheet", "a table", "a PivotTable"], answer: 0 }
        - { id: xl-w11-d4-g05, difficulty: easy, type: mcq, prompt: "Avoid…", choices: ["3D anything", "data labels", "sorted bars", "insight titles"], answer: 0 }
        - { id: xl-w11-d4-g06, difficulty: easy, type: mcq, prompt: "Pie charts are OK for…", choices: ["2–5 parts of a whole", "trends over 12 months", "10+ categories", "two measures"], answer: 0 }
        - { id: xl-w11-d4-g07, difficulty: medium, type: match, prompt: "Match.", pairs: [["line", "change over time"], ["bar", "compare categories"], ["scatter", "relationship"], ["histogram", "distribution"]] }
        - { id: xl-w11-d4-g08, difficulty: medium, type: text, prompt: "Lagos share of net sales (1 decimal %)?", accept: ["38.6%", "38.6"] }
        - { id: xl-w11-d4-g09, difficulty: medium, type: mcq, prompt: "Category net sales (10 categories)", choices: ["sorted horizontal bar", "pie", "line", "doughnut"], answer: 0 }
