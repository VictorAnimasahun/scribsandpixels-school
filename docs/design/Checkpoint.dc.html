<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkpoint</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&amp;family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#16211D;color:#16211D;font-family:'Public Sans',system-ui,sans-serif}
.serif{font-family:'Literata',Georgia,serif}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border:1.5px solid #C9D3C2;border-radius:8px;background:#FFFFFF;font:400 15px 'JetBrains Mono',ui-monospace,monospace;color:#16211D;text-align:left;cursor:pointer}
.opt:focus-visible,.btn:focus-visible{outline:2px solid #C24A33;outline-offset:2px}
.key{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid #A9B3A4;font:600 13px 'Public Sans',system-ui,sans-serif;flex:none}
.q{width:22px;height:22px;border-radius:3px;background:#2C3B35}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:8px;font:600 16px 'Public Sans',system-ui,sans-serif;border:0;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 18px 16px 20px; background: #16211D; color: #E6EDE3">

<header style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
  <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #C7E85C">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    Checkpoint on yesterday
  </span>
  <h1 class="serif" style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; color: #F2F5EC">Lists: slicing, membership and methods</h1>
  <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #B8C4B6">Get 7 of 10 right to open tonight's lesson. Leaving before the end counts as an attempt.</p>
</header>

<div style="display: flex; gap: 6px; padding: 0 4px" aria-label="Question 3 of 10">
  <span class="q" style="background: #C7E85C"></span>
  <span class="q" style="background: #C7E85C"></span>
  <span class="q" style="background: #F2F5EC"></span>
  <span class="q"></span><span class="q"></span><span class="q"></span><span class="q"></span><span class="q"></span><span class="q"></span><span class="q"></span>
</div>

<section style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px; border-radius: 8px; background: #FBFCF7; color: #16211D">
  <div style="display: flex; justify-content: space-between; font-size: 13px; color: #55615A">
    <span>Question 3 of 10</span><span>Medium</span>
  </div>
  <p class="serif" style="margin: 0; font-size: 19px; line-height: 1.4">What does this print?</p>
  <pre style="margin: 0; padding: 12px 14px; border-radius: 6px; background: #173A2E; color: #E6F0DA; font: 400 14px/1.7 'JetBrains Mono', ui-monospace, monospace; overflow-x: auto">cities = ["Lagos", "Abuja", "Kano", "Enugu"]
print(cities[1:3])</pre>
  <div style="display: flex; flex-direction: column; gap: 8px" role="radiogroup" aria-label="Answers">
    <button class="opt" type="button" role="radio" aria-checked="false"><span class="key">A</span>['Lagos', 'Abuja', 'Kano']</button>
    <button class="opt" type="button" role="radio" aria-checked="true" style="border-color: #164F3B; background: #EEF6D6; box-shadow: inset 0 0 0 1px #164F3B"><span class="key" style="background: #164F3B; border-color: #164F3B; color: #F2F5EC">B</span>['Abuja', 'Kano']</button>
    <button class="opt" type="button" role="radio" aria-checked="false"><span class="key">C</span>['Abuja', 'Kano', 'Enugu']</button>
    <button class="opt" type="button" role="radio" aria-checked="false"><span class="key">D</span>IndexError</button>
  </div>
  <button class="btn" type="button" style="margin-top: auto; background: #164F3B; color: #F2F5EC">Next question</button>
</section>
</div>
</x-dc>
