<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your year</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F2F5EC;color:#16211D;font-family:'Public Sans',system-ui,sans-serif}
a{color:#164F3B}
.serif{font-family:'Literata',Georgia,serif}
.p{width:14px;height:14px;border-radius:2px;background:#DDE5D6}
.p.done{background:#164F3B}
.p.today{background:#C7E85C;box-shadow:inset 0 0 0 2px #164F3B}
.wk{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#55615A;font-variant-numeric:tabular-nums}
.wk.cur{color:#16211D;font-weight:700}
.phase{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:6px;border:1px solid #D8E0D2;background:#FBFCF7}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;color:#55615A;text-decoration:none;font-size:12px;font-weight:500}
.tab.on{color:#164F3B;font-weight:700}
</style>
</helmet>
<div style="width: 390px; min-height: 1240px; display: flex; flex-direction: column; background: #F2F5EC">

<header style="padding: 22px 20px 14px; display: flex; flex-direction: column; gap: 8px">
  <p style="margin: 0; font-size: 14px; color: #55615A">12-Month Fullstack + ML</p>
  <h1 class="serif" style="margin: 0; font-size: 30px; font-weight: 600; line-height: 1.15">Your year</h1>
  <p style="margin: 0; font-size: 14px; color: #3F4B45; font-variant-numeric: tabular-nums">8 of 312 study days. Week 2 of 52.</p>
</header>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px 24px">
  <sc-for list="{{phases}}" as="ph" hint-placeholder-count="6">
    <section class="phase" style="{{ph.style}}">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px">
        <strong style="font-size: 16px">{{ph.title}}</strong>
        <span style="font-size: 13px; color: #55615A; flex: none">{{ph.range}}</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px 8px">
        <sc-for list="{{ph.weeks}}" as="w" hint-placeholder-count="8">
          <div class="{{w.cls}}">
            <sc-for list="{{w.days}}" as="d" hint-placeholder-count="6">
              <span class="{{d.cls}}"></span>
            </sc-for>
            <span style="margin-top: 3px">{{w.n}}</span>
          </div>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #3F4B45"><b>Milestone:</b> {{ph.milestone}}</p>
    </section>
  </sc-for>
</div>

<nav style="margin-top: auto; display: flex; background: #FBFCF7; border-top: 1px solid #D8E0D2" aria-label="Main">
  <a class="tab" href="Main.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Today</a>
  <a class="tab on" href="Year.dc.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Course</a>
  <a class="tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Log</a>
  <a class="tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    var defs = [
      ['Phase 1: Foundations', 1, 6, "A personal webpage and a Python script that prints today's weather for Lagos."],
      ['Phase 2: Web development', 7, 14, 'Mama Put Kitchen: a multi-page site for a Nigerian restaurant, live on GitHub Pages.'],
      ['Phase 3: Backend development', 15, 24, 'A job board where users post and apply for jobs, with tests, logs and a short design doc.'],
      ['Phase 4: Fullstack', 25, 34, 'A deployed fullstack app with a shareable URL: load-tested, monitored, with a capacity plan for 2 million users.'],
      ['Phase 5: Machine learning', 35, 44, 'A model that predicts house prices in Lagos, shared on GitHub.'],
      ['Phase 6: Job ready', 45, 52, 'A live capstone (fullstack plus an ML feature) and 10 job applications a week.']
    ];
    var phases = defs.map(function (p, i) {
      var weeks = [];
      for (var n = p[1]; n <= p[2]; n++) {
        var days = [];
        for (var d = 1; d <= 6; d++) {
          var cls = 'p';
          if (n === 1 || (n === 2 && d < 3)) cls = 'p done';
          else if (n === 2 && d === 3) cls = 'p today';
          days.push({ cls: cls });
        }
        weeks.push({ n: n, days: days, cls: n === 2 ? 'wk cur' : 'wk' });
      }
      return {
        title: p[0], range: 'Weeks ' + p[1] + '–' + p[2], milestone: p[3], weeks: weeks,
        style: i === 0 ? 'border-color: #164F3B; box-shadow: inset 0 0 0 1px #164F3B' : ''
      };
    });
    return { phases: phases };
  }
}
</script>
</body>
</html>
